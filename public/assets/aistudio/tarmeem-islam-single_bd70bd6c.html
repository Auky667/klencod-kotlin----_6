\n1. الشمائل المحمدية\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D9%86%D9%88%D9%85%20%D9%88%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%8A%D9%82%D8%A7%D8%B8"},{"id":"seerah-38","title":"شمائله في الصمت والحديث","group":"السيرة النبوية · الشمائل المحمدية","summary":"صمتٌ يُشهد على الفِكر، وحديثٌ يُشهد على الحكمة.","body":"شمائله في الصمت والحديث\n\nصمتٌ يُشهد على الفِكر، وحديثٌ يُشهد على الحكمة.\n\nكان ﷺ يَصمتُ طويلًا، ويُخاطب الناس بالحِكمة، وكان ﷺ في الصمت يُشهد على الفِكر.\nوكان ﷺ في الحديث لا يُشهد عليه تفرّط، وكان ﷺ في الصمت يُشهد على الفِكر.\n\nالأدلة الشرعية:\n• «كان ﷺ يَصمتُ طويلًا، ويُخاطب الناس بالحِكمة» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الصمت سُنّةٌ للفِكر.\n2. من أَحسَن الصمت فقد أَحسَن.\n3. من أَحسَن الحديث فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. البدء والنهاية","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B5%D9%85%D8%AA%20%D9%88%D8%A7%D9%84%D8%AD%D8%AF%D9%8A%D8%AB"},{"id":"seerah-39","title":"شمائله في التجارة والأمانة","group":"السيرة النبوية · الشمائل المحمدية","summary":"أمانةٌ في التجارة قبل النبوة، وصدقٌ في القول.","body":"شمائله في التجارة والأمانة\n\nأمانةٌ في التجارة قبل النبوة، وصدقٌ في القول.\n\nكان ﷺ في التجارة أمينًا، وكان ﷺ في التجارة لا يُشهد عليه خيانة، وكان ﷺ في التجارة صادقًا.\nوكان ﷺ في التجارة لا يُشهد عليه تفرّط، وكان ﷺ في التجارة لا يُشهد عليه تعصّب.\n\nالأدلة الشرعية:\n• «كان ﷺ في التجارة أمينًا» — سيرة ابن هشام\n\nفوائد ودروس:\n1. الأمانة في التجارة سُنّة النبي ﷺ.\n2. من أَحسَن في التجارة فقد أَحسَن.\n3. من أَصادق فقد أَحسَن.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AA%D8%AC%D8%A7%D8%B1%D8%A9%20%D9%88%D8%A7%D9%84%D8%A3%D9%85%D8%A7%D9%86%D8%A9"},{"id":"seerah-40","title":"شمائله في الهدوء والحلم","group":"السيرة النبوية · الشمائل المحمدية","summary":"هدوءٌ لا يُشهد عليه تعصّب، وحلمٌ لا يُشهد عليه تفرّط.","body":"شمائله في الهدوء والحلم\n\nهدوءٌ لا يُشهد عليه تعصّب، وحلمٌ لا يُشهد عليه تفرّط.\n\nكان ﷺ هَدِيءًا، وكان ﷺ في الهدوء لا يُشهد عليه تعصّب، وكان ﷺ في الهدوء حَلِيمًا.\nوكان ﷺ في الحلم لا يُشهد عليه تفرّط، وكان ﷺ في الهدوء يُشهد على الحلم.\n\nالأدلة الشرعية:\n• «كان ﷺ هَدِيءًا حَلِيمًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الهدوء سُنّةٌ للعقل.\n2. من أَحسَن الهدوء فقد أَحسَن.\n3. من أَحسَن الحلم فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D9%87%D8%AF%D9%88%D8%A1%20%D9%88%D8%A7%D9%84%D8%AD%D9%84%D9%85"},{"id":"seerah-41","title":"شمائله في الكرم والجود","group":"السيرة النبوية · الشمائل المحمدية","summary":"جودٌ لا يُشهد عليه تفرّط، وكرمٌ لا يُشهد عليه تكلّف.","body":"شمائله في الكرم والجود\n\nجودٌ لا يُشهد عليه تفرّط، وكرمٌ لا يُشهد عليه تكلّف.\n\nكان ﷺ جَوَادًا، وكان ﷺ في الجود لا يُشهد عليه تفرّط، وكان ﷺ في الكرم لا يُشهد عليه تكلّف.\nوكان ﷺ يُعطي ولا يُخِدّ، وكان ﷺ في الجود لا يُشهد عليه تعصّب.\n\nالأدلة الشرعية:\n• «كان ﷺ جَوَادًا لا يُخِدّ» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الجود سُنّةٌ للقلب.\n2. من أَحسَن الجود فقد أَحسَن.\n3. من أَحسَن الكرم فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D9%83%D8%B1%D9%85%20%D9%88%D8%A7%D9%84%D8%AC%D9%88%D8%AF"},{"id":"seerah-42","title":"شمائله في الشجاعة","group":"السيرة النبوية · الشمائل المحمدية","summary":"شجاعةٌ في الحق، ولا تَفرّط ولا تعصّب.","body":"شمائله في الشجاعة\n\nشجاعةٌ في الحق، ولا تَفرّط ولا تعصّب.\n\nكان ﷺ شَجِيعًا، وكان ﷺ في الشجاعة لا يُشهد عليه تفرّط، وكان ﷺ في الشجاعة لا يُشهد عليه تعصّب.\nوكان ﷺ في الشجاعة يُشهد على القُدّامة، وكان ﷺ في الشجاعة لا يُشهد عليه تكلّف.\n\nالأدلة الشرعية:\n• «كان ﷺ شَجِيعًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الشجاعة سُنّةٌ للحق.\n2. من أَحسَن الشجاعة فقد أَحسَن.\n3. من أَحسَن القُدّامة فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. البدء والنهاية","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B4%D8%AC%D8%A7%D8%B9%D8%A9"},{"id":"seerah-43","title":"شمائله في التواضع","group":"السيرة النبوية · الشمائل المحمدية","summary":"تواضعٌ لا يُشهد عليه تعصّب ولا تعالي.","body":"شمائله في التواضع\n\nتواضعٌ لا يُشهد عليه تعصّب ولا تعالي.\n\nكان ﷺ مُتَواضعًا، وكان ﷺ في التواضع لا يُشهد عليه تعصّب، وكان ﷺ في التواضع لا يُشهد عليه تعالي.\nوكان ﷺ يُجِب الولد، ويُجِب الضعيف، ويُجِب الغريب.\n\nالأدلة الشرعية:\n• «كان ﷺ مُتَواضعًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. التواضع سُنّةٌ للقلب.\n2. من أَحسَن التواضع فقد أَحسَن.\n3. من أَجِب الضعيف فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AA%D9%88%D8%A7%D8%B6%D8%B9"},{"id":"seerah-44","title":"شمائله في الرحمة بالصغار والكبار","group":"السيرة النبوية · الشمائل المحمدية","summary":"رحمةٌ في الصغار والكبار، ولا تَفرّط ولا تعصّب.","body":"شمائله في الرحمة بالصغار والكبار\n\nرحمةٌ في الصغار والكبار، ولا تَفرّط ولا تعصّب.\n\nكان ﷺ رَحِيمًا، وكان ﷺ في الرحمة لا يُشهد عليه تفرّط، وكان ﷺ في الرحمة لا يُشهد عليه تعصّب.\nوكان ﷺ يُرعى الصغار، ويُرعى الكبار، ويُرعى الضعيف.\n\nالأدلة الشرعية:\n• «كان ﷺ رَحِيمًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الرحمة سُنّةٌ للقلب.\n2. من أَحسَن الرحمة فقد أَحسَن.\n3. من أَرعى الضعيف فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B1%D8%AD%D9%85%D8%A9%20%D8%A8%D8%A7%D9%84%D8%B5%D8%BA%D8%A7%D8%B1%20%D9%88%D8%A7%D9%84%D9%83%D8%A8%D8%A7%D8%B1"},{"id":"seerah-45","title":"شمائله في العدل بين الأزواج والأحباب","group":"السيرة النبوية · الشمائل المحمدية","summary":"عدلٌ في التقسيم والقسط، ولا تَفرّط ولا تعصّب.","body":"شمائله في العدل بين الأزواج والأحباب\n\nعدلٌ في التقسيم والقسط، ولا تَفرّط ولا تعصّب.\n\nكان ﷺ عَادِلًا في أزواجه، وكان ﷺ في العدل لا يُشهد عليه تفرّط، وكان ﷺ في العدل لا يُشهد عليه تعصّب.\nوكان ﷺ يُقسّم بالقسط، وكان ﷺ في العدل لا يُشهد عليه تكلّف.\n\nالأدلة الشرعية:\n• «كان ﷺ عَادِلًا في أزواجه» — الشمائل المحمدية\n\nفوائد ودروس:\n1. العدل سُنّةٌ في الأسرة.\n2. من أَحسَن العدل فقد أَحسَن.\n3. من أَقسّم بالقسط فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B9%D8%AF%D9%84%20%D8%A8%D9%8A%D9%86%20%D8%A7%D9%84%D8%A3%D8%B2%D9%88%D8%A7%D8%AC%20%D9%88%D8%A7%D9%84%D8%A3%D8%AD%D8%A8%D8%A7%D8%A8"},{"id":"seerah-46","title":"شمائله في الاستشارة والشورى","group":"السيرة النبوية · الشمائل المحمدية","summary":"شورىٌ في الأمور، ولا تَفرّط ولا تعصّب.","body":"شمائله في الاستشارة والشورى\n\nشورىٌ في الأمور، ولا تَفرّط ولا تعصّب.\n\nكان ﷺ يُشاور أصحابه، وكان ﷺ في الشورى لا يُشهد عليه تفرّط، وكان ﷺ في الشورى لا يُشهد عليه تعصّب.\nوكان ﷺ يُشاور في الحرب، ويُشاور في الأمور العامة، ويُشاور في العمل.\n\nالأدلة الشرعية:\n• «كان ﷺ يُشاور أصحابه» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الشورى سُنّةٌ في الإسلام.\n2. من أَحسَن الشورى فقد أَحسَن.\n3. من أَشاور فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%B4%D8%A7%D8%B1%D8%A9%20%D9%88%D8%A7%D9%84%D8%B4%D9%88%D8%B1%D9%89"},{"id":"seerah-47","title":"شمائله في الدعاء والتوكل","group":"السيرة النبوية · الشمائل المحمدية","summary":"دعاءٌ وتوكلٌ على الله، ولا تَفرّط ولا تعصّب.","body":"شمائله في الدعاء والتوكل\n\nدعاءٌ وتوكلٌ على الله، ولا تَفرّط ولا تعصّب.\n\nكان ﷺ يُدعو الله، وكان ﷺ في الدعاء لا يُشهد عليه تفرّط، وكان ﷺ في الدعاء لا يُشهد عليه تعصّب.\nوكان ﷺ يُتَوَكّل على الله، وكان ﷺ في التوكل لا يُشهد عليه تفرّط.\n\nالأدلة الشرعية:\n• «كان ﷺ يُدعو الله، ويُتَوَكّل عليه» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الدعاء سُنّةٌ للقلب.\n2. من أَحسَن الدعاء فقد أَحسَن.\n3. من أَتَوَكّل على الله فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AF%D8%B9%D8%A7%D8%A1%20%D9%88%D8%A7%D9%84%D8%AA%D9%88%D9%83%D9%84"},{"id":"seerah-48","title":"شمائله في صلاته الليل وقراءته","group":"السيرة النبوية · الشمائل المحمدية","summary":"صلاةٌ ليليةٌ طويلة، وقراءةٌ للمَشِيئة.","body":"شمائله في صلاته الليل وقراءته\n\nصلاةٌ ليليةٌ طويلة، وقراءةٌ للمَشِيئة.\n\nكان ﷺ يُقَام الليل، ويُقرأ في المَشِيئة، وكان ﷺ في الصلاة الليلية لا يُشهد عليه تفرّط.\nوكان ﷺ يُقرأ في المَشِيئة، وكان ﷺ في الصلاة الليلية لا يُشهد عليه تعصّب.\n\nالأدلة الشرعية:\n• «كان ﷺ يُقَام الليل» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الصلاة الليلية سُنّةٌ للقلب.\n2. من أَقام الليل فقد أَحسَن.\n3. من أَقرأ في المَشِيئة فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%B5%D9%84%D8%A7%D8%AA%D9%87%20%D8%A7%D9%84%D9%84%D9%8A%D9%84%20%D9%88%D9%82%D8%B1%D8%A7%D8%A1%D8%AA%D9%87"},{"id":"seerah-49","title":"شمائله في قبول العذر وترك الجرح","group":"السيرة النبوية · الشمائل المحمدية","summary":"قبولٌ للعذر، وتركٌ للجرح، ولا تَفرّط ولا تعصّب.","body":"شمائله في قبول العذر وترك الجرح\n\nقبولٌ للعذر، وتركٌ للجرح، ولا تَفرّط ولا تعصّب.\n\nكان ﷺ يُقَبِل العذر، وكان ﷺ يُتَرُك الجرح، وكان ﷺ في قبول العذر لا يُشهد عليه تفرّط.\nوكان ﷺ يُتَرُك الجرح، وكان ﷺ في ترك الجرح لا يُشهد عليه تعصّب.\n\nالأدلة الشرعية:\n• «كان ﷺ يُقَبِل العذر» — الشمائل المحمدية\n\nفوائد ودروس:\n1. قبول العذر سُنّةٌ للقلب.\n2. من أَقَبِل العذر فقد أَحسَن.\n3. من أَتَرُك الجرح فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D9%82%D8%A8%D9%88%D9%84%20%D8%A7%D9%84%D8%B9%D8%B0%D8%B1%20%D9%88%D8%AA%D8%B1%D9%83%20%D8%A7%D9%84%D8%AC%D8%B1%D8%AD"},{"id":"seerah-50","title":"شمائله في الاجتماع العام والخاص","group":"السيرة النبوية · الشمائل المحمدية","summary":"اجتماعٌ عامٌ وخاصٌّ بعفوٍ ورفق.","body":"شمائله في الاجتماع العام والخاص\n\nاجتماعٌ عامٌ وخاصٌّ بعفوٍ ورفق.\n\nكان ﷺ يُجتمِع عامًا وخاصًّا، وكان ﷺ في الاجتماع لا يُشهد عليه تفرّط، وكان ﷺ في الاجتماع لا يُشهد عليه تعصّب.\nوكان ﷺ يُعِفُو، وكان ﷺ في العفو لا يُشهد عليه تفرّط.\n\nالأدلة الشرعية:\n• «كان ﷺ يُجتمِع عامًا وخاصًّا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الاجتماع سُنّةٌ في الإسلام.\n2. من أَحسَن الاجتماع فقد أَحسَن.\n3. من أَعِفُو فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. البدء والنهاية","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%20%D8%A7%D9%84%D8%B9%D8%A7%D9%85%20%D9%88%D8%A7%D9%84%D8%AE%D8%A7%D8%B5"},{"id":"seerah-51","title":"شمائله في وصاياه وآخر أيامه","group":"السيرة النبوية · الشمائل المحمدية","summary":"وصايا ﷺ في آخر أيامه، وتركٌ للأمة في كتاب الله وسنّته.","body":"شمائله في وصاياه وآخر أيامه\n\nوصايا ﷺ في آخر أيامه، وتركٌ للأمة في كتاب الله وسنّته.\n\nكان ﷺ يُوصي الأمة، وكان ﷺ في الوصية لا يُشهد عليه تفرّط، وكان ﷺ في الوصية لا يُشهد عليه تعصّب.\nوكان ﷺ في آخر أيامه يُوصي الأمة بالكتاب والسنّة، ويُوصي بالأهلة والضعفاء والجار.\n\nالأدلة الشرعية:\n• «كان ﷺ يُوصي الأمة بالكتاب والسنّة» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. الوصية سُنّةٌ في الإسلام.\n2. من أَحسَن الوصية فقد أَحسَن.\n3. من أَتَرُك الأمة في كتاب الله وسنّته فقد أَحسَن.\n\nالمصادر والمراجع:\n1. السيرة النبوية لابن كثير\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D9%88%D8%B5%D8%A7%D9%8A%D8%A7%D9%87%20%D9%88%D8%A2%D8%AE%D8%B1%20%D8%A3%D9%8A%D8%A7%D9%85%D9%87"},{"id":"seerah-52","title":"أبو بكر الصدّيق","group":"السيرة النبوية · الخلفاء الراشدون","summary":"أول الخلفاء، وصاحب النبي ﷺ في الهجرة، وجامع القرآن.","body":"أبو بكر الصدّيق\n\nأول الخلفاء، وصاحب النبي ﷺ في الهجرة، وجامع القرآن.\n\nأبو بكر عبد الله بن عثمان بن عامر القرشي التيمي، واسمه في الجاهلية عبد الكعبة، وأمّه أمّ رومان، وأول الخلفاء الراشدين، وأول من دعا إلى الإسلام، وصاحب النبي ﷺ في الهجرة، وقد توفي في عام ثلاثة عشر من الهجرة.\nكان أبو بكر قد جَمَع القرآن، وكان في خلافته يُنصِر الإسلام، ويُحارب المُرتدّين، وكان في خلافته يُصلِح بين الناس، ويُنصِر الضعيف.\n\nالأدلة الشرعية:\n• «كان ﷺ في الجَمَع ومعه أبو بكر، وكان أبو بكر في الجَمَع يُشهد على الصدق» — صحيح البخاري\n• «ما أعلم من صحبتِ سيدنا ﷺ، فقد صحبتِ سيدنا ﷺ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. الصدق ركنٌ في الإسلام، ومن أَصادق فقد أَحسَن.\n2. النصرة للإسلام في الشدة سُنّة الصحابة.\n3. الخلافة عهدٌ لا مُلك، ومن أَخلّ بالعهد فقد أَخلّ بالإيمان.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%A3%D8%A8%D9%88%20%D8%A8%D9%83%D8%B1%20%D8%A7%D9%84%D8%B5%D8%AF%D9%91%D9%8A%D9%82"},{"id":"seerah-53","title":"عمر بن الخطاب","group":"السيرة النبوية · الخلفاء الراشدون","summary":"الخليفة الثاني، وناصر الإسلام بالعزّة والقوّة، ومُنظّم الدولة والقضاء.","body":"عمر بن الخطاب\n\nالخليفة الثاني، وناصر الإسلام بالعزّة والقوّة، ومُنظّم الدولة والقضاء.\n\nعمر بن الخطاب بن نُفَيل، وأمّه حَنْتَمَة بنت هاشم، وأول ما أُمِر بالخلافة في عام ثلاثة عشر من الهجرة، وكان عمر يُنصِر الإسلام بالعزّة والقوّة.\nكان عمر في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عمر يُنصِر الأمن، ويُنصِر القضاء، ويُنصِر الدولة.\n\nالأدلة الشرعية:\n• «كان عمر يُنصِر الإسلام بالعزّة والقوّة» — السيرة النبوية لابن كثير\n• «كان عمر في خلافته يُنصِر الإسلام» — الرحيق المختوم\n\nفوائد ودروس:\n1. العزّة والقوّة في الإسلام ليست في العدد بل في التوحيد.\n2. العدل أساس الدولة، ومن أَعدل فقد أَحسَن.\n3. النصرة للضعيف ركنٌ في الإسلام.\n\nالمصادر والمراجع:\n1. السيرة النبوية لابن كثير\n2. البدء والنهاية","kind":"topic","route":"/search?q=%D8%B9%D9%85%D8%B1%20%D8%A8%D9%86%20%D8%A7%D9%84%D8%AE%D8%B7%D8%A7%D8%A8"},{"id":"seerah-54","title":"عثمان بن عفان","group":"السيرة النبوية · الخلفاء الراشدون","summary":"الخليفة الثالث، وجامع المصحف، وسيد الفقراء.","body":"عثمان بن عفان\n\nالخليفة الثالث، وجامع المصحف، وسيد الفقراء.\n\nعثمان بن عفان بن أبي العاص، وأمّه أروى بنت كُرَيز، وأول ما أُمِر بالخلافة في عام ثلاثة وعشرين من الهجرة، وكان عثمان قد جَمَع المصحف.\nكان عثمان في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عثمان قد جَمَع المصحف.\n\nالأدلة الشرعية:\n• «كان عثمان قد جَمَع المصحف» — السيرة النبوية لابن كثير\n• «كان عثمان سيد الفقراء» — الرحيق المختوم\n\nفوائد ودروس:\n1. الإنفاق في سبيل الإسلام ركنٌ في الإسلام.\n2. جمع المصحف نُصرةٌ للقرآن.\n3. الكرم والسخاء سُنّةٌ في الإسلام.\n\nالمصادر والمراجع:\n1. السيرة النبوية لابن كثير\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%B9%D8%AB%D9%85%D8%A7%D9%86%20%D8%A8%D9%86%20%D8%B9%D9%81%D8%A7%D9%86"},{"id":"seerah-55","title":"عليّ بن أبي طالب","group":"السيرة النبوية · الخلفاء الراشدون","summary":"الخليفة الرابع، وصاحب النبي ﷺ في الهجرة، وسيد الحكمة والعلم.","body":"عليّ بن أبي طالب\n\nالخليفة الرابع، وصاحب النبي ﷺ في الهجرة، وسيد الحكمة والعلم.\n\nعليّ بن أبي طالب بن عبد المطلب، وأمّه فاطمة بنت أسد، وأول ما أُمِر بالخلافة في عام خمسة وثلاثين من الهجرة، وكان عليّ قد ناصر النبي ﷺ في الهجرة.\nكان عليّ في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عليّ قد ناصر النبي ﷺ في الهجرة.\n\nالأدلة الشرعية:\n• «كان عليّ قد ناصر النبي ﷺ في الهجرة» — السيرة النبوية لابن كثير\n• «كان عليّ سيد الحكمة والعلم» — الرحيق المختوم\n\nفوائد ودروس:\n1. العلم والصبر سُنّةٌ في الإسلام.\n2. النصرة للحق ركنٌ في الإسلام.\n3. من أَحسَن الحكمة فقد أَحسَن.\n\nالمصادر والمراجع:\n1. السيرة النبوية لابن كثير\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%B9%D9%84%D9%8A%D9%91%20%D8%A8%D9%86%20%D8%A3%D8%A8%D9%8A%20%D8%B7%D8%A7%D9%84%D8%A8"},{"id":"aqeedah-1","title":"تعريف العقيدة ومكانتها","group":"العقيدة","summary":"العقيدة هي التصديق الجازم المُقَرَّن بالعمل، وهي أساس الدين وبركته وثمرته.","body":"تعريف العقيدة ومكانتها\n\nالعقيدة هي التصديق الجازم المُقَرَّن بالعمل، وهي أساس الدين وبركته وثمرته.\n\nالعقيدة في اصطلاح أهل السنة: الجملة الأمور التي يُعتقد بها جازمةً ويُقرّ بها بالقلب ويُعمل بها بالجوارح، وهي التصديق الجازم لا يقبل الشك أو الاحتمال، وهي ما يُسَمّى في الأصول «القِبَل» أو «المذهب».\nومكانتها أنّها الأساس الذي يُبنى عليه العمل، فإن لم يُبنِ العبد عمله على عقيدةٍ صحيحةٍ لم يُقبَل من عمله، ومن هنا كان أول ما يُطلب من العبد أن يُعرف عقيدته ويُثبّت قلبه على الحق قبل أن يُعمل.\n\nالأدلة الشرعية:\n• «فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ وَاسْتَغْفِرْ لِذَنْبِكَ» — سورة محمد 19\n• «الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ» — سورة المائدة 3\n\nفوائد ودروس:\n1. العقيدة أساس، والعمل بناء، فمن أصلح الأساس أصلح البناء.\n2. معرفة العقيدة قبل العمل أصلٌ في منهج أهل السنة.\n3. الاستغفار والتوحيد يُقرن بالعمل لا ينفصلان.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح العقيدة الطحاوية","kind":"topic","route":"/search?q=%D8%AA%D8%B9%D8%B1%D9%8A%D9%81%20%D8%A7%D9%84%D8%B9%D9%82%D9%8A%D8%AF%D8%A9%20%D9%88%D9%85%D9%83%D8%A7%D9%86%D8%AA%D9%87%D8%A7"},{"id":"aqeedah-2","title":"التوحيد وتقسيمه","group":"العقيدة","summary":"التوحيد ثلاثة أقسام: الربوبية، والألوهية، والأسماء والصفات، وكل قسم يُتمّ الآخر.","body":"التوحيد وتقسيمه\n\nالتوحيد ثلاثة أقسام: الربوبية، والألوهية، والأسماء والصفات، وكل قسم يُتمّ الآخر.\n\nالتوحيد هو أن تُعلم أنّ الله وحده ربٌّ، ومعبودٌ بأحقّ الوصف، وبأسمائه وصفاته، ويُقسَم إلى ثلاثة أقسام يُتمّ بعضها بعضًا: توحيد الربوبية، وتوحيد الألوهية، وتوحيد الأسماء والصفات.\nومن نقض قسماً من هذه الأقسام لم يُتمّ التوحيد، فمن أثبت الربوبية ولم يُوحّد في الألوهية فلم يُتمّ التوحيد، كما قال الله عن المشركين: «وَمَا يُؤْمِنُ أَكْثَرُهُم بِاللَّهِ إِلَّا وَهُم مُّشْرِكُونَ».\n\nالأدلة الشرعية:\n• «قُلْ هُوَ اللَّهُ أَحَدٌ» — سورة الإخلاص 1\n• «وَمَا أَمْرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ» — سورة البينة 5\n\nفوائد ودروس:\n1. التوحيد ثلاثة أقسام لا تُفصِل عن بعضها.\n2. من أثبت الربوبية ولم يُوحّد في الألوهية لم يُتمّ التوحيد.\n3. الإخلاص في العبادة هو ثمر التوحيد.\n\nالمصادر والمراجع:\n1. كتاب التوحيد\n2. المجموع الفقهي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AA%D9%88%D8%AD%D9%8A%D8%AF%20%D9%88%D8%AA%D9%82%D8%B3%D9%8A%D9%85%D9%87"},{"id":"aqeedah-3","title":"توحيد الربوبية","group":"العقيدة","summary":"إثبات أنّ الله وحده الخالق الرازق المدبّر المُميت المُحيي.","body":"توحيد الربوبية\n\nإثبات أنّ الله وحده الخالق الرازق المدبّر المُميت المُحيي.\n\nتوحيد الربوبية هو إثبات أنّ الله وحده الخالق الرازق المالك المُدبِّر، لا خالقَ إلا الله ولا رازقَ إلا الله ولا مالكَ إلا الله ولا مُدبِّرَ إلا الله.\nوهذا القسم أقرّ به المشركون كأنّهم لا يعلمون إلا أنّ الله خالقهم ورازقهم، لكنّهم جمعوا معه من الأصنام والأولياء ما لا ينبغي، وهذا هو القسم الذي يستحقّ المُوحِّد به أن يُسمّى مُوحِّدًا.\n\nالأدلة الشرعية:\n• «قُلْ مَن يَرْزُقُكُم مِّنَ السَّمَاءِ وَالْأَرْضِ» — سورة سبأ 24\n• «اللَّهُ خَالِقُ كُلِّ شَيْءٍ» — سورة الزمر 62\n\nفوائد ودروس:\n1. الخالق واحدٌ لا يُشرك به أحد.\n2. الرزق من الله وحده، فمن يُطلب الرزق من غيره فقد أخطأ.\n3. الإقرار بالربوبية لا يُكفي إلا مع الألوهية.\n\nالمصادر والمراجع:\n1. كتاب التوحيد\n2. أسماء الله الحسنى للبخاري","kind":"topic","route":"/search?q=%D8%AA%D9%88%D8%AD%D9%8A%D8%AF%20%D8%A7%D9%84%D8%B1%D8%A8%D9%88%D8%A8%D9%8A%D8%A9"},{"id":"aqeedah-4","title":"توحيد الألوهية","group":"العقيدة","summary":"أن يُفرَّد الله وحده بالعبادة من صلاة ودعاء ونذر واستغاثة.","body":"توحيد الألوهية\n\nأن يُفرَّد الله وحده بالعبادة من صلاة ودعاء ونذر واستغاثة.\n\nتوحيد الألوهية هو أن يُفرَّد الله وحده بالعبادة، من صلاةٍ ودعاءٍ ونذرٍ واستغاثةٍ وذبحٍ وخوفٍ ورجاءٍ، فلا يُشرك به في شيءٍ من هذه الأشياء.\nوهذا هو القسم الذي نزلت به الرسل، والمشركون في الجاهلية لم يُوحّدوا به، وقد أقرّوا بالربوبية، ولهذا قالت الله: «وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ».\n\nالأدلة الشرعية:\n• «فَاعْبُدُوا اللَّهَ وَأَقِيمُوا الصَّلَاةَ» — سورة البقرة 43\n• «فَادْعُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ» — سورة غافر 14\n\nفوائد ودروس:\n1. العبادة لا تكون إلا لله وحده.\n2. الدعاء ركناً من العبادة، فمن دعا من دون الله فقد أشرك.\n3. الإخلاص في كل صلاةٍ ونذرٍ واستغاثةٍ من التوحيد.\n\nالمصادر والمراجع:\n1. كتاب التوحيد\n2. عمدة الأحكام","kind":"topic","route":"/search?q=%D8%AA%D9%88%D8%AD%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A3%D9%84%D9%88%D9%87%D9%8A%D8%A9"},{"id":"aqeedah-5","title":"توحيد الأسماء والصفات","group":"العقيدة","summary":"إثبات ما أثبته الله ورسوله من الأسماء والصفات بلا تحريفٍ ولا تعطيل.","body":"توحيد الأسماء والصفات\n\nإثبات ما أثبته الله ورسوله من الأسماء والصفات بلا تحريفٍ ولا تعطيل.\n\nتوحيد الأسماء والصفات هو إثبات ما أثبته الله لنفسه أو أثبته له رسوله من الأسماء والصفات، ونفي ما نفاه عنه، بلا تحريفٍ ولا تعطيلٍ ولا تشبيهٍ ولا تمثيل، بلا تكييفٍ ولا تخييل.\nفمن قال: أثبت الأسماء والصفات مع تأويلها أو تعطيلها فقد نقض هذا القسم، ومن قال: أشبه الله بخلقه فقد نقضه، والمنهج: الإثبات بلا كيفية، والتنزيه بلا تعطيل.\n\nالأدلة الشرعية:\n• «وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا» — سورة الأعراف 180\n• «لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ» — سورة الشورى 11\n\nفوائد ودروس:\n1. الإثبات بلا كيفية، والتنزيه بلا تعطيل.\n2. أسماء الله الحسنى يجب أن تُطلَب وتُدعى بها.\n3. من أثبت بلا تكييف فقد أتمّ التوحيد.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. أسماء الله الحسنى للبخاري","kind":"topic","route":"/search?q=%D8%AA%D9%88%D8%AD%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A3%D8%B3%D9%85%D8%A7%D8%A1%20%D9%88%D8%A7%D9%84%D8%B5%D9%81%D8%A7%D8%AA"},{"id":"aqeedah-6","title":"الشرك وأنواعه","group":"العقيدة","summary":"الشرك الأكبر والشرك الأصغر والشرك الخفي، وأحكام كل قسم.","body":"الشرك وأنواعه\n\nالشرك الأكبر والشرك الأصغر والشرك الخفي، وأحكام كل قسم.\n\nالشرك هو إشارة شيءٍ إلى الله في شيءٍ من أقسام التوحيد، وأقسامه: الشرك الأكبر، والشرك الأصغر، والشرك الخفي. والشرك الأكبر هو إشراك شيءٍ في العبادة، ولا يُقبَل منه توبة، ومن قام عليه لم يَسْتَغْفِر.\nوالشرك الأصغر هو الرياء والاستعمال المُغَيَّر، فهو شركٌ في العبادة لكنه لا يُخرِج من الدين، ومن قام عليه لم يُعذّب. والشرك الخفي هو التعلّق بالوسائل والإشارات من دون الله.\n\nالأدلة الشرعية:\n• «إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ» — سورة النساء 48\n• «فَمَن يَشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ» — سورة المائدة 72\n\nفوائد ودروس:\n1. الشرك الأكبر لا يُقبَل منه توبة إلا بالتوبة.\n2. الرياء شركٌ أصغر، فليس كما يُشبه الشرك الأكبر.\n3. التعلّق بالوسائل من دون الله شركٌ خفيّ.\n\nالمصادر والمراجع:\n1. كتاب التوحيد\n2. مجموع الفتاوى","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%B4%D8%B1%D9%83%20%D9%88%D8%A3%D9%86%D9%88%D8%A7%D8%B9%D9%87"},{"id":"aqeedah-7","title":"الإيمان بالملائكة","group":"العقيدة","summary":"تصديق أنّ الله خلق ملائكةً من نور، وأنّهم لا يعصون الله ما أمرهم.","body":"الإيمان بالملائكة\n\nتصديق أنّ الله خلق ملائكةً من نور، وأنّهم لا يعصون الله ما أمرهم.\n\nالإيمان بالملائكة ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله خلقهم من نور، وأنّهم لا يعصون الله ما أمرهم ويَفعلون ما يُؤمرون، وأنّ لهم أوطاناً وأشكالاً وأفعالاً لا نعلمها إلا مما نزلت به السنّة.\nومن أشهرهم: جبريل ورُوح، وميكائيل، وإسرافيل، ومالك خازن النار، ورِدْوان? والكرام الكاتبون، والحُمَنَة التي تلتحف العبد في القبر، والنكير والمنكَر؟ وهذه الأسماء تُذكَر في السنّة بوصفٍ مُختَلِف، فالإيمان بهم عمومًا واجب.\n\nالأدلة الشرعية:\n• «آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ» — سورة البقرة 285\n• «وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ» — سورة الطارق 10\n\nفوائد ودروس:\n1. الإيمان بالملائكة ركنٌ من أركان الإيمان.\n2. الملائكة لا يعصون الله ما أمرهم.\n3. الكرام الكاتبون يُدوّنون الأعمال، فليحفظ العبد ما يُعَمّل.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح الأربعين النووية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D9%8A%D9%85%D8%A7%D9%86%20%D8%A8%D8%A7%D9%84%D9%85%D9%84%D8%A7%D8%A6%D9%83%D8%A9"},{"id":"aqeedah-8","title":"الإيمان بالكتب المنزلة","group":"العقيدة","summary":"الإيمان بالقرآن والكتب التي أُنزلت على الرسل.","body":"الإيمان بالكتب المنزلة\n\nالإيمان بالقرآن والكتب التي أُنزلت على الرسل.\n\nالإيمان بالكتب المنزلة ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله أنزل على رسله كتباً بياناً وهدايةً، وأنّ القرآن آخرها، وأنّه محفوظٌ من التحريف، وأنّه ناسخٌ لما سبق من الكتب.\nومن الكتب المنزلة: القرآن، والتوراة، والإنجيل، والزبور، والصحف التي أُنزلت على إبراهيم وموسى، ونحن نُصدّق بها جميعًا ونُقرّ بها، وننصرف إلى القرآن وحده للعمل.\n\nالأدلة الشرعية:\n• «إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ» — سورة الحجر 9\n• «وَأَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ مِنَ الْكِتَابِ» — سورة المائدة 48\n\nفوائد ودروس:\n1. القرآن محفوظٌ من التحريف، وناسخٌ لما سبق من الكتب.\n2. العمل في الدين لا يكون إلا بالقرآن وحده.\n3. الإيمان بالكتب سبق القرآن لا يعارضه.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. الإتقان في علوم القرآن","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D9%8A%D9%85%D8%A7%D9%86%20%D8%A8%D8%A7%D9%84%D9%83%D8%AA%D8%A8%20%D8%A7%D9%84%D9%85%D9%86%D8%B2%D9%84%D8%A9"},{"id":"aqeedah-9","title":"الإيمان بالرسل","group":"العقيدة","summary":"الإيمان بأنّ الله أرسل الرسل، وأنّهم أفضل الأنبياء، وأنّ محمدًا ﷺ خاتمهم.","body":"الإيمان بالرسل\n\nالإيمان بأنّ الله أرسل الرسل، وأنّهم أفضل الأنبياء، وأنّ محمدًا ﷺ خاتمهم.\n\nالإيمان بالرسل ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله أرسل الرسل إلى الناس، وأنّهم أَحسَن بشر وأعلى مَرتبة، وأنّ محمدًا ﷺ خاتمهم، وأنّه أَحسَن بشر وأعلى مَرتبة، وأنّه أَحسَن بشر.\nوكلّ رسول قد أُمِر بالدعوة إلى الله وحده، وكلّهم على واحدٍ من الحق، ومن أَنكَر الرسالة فقد أَنكَر الدين، ومن أَنكَر واحداً منهم فقد أَنكَر جميعاً.\n\nالأدلة الشرعية:\n• «رُسُلًا مُّبَشِّرِينَ وَمُنذِرِينَ» — سورة النساء 165\n• «مَّا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ» — سورة الأحزاب 40\n\nفوائد ودروس:\n1. الرسل أَحسَن بشر وأعلى مَرتبة.\n2. محمد ﷺ خاتم الأنبياء، فليس بعدُ نبيّ ولا رسول.\n3. من أَنكَر واحداً فقد أَنكَر جميعاً.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. العقيدة الواسطية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D9%8A%D9%85%D8%A7%D9%86%20%D8%A8%D8%A7%D9%84%D8%B1%D8%B3%D9%84"},{"id":"aqeedah-10","title":"الإيمان باليوم الآخر","group":"العقيدة","summary":"الإيمان بالبعث والحساب والجنة والنار، وأهوال اليوم الآخر.","body":"الإيمان باليوم الآخر\n\nالإيمان بالبعث والحساب والجنة والنار، وأهوال اليوم الآخر.\n\nالإيمان باليوم الآخر ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله بعث الخلق، وقيَم به الحساب، وجعل للجنة والنار أهلها، وأهوال اليوم الآخر أهوالٌ لا تُشبِهها أهوالُ الدنيا.\nومن أهوال اليوم الآخر: البعث، والنشور، والحساب، والميزان، والصراط، والحوض، والشفاعة، وألّا يعلم أحدٌ إلا الله ما فيه من الغيب، وأنّ الله قد بيّن ما بيّن في القرآن من العذاب والنعيم.\n\nالأدلة الشرعية:\n• «يَوْمَ يُنفَخُ فِي الصُّورِ وَتَأْتِي كُلُّ نَفْسٍ مَّعَهَا سَائِقٌ وَشَهِيدٌ» — سورة ق 21\n• «يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا» — سورة الأعراف 187\n\nفوائد ودروس:\n1. الإيمان باليوم الآخر ركنٌ من أركان الإيمان.\n2. العمل في الدنيا لا يُشهد إلا في اليوم الآخر.\n3. من أَمَل في الدنيا ولم يُعمل فقد أخطأ.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح الأربعين النووية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D9%8A%D9%85%D8%A7%D9%86%20%D8%A8%D8%A7%D9%84%D9%8A%D9%88%D9%85%20%D8%A7%D9%84%D8%A2%D8%AE%D8%B1"},{"id":"aqeedah-11","title":"الإيمان بالقدر خيره وشره","group":"العقيدة","summary":"الإيمان بأنّ الله قدّر كل شيءٍ خيراً وشراً، وأنّ العبد مُخيَّرٌ ومُكلَّف.","body":"الإيمان بالقدر خيره وشره\n\nالإيمان بأنّ الله قدّر كل شيءٍ خيراً وشراً، وأنّ العبد مُخيَّرٌ ومُكلَّف.\n\nالإيمان بالقدر ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله قدّر كل شيءٍ خيراً وشراً، وأنّه علم ما كان وما سيكون، وكتب في اللوح المحفوظ ما كُتِب، وأنّ العبد مُخيَّرٌ ومُكلَّف بقدر ما أُعطي من أُلُوف.\nوهذا القدر ليس تعطيلاً للعبادة، ولا إجبارةً للعبد، بل هو علم الله وإرادته وخلقه وتدبيره، والعبادة تُطلب بجهدٍ لا بجبر.\n\nالأدلة الشرعية:\n• «مَا أَصَابَ مِن مُّصِيبَةٍ فِي الْأَرْضِ وَلَا فِي أَنفُسِكُمْ إِلَّا فِي كِتَابٍ مِّن قَبْلِ أَن نَّبْرَأَهَا» — سورة الحديد 22\n• «وَكَانَ أَمْرُ اللَّهِ قَدَرًا مَّقْدُورًا» — سورة الأحزاب 38\n\nفوائد ودروس:\n1. القدر علمٌ من الله لا يُنقص من العبادة.\n2. الجهد في العبادة مع الرضا بالقدر.\n3. من أَمَل في القدر ولم يُعمل فقد أخطأ.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح العقيدة الواسطية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D9%8A%D9%85%D8%A7%D9%86%20%D8%A8%D8%A7%D9%84%D9%82%D8%AF%D8%B1%20%D8%AE%D9%8A%D8%B1%D9%87%20%D9%88%D8%B4%D8%B1%D9%87"},{"id":"aqeedah-12","title":"أركان الإسلام ومكانتها","group":"العقيدة","summary":"الشاهدتان والصلاة والزكاة والصوم والحج، وربطها بالإيمان.","body":"أركان الإسلام ومكانتها\n\nالشاهدتان والصلاة والزكاة والصوم والحج، وربطها بالإيمان.\n\nأركان الإسلام خمسة: الشهادتان، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحجّ البيت لمن استطاع إليه سبيلاً، وهي أركانٌ لا تُستَقيم الدين بغيرها، وهي أعلى شيءٍ في الإسلام.\nوهذه الأركان تُسبِق الإيمان في الظاهر، وتُتمّه في العمل، فليس إسلامٌ بلا إيمان، ولا إيمانٌ بلا عمل، فمن تركها فقد أَفحَم الدين.\n\nالأدلة الشرعية:\n• «بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ» — صحيح البخاري ومسلم\n• «وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ» — سورة البقرة 43\n\nفوائد ودروس:\n1. الأركان خمسةٌ لا يُستَقيم الدين بغيرها.\n2. من تركها فقد أَفحَم الدين.\n3. العمل يُتمّ الإيمان، والإيمان يُتمّ العمل.\n\nالمصادر والمراجع:\n1. صحيح البخاري\n2. عمدة الأحكام","kind":"topic","route":"/search?q=%D8%A3%D8%B1%D9%83%D8%A7%D9%86%20%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85%20%D9%88%D9%85%D9%83%D8%A7%D9%86%D8%AA%D9%87%D8%A7"},{"id":"aqeedah-13","title":"الإيمان والزيادة والنقصان","group":"العقيدة","summary":"الإيمان قولٌ وعمل، يَزيد ويَنقص، ويُتَمّ بالعلم والعمل.","body":"الإيمان والزيادة والنقصان\n\nالإيمان قولٌ وعمل، يَزيد ويَنقص، ويُتَمّ بالعلم والعمل.\n\nالإيمان قولٌ وعمل، يَزيد ويَنقص، فالأعمال تَزيد الإيمان، والمعاصي تَنقصه، وهذا منهج أهل السنة، وهو خلاف المعتزلة الذين قالوا: الإيمان لا يَزيد ولا يَنقص.\nوقد قال الله: «وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى»، وقال: «وَإِذَا مَا أُنزِلَتْ سُورَةٌ فَمِنَ الْمُؤْمِنِينَ مَن يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا».\n\nالأدلة الشرعية:\n• «وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى» — سورة محمد 17\n• «وَإِذَا مَا أُنزِلَتْ سُورَةٌ فَمِنَ الْمُؤْمِنِينَ مَن يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا» — سورة التوبة 124\n\nفوائد ودروس:\n1. الإيمان يَزيد بالطاعة ويَنقص بالمعصية.\n2. العلم يُزيد الإيمان، فالإيمان لا يكون بلا علم.\n3. من أَمَل في نفسه بلا عمل فقد أخطأ.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح العقيدة الواسطية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D9%8A%D9%85%D8%A7%D9%86%20%D9%88%D8%A7%D9%84%D8%B2%D9%8A%D8%A7%D8%AF%D8%A9%20%D9%88%D8%A7%D9%84%D9%86%D9%82%D8%B5%D8%A7%D9%86"},{"id":"aqeedah-14","title":"قاعدة الإثبات والتنزيه","group":"العقيدة","summary":"إثبات ما أثبته الله بلا تكييف، وتنزيهه عن ما يليق بالخلق بلا تعطيل.","body":"قاعدة الإثبات والتنزيه\n\nإثبات ما أثبته الله بلا تكييف، وتنزيهه عن ما يليق بالخلق بلا تعطيل.\n\nمنهج أهل السنة في الأسماء والصفات: الإثبات بلا تكييف، والتنزيه بلا تعطيل، فنُثبِت ما أثبته الله لنفسه أو أثبته له رسوله، وننفِ ما نفاه عنه، ولا نُشبِهه بخلقه، ولا نُعطّله.\nوهذه القاعدة تُنظّم كل حديثٍ في الأسماء والصفات، فمن قال: نُثبِت بلا كيفية، فقد أَحسَن، ومن قال: نُنزِهه عن ما يليق بالخلق، فقد أَحسَن، ومن أَعطّل فقد أَفحَم، ومن أَشبِه فقد أَفحَم.\n\nالأدلة الشرعية:\n• «لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ» — سورة الشورى 11\n• «وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا» — سورة الأعراف 180\n\nفوائد ودروس:\n1. الإثبات بلا تكييف، والتنزيه بلا تعطيل.\n2. من أَشبِه الله بخلقه فقد أَفحَم.\n3. من أَعطّل فقد أَفحَم، فليُثبِت ما أثبته الله.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح العقيدة الطحاوية","kind":"topic","route":"/search?q=%D9%82%D8%A7%D8%B9%D8%AF%D8%A9%20%D8%A7%D9%84%D8%A5%D8%AB%D8%A8%D8%A7%D8%AA%20%D9%88%D8%A7%D9%84%D8%AA%D9%86%D8%B2%D9%8A%D9%87"},{"id":"aqeedah-15","title":"الاستواء على العرش ورؤية الله","group":"العقيدة","summary":"إثبات الاستواء على العرش بلا كيفية، وإثبات رؤية الله في الآخرة.","body":"الاستواء على العرش ورؤية الله\n\nإثبات الاستواء على العرش بلا كيفية، وإثبات رؤية الله في الآخرة.\n\nأهل السنة يُثبتون الاستواء على العرش بلا كيفية ولا تشبيه ولا تعطيل، ويُثبتون رؤية الله في الآخرة للمؤمنين، كما أثبتَ الله ذلك في القرآن، وأثبَتَه ﷺ في السنّة.\nومن قام بتعطيل الاستواء فقد أَفحَم، ومن قام بتحريفه فقد أَفحَم، ومن قام بتكييفه فقد أَفحَم، فالمنهج: نُثبِت وننزِه وننفي، ولا نُكيّف ولا نُشبِه.\n\nالأدلة الشرعية:\n• «الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ» — سورة طه 5\n• «لَا نُمْسِكُ عَنْكُمْ يَوْمَ تَرَوْنَ رَبَّكُمْ» — رواه مسلم في الحديث القدسي\n\nفوائد ودروس:\n1. الاستواء على العرش يُثبَت بلا كيفية.\n2. رؤية الله في الآخرة يُثبَتها أهل السنة.\n3. من أَعطّل الاستواء فقد أَفحَم.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح العقيدة الواسطية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%88%D8%A7%D8%A1%20%D8%B9%D9%84%D9%89%20%D8%A7%D9%84%D8%B9%D8%B1%D8%B4%20%D9%88%D8%B1%D8%A4%D9%8A%D8%A9%20%D8%A7%D9%84%D9%84%D9%87"},{"id":"aqeedah-16","title":"الشفاعة وأقسامها","group":"العقيدة","summary":"الشفاعة الصغرى والكبرى، وأحكام كل قسم.","body":"الشفاعة وأقسامها\n\nالشفاعة الصغرى والكبرى، وأحكام كل قسم.\n\nالشفاعة في الإسلام قسمان: الشفاعة الصغرى وهي الدعاء والنصحة والمعونة، والشفاعة الكبرى وهي شفاعة النبي ﷺ في يوم القيامة، ولا تُشهد إلا في يوم القيامة، وهي للنبي ﷺ وحده.\nومن أشكل الشفاعة أنّها ليست لكلّ أحد، ولا تُقبل إلا بقرنٍ من الله ورضاه، كما قال الله: «مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ».\n\nالأدلة الشرعية:\n• «مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ» — سورة البقرة 255\n• «عَسَىٰ رَبُّكُمْ أَن يُقِيلَكَ مَقَامًا مَّحْمُودًا» — سورة الإسراء 79\n\nفوائد ودروس:\n1. الشفاعة الكبرى للنبي ﷺ وحده.\n2. الشفاعة لا تُقبل إلا بقرنٍ من الله ورضاه.\n3. الشفاعة الصغرى في الدنيا هي الدعاء والنصحة والمعونة.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح الأربعين النووية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%B4%D9%81%D8%A7%D8%B9%D8%A9%20%D9%88%D8%A3%D9%82%D8%B3%D8%A7%D9%85%D9%87%D8%A7"},{"id":"aqeedah-17","title":"عذاب القبر ونعيمه","group":"العقيدة","summary":"إثبات عذاب القبر ونعيمه، وأنّه حقٌّ في الروح لا في البدن.","body":"عذاب القبر ونعيمه\n\nإثبات عذاب القبر ونعيمه، وأنّه حقٌّ في الروح لا في البدن.\n\nأهل السنة يُثبتون عذاب القبر ونعيمه، وأنّه حقٌّ واقعٌ على الروح والبدن معًا، وأنّه لا يُشهد إلا للملائكة، وأنّه ليس في الدنيا ولا في الآخرة، بل بين الدنيا والآخرة.\nوهذا مستقرٌّ عند أهل السنة، ولهذا كان النبي ﷺ يُدعو بالعافية في القبر، ويعوّذ فتيةً من عذاب القبر، ويُصبر على العذاب، ويدعو بالعافية.\n\nالأدلة الشرعية:\n• «اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ» — صحيح البخاري ومسلم\n• «فَإِنَّهُ لَا يُشْهَدُ إِلَّا لِلْمَلَائِكَةِ» — شرح الأربعين النووية\n\nفوائد ودروس:\n1. عذاب القبر حقٌّ يُثبِته أهل السنة.\n2. الاستعاذة من عذاب القبر سُنّة النبي ﷺ.\n3. من أَحسَن عمله فقد أَحسَن في القبر.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح الأربعين النووية","kind":"topic","route":"/search?q=%D8%B9%D8%B0%D8%A7%D8%A8%20%D8%A7%D9%84%D9%82%D8%A8%D8%B1%20%D9%88%D9%86%D8%B9%D9%8A%D9%85%D9%87"},{"id":"aqeedah-18","title":"الحوض والصحيفة والصراط والميزان","group":"العقيدة","summary":"أهوال يوم القيامة، وأحكام كل قسم من الأهوال.","body":"الحوض والصحيفة والصراط والميزان\n\nأهوال يوم القيامة، وأحكام كل قسم من الأهوال.\n\nالحوض حوضٌ في المِقام، والصحيفة صحيفةٌ فيها الأعمال، والصراط صراطٌ على النار، والميزان ميزانٌ يُعَمَّل به العدل، فكلّها أهوالٌ لا تُشبِهها أهوالُ الدنيا.\nوكلّها حقٌّ يُثبِته أهل السنة، وأمّا الميزان فقد بيّن الله أنه حقّ، وأمّا الصراط فقد بيّن الله أنه حقّ، وأمّا الحوض فقد بيّن الله أنه حقّ.\n\nالأدلة الشرعية:\n• «وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ» — سورة الأنبياء 47\n• «يَوْمَ نَقُولُ لِلْجَنَّةِ أَنْتِ لِأَهْلِهَا» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. الميزان حقٌّ لا يُشهد إلا في يوم القيامة.\n2. الصراط حقٌّ على النار، والحوض حقٌّ في المِقام.\n3. من أَحسَن عمله فقد أَحسَن في يوم القيامة.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AD%D9%88%D8%B6%20%D9%88%D8%A7%D9%84%D8%B5%D8%AD%D9%8A%D9%81%D8%A9%20%D9%88%D8%A7%D9%84%D8%B5%D8%B1%D8%A7%D8%B7%20%D9%88%D8%A7%D9%84%D9%85%D9%8A%D8%B2%D8%A7%D9%86"},{"id":"aqeedah-19","title":"الصحابة وسيادتهم","group":"العقيدة","summary":"العدل في الصحابة، وسيادة أبو بكر وعمر، وثمّة عثمان وعليّ.","body":"الصحابة وسيادتهم\n\nالعدل في الصحابة، وسيادة أبو بكر وعمر، وثمّة عثمان وعليّ.\n\nأهل السنة يُعدلون في الصحابة، ويُثبتون سيادة أبو بكر وعمر، ثم عثمان، ثم عليّ، وأنّهم أَحسَن الأمة، وأنّ الله رضي عنهم جميعاً، وأنّ ما جرى بينهم من الخلاف كان اجتهاداً في الحق.\nومن قام بسَبِّ الصحابة فقد أَفحَم، ومن قام بتبرُّئهم فقد أَحسَن، فالعدل في الصحابة ركنٌ في الإيمان.\n\nالأدلة الشرعية:\n• «رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ» — سورة المجادلة 22\n• «كَانُوا أَحْسَنَ الْأُمَّةِ» — شرح الأربعين النووية\n\nفوائد ودروس:\n1. العدل في الصحابة ركنٌ في الإيمان.\n2. سيادة الخلفاء الراشدين بالترتيب.\n3. من سَبَّ الصحابة فقد أَفحَم.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. شرح العقيدة الطحاوية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%B5%D8%AD%D8%A7%D8%A8%D8%A9%20%D9%88%D8%B3%D9%8A%D8%A7%D8%AF%D8%AA%D9%87%D9%85"},{"id":"aqeedah-20","title":"الولاء والبراء والفرق المنحرفة","group":"العقيدة","summary":"الولاء لله ولمن آمن به، والبراء من الشرك وأهله.","body":"الولاء والبراء والفرق المنحرفة\n\nالولاء لله ولمن آمن به، والبراء من الشرك وأهله.\n\nالولاء والبراء ركنٌ من أركان الإيمان، وهو أن يُوالِي العبد الله ورسوله ومن آمن، وأن يُبَرّأ من الشرك وأهله، وأن يُبَرّأ من الفِرَق المنحرفة من الخوارج والرافضة والجهمية والمعتزلة.\nومن قام بالولاء والبراء فقد أَتمّ الإيمان، ومن قام بغيره فقد أَفحَم، فالولاء والبراء مبدأٌ في التوحيد لا يُفصِل عنه.\n\nالأدلة الشرعية:\n• «لَا تَتَّخِذُوا الْيَهُودَ وَالنَّصَارَىٰ أَوْلِيَاءَ» — سورة المائدة 51\n• «وَمَن يَتَوَلَّ اللَّهَ وَرَسُولَهُ فَأُولَٰئِكَ حِزْبُ اللَّهِ» — سورة المجادلة 22\n\nفوائد ودروس:\n1. الولاء والبراء ركنٌ من أركان الإيمان.\n2. من أَوَلَى الشرك فقد أَفحَم.\n3. من أَبَرّأ من الفِرَق المنحرفة فقد أَحسَن.\n\nالمصادر والمراجع:\n1. عقيدة أهل السنة للطحاوية\n2. مجموع الفتاوى","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%88%D9%84%D8%A7%D8%A1%20%D9%88%D8%A7%D9%84%D8%A8%D8%B1%D8%A7%D8%A1%20%D9%88%D8%A7%D9%84%D9%81%D8%B1%D9%82%20%D8%A7%D9%84%D9%85%D9%86%D8%AD%D8%B1%D9%81%D8%A9"},{"id":"quran-1","title":"تعريف علوم القرآن وفضله","group":"القرآن الكريم · علوم القرآن","summary":"علوم القرآن هي أدوات فهم النص وتدبّره، والقرآن كتابٌ مُعجَز في لفظه ومعناه.","body":"تعريف علوم القرآن وفضله\n\nعلوم القرآن هي أدوات فهم النص وتدبّره، والقرآن كتابٌ مُعجَز في لفظه ومعناه.\n\nعلوم القرآن هي مجموعة الأبواب التي تُفصِل أحوال النص القرآني: كيف نزل، وكيف جُمِع، وكيف ضُبط، وكيف يُقرأ، وكيف يُفهَم، وكيف يُنازَع في فهمه، وكيف تُستَخرَج منه الأحكام والفوائد.\nومكانة هذه الأبواب أنّها وسائل لا غاية، فالغاية هي التدبر والعمل، ومن انصرف إلى الأدوات وترك الغاية فقد أَفحَم، ومن انصرف إلى الغاية بلا أدوات فقد أَضلّ.\n\nالأدلة الشرعية:\n• «كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِّيَدَّبَّرُوا آيَاتِهِ» — سورة ص 29\n• «إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ» — سورة الإسراء 9\n\nفوائد ودروس:\n1. علوم القرآن وسائل، والتدبر والعمل هو الغاية.\n2. من أَحسَن الفهم أَحسَن العمل.\n3. القرآن مُعجَز في لفظه ومعناه.\n\nالمصادر والمراجع:\n1. الإتقان في علوم القرآن للسيوطي\n2. البرهان في علوم القرآن للزركشي","kind":"topic","route":"/search?q=%D8%AA%D8%B9%D8%B1%D9%8A%D9%81%20%D8%B9%D9%84%D9%88%D9%85%20%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86%20%D9%88%D9%81%D8%B6%D9%84%D9%87"},{"id":"quran-2","title":"نزول القرآن وأول ما نزل وآخر ما نزل","group":"القرآن الكريم · علوم القرآن","summary":"نزولٌ مُتَدرِجٌ بأسبابه، وأول ما نزل «اقرأ»، وآخر ما نزل كان من آيات التوبة.","body":"نزول القرآن وأول ما نزل وآخر ما نزل\n\nنزولٌ مُتَدرِجٌ بأسبابه، وأول ما نزل «اقرأ»، وآخر ما نزل كان من آيات التوبة.\n\nالقرآن نزل مُتَدرِجًا على مدى ثلاثة وعشرين عامًا، لا مرةً واحدة، فذلك أَحسَن في التربية وتثبيت القلوب، ومن أول ما نزل: «اقرأ باسم ربك الذي خلق»، ومن آخر ما نزل: «وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ».\nونزول القرآن على سبعة أَحزاب? وأمّا نزوله فقد كان مُتَدرِجًا، وقد كان ﷺ يُسَمّي ما نزل عليه، ويُعَلِّم أهلَه، ويُخبرهم بأسباب النزول، وقد كان ﷺ يُحَدّث أصحابه في القتل والنكال.\n\nالأدلة الشرعية:\n• «وَقُرْآنًا فَرَقْنَاهُ لِتَقْرَأَهُ عَلَى النَّاسِ عَلَىٰ مُكْثٍ» — سورة الإسراء 106\n• «وَقَالَ الَّذِينَ كَفَرُوا لَوْلَا نُزِّلَ عَلَيْهِ الْقُرْآنُ جُمْلَةً وَاحِدَةً» — سورة الفرقان 32\n\nفوائد ودروس:\n1. النزول المُتَدرِج رحمةٌ وتربية، لا عجزٌ في النص.\n2. أول ما نزل أمرٌ بالقراءة، وآخر ما نزل أمرٌ بالتقوى والردّ.\n3. من أَحسَن النزول أَحسَن الفهم.\n\nالمصادر والمراجع:\n1. الإتقان للسيوطي\n2. مباحث في علوم القرآن","kind":"topic","route":"/search?q=%D9%86%D8%B2%D9%88%D9%84%20%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86%20%D9%88%D8%A3%D9%88%D9%84%20%D9%85%D8%A7%20%D9%86%D8%B2%D9%84%20%D9%88%D8%A2%D8%AE%D8%B1%20%D9%85%D8%A7%20%D9%86%D8%B2%D9%84"},{"id":"quran-3","title":"جمع القرآن في عهد أبي بكر","group":"القرآن الكريم · علوم القرآن","summary":"جمع المصحف في صحيفةٍ واحدة بعد معركة اليمامة، واستخلاف العلماء.","body":"جمع القرآن في عهد أبي بكر\n\nجمع المصحف في صحيفةٍ واحدة بعد معركة اليمامة، واستخلاف العلماء.\n\nفي السنة الثانية عشر من الهجرة وقعت معركة اليمامة، وقتُل فيها عددٌ كبير من القرّاء، فأشار عمر إلى أبي بكر بجمع القرآن في مصحفٍ واحد، فوُرِد إلى زيد بن ثابت فجمعه في صحيفة.\nومن هنا كان أول ما جُمِع القرآن صحيفةً واحدة، ثم جُمِع في عهد عثمان في مصحفٍ واحد، وضُبط رسمه، وتُضَرِبت عليه المصاحف، وحُرِستَ عليه المصاحف.\n\nالأدلة الشرعية:\n• «كَانَ زَيْدٌ مِنَ الْقَرَائِكُمْ فَجَمَعُوا الْقُرْآنَ فِي صَحِيفَةٍ» — صحيح البخاري\n• «كَانَ زَيْدٌ مِنَ الْقُرَائِكُمْ، فَجَمَعُوا الْقُرْآنَ فِي مَصْحَفٍ» — الإتقان للسيوطي\n\nفوائد ودروس:\n1. جمع القرآن نُصرةٌ للدين.\n2. من أَحسَن الجمع أَحسَن الفهم.\n3. الحُرِستَ على المصحف ركنٌ في الإسلام.\n\nالمصادر والمراجع:\n1. صحيح البخاري\n2. الإتقان للسيوطي","kind":"topic","route":"/search?q=%D8%AC%D9%85%D8%B9%20%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86%20%D9%81%D9%8A%20%D8%B9%D9%87%D8%AF%20%D8%A3%D8%A8%D9%8A%20%D8%A8%D9%83%D8%B1"},{"id":"quran-4","title":"المصحف في عهد عثمان وضبط الرسم","group":"القرآن الكريم · علوم القرآن","summary":"إمّا المصاحف، وتوحيد رسم المصحف، ومنع اختلاف القرّاء.","body":"المصحف في عهد عثمان وضبط الرسم\n\nإمّا المصاحف، وتوحيد رسم المصحف، ومنع اختلاف القرّاء.\n\nفي عهد عثمان اختلفت المصاحف في الرسم، فأمّر عثمان بضبط رسم المصحف، وخلع المصاحف المُختَلِف، وأمّر بحمل المصاحف إلى البلاد، فلم يَشكُل القرّاء بعد ذلك.\nومن هنا كان رسم المصحف الذي نقرأ به اليوم، وأمّا الرسم فقد كان مُختَلِفًا، وأمّا الضبط فقد كان في عهد عثمان، وأمّا المصاحف فقد كانت مُختَلِفًا.\n\nالأدلة الشرعية:\n• «كَانَ عُثْمَانٌ يُضَرِبُ عَلَى الْمَصْحَفِ وَيُخْلِفُ الْمَصَاحِفَ» — الإتقان للسيوطي\n• «كَانَ عُثْمَانٌ يُضَرِبُ عَلَى الْمَصْحَفِ» — البرهان للزركشي\n\nفوائد ودروس:\n1. ضبط رسم المصحف نُصرةٌ للدين.\n2. من أَحسَن الضبط أَحسَن القراءة.\n3. الحُرِستَ على المصحف ركنٌ في الإسلام.\n\nالمصادر والمراجع:\n1. الإتقان للسيوطي\n2. البرهان للزركشي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%85%D8%B5%D8%AD%D9%81%20%D9%81%D9%8A%20%D8%B9%D9%87%D8%AF%20%D8%B9%D8%AB%D9%85%D8%A7%D9%86%20%D9%88%D8%B6%D8%A8%D8%B7%20%D8%A7%D9%84%D8%B1%D8%B3%D9%85"},{"id":"quran-5","title":"المكي والمدني وعلاماتهما","group":"القرآن الكريم · علوم القرآن","summary":"المكي والمدني بحسب زمان النزول، وعلاماتُ كل قسم.","body":"المكي والمدني وعلاماتهما\n\nالمكي والمدني بحسب زمان النزول، وعلاماتُ كل قسم.\n\nالمكي هو ما نزل قبل الهجرة، والمدني هو ما نزل بعد الهجرة، حتى لو نزل بمكة بعد الهجرة فهو مدنيّ، حتى لو نزل بالمدينة قبل الهجرة فهو مكيّ.\nومن العلامات المكيّة: ألف «كلَّا»، وأسماء الأنبياء، وذكر الجُهُود والقُرّاء، ومن العلامات المدنيّة: ألف «يا أيها الناس»، وذكر الأحكام والمُنافِقين والقِتال.\n\nالأدلة الشرعية:\n• «الَّذِينَ آمَنُوا وَهَاجَرُوا» — الإتقان للسيوطي\n• «الَّذِينَ كَفَرُوا» — البرهان للزركشي\n\nفوائد ودروس:\n1. المكي ما نزل قبل الهجرة، والمدني ما نزل بعد الهجرة.\n2. العلامات لا تُعَمّل إلا مع العلم.\n3. من أَحسَن التمييز أَحسَن الفهم.\n\nالمصادر والمراجع:\n1. الإتقان للسيوطي\n2. البرهان للزركشي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%85%D9%83%D9%8A%20%D9%88%D8%A7%D9%84%D9%85%D8%AF%D9%86%D9%8A%20%D9%88%D8%B9%D9%84%D8%A7%D9%85%D8%A7%D8%AA%D9%87%D9%85%D8%A7"},{"id":"quran-6","title":"أسباب النزول","group":"القرآن الكريم · علوم القرآن","summary":"معرفة سبب نزول الآية تُساعِد في فهمها، والأصل أنّ الآية تُحمل على سببها.","body":"أسباب النزول\n\nمعرفة سبب نزول الآية تُساعِد في فهمها، والأصل أنّ الآية تُحمل على سببها.\n\nأسباب النزول هي الجُهُود والأحداث التي أُنزِلت فيها الآية، ومعرفتها تُساعِد في فهمها، فمن أَحسَن سبب النزول أَحسَن الفهم، ومن لم يَعرف السبب فقد أَضلّ.\nوأمّا الأصل: أنّ الآية تُحمل على سببها، ولا تُختصّ به إن كان السبب خُصوصًا، فالآية تُحمل على سببها وعلى غيره.\n\nالأدلة الشرعية:\n• «فَإِنَّ آيَةً تُنْزَلُ لِسَبَبٍ، فَتُحْمَلُ عَلَى سَبَبِهَا وَعَلَى غَيْرِهِ» — مباحث في علوم القرآن\n• «مَا أَنْزَلَ اللَّهُ الْآيَةَ إِلَّا لِسَبَبٍ» — الإتقان للسيوطي\n\nفوائد ودروس:\n1. معرفة سبب النزول تُساعِد في فهم الآية.\n2. الآية تُحمل على سببها وعلى غيره.\n3. من أَحسَن السبب أَحسَن الفهم.\n\nالمصادر والمراجع:\n1. مباحث في علوم القرآن\n2. الإتقان للسيوطي","kind":"topic","route":"/search?q=%D8%A3%D8%B3%D8%A8%D8%A7%D8%A8%20%D8%A7%D9%84%D9%86%D8%B2%D9%88%D9%84"},{"id":"quran-7","title":"الناسخ والمنسوخ","group":"القرآن الكريم · علوم القرآن","summary":"أن يحلّ حكمٌ محلّ حكمٍ بآيةٍ أُخرى أو سُنّةٍ قطعية.","body":"الناسخ والمنسوخ\n\nأن يحلّ حكمٌ محلّ حكمٍ بآيةٍ أُخرى أو سُنّةٍ قطعية.\n\nالناسخ هو ما حُكِم به، والمنسوخ هو ما أُلغي حكمه، وأمّا الناسخ فقد كان حُكِم به، وأمّا المنسوخ فقد أُلغي حكمه.\nوأمّا شروط النسخ: أن يكون الناسخ آيةً أو سُنّةً قطعية، وأن يكون المنسوخ قد أُنزِل قبل الناسخ، وأن يكون الناسخ قد أُنزِل قبل وفاة النبي ﷺ.\n\nالأدلة الشرعية:\n• «مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نُسِّهَا» — الإتقان للسيوطي\n• «مَا نُنْسِخُ مِنْ آيَةٍ» — البرهان للزركشي\n\nفوائد ودروس:\n1. النسخ حُكِم به، والمنسوخ أُلغي حكمه.\n2. شروط النسخ تُنظّم الفهم.\n3. من أَحسَن الناسخ أَحسَن الفهم.\n\nالمصادر والمراجع:\n1. الإتقان للسيوطي\n2. البرهان للزركشي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%86%D8%A7%D8%B3%D8%AE%20%D9%88%D8%A7%D9%84%D9%85%D9%86%D8%B3%D9%88%D8%AE"},{"id":"quran-8","title":"المحكم والمتشابه","group":"القرآن الكريم · علوم القرآن","summary":"المحكم واضحُ الدلالة، والمتشابه لُغتُه مُجمَعة، والفقهاء يُعَمّلون بالأول.","body":"المحكم والمتشابه\n\nالمحكم واضحُ الدلالة، والمتشابه لُغتُه مُجمَعة، والفقهاء يُعَمّلون بالأول.\n\nالمحكم هو الآية الواضحة الدلالة على مرادها بلا حاجةٍ إلى تأويل، والمتشابه هو الآية التي لا تُحكِم دلالتها على مرادها، ولا تُحكِم على غيرها.\nوقد كان الفقهاء يُعَمّلون بالمحكم، ويُؤوّلون المتشابه بالفهم، ويُخالفون بين المحكم والمتشابه، ولا يُشهد إلا في المحكم.\n\nالأدلة الشرعية:\n• «فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ» — سورة آل عمران 7\n• «وَمَا نَعْلَمُ تَأْوِيلَهُ» — البرهان للزركشي\n\nفوائد ودروس:\n1. المحكم واضحٌ، والمتشابه لا يُشهد.\n2. من أَحسَن المحكم أَحسَن الفهم.\n3. من قام بغير المحكم فقد أَضلّ.\n\nالمصادر والمراجع:\n1. البرهان للزركشي\n2. الإتقان للسيوطي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%85%D8%AD%D9%83%D9%85%20%D9%88%D8%A7%D9%84%D9%85%D8%AA%D8%B4%D8%A7%D8%A8%D9%87"},{"id":"quran-9","title":"تعدد القراءات وعلم القراءات","group":"القرآن الكريم · علوم القرآن","summary":"قراءاتٌ متواترةٌ من النبي ﷺ، وأحكامٌ في الضبط والرسم.","body":"تعدد القراءات وعلم القراءات\n\nقراءاتٌ متواترةٌ من النبي ﷺ، وأحكامٌ في الضبط والرسم.\n\nالقراءات هي طرق القراءة المُتواتِرة من النبي ﷺ، وهي قراءاتٌ لا تُشهد إلا على التواتر، وقد كانت قراءاتٌ مُتواتِرة، وقد كانت قراءاتٌ مُتقارِبة.\nومن أشهر القراءات: نافع المدني، وابن كثير المكي، وأبو عمرو البصري، وابن عامر الشامي، وعاصم الكوفي، وحمزة الكوفي، والكسائي الكوفي، وقد كان الرسم مُختَلِفًا.\n\nالأدلة الشرعية:\n• «أُنزِلَ الْقُرْآنُ عَلَى سَبْعَةِ أَحْرُفٍ» — صحيح البخاري\n• «وَقَرَأَ الْقُرَاءُ عَلَى أَحْرُفٍ» — البرهان للزركشي\n\nفوائد ودروس:\n1. القراءات متواترةٌ من النبي ﷺ.\n2. القراءات سبعةٌ لا تُشهد إلا على التواتر.\n3. من أَحسَن القراءة أَحسَن الفهم.\n\nالمصادر والمراجع:\n1. البرهان للزركشي\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%AA%D8%B9%D8%AF%D8%AF%20%D8%A7%D9%84%D9%82%D8%B1%D8%A7%D8%A1%D8%A7%D8%AA%20%D9%88%D8%B9%D9%84%D9%85%20%D8%A7%D9%84%D9%82%D8%B1%D8%A7%D8%A1%D8%A7%D8%AA"},{"id":"quran-10","title":"الإعجاز البياني والعلمي","group":"القرآن الكريم · علوم القرآن","summary":"القرآن مُعجَز في لفظه ومعناه، ولا يُقابِله شيء.","body":"الإعجاز البياني والعلمي\n\nالقرآن مُعجَز في لفظه ومعناه، ولا يُقابِله شيء.\n\nالإعجاز هو أنّ القرآن لا يُقابِله شيء، ولا يُشهد إلا على التواتر، وقد كان الإعجاز مُتقارِبًا، وقد كان الإعجاز مُتقارِبًا في اللفظ والمعنى، وأمّا الإعجاز العلمي فقد كان في الآيات التي تُشهد على التوحيد.\nومن هنا كان القرآن مُعجَزًا في لفظه ومعناه، ولا يُقابِله شيء، وقد كان الإعجاز مُتقارِبًا في اللفظ والمعنى.\n\nالأدلة الشرعية:\n• «فَأْتُوا بِسُورَةٍ مِّن مِّثْلِهِ» — سورة البقرة 23\n• «لَئِن جَاءَ الْبَشَرُ بِكُلِّ مِثْلِهِ فَلَنْ يُقَابِلُوهُ» — البرهان للزركشي\n\nفوائد ودروس:\n1. القرآن مُعجَز في لفظه ومعناه.\n2. من أَحسَن الإعجاز أَحسَن الفهم.\n3. من أَقَبِل التحدي فقد أَحسَن.\n\nالمصادر والمراجع:\n1. البرهان للزركشي\n2. الإتقان للسيوطي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D8%B9%D8%AC%D8%A7%D8%B2%20%D8%A7%D9%84%D8%A8%D9%8A%D8%A7%D9%86%D9%8A%20%D9%88%D8%A7%D9%84%D8%B9%D9%84%D9%85%D9%8A"},{"id":"quran-11","title":"مناسبات الآيات والسور","group":"القرآن الكريم · علوم القرآن","summary":"المناسبات بين الآيات والسور تُفصِل النص، وتُنظّم الفهم.","body":"مناسبات الآيات والسور\n\nالمناسبات بين الآيات والسور تُفصِل النص، وتُنظّم الفهم.\n\nالمناسبات هي العَلَائِق بين الآيات والسور، وقد كانت المناسبات مُتقارِبة، وقد كانت المناسبات مُتقارِبة في المعنى والفهم.\nومن هنا كان العلماء يُعَمّلون بالمناسبات، ويُعَمّلون بالفهم، ويُعَمّلون بالتدبر، ويُعَمّلون بالعمل.\n\nالأدلة الشرعية:\n• «كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ» — البرهان للزركشي\n• «وَقَدْ كَانَتِ الْمَنَاسَبَاتُ مُتَقَارِبَةً» — الإتقان للسيوطي\n\nفوائد ودروس:\n1. المناسبات تُنظّم الفهم.\n2. من أَحسَن المناسبات أَحسَن الفهم.\n3. من أَعَمّل بالمناسبات فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الإتقان للسيوطي\n2. البرهان للزركشي","kind":"topic","route":"/search?q=%D9%85%D9%86%D8%A7%D8%B3%D8%A8%D8%A7%D8%AA%20%D8%A7%D9%84%D8%A2%D9%8A%D8%A7%D8%AA%20%D9%88%D8%A7%D9%84%D8%B3%D9%88%D8%B1"},{"id":"quran-12","title":"أسماء القرآن وترتيب المصحف","group":"القرآن الكريم · علوم القرآن","summary":"القرآن له أسماءٌ متعددة، وترتيبُ المصحف توقيفيّ.","body":"أسماء القرآن وترتيب المصحف\n\nالقرآن له أسماءٌ متعددة، وترتيبُ المصحف توقيفيّ.\n\nللقرآن أسماءٌ متعددة: القرآن، والفرقان، والكتاب، والذكر، والنور، والهُدى، والشِفاء، والحق، والتنزيل، وأمّا أسماء القرآن فقد كانت مُتعددة.\nوأمّا ترتيب المصحف فقد كان توقيفيًّا، فقد كان ﷺ يُخبر جبريل بالترتيب، ويُرَتِّب بالحُكم، وقد كان الترتيب توقيفيًّا.\n\nالأدلة الشرعية:\n• «إِنَّهُ لَقُرْآنٌ كَرِيمٌ» — سورة الحاقّة 40\n• «وَقَدْ كَانَ التَّرْتِيبُ تَوْقِيفِيًّا» — الإتقان للسيوطي\n\nفوائد ودروس:\n1. القرآن له أسماءٌ متعددة.\n2. ترتيب المصحف توقيفيّ.\n3. من أَحسَن الترتيب أَحسَن الفهم.\n\nالمصادر والمراجع:\n1. الإتقان للسيوطي\n2. البرهان للزركشي","kind":"topic","route":"/search?q=%D8%A3%D8%B3%D9%85%D8%A7%D8%A1%20%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86%20%D9%88%D8%AA%D8%B1%D8%AA%D9%8A%D8%A8%20%D8%A7%D9%84%D9%85%D8%B5%D8%AD%D9%81"},{"id":"tajweed-1","title":"تعريف التجويد وحكمه وفضله","group":"القرآن الكريم · التجويد","summary":"التجويد إعطاء كل حرفٍ حقّه من مخرجٍ وصفة، وواجبٌ على كل قارئ.","body":"تعريف التجويد وحكمه وفضله\n\nالتجويد إعطاء كل حرفٍ حقّه من مخرجٍ وصفة، وواجبٌ على كل قارئ.\n\nالتجويد في اللغة: الإحسان والإتقان، وفي الاصطلاح: إعطاء كل حرفٍ حقّه من مخرجٍ وصفةٍ لازمَة أو عرضية، وحكمه فرضٌ كفائيّ على الأمة، وواجبٌ عينيّ على من أراد أن يُقرأ القرآن كما أُنزِل.\nومن أَراد أن يُقرأ القرآن كما أُنزِل فليُعَلّم التجويد، وليُعَمّل به، وليُقرأ بالتجويد، وليُعَمّل به، وليُقرأ بالتجويد.\n\nالأدلة الشرعية:\n• «وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا» — سورة المزمل 4\n• «إِنَّ الْأَنْتَ يُقْرَأُ فِي الْمَشِيئَةِ» — المقدمة الجزرية\n\nفوائد ودروس:\n1. التجويد فرضٌ كفائيّ وواجبٌ عينيّ على القارئ.\n2. من أَحسَن التجويد أَحسَن القراءة.\n3. اللحن الجلي مُحرِّم، واللحن الخفيّ مُنقصٌ للقراءة.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%AA%D8%B9%D8%B1%D9%8A%D9%81%20%D8%A7%D9%84%D8%AA%D8%AC%D9%88%D9%8A%D8%AF%20%D9%88%D8%AD%D9%83%D9%85%D9%87%20%D9%88%D9%81%D8%B6%D9%84%D9%87"},{"id":"tajweed-2","title":"الاستعاذة والبسملة","group":"القرآن الكريم · التجويد","summary":"الاستعاذة قبل القراءة، والبسملة في أول السورة، وأحكام الوصل بينهما.","body":"الاستعاذة والبسملة\n\nالاستعاذة قبل القراءة، والبسملة في أول السورة، وأحكام الوصل بينهما.\n\nالاستعاذة: أن يقول القارئ: «أعوذ بالله من الشيطان الرجيم» قبل القراءة، وهي سُنّة، وقد أمّر الله ﷺ بالاستعاذة، وقد كانت الاستعاذة سُنّة.\nوالبسملة: «بسم الله الرحمن الرحيم» في أول كل سورة إلا التوبة، وأمّا الوصل بين الاستعاذة والبسملة والسورة فقد كان في الأحكام، وقد كانت الاستعاذة سُنّة.\n\nالأدلة الشرعية:\n• «فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ» — سورة النحل 98\n• «بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ» — أول سورة الفاتحة\n\nفوائد ودروس:\n1. الاستعاذة سُنّة قبل القراءة.\n2. البسملة في أول كل سورة إلا التوبة.\n3. من أَحسَن الاستعاذة أَحسَن القراءة.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%B9%D8%A7%D8%B0%D8%A9%20%D9%88%D8%A7%D9%84%D8%A8%D8%B3%D9%85%D9%84%D8%A9"},{"id":"tajweed-3","title":"مخارج الحروف","group":"القرآن الكريم · التجويد","summary":"كل حرفٍ له مخرجٌ معروف، ومعرفة المخارج تحمي من اللحن.","body":"مخارج الحروف\n\nكل حرفٍ له مخرجٌ معروف، ومعرفة المخارج تحمي من اللحن.\n\nمخارج الحروف هي أماكن ظهور الحروف من الفم والحنجرة، وهي سبعة عشر مخارجًا، وقد كانت المخارج مُتقارِبة، وقد كانت المخارج مُتقارِبة في الفم والحنجرة.\nومن أَحسَن المخارج أَحسَن القراءة، ومن أَخطأ المخرج فقد أَخطأ الحرف، وقد كان اللحن مُتقارِبًا.\n\nالأدلة الشرعية:\n• «كُلُّ حَرْفٍ لَهُ مَخْرَجٌ مَعْلُومٌ» — هداية القاري للداني\n• «وَمَنْ أَخْطَأَ الْمَخْرَجَ أَخْطَأَ الْحَرْفَ» — المقدمة الجزرية\n\nفوائد ودروس:\n1. مخارج الحروف سبعة عشر مخارجًا.\n2. من أَحسَن المخارج أَحسَن القراءة.\n3. من أَخطأ المخرج فقد أَخطأ الحرف.\n\nالمصادر والمراجع:\n1. هداية القاري للداني\n2. المقدمة الجزرية","kind":"topic","route":"/search?q=%D9%85%D8%AE%D8%A7%D8%B1%D8%AC%20%D8%A7%D9%84%D8%AD%D8%B1%D9%88%D9%81"},{"id":"tajweed-4","title":"صفات الحروف","group":"القرآن الكريم · التجويد","summary":"صفاتٌ لازمةٌ وعرضية، ومعرفة الصفات تُكمّل أداء الحرف.","body":"صفات الحروف\n\nصفاتٌ لازمةٌ وعرضية، ومعرفة الصفات تُكمّل أداء الحرف.\n\nصفات الحروف هي أوصاف تظهر بالحرف عند نطقه، وهي لازمةٌ لا تُفارِقه، وعرضيةٌ تُفارِقه، وقد كانت الصفات مُتقارِبة.\nومن اللازمة: الجهر، والشدّة، والاستعلاء، والانفتاح، والصفير، والقلقلة، واللين، والانفراج، والاستطالة، والاستمالة، والغُنّة.\n\nالأدلة الشرعية:\n• «كُلُّ حَرْفٍ لَهُ صِفَاتٌ» — هداية القاري للداني\n• «وَمَنْ أَحْسَنَ الصِّفَاتِ أَحْسَنَ الْأَدَاءَ» — المقدمة الجزرية\n\nفوائد ودروس:\n1. الصفات لازمةٌ وعرضية.\n2. من أَحسَن الصفات أَحسَن الأداء.\n3. من أَنكَر الصفات فقد أَفحَم.\n\nالمصادر والمراجع:\n1. هداية القاري للداني\n2. المقدمة الجزرية","kind":"topic","route":"/search?q=%D8%B5%D9%81%D8%A7%D8%AA%20%D8%A7%D9%84%D8%AD%D8%B1%D9%88%D9%81"},{"id":"tajweed-5","title":"أحكام النون الساكنة والتنوين","group":"القرآن الكريم · التجويد","summary":"أربعة أحكام: الإظهار، والإدغام، والإقلاب، والإخفاء.","body":"أحكام النون الساكنة والتنوين\n\nأربعة أحكام: الإظهار، والإدغام، والإقلاب، والإخفاء.\n\nالنون الساكنة والتنوين لها أربعة أحكام: الإظهار عند الحلقية، والإدغام عند اللام والنون (بغنة) والياء والراء والميم والواو، والإقلاب عند الباء، والإخفاء عند الباقي.\nومن أَحسَن الأحكام أَحسَن القراءة، ومن أَخطأ الإخفاء فقد أَخطأ الغُنّة، وقد كانت الأحكام مُتقارِبة.\n\nالأدلة الشرعية:\n• «إِذَا تَوَضَّأَ بِالنُّونِ فَاسْتَقِمْ» — المقدمة الجزرية\n• «وَإِنْ نَأْتَى الْبَاءُ فَقَلِبْ» — المقدمة الجزرية\n\nفوائد ودروس:\n1. أحكام النون الساكنة والتنوين أربعة.\n2. من أَحسَن الإخفاء أَحسَن القراءة.\n3. من أَخطأ الغُنّة فقد أَخطأ القراءة.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A3%D8%AD%D9%83%D8%A7%D9%85%20%D8%A7%D9%84%D9%86%D9%88%D9%86%20%D8%A7%D9%84%D8%B3%D8%A7%D9%83%D9%86%D8%A9%20%D9%88%D8%A7%D9%84%D8%AA%D9%86%D9%88%D9%8A%D9%86"},{"id":"tajweed-6","title":"أحكام الميم الساكنة","group":"القرآن الكريم · التجويد","summary":"الإظهار الحلققي، والإدغام الشفوي، والإقلاب، والإخفاء الحقيقي، والمدّ.","body":"أحكام الميم الساكنة\n\nالإظهار الحلققي، والإدغام الشفوي، والإقلاب، والإخفاء الحقيقي، والمدّ.\n\nالميم الساكنة لها خمسة أحكام: الإظهار الحلققي عند اللام والراء، والإدغام الشفوي عند الميم، والإقلاب عند الباء، والإخفاء الحقيقي عند الباقي، ووجوب مدّ الألفين عند الميم المشدّدة.\nومن أَحسَن الأحكام أَحسَن القراءة، وقد كانت الأحكام مُتقارِبة، وقد كانت الأحكام مُتقارِبة في الضبط.\n\nالأدلة الشرعية:\n• «اللَّافِ وَالرَّاءِ اُظْهِرْ حَلْقِيًّا» — المقدمة الجزرية\n• «وَإِنْ لَقِيَتْ مِيمًا تَدْغَمْ شَفَوِيًّا» — المقدمة الجزرية\n\nفوائد ودروس:\n1. أحكام الميم الساكنة خمسة.\n2. من أَحسَن الإخفاء أَحسَن القراءة.\n3. من أَنكَر الأحكام فقد أَفحَم.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A3%D8%AD%D9%83%D8%A7%D9%85%20%D8%A7%D9%84%D9%85%D9%8A%D9%85%20%D8%A7%D9%84%D8%B3%D8%A7%D9%83%D9%86%D8%A9"},{"id":"tajweed-7","title":"المدود وأنواعها","group":"القرآن الكريم · التجويد","summary":"المدّ الطبيعي، والفرعي: واجبٌ متّصل، جائزٌ منفصل، لازمٌ كَلِميّ وحَرْفيّ.","body":"المدود وأنواعها\n\nالمدّ الطبيعي، والفرعي: واجبٌ متّصل، جائزٌ منفصل، لازمٌ كَلِميّ وحَرْفيّ.\n\nالمدّ هو إطالة الصوت بالحرف المدّي أو الين، وله قسم: مدّ طبيعي حَرْفان، ومدّ فرعي يزيد على ذلك، ومن الفرعي: الواجب المتّصل، والجائز المنفصل، واللازم الكَلِميّ، واللازم الحَرْفيّ.\nومن أَحسَن المدّ أَحسَن القراءة، ومن زاد أو نقص في المدّ فقد أَخطأ، وقد كان المدّ مُتقارِبًا في الضبط.\n\nالأدلة الشرعية:\n• «وَالْمَدُّ فِي الْحُرُوفِ الثَّلَاثَةِ» — المقدمة الجزرية\n• «وَمَا يُزِيدُ أَوْ يَنْقُصُ فَقَدْ أَخْطَأَ» — المقدمة الجزرية\n\nفوائد ودروس:\n1. المدّ طبيعيٌّ وفرعيّ.\n2. من زاد أو نقص في المدّ فقد أَخطأ.\n3. من أَحسَن المدّ أَحسَن القراءة.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%85%D8%AF%D9%88%D8%AF%20%D9%88%D8%A3%D9%86%D9%88%D8%A7%D8%B9%D9%87%D8%A7"},{"id":"tajweed-8","title":"القلقلة","group":"القرآن الكريم · التجويد","summary":"اضطراب الصوت عند الحروف المُجمَعة في «قطب جدّ» عند السكون.","body":"القلقلة\n\nاضطراب الصوت عند الحروف المُجمَعة في «قطب جدّ» عند السكون.\n\nالقلقلة هي اضطراب الصوت عند نطق الحرف عند السكون، وحروفها مُجمَعة في «قطب جدّ»، وهي: ق، ط، ب، ج، د.\nومن أَحسَن القلقلة أَحسَن القراءة، ومن زاد في القلقلة فقد أَخطأ، وقد كانت القلقلة مُتقارِبة في الضبط.\n\nالأدلة الشرعية:\n• «وَقُطْبُ جَدٍّ قَلْقَلَةٌ» — المقدمة الجزرية\n• «وَمَنْ أَحْسَنَ الْقَلْقَلَةَ أَحْسَنَ الْأَدَاءَ» — هداية القاري للداني\n\nفوائد ودروس:\n1. حروف القلقلة خمسة: ق، ط، ب، ج، د.\n2. من زاد في القلقلة فقد أَخطأ.\n3. من أَحسَن القلقلة أَحسَن الأداء.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%82%D9%84%D9%82%D9%84%D8%A9"},{"id":"tajweed-9","title":"اللام الشمسية والقمرية","group":"القرآن الكريم · التجويد","summary":"اللام التي تُدغَم شمسيةٌ، والتي تُظهَر قمريةٌ، ومثالٌ لكل قسم.","body":"اللام الشمسية والقمرية\n\nاللام التي تُدغَم شمسيةٌ، والتي تُظهَر قمريةٌ، ومثالٌ لكل قسم.\n\nاللام الشمسية هي التي تُدغَم فيما بعدها، وحروفها مُجمَعة في «طب ثم صل رحيما تفّض ذكْرم شُكْ نِمْ دُسْ لِهُ»، واللام القمرية هي التي تُظهَر، وهي الباقي.\nومن أَحسَن التمييز أَحسَن القراءة، وقد كان التمييز مُتقارِبًا في الضبط.\n\nالأدلة الشرعية:\n• «وَاللَّامُ الشَّمْسِيَّةُ تُدْغَمُ» — المقدمة الجزرية\n• «وَاللَّامُ الْقَمَرِيَّةُ تُظْهَرُ» — المقدمة الجزرية\n\nفوائد ودروس:\n1. اللام الشمسية تُدغَم، والقمرية تُظهَر.\n2. من أَحسَن التمييز أَحسَن القراءة.\n3. من أَخطأ التمييز فقد أَخطأ القراءة.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%84%D8%A7%D9%85%20%D8%A7%D9%84%D8%B4%D9%85%D8%B3%D9%8A%D8%A9%20%D9%88%D8%A7%D9%84%D9%82%D9%85%D8%B1%D9%8A%D8%A9"},{"id":"tajweed-10","title":"التفخيم والترقيق والراء","group":"القرآن الكريم · التجويد","summary":"الراء مفخّمةٌ في أحوال، مرقّقةٌ في أحوال، وتفخيمٌ وترقيقٌ عام.","body":"التفخيم والترقيق والراء\n\nالراء مفخّمةٌ في أحوال، مرقّقةٌ في أحوال، وتفخيمٌ وترقيقٌ عام.\n\nالراء مفخّمةٌ في أحوال، ومرقّقةٌ في أحوال، ومن الفخم: الراء المُشبَعَة، والراء المُسكَنة، والراء المُمدّدة، ومن الترقيق: الراء المُكسَرة، والراء الساكنة بعد كسر.\nوأمّا التفخيم والترقيق فقد كانا مُتقارِبَين، وقد كان التفخيم مُتقارِبًا في الضبط، وأمّا الترقيق فقد كان مُتقارِبًا في الضبط.\n\nالأدلة الشرعية:\n• «وَالرَّاءُ مُفَخَّمَةٌ وَمُرَقَّقَةٌ» — المقدمة الجزرية\n• «وَمَنْ أَحْسَنَ التَّفْخِيمَ أَحْسَنَ الْأَدَاءَ» — هداية القاري للداني\n\nفوائد ودروس:\n1. الراء مفخّمةٌ ومرقّقةٌ.\n2. من أَحسَن التفخيم أَحسَن الأداء.\n3. من أَخطأ التفخيم فقد أَخطأ القراءة.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AA%D9%81%D8%AE%D9%8A%D9%85%20%D9%88%D8%A7%D9%84%D8%AA%D8%B1%D9%82%D9%8A%D9%82%20%D9%88%D8%A7%D9%84%D8%B1%D8%A7%D8%A1"},{"id":"tajweed-11","title":"الإدغام والهمزات","group":"القرآن الكريم · التجويد","summary":"الإدغام بغنةٍ وبغيرها، والهمزة المقطعة والموصولة.","body":"الإدغام والهمزات\n\nالإدغام بغنةٍ وبغيرها، والهمزة المقطعة والموصولة.\n\nالإدغام هو إدخال حرفٍ ساكنٍ في حرفٍ متحرك، وهو بغنةٍ عند الياء والنون والميم والواو، وبغير غنةٍ عند اللام والراء، وقد كان الإدغام مُتقارِبًا في الضبط.\nوأمّا الهمزات فقد كان القسم قُطعًا ووُصلاً، وقد كان الهمزة المقطعة في أول الكلمة، والهمزة الموصولة في وسط الكلمة، وقد كان التبادل مُتقارِبًا.\n\nالأدلة الشرعية:\n• «وَالْإِدْغَامُ بِغُنَّةٍ وَبِغَيْرِهَا» — المقدمة الجزرية\n• «وَالْهَمْزَةُ قَطْعًا وَوَصْلًا» — المقدمة الجزرية\n\nفوائد ودروس:\n1. الإدغام بغنةٍ وبغير غنة.\n2. الهمزة قَطعًا ووُصلًا.\n3. من أَحسَن الهمزات أَحسَن القراءة.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D8%AF%D8%BA%D8%A7%D9%85%20%D9%88%D8%A7%D9%84%D9%87%D9%85%D8%B2%D8%A7%D8%AA"},{"id":"tajweed-12","title":"الوقف والابتداء","group":"القرآن الكريم · التجويد","summary":"أقسام الوقف: تام، كافٍ، جائز، حسن، قبيح، ومُستَحسَن.","body":"الوقف والابتداء\n\nأقسام الوقف: تام، كافٍ، جائز، حسن، قبيح، ومُستَحسَن.\n\nالوقف هو قطع القراءة عن آخر الكلمة زمنًا عادةً نَفَسَين، وأقسامه: تام، وكافٍ، وجائز، وحسن، وقبيح، ومُستَحسَن، ومن أَحسَن الوقف أَحسَن القراءة.\nوأمّا الابتداء فقد كان مُتقارِبًا، وقد كان الابتداء مُتقارِبًا في الضبط، وقد كان الابتداء مُتقارِبًا في المعنى.\n\nالأدلة الشرعية:\n• «وَالْوَقْفُ تَامٌ وَكَافِيٌّ وَجَائِزٌ» — المقدمة الجزرية\n• «وَمَنْ أَحْسَنَ الْوَقْفَ أَحْسَنَ الْقِرَاءَةَ» — هداية القاري للداني\n\nفوائد ودروس:\n1. الوقف تام وكافٍ وجائز.\n2. من أَحسَن الوقف أَحسَن القراءة.\n3. من أَخطأ الوقف فقد أَخطأ المعنى.\n\nالمصادر والمراجع:\n1. المقدمة الجزرية\n2. هداية القاري للداني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%88%D9%82%D9%81%20%D9%88%D8%A7%D9%84%D8%A7%D8%A8%D8%AA%D8%AF%D8%A7%D8%A1"},{"id":"fiqh-taharah-1","title":"التعريف وأنواع المياه","group":"الفقه الإسلامي · الطهارة","summary":"الطهارة إزالة الحدث والنجاسة، والماء أوّل ما يُبنى عليه.","body":"التعريف وأنواع المياه\n\nالطهارة إزالة الحدث والنجاسة، والماء أوّل ما يُبنى عليه.\n\nالطهارة في اصطلاح الفقهاء: إزالة الحدث من الجسد، وإزالة النجاسة من الثوب والمكان، وأصلها الماء الطاهر، وقد قُسّم الماء إلى: طاهرٍ طَهُورٍ بذاته، وطاهرٍ طَهُورٍ سبباً، وغير ناجسٍ لم يُرَ ذلك.\nوالماء المستعمَل يُكره الوضوء به، وقد قُسّم الفقهاء على أقوالٍ، وأصلُه أنّه يُنقَد بالنجاسة، ولا يُنقَد بالاستعمال لحده.\n\nالأدلة الشرعية:\n• «وَنَزَّلْنَا مِنَ السَّمَاءِ مَاءً طَهُورًا» — سورة الفرقان 48\n• «الطَّهُورُ شُطْفُ وَجْهِ الْمُسْلِمِ» — رواه أحمد وأصحاب السُّنّة\n\nفوائد ودروس:\n1. الطهارة شرطٌ في الصلاة، فمن لم يَطَهّر لم تُقبَل صلاته.\n2. الماء الطاهر يُنقِد النجاسة، ولا يُنقِد بالاستعمال لحده.\n3. من أَحسَن الطهارة أَحسَن الصلاة.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AA%D8%B9%D8%B1%D9%8A%D9%81%20%D9%88%D8%A3%D9%86%D9%88%D8%A7%D8%B9%20%D8%A7%D9%84%D9%85%D9%8A%D8%A7%D9%87"},{"id":"fiqh-taharah-2","title":"الوضوء وفرائضه ونواقضه","group":"الفقه الإسلامي · الطهارة","summary":"الوضوء رُكِنٌ في الصلاة، وله فرائضٌ وسننٌ ونواقض.","body":"الوضوء وفرائضه ونواقضه\n\nالوضوء رُكِنٌ في الصلاة، وله فرائضٌ وسننٌ ونواقض.\n\nالوضوء فرضٌ على كل مُكلَّفٍ قبل الصلاة، وفرائضه عند الشافعية والحنابلة: النية، وغسل الوجه، وغسل اليدين إلى المرفقين، ومسح الرأس، وغسل القدمين إلى الكعبين، وبعضها يُمَهَّد عند المالكية والحنفية.\nونواقضه: ما خَرَج من السُّبلين، والنَّوم المُستَقِيم، وفَقد العَقل، ولمس الفرج باليد من غير حائل، وأكل لحم الجزور، وَشُكُّ هذا الأخير عند الشافعية.\n\nالأدلة الشرعية:\n• «يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ» — سورة المائدة 6\n• «لَا صَلَاةَ لِمَنْ لَا وُضُوءَ لَهُ» — رواه البخاري ومسلم\n\nفوائد ودروس:\n1. الوضوء شرطٌ في الصلاة، فمن لم يَتَوضّأ لم تُقبَل صلاته.\n2. النية شرطٌ في الوضوء، فمن لم يَتَنَوّأ فقد أَفحَم.\n3. من أَحسَن الوضوء أَحسَن الصلاة.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المجموع للنووي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%88%D8%B6%D9%88%D8%A1%20%D9%88%D9%81%D8%B1%D8%A7%D8%A6%D8%B6%D9%87%20%D9%88%D9%86%D9%88%D8%A7%D9%82%D8%B6%D9%87"},{"id":"fiqh-taharah-3","title":"الغسل وما يجب معه","group":"الفقه الإسلامي · الطهارة","summary":"الغسل لمن قُدِم عليه الحدث الأكبر، وفرائضه ونواقضه.","body":"الغسل وما يجب معه\n\nالغسل لمن قُدِم عليه الحدث الأكبر، وفرائضه ونواقضه.\n\nالغسل فرضٌ لمن قُدِم عليه الحدث الأكبر، مثل: الجِنَابة، والحيض، والنفاس، ومَن جاء من المَطَع والنَّفَس، وأصلُه أن يُخِفّ في الأعضاء، وفرائضه عند الشافعية: النية، وشمل البدن بالماء، ودَفْع ما يُمنِع الماء.\nوقد قُدِم على الغسل من السُّنّة: الترتيب، والسُّنّة الواقعة، وأمّا المُستَقِيم فقد كان يُعَمّل بالغسل، وأمّا المُخالف فقد كان يُعَمّل بالغسل.\n\nالأدلة الشرعية:\n• «وَإِنْ كُنْتُمْ جُنُبًا فَاطَّهَّرُوا» — سورة المائدة 6\n• «كَانَ ﷺ يُغَسِّلُ رَأْسَهُ وَيَتَوَضَّأُ» — صحيح البخاري\n\nفوائد ودروس:\n1. الغسل فرضٌ على من قُدِم عليه الحدث الأكبر.\n2. النية شرطٌ في الغسل، وشمل البدن بالماء رُكِنٌ.\n3. من أَحسَن الغسل أَحسَن الصلاة.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%BA%D8%B3%D9%84%20%D9%88%D9%85%D8%A7%20%D9%8A%D8%AC%D8%A8%20%D9%85%D8%B9%D9%87"},{"id":"fiqh-taharah-4","title":"التيمم","group":"الفقه الإسلامي · الطهارة","summary":"التيمم بديلٌ عن الماء عند العَجْزِ أو الخَوفِ أو المَرَض.","body":"التيمم\n\nالتيمم بديلٌ عن الماء عند العَجْزِ أو الخَوفِ أو المَرَض.\n\nالتيمم رُخْصَةٌ عند العَجْزِ عن الماء، أو الخَوفِ من الماء، أو المَرَضِ، ويُعَمَّل بترابٍ طاهرٍ، ويُمسَح به الوجه والكفّين، وأصلُه نية.\nوأصلُ التيمم: أن يَنقَد الطهارة بالماء، فمن لم يَنقَد فقد أَفحَم، ومن أَحسَن التيمم فقد أَحسَن الطهارة.\n\nالأدلة الشرعية:\n• «فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا وُجُوهَكُمْ» — سورة النساء 43\n• «كَانَ ﷺ يَتَيَمَّمُ بِالتُّرْبَةِ» — صحيح البخاري\n\nفوائد ودروس:\n1. التيمم رُخْصَةٌ عند العَجْزِ عن الماء.\n2. النية شرطٌ في التيمم.\n3. من أَحسَن التيمم أَحسَن الطهارة.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AA%D9%8A%D9%85%D9%85"},{"id":"fiqh-taharah-5","title":"المسح على الخفين والعمامة","group":"الفقه الإسلامي · الطهارة","summary":"المسح على الخفين رُخْصَةٌ للمُقلَلين.","body":"المسح على الخفين والعمامة\n\nالمسح على الخفين رُخْصَةٌ للمُقلَلين.\n\nالمسح على الخفين رُخْصَةٌ للمُقلَلين، وقد كان المُقلَلون يُعَمّلون بالمسح، وقد كان المسح على الخفين رُخْصَةٌ للطهارة، وقد كان المسح على الخفين رُخْصَةٌ للمُقلَلين.\nوأمّا مدّة المسح فقد كانت يومًا وليلةً للمُقام، وثلاثة أيّامٍ وليلَتهن للمُسافِر، وقد كانت المُستَجَدة على الخفين.\n\nالأدلة الشرعية:\n• «فَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ» — سورة المائدة 6\n• «كَانَ ﷺ يَمْسَحُ عَلَى الْخُفَّيْنِ» — رواه أحمد وأصحاب السُّنّة\n\nفوائد ودروس:\n1. المسح على الخفين رُخْصَةٌ للطهارة.\n2. مدّة المسح يومٌ وليلةٌ للمُقام، وثلاثة أيّامٍ للمُسافِر.\n3. من أَحسَن المسح أَحسَن الطهارة.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المجموع للنووي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%85%D8%B3%D8%AD%20%D8%B9%D9%84%D9%89%20%D8%A7%D9%84%D8%AE%D9%81%D9%8A%D9%86%20%D9%88%D8%A7%D9%84%D8%B9%D9%85%D8%A7%D9%85%D8%A9"},{"id":"fiqh-salah-1","title":"أوقات الصلوات وشروطها","group":"الفقه الإسلامي · الصلاة","summary":"خمس صلواتٍ مُحدَّدةً في الوقت، ولهن شروطٌ وأركانٌ وواجبات.","body":"أوقات الصلوات وشروطها\n\nخمس صلواتٍ مُحدَّدةً في الوقت، ولهن شروطٌ وأركانٌ وواجبات.\n\nالصلوات الخمس لها أوقاتٌ مُحدَّدة: الفجر من طلوع الفجر إلى طلوع الشمس، والظهر إلى أن يَصِل ظلُّ الشيء إلى مثله، والعصر إلى اصفرار المُكلَّف، والمغرب إلى غُيوب الشفق، والعشاء إلى نصف الليل أو الفجر.\nوأمّا الشروط: الإسلام، والعقل، والتوَهّد، والطهارة من الحدث والنجاسة، واستِقبال القِبلة، وسَدّ البَطْن من النجاسة.\n\nالأدلة الشرعية:\n• «إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا» — سورة النساء 103\n• «تُقْتَلُ الصَّلَاةُ فِي عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا» — الفقه الإسلامي وأدلته للزرقا\n\nفوائد ودروس:\n1. أوقات الصلوات خمسٌ مُحدَّدة، فمن تركها فقد أَفحَم.\n2. الشروط تُنظّم الصلاة، فمن أَحسَن الشروط أَحسَن الصلاة.\n3. من أَدَّى الصلاة في وقتها فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المجموع للنووي","kind":"topic","route":"/search?q=%D8%A3%D9%88%D9%82%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%84%D9%88%D8%A7%D8%AA%20%D9%88%D8%B4%D8%B1%D9%88%D8%B7%D9%87%D8%A7"},{"id":"fiqh-salah-2","title":"أركان الصلاة وواجباتها وسننها","group":"الفقه الإسلامي · الصلاة","summary":"الأركان لا تُستَقيم الصلاة بغيرها، والواجبات يُقضى لسَهوٍ.","body":"أركان الصلاة وواجباتها وسننها\n\nالأركان لا تُستَقيم الصلاة بغيرها، والواجبات يُقضى لسَهوٍ.\n\nأركان الصلاة عند الشافعية: النية، وتَكْبيرة الإحرام، والقيام في الفرض، والفاتحة، والرُّكوع، والرفع منه، والسُّجود، والجُلوس بين السُّجودَين، والتشهّد، والسّلام.\nوالواجبات لا تُسقِط الصلاة، ويُقضى لها بسَهوٍ، وأمّا السنن فقد تُتَرك، ولا تُسقِط الصلاة.\n\nالأدلة الشرعية:\n• «أَقِيمُوا الصَّلَاةَ» — سورة البقرة 43\n• «لَا صَلَاةَ لِمَنْ لَا فَاتِحَةَ لَهُ» — رواه البخاري ومسلم\n\nفوائد ودروس:\n1. الأركان لا تُسقِط الصلاة.\n2. الواجبات يُقضى لها بسَهوٍ، والسنن تُتَرك.\n3. من أَحسَن الأركان أَحسَن الصلاة.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%A3%D8%B1%D9%83%D8%A7%D9%86%20%D8%A7%D9%84%D8%B5%D9%84%D8%A7%D8%A9%20%D9%88%D9%88%D8%A7%D8%AC%D8%A8%D8%A7%D8%AA%D9%87%D8%A7%20%D9%88%D8%B3%D9%86%D9%86%D9%87%D8%A7"},{"id":"fiqh-salah-3","title":"الصلاة في السفر والمرض","group":"الفقه الإسلامي · الصلاة","summary":"الجمع والقصر رُخْصَتان للمُسافِر، والصلاة مُخَفَّفةً للمريض.","body":"الصلاة في السفر والمرض\n\nالجمع والقصر رُخْصَتان للمُسافِر، والصلاة مُخَفَّفةً للمريض.\n\nالمُسافِر يُقصر الرباعية إلى رُكْعَتَين، ويُجمع بين المغرب والعشاء، وبين الفجر والعصر في الحضار، والشروط لا تُشهد في السفر، ولا تُسقِط الصلاة.\nوأمّا المريض فقد كان يُصلّي على ما يُستَطيع، ومن لم يَستَطِع فقد كان يُصلّي بجُهوده، وأمّا المُخالف فقد كان يُصلّي على ما يُستَطيع.\n\nالأدلة الشرعية:\n• «إِذَا سَافَرْتُمْ فَاقْصُرُوا الصَّلَاةَ» — الفقه الإسلامي وأدلته للزرقا\n• «صَلِّ وَاقْعُدْ، وَإِنْ لَمْ تَسْتَطِعْ فَصَلِّ بِجُهْدِكَ» — صحيح البخاري\n\nفوائد ودروس:\n1. القصر رُخْصَةٌ للمُسافِر، والجمع في الحضار.\n2. من أَحسَن السفر أَحسَن الصلاة.\n3. من أَصابَ في المرض فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%B5%D9%84%D8%A7%D8%A9%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B3%D9%81%D8%B1%20%D9%88%D8%A7%D9%84%D9%85%D8%B1%D8%B6"},{"id":"fiqh-salah-4","title":"الجماعة والامامة وترتيب الصفوف","group":"الفقه الإسلامي · الصلاة","summary":"الجماعة سُنّةٌ مؤكَّدة، وترتيبُ الصفوف من كمال الصلاة.","body":"الجماعة والامامة وترتيب الصفوف\n\nالجماعة سُنّةٌ مؤكَّدة، وترتيبُ الصفوف من كمال الصلاة.\n\nالجماعة سُنّةٌ مؤكَّدة، وقد كان ﷺ يُصلّي بالجماعة، ويُحضّر الصفوف، ويُصلّي بالجماعة، وقد كان ﷺ يُصلّي بالجماعة، ويُحضّر الصفوف.\nوأمّا الامامة فقد كان الأَحسَن أَعلى العلم، والأَحسَن أَعلى القراءة، وأمّا الصفوف فقد كان المُهَدّدان الأَوّل، وأمّا الْعَدْل فقد كان الأَحسَن.\n\nالأدلة الشرعية:\n• «وَأَقِيمُوا الصَّلَاةَ» — سورة البقرة 43\n• «صَفُّوا وَاسْتَقِيمُوا وَسَلَّسُوا» — رواه البخاري ومسلم\n\nفوائد ودروس:\n1. الجماعة سُنّةٌ مؤكَّدة، وترتيبُ الصفوف من كمال الصلاة.\n2. من أَحسَن الجماعة أَحسَن الصلاة.\n3. من أَصلّي بالجماعة فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AC%D9%85%D8%A7%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D8%A7%D9%85%D8%A7%D9%85%D8%A9%20%D9%88%D8%AA%D8%B1%D8%AA%D9%8A%D8%A8%20%D8%A7%D9%84%D8%B5%D9%81%D9%88%D9%81"},{"id":"fiqh-salah-5","title":"سجود السهو","group":"الفقه الإسلامي · الصلاة","summary":"سجودٌ قبل السّلام أو بعده، لحُكومٍ تَزَادت أو نُقِصت.","body":"سجود السهو\n\nسجودٌ قبل السّلام أو بعده، لحُكومٍ تَزَادت أو نُقِصت.\n\nسجود السهو لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك، ويُقضى بسَهوٍ، وأمّا سجود السهو فقد كان يُقضى لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك.\nوأمّا الواجبات فقد كان يُقضى لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك، وأمّا السنن فقد كانت تُتَرك، ولا تُسقِط الصلاة.\n\nالأدلة الشرعية:\n• «إِذَا سَهَا فَسَجِدْ سَجْدَتَيْنِ» — الفقه الإسلامي وأدلته للزرقا\n• «كَانَ ﷺ يَسْجُدُ لِلسَّهْوِ» — صحيح مسلم\n\nفوائد ودروس:\n1. سجود السهو لمن أَحسَن في الصلاة.\n2. من أَحسَن السهو فقد أَحسَن الصلاة.\n3. من أَنكَر السهو فقد أَفحَم.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المجموع للنووي","kind":"topic","route":"/search?q=%D8%B3%D8%AC%D9%88%D8%AF%20%D8%A7%D9%84%D8%B3%D9%87%D9%88"},{"id":"fiqh-salah-6","title":"الجمعة والعيدان","group":"الفقه الإسلامي · الصلاة","summary":"الجمعة فرضٌ مُكتمَل، والعيدان سُنّةٌ مؤكَّدة.","body":"الجمعة والعيدان\n\nالجمعة فرضٌ مُكتمَل، والعيدان سُنّةٌ مؤكَّدة.\n\nالجمعة فرضٌ مُكتمَل، وقد كان ﷺ يُصلّي بالجماعة، ويُخطِب الخطبة، ويُصلّي بالجمعة، وقد كان ﷺ يُصلّي بالجمعة، ويُخطِب الخطبة.\nوأمّا العيدان فقد كان ﷺ يُصلّي بالجماعة، ويُخطِب الخطبة، ويُصلّي بالعيد، وقد كان ﷺ يُصلّي بالعيد، ويُخطِب الخطبة.\n\nالأدلة الشرعية:\n• «فَإِذَا نُودِيَ لِلصَّلَاةِ مِنْ يَوْمِ الْجُمُعَةِ» — سورة الجمعة 9\n• «كَانَ ﷺ يُصلّي الْعِيدَيْنِ فِي الْمُصَلَّى» — صحيح البخاري\n\nفوائد ودروس:\n1. الجمعة فرضٌ مُكتمَل، والعيدان سُنّةٌ مؤكَّدة.\n2. من أَحسَن الجمعة أَحسَن الصلاة.\n3. من أَصلّي بالعيد فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AC%D9%85%D8%B9%D8%A9%20%D9%88%D8%A7%D9%84%D8%B9%D9%8A%D8%AF%D8%A7%D9%86"},{"id":"fiqh-zakah-1","title":"حكم الزكاة وشروط وجوبها","group":"الفقه الإسلامي · الزكاة","summary":"الزكاة رُكِنٌ ثالثٌ في الإسلام، وشرطُها مَلْكٌ وأنِبال.","body":"حكم الزكاة وشروط وجوبها\n\nالزكاة رُكِنٌ ثالثٌ في الإسلام، وشرطُها مَلْكٌ وأنِبال.\n\nالزكاة رُكِنٌ ثالثٌ في الإسلام، وقد كان ﷺ يُيَرّ بالزكاة، ويُيَرّ بالزكاة، وقد كان ﷺ يُيَرّ بالزكاة، ويُيَرّ بالزكاة.\nوأمّا شروطها: الإسلام، وملك المال، والنِّسَاب، والحَوْل، وأمّا النِّسَاب فقد كان خمسُ أواقٍ، وقد كان النِّسَاب خمسُ أواقٍ.\n\nالأدلة الشرعية:\n• «وَآتُوا الزَّكَاةَ» — سورة البقرة 43\n• «بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ» — صحيح البخاري ومسلم\n\nفوائد ودروس:\n1. الزكاة رُكِنٌ ثالثٌ في الإسلام.\n2. شروطها: الإسلام، وملك المال، والنِّسَاب، والحَوْل.\n3. من أَحسَن الزكاة أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%AD%D9%83%D9%85%20%D8%A7%D9%84%D8%B2%D9%83%D8%A7%D8%A9%20%D9%88%D8%B4%D8%B1%D9%88%D8%B7%20%D9%88%D8%AC%D9%88%D8%A8%D9%87%D8%A7"},{"id":"fiqh-zakah-2","title":"زكاة المال النقدي ونصابها","group":"الفقه الإسلامي · الزكاة","summary":"خمسُ أواقٍ من الذهب، ومائتا دِرْهَمٍ من الفضة.","body":"زكاة المال النقدي ونصابها\n\nخمسُ أواقٍ من الذهب، ومائتا دِرْهَمٍ من الفضة.\n\nزكاة المال النقدي خمسُ أواقٍ من الذهب، ومائتا دِرْهَمٍ من الفضة، وقد كان النِّسَاب خمسُ أواقٍ، ومائتا دِرْهَمٍ.\nوأمّا الزكاة فقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر.\n\nالأدلة الشرعية:\n• «خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً» — سورة التوبة 103\n• «مَا مِنْ مَالٍ لَا يَنْصُبُ فِيهِ الزَّكَاةُ» — الفقه الإسلامي وأدلته للزرقا\n\nفوائد ودروس:\n1. زكاة المال النقدي خمسُ أواقٍ، ومائتا دِرْهَمٍ.\n2. الزكاة رُبْعُ العُشْر.\n3. من أَحسَن الزكاة أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%B2%D9%83%D8%A7%D8%A9%20%D8%A7%D9%84%D9%85%D8%A7%D9%84%20%D8%A7%D9%84%D9%86%D9%82%D8%AF%D9%8A%20%D9%88%D9%86%D8%B5%D8%A7%D8%A8%D9%87%D8%A7"},{"id":"fiqh-zakah-3","title":"زكاة العروض التجارية","group":"الفقه الإسلامي · الزكاة","summary":"العروض التجارية تُزَكَّى بالقيمة، ولا تُزَكَّى بالعدد.","body":"زكاة العروض التجارية\n\nالعروض التجارية تُزَكَّى بالقيمة، ولا تُزَكَّى بالعدد.\n\nزكاة العروض التجارية بالقيمة، وقد كان القيمة تُزَكَّى، وقد كان القيمة تُزَكَّى، وقد كان القيمة تُزَكَّى.\nوأمّا العُرُوض فقد كانت تُزَكَّى بالقيمة، وقد كانت تُزَكَّى بالقيمة، وقد كانت تُزَكَّى بالقيمة.\n\nالأدلة الشرعية:\n• «وَآتُوا الزَّكَاةَ» — سورة البقرة 43\n• «وَمَا أَنْفَقْتُمْ مِنْ شَيْءٍ فَهُوَ عِنْدَ اللَّهِ» — سورة الحديد 19\n\nفوائد ودروس:\n1. زكاة العروض التجارية بالقيمة.\n2. من أَحسَن العروض فقد أَحسَن.\n3. من أَعَمّل بالقيمة فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%B2%D9%83%D8%A7%D8%A9%20%D8%A7%D9%84%D8%B9%D8%B1%D9%88%D8%B6%20%D8%A7%D9%84%D8%AA%D8%AC%D8%A7%D8%B1%D9%8A%D8%A9"},{"id":"fiqh-zakah-4","title":"زكاة الزروع والثمار","group":"الفقه الإسلامي · الزكاة","summary":"العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود.","body":"زكاة الزروع والثمار\n\nالعُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود.\n\nزكاة الزروع والثمار: العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود، وقد كان العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود.\nوأمّا الزروع فقد كانت تُزَكَّى بالعُشْر، وقد كانت تُزَكَّى بالعُشْر، وقد كانت تُزَكَّى بالعُشْر.\n\nالأدلة الشرعية:\n• «وَآتُوا حَقَّهُ يَوْمَ حَصَادِهِ» — سورة الأنعام 141\n• «فِيمَا سَقَتِ السَّمَاءُ وَالْعُيُونُ أَوْ كَانَ عَاثِرِيًّا فَالْعُشْرُ» — صحيح البخاري\n\nفوائد ودروس:\n1. زكاة الزروع والثمار بالعُشْر.\n2. من أَحسَن الزروع فقد أَحسَن.\n3. من أَعَمّل بالعُشْر فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%B2%D9%83%D8%A7%D8%A9%20%D8%A7%D9%84%D8%B2%D8%B1%D9%88%D8%B9%20%D9%88%D8%A7%D9%84%D8%AB%D9%85%D8%A7%D8%B1"},{"id":"fiqh-zakah-5","title":"المُصَدَّقُون وأولويات الإنفاق","group":"الفقه الإسلامي · الزكاة","summary":"الأنفاق ثمانية، و«في سبيل الله» تُنظّم أولويات الإنفاق.","body":"المُصَدَّقُون وأولويات الإنفاق\n\nالأنفاق ثمانية، و«في سبيل الله» تُنظّم أولويات الإنفاق.\n\nالمُصَدَّقُون ثمانية: الفُقَرَاء، والمَسَاكِين، والعاملين عليها، والمؤالَفات، والرِّقَاب، والغَارِمِين، وفي سبيل الله، وابن السَّبِيل.\nوأمّا «في سبيل الله» فقد كانت تُنظّم أولويات الإنفاق، وقد كانت تُنظّم أولويات الإنفاق، وقد كانت تُنظّم أولويات الإنفاق.\n\nالأدلة الشرعية:\n• «إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ» — سورة التوبة 60\n• «وَمَا أَنْفَقْتُمْ مِنْ شَيْءٍ فَهُوَ عِنْدَ اللَّهِ» — سورة الحديد 19\n\nفوائد ودروس:\n1. المُصَدَّقُون ثمانية.\n2. من أَحسَن الإنفاق فقد أَحسَن.\n3. من أَعَمّل بأولويات الإنفاق فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%85%D9%8F%D8%B5%D9%8E%D8%AF%D9%8E%D9%91%D9%82%D9%8F%D9%88%D9%86%20%D9%88%D8%A3%D9%88%D9%84%D9%88%D9%8A%D8%A7%D8%AA%20%D8%A7%D9%84%D8%A5%D9%86%D9%81%D8%A7%D9%82"},{"id":"fiqh-siyam-1","title":"حكم الصيام وشروط وجوبه","group":"الفقه الإسلامي · الصيام","summary":"الصيام رُكِنٌ رابعٌ في الإسلام، وشروطُه الإسلام والعقل والطهارة.","body":"حكم الصيام وشروط وجوبه\n\nالصيام رُكِنٌ رابعٌ في الإسلام، وشروطُه الإسلام والعقل والطهارة.\n\nالصيام رُكِنٌ رابعٌ في الإسلام، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان.\nوأمّا شروطه: الإسلام، والعقل، والطهارة، والقِبلة، وأمّا الصيام فقد كان يُصوم رمضان، ويُصوم رمضان.\n\nالأدلة الشرعية:\n• «يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ» — سورة البقرة 183\n
