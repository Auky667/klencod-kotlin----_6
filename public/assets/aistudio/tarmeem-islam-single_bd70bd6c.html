• «بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ» — صحيح البخاري ومسلم\n\nفوائد ودروس:\n1. الصيام رُكِنٌ رابعٌ في الإسلام.\n2. شروطه: الإسلام، والعقل، والطهارة.\n3. من أَحسَن الصيام أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%AD%D9%83%D9%85%20%D8%A7%D9%84%D8%B5%D9%8A%D8%A7%D9%85%20%D9%88%D8%B4%D8%B1%D9%88%D8%B7%20%D9%88%D8%AC%D9%88%D8%A8%D9%87"},{"id":"fiqh-siyam-2","title":"المفطرات المُوجِبة للقضاء والإطعام","group":"الفقه الإسلامي · الصيام","summary":"أكلٌ وشربٌ وشيءٌ يُنقِد الصيام، ويُقضى له.","body":"المفطرات المُوجِبة للقضاء والإطعام\n\nأكلٌ وشربٌ وشيءٌ يُنقِد الصيام، ويُقضى له.\n\nالمفطرات المُوجِبة للقضاء: الأكل والشرب، وشيءٌ يُنقِد الصيام، وقد كان يُقضى له، وقد كان يُقضى له.\nوأمّا الإطعام فقد كان يُقضى له، وقد كان يُقضى له، وقد كان يُقضى له.\n\nالأدلة الشرعية:\n• «فَمَنْ كَانَ مِنْكُمْ مَرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ» — سورة البقرة 184\n• «مَنْ نَسِيَ فَهُوَ صَائِمٌ» — صحيح مسلم\n\nفوائد ودروس:\n1. المفطرات المُوجِبة للقضاء تُقضى، والمُوجِبة للإطعام تُعَمّل.\n2. من أَحسَن القضاء فقد أَحسَن.\n3. من أَعَمّل بالإطعام فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المجموع للنووي","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%85%D9%81%D8%B7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D9%85%D9%8F%D9%88%D8%AC%D9%90%D8%A8%D8%A9%20%D9%84%D9%84%D9%82%D8%B6%D8%A7%D8%A1%20%D9%88%D8%A7%D9%84%D8%A5%D8%B7%D8%B9%D8%A7%D9%85"},{"id":"fiqh-siyam-3","title":"صيام رمضان ووتر وليلة القدر","group":"الفقه الإسلامي · الصيام","summary":"رمضان رُكِنٌ، والوتر سُنّةٌ، وليلة القدر أفضلُ ليلة.","body":"صيام رمضان ووتر وليلة القدر\n\nرمضان رُكِنٌ، والوتر سُنّةٌ، وليلة القدر أفضلُ ليلة.\n\nصيام رمضان رُكِنٌ، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان.\nوأمّا الوتر فقد كان سُنّةٌ، وقد كان سُنّةٌ، وقد كان سُنّةٌ، وأمّا ليلة القدر فقد كانت أفضلُ ليلة، وقد كانت أفضلُ ليلة.\n\nالأدلة الشرعية:\n• «شَهْرُ رَمَضَانَ الَّذِي أُنْزِلَ فِيهِ الْقُرْآنُ» — سورة البقرة 185\n• «لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ» — سورة القدر 3\n\nفوائد ودروس:\n1. صيام رمضان رُكِنٌ، والوتر سُنّةٌ، وليلة القدر أفضلُ ليلة.\n2. من أَحسَن رمضان فقد أَحسَن.\n3. من أَعَمّل بالوتر فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%B5%D9%8A%D8%A7%D9%85%20%D8%B1%D9%85%D8%B6%D8%A7%D9%86%20%D9%88%D9%88%D8%AA%D8%B1%20%D9%88%D9%84%D9%8A%D9%84%D8%A9%20%D8%A7%D9%84%D9%82%D8%AF%D8%B1"},{"id":"fiqh-siyam-4","title":"صيام النافلة","group":"الفقه الإسلامي · الصيام","summary":"صيامُ الإثنين والخُمُس، وشَوال، وثلاثة أيّامٍ في كل شهر.","body":"صيام النافلة\n\nصيامُ الإثنين والخُمُس، وشَوال، وثلاثة أيّامٍ في كل شهر.\n\nصيام النافلة: الإثنين والخُمُس، وشَوال، وثلاثة أيّامٍ في كل شهر، وقد كان ﷺ يُصوم الإثنين والخُمُس، ويُصوم الإثنين والخُمُس.\nوأمّا النافلة فقد كانت تُصوم، وقد كانت تُصوم، وقد كانت تُصوم.\n\nالأدلة الشرعية:\n• «كَانَ ﷺ يُصوم الْإِثْنَيْنِ وَالْخُمُسِ» — صحيح البخاري\n• «صِيَامُ دَهْرٍ لَا صِيَامَ لِمَنْ صَامَ دَهْرًا» — صحيح البخاري\n\nفوائد ودروس:\n1. صيام النافلة سُنّةٌ مؤكَّدة.\n2. من أَحسَن النافلة فقد أَحسَن.\n3. من أَصوم الإثنين والخُمُس فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%B5%D9%8A%D8%A7%D9%85%20%D8%A7%D9%84%D9%86%D8%A7%D9%81%D9%84%D8%A9"},{"id":"fiqh-siyam-5","title":"قضاء الرمضان وكفاراته","group":"الفقه الإسلامي · الصيام","summary":"القضاء واجبٌ لمن أَفَطَرَ عَمَدًا، والكفارة لمن أَجَمَعَ.","body":"قضاء الرمضان وكفاراته\n\nالقضاء واجبٌ لمن أَفَطَرَ عَمَدًا، والكفارة لمن أَجَمَعَ.\n\nقضاء الرمضان واجبٌ لمن أَفَطَرَ عَمَدًا، وقد كان يُقضى، وقد كان يُقضى، وقد كان يُقضى.\nوأمّا الكفارة فقد كانت لمن أَجَمَعَ، وقد كانت لمن أَجَمَعَ، وقد كانت لمن أَجَمَعَ.\n\nالأدلة الشرعية:\n• «فَمَنْ كَانَ مِنْكُمْ مَرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ» — سورة البقرة 184\n• «مَنْ أَفَطَرَ عَمَدًا فَلْيُقَضِهِ» — الفقه الإسلامي وأدلته للزرقا\n\nفوائد ودروس:\n1. القضاء واجبٌ لمن أَفَطَرَ عَمَدًا، والكفارة لمن أَجَمَعَ.\n2. من أَحسَن القضاء فقد أَحسَن.\n3. من أَعَمّل بالكفارة فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المجموع للنووي","kind":"topic","route":"/search?q=%D9%82%D8%B6%D8%A7%D8%A1%20%D8%A7%D9%84%D8%B1%D9%85%D8%B6%D8%A7%D9%86%20%D9%88%D9%83%D9%81%D8%A7%D8%B1%D8%A7%D8%AA%D9%87"},{"id":"fiqh-hajj-1","title":"الحج: شروطه وأنواعه","group":"الفقه الإسلامي · الحج والعمرة","summary":"الحج رُكِنٌ خامسٌ في الإسلام، وشروطُه الإسلام والعقل والطهارة.","body":"الحج: شروطه وأنواعه\n\nالحج رُكِنٌ خامسٌ في الإسلام، وشروطُه الإسلام والعقل والطهارة.\n\nالحج رُكِنٌ خامسٌ في الإسلام، وقد كان ﷺ يُحجّ الحج، ويُحجّ الحج، وقد كان ﷺ يُحجّ الحج، ويُحجّ الحج.\nوأمّا شروطه: الإسلام، والعقل، والطهارة، وأمّا الحج فقد كان يُحجّ الحج، ويُحجّ الحج.\n\nالأدلة الشرعية:\n• «وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ» — سورة البقرة 196\n• «بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ» — صحيح البخاري ومسلم\n\nفوائد ودروس:\n1. الحج رُكِنٌ خامسٌ في الإسلام.\n2. شروطه: الإسلام، والعقل، والطهارة.\n3. من أَحسَن الحج أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AD%D8%AC%3A%20%D8%B4%D8%B1%D9%88%D8%B7%D9%87%20%D9%88%D8%A3%D9%86%D9%88%D8%A7%D8%B9%D9%87"},{"id":"fiqh-hajj-2","title":"العمرة وأركانها","group":"الفقه الإسلامي · الحج والعمرة","summary":"العمرة سُنّةٌ مؤكَّدة، وأركانُها الإحرام والطواف والسعي والحلق.","body":"العمرة وأركانها\n\nالعمرة سُنّةٌ مؤكَّدة، وأركانُها الإحرام والطواف والسعي والحلق.\n\nالعمرة سُنّةٌ مؤكَّدة، وقد كان ﷺ يُعتمر العمرة، ويُعتمر العمرة، وقد كان ﷺ يُعتمر العمرة، ويُعتمر العمرة.\nوأمّا أركانها: الإحرام، والطواف، والسعي، والحلق، وأمّا العمرة فقد كانت سُنّةٌ، وقد كانت سُنّةٌ.\n\nالأدلة الشرعية:\n• «وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ» — سورة البقرة 196\n• «كَانَ ﷺ يُعتمر فِي الْعُمْرَةِ» — صحيح البخاري\n\nفوائد ودروس:\n1. العمرة سُنّةٌ مؤكَّدة، وأركانُها الإحرام والطواف والسعي والحلق.\n2. من أَحسَن العمرة فقد أَحسَن.\n3. من أَعَمّل بالعمرة فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%B9%D9%85%D8%B1%D8%A9%20%D9%88%D8%A3%D8%B1%D9%83%D8%A7%D9%86%D9%87%D8%A7"},{"id":"fiqh-hajj-3","title":"الإحرام ومحظوراته","group":"الفقه الإسلامي · الحج والعمرة","summary":"الإحرام نيةٌ، ومحظوراتُه في اللبس والكلام والشعر.","body":"الإحرام ومحظوراته\n\nالإحرام نيةٌ، ومحظوراتُه في اللبس والكلام والشعر.\n\nالإحرام نيةٌ، وقد كان ﷺ يُحرم الحرم، ويُحرم الحرم، وقد كان ﷺ يُحرم الحرم، ويُحرم الحرم.\nوأمّا محظوراته: اللبس، والكلام، والشعر، والريّ، وأمّا الإحرام فقد كان نيةٌ، وقد كان نيةٌ.\n\nالأدلة الشرعية:\n• «وَلَا تَحْلِقُوا رُءُوسَكُمْ حَتَّى يَبْلُغَ الْهَدْيُ مَحِلَّهُ» — سورة البقرة 196\n• «كَانَ ﷺ يُحرم فِي الْإِحْرَامِ» — صحيح البخاري\n\nفوائد ودروس:\n1. الإحرام نيةٌ، ومحظوراتُه في اللبس والكلام والشعر.\n2. من أَحسَن الإحرام فقد أَحسَن.\n3. من أَعَمّل بالحظر فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D8%AD%D8%B1%D8%A7%D9%85%20%D9%88%D9%85%D8%AD%D8%B8%D9%88%D8%B1%D8%A7%D8%AA%D9%87"},{"id":"fiqh-hajj-4","title":"أركان الحج وواجباته","group":"الفقه الإسلامي · الحج والعمرة","summary":"الأركان: الإحرام والوقوف والطواف والسعي، والواجبات تُجَزّى بها.","body":"أركان الحج وواجباته\n\nالأركان: الإحرام والوقوف والطواف والسعي، والواجبات تُجَزّى بها.\n\nأركان الحج: الإحرام، والوقوف، والطواف، والسعي، وقد كان ﷺ يُحرم الحرم، ويُحرم الحرم، ويُحرم الحرم.\nوأمّا الواجبات فقد كانت تُجَزّى بها، وقد كانت تُجَزّى بها، وقد كانت تُجَزّى بها.\n\nالأدلة الشرعية:\n• «وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ» — سورة البقرة 196\n• «كَانَ ﷺ يُحرم فِي الْإِحْرَامِ» — صحيح البخاري\n\nفوائد ودروس:\n1. الأركان: الإحرام والوقوف والطواف والسعي.\n2. من أَحسَن الأركان فقد أَحسَن.\n3. من أَعَمّل بالواجبات فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%A3%D8%B1%D9%83%D8%A ":"fiqh-muamalat-2","title":"البيوع وأحكامها والغش","group":"الفقه الإسلامي · المعاملات","summary":"البيوع عقدٌ ومقبول، ولا يُشهد فيه الغَشّ والاحتكار.","body":"البيوع وأحكامها والغش\n\nالبيوع عقدٌ ومقبول، ولا يُشهد فيه الغَشّ والاحتكار.\n\nالبيوع عقدٌ ومقبول، وقد كان البيوع عقدٌ ومقبول، وقد كان البيوع عقدٌ ومقبول، وقد كان البيوع عقدٌ ومقبول.\nوأمّا الغَشّ والاحتكار فقد كان مُحرَّمًا، وقد كان مُحرَّمًا، وقد كان مُحرَّمًا.\n\nالأدلة الشرعية:\n• «وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ» — سورة هود 85\n• «مَنْ غَشَّ فَلَيْسَ مِنِّي» — رواه مسلم\n\nفوائد ودروس:\n1. البيوع عقدٌ ومقبول.\n2. من أَحسَن البيوع فقد أَحسَن.\n3. من أَعَمّل بالعدل فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A8%D9%8A%D9%88%D8%B9%20%D9%88%D8%A3%D8%AD%D9%83%D8%A7%D9%85%D9%87%D8%A7%20%D9%88%D8%A7%D9%84%D8%BA%D8%B4"},{"id":"fiqh-muamalat-3","title":"الربا وأنواعه والمعاملات المعاصرة","group":"الفقه الإسلامي · المعاملات","summary":"الربا حَرَّمًا في القِرْض والبيع، وأمّا المعاملات المعاصرة فتُعَمَّل.","body":"الربا وأنواعه والمعاملات المعاصرة\n\nالربا حَرَّمًا في القِرْض والبيع، وأمّا المعاملات المعاصرة فتُعَمَّل.\n\nالربا حَرَّمًا في القِرْض والبيع، وقد كان الربا حَرَّمًا، وقد كان الربا حَرَّمًا، وقد كان الربا حَرَّمًا.\nوأمّا المعاملات المعاصرة فقد كانت تُعَمَّل، وقد كانت تُعَمَّل، وقد كانت تُعَمَّل.\n\nالأدلة الشرعية:\n• «وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا» — سورة البقرة 275\n• «وَمَا آتَيْتُمْ مِنْ رِبًا لِيَرْبُوَ فِي أَمْوَالِ النَّاسِ» — سورة الروم 39\n\nفوائد ودروس:\n1. الربا حَرَّمًا في القِرْض والبيع.\n2. من أَحسَن البيع فقد أَحسَن.\n3. من أَعَمّل بالعدل فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%B1%D8%A8%D8%A7%20%D9%88%D8%A3%D9%86%D9%88%D8%A7%D8%B9%D9%87%20%D9%88%D8%A7%D9%84%D9%85%D8%B9%D8%A7%D9%85%D9%84%D8%A7%D8%AA%20%D8%A7%D9%84%D9%85%D8%B9%D8%A7%D8%B5%D8%B1%D8%A9"},{"id":"fiqh-muamal أسرة والميراث","summary":"النكاح عقدٌ على الشهادة، والمهر حقٌّ للزوجة.","body":"الخطبة والمهر وشروط النكاح\n\nالنكاح عقدٌ على الشهادة، والمهر حقٌّ للزوجة.\n\nالنكاح عقدٌ على الشهادة، وقد كان النكاح عقدٌ على الشهادة، وقد كان النكاح عقدٌ على الشهادة، وقد كان النكاح عقدٌ على الشهادة.\nوأمّا المهر فقد كان حقٌّ للزوجة، وأمّا الخطبة فقد كانت لا تُشهد، وقد كانت لا تُشهد.\n\nالأدلة الشرعية:\n• «فَانْكِحُوا مَا طَابَ لَكُمْ مِنَ النِّسَاءِ» — سورة النساء 3\n• «الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ» — رواه الترمذي\n\nفوائد ودروس:\n1. النكاح عقدٌ على الشهادة، والمهر حقٌّ للزوجة.\n2. من أَحسَن النكاح فقد أَحسَن.\n3. من أَعَمّل بالعدل فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. المغني لابن قدامة","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AE%D8%B7%D8%A8%D8%A9%20%D9%88%D8%A7%D9%84%D9%85%D9%87%D8%B1%20%D9%88%D8%B4%D8%B1%D9%88%D8%B7%20%D8%A7%D9%84%D9%86%D9%83%D8%A7%D8%AD"},{"id":"fiqh-family-2","title":"حقوق الزوجين","group":"الفقه الإسلامي · الأسرة والميراث","summary":"الحقّان مُتَكافِئان، والعدل أساسٌ في الأسرة.","body":"حقوق الزوجين\n\nالحقّان مُتَكافِئان، والعدل أساسٌ في الأسرة.\n\nالحقّان مُتَكافِئان، وقد كانا مُتَكافِئان، وقد كانا مُتَكافِئان، وقد كانا مُتَكافِئان.\nوأمّا العدل فقد كان أساسٌ في الأسرة، وقد كان أساسٌ في الأسرة.\n\nالأدلة الشرعية:\n• «وَلَهُنَّ مِثْلُ الَّذِي عَلَيْهِنَّ بِالْمَعْرُوفِ» — سورة البقرة 228\n• «خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ» — رواه الترمذي\n\nفوائد ودروس:\n1. الحقّان مُتَكافِئان، والعدل أساسٌ في الأسرة.\n2. من أَحسَن العدل فقد أَحسَن.\n3. من أَعَمّل بالحقّ فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الفقه الإسلامي وأدلته للزرقا\n2. بدائع الصنائع للكاساني","kind":"topic","route":"/search?q=%D8%AD%D9%82%D9%88%D9%82%20%D8%A7%D9%84%D8%B2%D9%88%D8%AC%D9%8A%D9%86"},{"id":"fiqh-family-3","title":"الطلاق وأنواعه والحضانة","group":"الفقه الإسلامي · الأسرة والميراث","summary":"الطلاق أَحبُّ الأشياء إلى الله، والحضانة في العَدل.","body":"الطلاق وأنواعه والحضانة\n\nالطلاق أَحبُّ الأشياء إلى الله، والحضانة في العَدل.\n\nالطلاق أَحبُّ ال ُعَوِّذَتَين، وتُقرأ قبل النوم.","body":"سورة الْفَلَق — مكية، عدد آياتها 5. من المُعَوِّذَتَين، وتُقرأ قبل النوم.","kind":"surah","route":"/search?q=%D8%A7%D9%84%D9%92%D9%81%D9%8E%D9%84%D9%8E%D9%82"},{"id":"surah-114","title":"سورة النَّاس","group":"السور المختارة","summary":"مكية · 6 آية · آخر ما في المصحف، ومن المُعَوِّذَتَين.","body":"سورة النَّاس — مكية، عدد آياتها 6. آخر ما في المصحف، ومن المُعَوِّذَتَين.","kind":"surah","route":"/search?q=%D8%A7%D9%84%D9%86%D9%8E%D9%91%D8%A7%D8%B3"}],"totalTopics":135,"statistics":{"sections":6,"topics":135,"names":99,"surahs":114,"fiqhChapters":36,"battles":10},"featuredTopics":[{"topic":{"id":"seerah-1","title":"نسبه ﷺ ومولده المطهّر","summary":"شرف النسبة القريشية، ومولده في عام الفيل بمكة، وحمل المشارق والمغارب من عظمته.","content":["هو محمد بن عبد الله بن عبد المطلب بن هاشم بن عبد مناف، من قريش، ومن بني هاشم أشراف العرب نسبًا ومنزلةً، وكانت أمّه آمنة بنت وهب قد حملت به وقد استنزلت عليها الأخبار الطيبة في أسلامه وتعفيقه، وحملته في ثلاثة أشهر لا في تسعة كما ورد في روايات المولد.","وُلد ﷺ في يوم الاثنين من شهر ربيع الأول في عام الفيل، وولد في دار أبي طالب مخدوعًا، ثم قُطعت سُرّته وأُخترع، وكان جده عبد المطلب أول من أخذ إلى الحِضانة وأخذه إلى الكعبة ودعا عليه، وسمّاه محمدًا على رغبة أن يُحمَد به في السماء والأرض، وكان العرب يُسمّون فيه الأنبياء والملوك."],"evidences":[{"text":"«هذا النجم الذي وُلد به في يومك؛ فقد استنزلت اليوم على هذه الولادة وحمَله»","source":"رواه أحمد بسنده عن عبد الله بن عباس"},{"text":"«ولِدَتْ فاطمة في عام الفيل، وخلق رسول الله ﷺ في عام الفيل»","source":"أخرجه البخاري في صحيحه"}],"benefits":["شرف النسبة عزّة للنبي ﷺ وإشارة إلى أن النبوة تُقدَّم من سلالة صالحة.","المولد في عام الفيل رمز إلى حماية الله لبيته من أهل الفيل، فحماه من أبرهة وحمايته من سيد الخلق.","الاهتمام بمولده ﷺ مدخل لقراءة حياته كلها بوصفها مِحَنَ النبوة."],"references":["سيرة ابن هشام","الرحيق المختوم"]},"group":"السيرة النبوية"},{"topic":{"id":"seerah-6","title":"زواجه بخديجة رضي الله عنها","summary":"زواج ﷺ بخديجة بنت خويلد وهو ابن خمسة وعشرين، وكانت أمّاً لَه في الدنيا والرسالة.","content":["كانت خديجة بنت خويلد سيدة قريش في عصبيّتها وكرمها وعقلها، وقد أوّلوا ﷺ بالتجارة في أشعاعها، فكانت تُعِدّه بوصلةٍ في التجارة، ثم تزوّجه وهي سيدةٌ نزيهةٌ، فكانت أمّه في الحياة أولًا وأمّاً لَه في الدنيا.","كانت خديجة أول من آمن به، وأول من صدّقته في رسالته، وكانت تحفظه وتُحمي بيتها وتُشدد الإيذاء، وكانت ﷺ يقول عنها: «إنّها ما آمنتْ بها، صدّقتْني حيث كفّرتْني القوم»."],"evidences":[{"text":"«أَوَّلُ مَنْ آمَنَتْ خَدِيجَةُ، وَصَدَّقَتْنِي حَيْثُ كَفَرَتْنِي الْقَوْمُ»","source":"صحيح البخاري"},{"text":"«كَانَتْ أَوَّلَ زَوْجَتِي، وَأَوَّلَ مَنْ آمَنَتْ بِي»","source":"صحيح مسلم"}],"benefits":["زواج النبي ﷺ بخديجة نموذجٌ في القراءة التربوية للأسرة: الصدقة والثقة قبل الولد.","أول من آمن به كانت امرأة، وهذا شرفٌ للمرأة في الإسلام، ولا يُشرف بها إلا من صدّق.","الزوجة قد تكون سندًا في الدعوة لا رافعًا لها."],"references":["سيرة ابن هشام","صحيح البخاري"]},"group":"السيرة النبوية"},{"topic":{"id":"aqeedah-3","title":"توحيد الربوبية","summary":"إثبات أنّ الله وحده الخالق الرازق المدبّر المُميت المُحيي.","content":["توحيد الربوبية هو إثبات أنّ الله وحده الخالق الرازق المالك المُدبِّر، لا خالقَ إلا الله ولا رازقَ إلا الله ولا مالكَ إلا الله ولا مُدبِّرَ إلا الله.","وهذا القسم أقرّ به المشركون كأنّهم لا يعلمون إلا أنّ الله خالقهم ورازقهم، لكنّهم جمعوا معه من الأصنام والأولياء ما لا ينبغي، وهذا هو القسم الذي يستحقّ المُوحِّد به أن يُسمّى مُوحِّدًا."],"evidences":[{"text":"«قُلْ مَن يَرْزُقُكُم مِّنَ السَّمَاءِ وَالْأَرْضِ»","source":"سورة سبأ 24"},{"text":"«اللَّهُ خَالِقُ كُلِّ شَيْءٍ»","source":"سورة الزمر 62"}],"benefits":["الخالق واحدٌ لا يُشرك به أحد.","الرزق من الله وحده، فمن يُطلب الرزق من غيره فقد أخطأ.","الإقرار بالربوبية لا يُكفي إلا مع الألوهية."],"references":["كتاب التوحيد","أسماء الله الحسنى للبخاري"]},"group":"العقيدة"},{"topic":{"id":"quran-1","title":"تعريف علوم القرآن وفضله","summary":"علوم القرآن هي أدوات فهم النص وتدبّره، والقرآن كتابٌ مُعجَز في لفظه ومعناه.","content":["علوم القرآن هي مجموعة الأبواب التي تُفصِل أحوال النص القرآني: كيف نزل، وكيف جُمِع، وكيف ضُبط، وكيف يُقرأ، وكيف يُفهَم، وكيف يُنازَع في فهمه، وكيف تُستَخرَج منه الأحكام والفوائد.","ومكانة هذه الأبواب أنّها وسائل لا غاية، فالغاية هي التدبر والعمل، ومن انصرف إلى الأدوات وترك الغاية فقد أَفحَم، ومن انصرف إلى الغاية بلا أدوات فقد أَضلّ."],"evidences":[{"text":"«كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِّيَدَّبَّرُوا آيَاتِهِ»","source":"سورة ص 29"},{"text":"«إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ»","source":"سورة الإسراء 9"}],"benefits":["علوم القرآن وسائل، والتدبر والعمل هو الغاية.","من أَحسَن الفهم أَحسَن العمل.","القرآن مُعجَز في لفظه ومعناه."],"references":["الإتقان في علوم القرآن للسيوطي","البرهان في علوم القرآن للزركشي"]},"group":"علوم القرآن"},{"topic":{"id":"tajweed-5","title":"أحكام النون الساكنة والتنوين","summary":"أربعة أحكام: الإظهار، والإدغام، والإقلاب، والإخفاء.","content":["النون الساكنة والتنوين لها أربعة أحكام: الإظهار عند الحلقية، والإدغام عند اللام والنون (بغنة) والياء والراء والميم والواو، والإقلاب عند الباء، والإخفاء عند الباقي.","ومن أَحسَن الأحكام أَحسَن القراءة، ومن أَخطأ الإخفاء فقد أَخطأ الغُنّة، وقد كانت الأحكام مُتقارِبة."],"evidences":[{"text":"«إِذَا تَوَضَّأَ بِالنُّونِ فَاسْتَقِمْ»","source":"المقدمة الجزرية"},{"text":"«وَإِنْ نَأْتَى الْبَاءُ فَقَلِبْ»","source":"المقدمة الجزرية"}],"benefits":["أحكام النون الساكنة والتنوين أربعة.","من أَحسَن الإخفاء أَحسَن القراءة.","من أَخطأ الغُنّة فقد أَخطأ القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},"group":"التجويد"},{"topic":{"id":"fiqh-salah-1","title":"أوقات الصلوات وشروطها","summary":"خمس صلواتٍ مُحدَّدةً في الوقت، ولهن شروطٌ وأركانٌ وواجبات.","content":["الصلوات الخمس لها أوقاتٌ مُحدَّدة: الفجر من طلوع الفجر إلى طلوع الشمس، والظهر إلى أن يَصِل ظلُّ الشيء إلى مثله، والعصر إلى اصفرار المُكلَّف، والمغرب إلى غُيوب الشفق، والعشاء إلى نصف الليل أو الفجر.","وأمّا الشروط: الإسلام، والعقل، والتوَهّد، والطهارة من الحدث والنجاسة، واستِقبال القِبلة، وسَدّ البَطْن من النجاسة."],"evidences":[{"text":"«إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا»","source":"سورة النساء 103"},{"text":"«تُقْتَلُ الصَّلَاةُ فِي عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا»","source":"الفقه الإسلامي وأدلته للزرقا"}],"benefits":["أوقات الصلوات خمسٌ مُحدَّدة، فمن تركها فقد أَفحَم.","الشروط تُنظّم الصلاة، فمن أَحسَن الشروط أَحسَن الصلاة.","من أَدَّى الصلاة في وقتها فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},"group":"الفقه · الصلاة"}],"featuredSurahs":[{"id":"surah-1","number":1,"name":"الفاتحة","ayahs":7,"revelation":"مكية","virtue":"أعظم سورة في القرآن، وبهَا تُفَتَح الصلاة، وإنها لا تشبهها سورة."},{"id":"surah-2","number":2,"name":"البقرة","ayahs":286,"revelation":"مدنية","virtue":"أطول سورة، وفيها آية الكرسي، وإنها لا تدخله الشيطان في بيتٍ تُقرأ فيه."},{"id":"surah-3","number":3,"name":"آل عمران","ayahs":200,"revelation":"مدنية","virtue":"تُنزل على الأنبياء وتُتْمِم العقيدة، وفيها آيات الإيمان والتوحيد."},{"id":"surah-4","number":4,"name":"النساء","ayahs":176,"revelation":"مدنية","virtue":"سورة الأحكام والأسرة والعدل بين الناس."},{"id":"surah-5","number":5,"name":"المائدة","ayahs":120,"revelation":"مدنية","virtue":"آخر ما نزل من السور، وفيها عهد الله وميثاقه."},{"id":"surah-6","number":6,"name":"الأنعام","ayahs":165,"revelation":"مكية","virtue":"سورة التوحيد، نزلت مُجمَعةً في ليلةٍ واحدة."}],"featuredNames":[{"id":"asma-1","number":1,"name":"الرَّحْمَن","meaning":"الواسع الرحمة لجميع الخلق، ومنّانه قبل الطلب."},{"id":"asma-2","number":2,"name":"الرَّحِيم","meaning":"الواسع الرحمة بالمؤمنين، الذي يرحمهم في الدنيا والآخرة."},{"id":"asma-3","number":3,"name":"الْمَلِك","meaning":"الملك المُطلِق الذي يُدبِّر الخلق ولا يُحاجِزه أحد."},{"id":"asma-4","number":4,"name":"الْقُدُّوس","meaning":"المنزّه عن كل نقص وعيب، الذي لا يُشبِهه شيء."},{"id":"asma-5","number":5,"name":"السَّلَام","meaning":"السالم من كل نقص، ومانح السلام لخلقه."},{"id":"asma-6","number":6,"name":"الْمُؤْمِن","meaning":"المُحَقِّق لأوليائه، ومانح الأمن والسكينة."},{"id":"asma-7","number":7,"name":"الْمُهَيْمِن","meaning":"الرقيب الحافظ، الذي يُشهد الأشياء ولا يُحاجِزه شيء."},{"id":"asma-8","number":8,"name":"الْعَزِيز","meaning":"القوي الذي لا يُقهر، العزيز على كل شيء."}],"HOME_VERSE":"إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ","HOME_VERSE_SOURCE":"الإسراء: 9","ABOUT":{"mission":"ترميم الإسلام منبرٌ عربي يربط السيرة النبوية بالعقيدة والقرآن والفقه في صياغةٍ متينة، مع محتوى موثق يفتح أبواب التعلّم والتدبر، ويجعل المعلومة العلمية بين يدي القارئ في عرضٍ عربيٍّ رصين.","goals":["تقديم السيرة النبوية بأحداثها وشَمائلها وسِيَر خلفائها في قراءةٍ تربوية.","تمهيد عقيدة أهل السنة في توحيد وإيمان وقواعدٍ واضحة لا تُشَابِه.","تفريغ علوم القرآن وأحكام التجويد وضبط الأداء بأسلوبٍ عمليةٍ مبسّط.","عرض خريطة الأبواب الفقهية مع مسالك الاستدلال من القرآن والسنة.","تيسير البحث الشامل في الموسوعة والوصول السريع إلى الموضوعات المختارة.","تشجيع الحفظ والمراجعة من خلال السور المختارة وخطة حفظٍ متدرّجة."],"methodology":["الاعتماد على النصوص المثبَتة في القرآن والسنّة، والتنقية في اختيار الدليل.","العرض في موضوعاتٍ قصيرةٍ مُتَسَلسِلة تُقرأ في جلسةٍ واحدة وتُراجَع بسهولة.","ربط الدليل بالفائدة العملية، فلا مِعلومةً بلا أثر، ولا أثرًا بلا دليل.","الانتصار في العرض إلى الكتب المُعتمَدة في التاريخ والعقيدة والفقه.","التدرّج من المعنى إلى الحكم، ومن الحكم إلى العمل، فالغاية التدبر والتطبيق."],"sources":["سيرة ابن هشام","السيرة النبوية لابن كثير","زاد المعاد لابن القيم","الرحيق المختوم للمباركفوري","الشمائل المحمدية للترمذي","صحيح البخاري وصحيح مسلم","عقيدة أهل السنة للطحاوية","العقيدة الواسطية لابن تيمية","كتاب التوحيد لمحمد بن عبد الوهاب","الإتقان في علوم القرآن للسيوطي","البرهان في علوم القرآن للزركشي","المقدمة الجزرية وهداية القاري للداني","الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة، المجموع للنووي، بدائع الصنائع للكاساني","الفقه على المذاهب الأربعة للجزيري"]},"MEMORIZATION_PLAN":["ابدأ بتثبيت الفاتحة وقصار السور مع تصحيح المخارج والمدود.","قسّم الحفظ إلى وحداتٍ صغيرة مع تكرارٍ يوميٍّ قبل المراجعة.","اجعل لك وردًا ثابتًا من السرد والمراجعة في كل أسبوع.","راجع المتشابهات والأطراف بعد كل ختمةٍ جزئية.","اجمع بين الحفظ والفهم والتدبر، فذلك أثبت وأبرك."],"SECTION_CARDS":[{"key":"seerah","path":"/seerah","title":"السيرة النبوية","description":"محطات النبوة والشمائل والهجرة والجهاد والخلفاء الراشدون في قراءةٍ تجمع الرواية الصحيحة والدرس التربوي.","accent":"seerah","icon":"moon","count":55,"unit":"موضوعًا"},{"key":"aqeedah","path":"/aqeedah","title":"العقيدة","description":"توحيد الربوبية والألوهية والأسماء والصفات، والإيمان بالملائكة والرسل واليوم الآخر، مع قاعدةٍ راسخةٍ في منهج أهل السنة.","accent":"aqeedah","icon":"shield","count":20,"unit":"موضوعًا"},{"key":"quran","path":"/quran","title":"القرآن الكريم","description":"علوم القرآن والتجويد والسور المختارة وخطة حفظٍ متدرجة، مع مراعاة ضبط الأداء وفهم المعاني.","accent":"quran","icon":"book","count":24,"unit":"موضوعًا"},{"key":"fiqh","path":"/fiqh","title":"الفقه الإسلامي","description":"خريطةٌ عمليةٌ لأبواب الفقه السبعة مع عرضٍ مبسّطٍ للأحكام ومسالك الاستدلال من القرآن والسنة وأقوال الفقهاء.","accent":"fiqh","icon":"scale","count":36,"unit":"بابًا فقهيًّا"}]};
const SECTIONS=[{id:'seerah',title:'السيرة النبوية',icon:'☾',desc:'أحداث السيرة والشمائل والخلفاء الراشدون',topics:DATA.seerah},{id:'aqeedah',title:'العقيدة',icon:'◇',desc:'أصول الإيمان والتوحيد',topics:DATA.aqeedah},{id:'quran',title:'القرآن الكريم',icon:'▤',desc:'علوم القرآن والتجويد والسور',topics:[...DATA.quranScience,...DATA.tajweed]},{id:'fiqh',title:'الفقه الإسلامي',icon:'⚖',desc:'أبواب الفقه وأحكام العبادات والمعاملات',topics:DATA.fiqh.flatMap(x=>x.topics)}];
const $=s=>document.querySelector(s);let fav=new Set(JSON.parse(localStorage.getItem('tarmeem-favs')||'[]'));let openTopics=new Set();let current='home';let toastTimer;
function norm(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ـ/g,'').trim()}
function showToast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),2100)}
function go(path){location.hash=path;closeDrawer();}
function closeDrawer(){$('#mobileDrawer').classList.remove('open');$('#drawerBack').classList.remove('open')}
function navItems(){return [{id:'home',label:'الرئيسية',icon:'⌂',path:'#/'},...SECTIONS.map(s=>({id:s.id,label:s.title,icon:s.icon,path:'#/'+s.id})),{id:'search',label:'البحث',icon:'⌕',path:'#/search'},{id:'favorites',label:'المفضلة',icon:'♡',path:'#/favorites'},{id:'about',label:'عن التطبيق',icon:'ⓘ',path:'#/about'}]}
function renderNav(){let items=navItems();$('#sidebar').innerHTML='<div class="side-title">استكشف الموسوعة</div>'+items.map(i=>`<button class="navitem ${current===i.id?'active':''}" data-go="${i.path}"><span class="navicon">${i.icon}</span>${i.label}</button>`).join('')+'<div class="side-note">﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾<br><small>طه: ١١٤</small></div>';$('#mobileDrawer').innerHTML='<div class="side-title">استكشف الموسوعة</div>'+items.map(i=>`<button class="navitem ${current===i.id?'active':''}" data-go="${i.path}"><span class="navicon">${i.icon}</span>${i.label}</button>`).join('');$('#bottomnav').innerHTML=items.filter(i=>['home','seerah','quran','search','favorites'].includes(i.id)).map(i=>`<button class="${current===i.id?'active':''}" data-go="${i.path}"><b>${i.icon}</b>${i.label}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function head(title,desc){return `<div class="pagehead"><h1>${title}</h1><p>${desc||''}</p></div>`}
function topicText(t){let out=`<p>${(t.content||[]).map(esc).join('\n\n')}</p>`;if(t.evidences?.length)out+='<h4>الأدلة الشرعية</h4>'+t.evidences.map(e=>`<div class="evidence">${esc(e.text)}<small>${esc(e.source)}</small></div>`).join('');if(t.benefits?.length)out+='<h4>فوائد ودروس</h4><ul>'+t.benefits.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';if(t.references?.length)out+='<h4>المصادر والمراجع</h4><ul>'+t.references.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';return out}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fullText(t){return [t.title,t.summary,...(t.content||[]),...(t.evidences||[]).flatMap(e=>[e.text,e.source]),...(t.benefits||[]),...(t.references||[])].join('\n')}
function topicCard(t){let isOpen=openTopics.has(t.id),saved=fav.has(t.id);return `<article class="topic"><button class="topic-toggle" data-topic="${esc(t.id)}"><span>${esc(t.title)}<small>${esc(t.summary||'')}</small></span><span>${isOpen?'−':'＋'}</span></button>${isOpen?`<div class="topic-body">${topicText(t)}<div class="topic-actions"><button class="mini ${saved?'saved':''}" data-fav="${esc(t.id)}">${saved?'♥ محفوظ':'♡ أضف للمفضلة'}</button><button class="mini" data-copy="${esc(t.id)}">نسخ الموضوع</button><button class="mini" data-share="${esc(t.id)}">مشاركة</button></div></div>`:''}</article>`}
function bindTopicActions(){document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{let id=b.dataset.topic;openTopics.has(id)?openTopics.delete(id):openTopics.add(id);render()});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=b.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('tarmeem-favs',JSON.stringify([...fav]));render();showToast(fav.has(id)?'أُضيف إلى المفضلة':'أُزيل من المفضلة')});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyTopic(b.dataset.copy));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>shareTopic(b.dataset.share))}
function allTopics(){return [...DATA.seerah,...DATA.aqeedah,...DATA.quranScience,...DATA.tajweed,...DATA.fiqh.flatMap(x=>x.topics)]}
function getTopic(id){return allTopics().find(t=>t.id===id)}
async function copyTopic(id){let t=getTopic(id);if(!t)return;try{await navigator.clipboard.writeText(fullText(t));showToast('تم نسخ الموضوع')}catch(e){showToast('تعذر النسخ في هذا المتصفح')}}
async function shareTopic(id){let t=getTopic(id);if(!t)return;let text=fullText(t);if(navigator.share){try{await navigator.share({title:t.title,text})}catch(e){}}else{copyTopic(id)}}
function home(){let counts=[['موضوعات السيرة',55],['موضوعات العقيدة',20],['موضوعات القرآن والتجويد',24],['أبواب الفقه',DATA.fiqhTopicsCount],['السور القرآنية',114],['أسماء الله الحسنى',99]];return `<section class="hero"><div class="eyebrow">موسوعة علمية إسلامية</div><h1>ترميم الإسلام</h1><p>موسوعة علمية شاملة تربط السيرة النبوية بالعقيدة والقرآن والفقه في صياغةٍ متينة، مع محتوى موثق يفتح أبواب التعلّم والتدبر.</p><div class="hero-buttons"><button class="btn primary" data-go="#/seerah">ابدأ التعلّم ←</button><button class="btn" data-go="#/search">ابحث في الموسوعة</button></div></section><div class="verse"><div class="arabic">﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾</div><small>سورة طه · الآية ١١٤</small></div><div class="section-head"><h2>إحصائيات الموسوعة</h2><p>أرقام الموسوعة كما هي في بيانات المشروع.</p></div><div class="stats">${counts.map(x=>`<div class="stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}</div><div class="section-head"><h2>أقسام الموسوعة</h2><p>أربعة أقسام كبرى تجمع السيرة والعقيدة والقرآن والفقه.</p></div><div class="cards">${SECTIONS.map(s=>`<div class="card" data-go="#/${s.id}"><div class="symbol">${s.icon}</div><h3>${s.title}</h3><p>${s.desc}</p><span class="pill">${s.topics.length} موضوعًا</span></div>`).join('')}</div><div class="section-head"><h2>موضوعات مختارة</h2><p>نماذج من موضوعات الموسوعة.</p></div>${[DATA.seerah[0],DATA.aqeedah[2],DATA.quranScience[0],DATA.fiqh[1].topics[0]].filter(Boolean).map(topicCard).join('')}<div class="section-head"><h2>السور المختارة</h2><p>السور الأولى من المصحف الشريف.</p></div>${surahGrid(DATA.surahs.slice(0,6))}<div class="section-head"><h2>أسماء الله الحسنى</h2><p>نماذج من الأسماء ومعانيها.</p></div>${namesGrid(DATA.asmaAllah.slice(0,8))}`}
function surahGrid(items){return `<div class="surah-grid">${items.map(s=>`<div class="surah"><strong>${esc(s.name)}</strong><small>${s.number} · ${s.revelation} · ${s.ayahs} آية</small><p>${esc(s.virtue||'')}</p></div>`).join('')}</div>`}
function namesGrid(items){return `<div class="name-grid">${items.map(n=>`<div class="namebox"><strong>${esc(n.name)}</strong><small>${esc(n.meaning)}</small></div>`).join('')}</div>`}
function sectionPage(s){return head(s.title,s.desc)+`<div class="result-meta">عدد الموضوعات: ${s.topics.length}</div>`+s.topics.map(topicCard).join('')}
function fiqhPage(){return head('الفقه الإسلامي','خريطة أبواب الفقه السبعة، مع الموضوعات التفصيلية والأدلة والفوائد والمراجع.')+DATA.fiqh.map(sec=>`<div class="section-head"><h2>${esc(sec.title)}</h2><p>${esc(sec.description||'')}</p></div>${sec.topics.map(topicCard).join('')}`).join('')}
function searchPage(query=''){return head('البحث في الموسوعة','بحث فوري في موضوعات السيرة والعقيدة والقرآن والفقه والسور وأسماء الله الحسنى.')+`<input id="searchInput" class="searchbox" placeholder="ابحث عن موضوع أو كلمة..." value="${esc(query)}"><div class="result-meta" id="resultMeta"></div><div id="searchResults"></div>`}
function doSearch(q){let el=$('#searchResults'),meta=$('#resultMeta');if(!el)return;let n=norm(q);if(!n){el.innerHTML='<div class="empty">اكتب كلمة أو عبارة للبحث في الموسوعة.</div>';meta.textContent='';return}let items=[];for(let t of allTopics()){let text=norm(fullText(t));if(text.includes(n)){let score=norm(t.title).includes(n)?0:1;items.push({type:'topic',t,score})}}for(let s of DATA.surahs){if(norm(s.name+' '+s.virtue).includes(n))items.push({type:'surah',s,score:2})}for(let a of DATA.asmaAllah){if(norm(a.name+' '+a.meaning).includes(n))items.push({type:'name',a,score:2})}items.sort((a,b)=>a.score-b.score);meta.textContent=`${items.length} نتيجة`;el.innerHTML=items.length?items.slice(0,100).map(x=>x.type==='topic'?topicCard(x.t):x.type==='surah'?`<div class="topic"><div class="topic-toggle"><span>سورة ${esc(x.s.name)}<small>${x.s.revelation} · ${x.s.ayahs} آية · ${esc(x.s.virtue)}</small></span></div></div>`:`<div class="topic"><div class="topic-toggle"><span>${esc(x.a.name)}<small>${esc(x.a.meaning)}</small></span></div></div>`).join(''):'<div class="empty">لا توجد نتائج مطابقة. جرّب كلمة أخرى.</div>';bindTopicActions()}
function favoritesPage(){let items=allTopics().filter(t=>fav.has(t.id));return head('المفضلة','الموضوعات التي حفظتها للرجوع إليها لاحقًا.')+(items.length?items.map(topicCard).join(''):'<div class="empty">لم تضف أي موضوع إلى المفضلة بعد.</div>')}
function aboutPage(){return head('عن ترميم الإسلام','موسوعة علمية إسلامية للتعلّم والبحث والتدبر.')+`<div class="topic"><div class="topic-body" style="display:block;border:0;padding:20px"><h3>رسالة الموسوعة</h3><p>تجمع الموسوعة موضوعات السيرة النبوية والعقيدة وعلوم القرآن والتجويد والفقه الإسلامي، مع الأدلة الشرعية والفوائد والمصادر والمراجع حيثما وردت في بيانات الموضوع.</p><h4>محتويات الموسوعة</h4><ul><li>السيرة النبوية والشمائل والخلفاء الراشدون.</li><li>العقيدة وأصول الإيمان.</li><li>علوم القرآن والتجويد والسور.</li><li>أبواب الفقه الإسلامي.</li><li>أسماء الله الحسنى.</li><li>بحث شامل ومفضلة محلية.</li></ul><h4>المصادر المعتمدة في بيانات المشروع</h4><p>سيرة ابن هشام، السيرة النبوية لابن كثير، زاد المعاد، الرحيق المختوم، الشمائل المحمدية، صحيح البخاري ومسلم، العقيدة الطحاوية، العقيدة الواسطية، كتاب التوحيد، الإتقان في علوم القرآن، البرهان في علوم القرآن، المقدمة الجزرية، هداية القاري، الفقه الإسلامي وأدلته، المغني، المجموع، بدائع الصنائع، والفقه على المذاهب الأربعة.</p><p style="color:var(--muted)">© 2026 ترميم الإسلام. جميع الحقوق محفوظة.</p></div></div>`}
function render(){let hash=decodeURIComponent(location.hash||'#/');let path=hash.replace(/^#\/?/,'').split('?')[0]||'home';let query=new URLSearchParams(hash.split('?')[1]||'').get('q')||'';current=path;let app=$('#app');if(path==='home')app.innerHTML=home();else if(path==='seerah')app.innerHTML=sectionPage(SECTIONS[0]);else if(path==='aqeedah')app.innerHTML=sectionPage(SECTIONS[1]);else if(path==='quran')app.innerHTML=sectionPage(SECTIONS[2])+`<div class="section-head"><h2>السور القرآنية</h2><p>بيانات السور كما وردت في الموسوعة.</p></div>`+surahGrid(DATA.surahs)+`<div class="section-head"><h2>أسماء الله الحسنى</h2><p>الأسماء ومعانيها.</p></div>`+namesGrid(DATA.asmaAllah)+`<div class=\"section-head\"><h2>خطة الحفظ والمراجعة</h2><p>خطوات عملية مقترحة لتثبيت الحفظ.</p></div><div class=\"topic\"><div class=\"topic-body\" style=\"display:block;border:0;padding:18px\"><ol>${DATA.MEMORIZATION_PLAN.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div></div>`;else if(path==='fiqh')app.innerHTML=fiqhPage();else if(path==='search')app.innerHTML=searchPage(query);else if(path==='favorites')app.innerHTML=favoritesPage();else if(path==='about')app.innerHTML=aboutPage();else app.innerHTML=home();renderNav();bindTopicActions();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if(path==='search'){let input=$('#searchInput');doSearch(query);input.addEventListener('input',()=>doSearch(input.value))}window.scrollTo({top:0,behavior:'instant'})}
$('#themeBtn').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('tarmeem-theme',t)};let savedTheme=localStorage.getItem('tarmeem-theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;$('#menuBtn').onclick=()=>{$('#mobileDrawer').classList.add('open');$('#drawerBack').classList.add('open')};$('#drawerBack').onclick=closeDrawer;window.addEventListener('hashchange',render);window.addEventListener('scroll',()=>{let d=document.documentElement;let max=d.scrollHeight-d.clientHeight;$('#progress').style.width=(max>0?d.scrollTop/max*100:0)+'%'});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});render();
</script></body></html>
