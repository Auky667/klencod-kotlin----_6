:root{--bg:#211f1b;--surface:#2b2822;--surface2:#343027;--text:#f3eee3;--muted:#b7ad9c;--gold:#c6a66b;--gold2:#e0c58d;--line:#51483a;--shadow:0 18px 48px #0005;--green:#9cae8b} [data-theme=light]{--bg:#f4f0e7;--surface:#fffdf8;--surface2:#eee8dc;--text:#302b23;--muted:#756b5c;--gold:#98743d;--gold2:#785b2e;--line:#ded4c3;--shadow:0 16px 40px #51452b18;--green:#5c7950}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,Arial,sans-serif;line-height:1.85;background-image:radial-gradient(circle at 15% 10%,#c6a66b0d,transparent 30%),radial-gradient(circle at 90% 40%,#c6a66b0a,transparent 35%)}button,input{font:inherit}button{cursor:pointer}.topbar{height:68px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1120px)/2))}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-weight:800;font-size:20px}.brandmark{width:40px;height:40px;border:1px solid var(--gold);border-radius:13px;display:grid;place-items:center;color:var(--gold);font-family:Amiri;font-size:25px;background:linear-gradient(145deg,#c6a66b22,#c6a66b05)}.top-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 13px}.iconbtn{width:42px;height:42px;display:grid;place-items:center;font-size:18px}.btn.primary{background:var(--gold);color:#211d16;border-color:var(--gold);font-weight:800}.shell{max-width:1120px;margin:auto;padding:26px 18px 100px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:26px}.sidebar{position:sticky;top:88px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}.side-title{color:var(--muted);font-size:12px;margin:4px 10px 10px}.navitem{width:100%;display:flex;align-items:center;gap:11px;text-align:right;padding:11px 12px;border:0;background:transparent;color:var(--muted);border-radius:12px;font-weight:600}.navitem:hover,.navitem.active{background:var(--surface2);color:var(--gold2)}.navicon{width:25px;text-align:center;font-size:17px}.side-note{margin-top:18px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#c6a66b1c,#c6a66b05);border:1px solid #c6a66b35;color:var(--muted);font-family:Amiri;font-size:17px}.content{min-width:0}.hero{border:1px solid #b99a624a;border-radius:25px;padding:34px 30px;background:linear-gradient(120deg,#3a3225,#26231e 72%);position:relative;overflow:hidden;box-shadow:var(--shadow)}[data-theme=light] .hero{background:linear-gradient(120deg,#eee1c7,#fffaf0 72%)}.hero:after{content:'۞';position:absolute;left:18px;top:-45px;font-size:190px;color:#c6a66b16}.eyebrow{color:var(--gold2);font-weight:700;font-size:13px;letter-spacing:.5px}.hero h1{font-family:Amiri,serif;font-size:clamp(34px,5vw,54px);line-height:1.35;margin:8px 0;color:var(--text)}.hero p{max-width:660px;color:var(--muted);font-size:17px;margin:0 0 20px}.hero-buttons{display:flex;gap:10px;flex-wrap:wrap}.verse{margin-top:20px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:22px;text-align:center}.verse .arabic{font-family:Amiri;font-size:25px;color:var(--gold2);line-height:2}.verse small{color:var(--muted)}.section-head{margin:34px 0 15px}.section-head h2{font-family:Amiri;font-size:27px;margin:0}.section-head p{color:var(--muted);margin:0;font-size:14px}.stats,.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat,.card,.topic{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:17px}.stat strong{display:block;color:var(--gold2);font-size:27px}.stat span{color:var(--muted);font-size:13px}.card{cursor:pointer;transition:.2s;position:relative}.card:hover{transform:translateY(-2px);border-color:var(--gold)}.card .symbol{font-size:23px;color:var(--gold)}.card h3{margin:6px 0 3px;font-size:19px}.card p{color:var(--muted);font-size:14px;margin:0}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--gold2);font-size:12px;margin-top:10px}.pagehead{padding:22px 0 18px;border-bottom:1px solid var(--line);margin-bottom:20px}.pagehead h1{font-family:Amiri;font-size:35px;margin:0}.pagehead p{color:var(--muted);margin:2px 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.searchbox{width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none}.searchbox:focus{border-color:var(--gold)}.topic{margin-bottom:11px;padding:0;overflow:hidden}.topic-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px;text-align:right;border:0;background:transparent;color:var(--text);font-weight:800;font-size:17px}.topic-toggle small{display:block;color:var(--muted);font-weight:400;font-size:13px}.topic-body{padding:0 18px 18px;border-top:1px solid var(--line);color:var(--text)}.topic-body p{white-space:pre-line}.topic-body h4{color:var(--gold2);margin:15px 0 5px}.topic-body ul{padding-right:22px;color:var(--muted)}.evidence{padding:12px 14px;border-right:3px solid var(--gold);background:var(--surface2);border-radius:10px;margin:9px 0;font-family:Amiri;font-size:17px}.evidence small{display:block;color:var(--muted);font-family:Tajawal;font-size:12px}.topic-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.mini{font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text)}.mini.saved{color:var(--gold2);border-color:var(--gold)}.surah-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.surah{padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--surface);text-align:center}.surah strong{display:block;color:var(--gold2);font-family:Amiri;font-size:20px}.surah small{color:var(--muted)}.name-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.namebox{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center}.namebox strong{font-family:Amiri;color:var(--gold2);font-size:21px}.namebox small{display:block;color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.footer{color:var(--muted);text-align:center;padding:35px 10px 10px;font-size:12px}.bottomnav{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--gold);color:#211d16;padding:10px 18px;border-radius:99px;z-index:80;transition:.25s;font-weight:700}.toast.show{opacity:1;transform:translate(-50%,0)}.progress{position:fixed;top:68px;right:0;height:2px;background:var(--gold);z-index:19;width:0}.drawerback{display:none}.drawerback.open{display:block;position:fixed;inset:68px 0 0;background:#0008;z-index:29}.mobile-drawer{display:none}.result-meta{color:var(--muted);font-size:13px;margin:8px 0 14px}

</style></head><body><div class="progress" id="progress"></div><header class="topbar"><a class="brand" href="#/"><span class="brandmark">۞</span><span>ترميم الإسلام</span></a><div class="top-actions"><button class="iconbtn" id="themeBtn" aria-label="تغيير المظهر">☼</button><button class="iconbtn" id="menuBtn" aria-label="القائمة">☰</button></div></header><div class="drawerback" id="drawerBack"></div><aside class="mobile-drawer" id="mobileDrawer"></aside><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="content" id="app" aria-live="polite"></main></div><nav class="bottomnav" id="bottomnav"></nav><div class="toast" id="toast"></div><script>
const DATA={"seerah":[{"id":"seerah-1","title":"نسبه ﷺ ومولده المطهّر","summary":"شرف النسبة القريشية، ومولده في عام الفيل بمكة، وحمل المشارق والمغارب من عظمته.","content":["هو محمد بن عبد الله بن عبد المطلب بن هاشم بن عبد مناف، من قريش، ومن بني هاشم أشراف العرب نسبًا ومنزلةً، وكانت أمّه آمنة بنت وهب قد حملت به وقد استنزلت عليها الأخبار الطيبة في أسلامه وتعفيقه، وحملته في ثلاثة أشهر لا في تسعة كما ورد في روايات المولد.","وُلد ﷺ في يوم الاثنين من شهر ربيع الأول في عام الفيل، وولد في دار أبي طالب مخدوعًا، ثم قُطعت سُرّته وأُخترع، وكان جده عبد المطلب أول من أخذ إلى الحِضانة وأخذه إلى الكعبة ودعا عليه، وسمّاه محمدًا على رغبة أن يُحمَد به في السماء والأرض، وكان العرب يُسمّون فيه الأنبياء والملوك."],"evidences":[{"text":"«هذا النجم الذي وُلد به في يومك؛ فقد استنزلت اليوم على هذه الولادة وحمَله»","source":"رواه أحمد بسنده عن عبد الله بن عباس"},{"text":"«ولِدَتْ فاطمة في عام الفيل، وخلق رسول الله ﷺ في عام الفيل»","source":"أخرجه البخاري في صحيحه"}],"benefits":["شرف النسبة عزّة للنبي ﷺ وإشارة إلى أن النبوة تُقدَّم من سلالة صالحة.","المولد في عام الفيل رمز إلى حماية الله لبيته من أهل الفيل، فحماه من أبرهة وحمايته من سيد الخلق.","الاهتمام بمولده ﷺ مدخل لقراءة حياته كلها بوصفها مِحَنَ النبوة."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-2","title":"الرضاعة في بادية بني سعد","summary":"تغذّيه ﷺ بحليب حليمة السعدية وتجفيف الدماء قبل القيام بالرسالة.","content":["أُرسل ﷺ إلى بادية بني سعد ليُرعى في كفالة حليمة السعدية، فكانت تُرعاه مع ابنها، وشهده ﷺ أربع سنوات في بادية بني سعد، وقيل: خمس سنوات، وفيها تعلّم لغة العرب الفصيحة، وشهد أهلها كرمًا وحلمًا وصلاة ليل ونهارًا، ولم يكن ﷺ في الصبا يُعربُ ولا يُهمِل.","كانت حليمة تقول: رأيتُ في حضنه بركةً لا تُرى في سواها، ولم يُصِبه من عينٍ ولا آفة، ولم يصبه كريب ولا ذُحِل ولا نُحِل، وكانت تشهد ﷺ وهو صبيّ أنّه كان يُنصف في اللعب ولا يُعنّف."],"evidences":[{"text":"«إِنَّمَا النِّعْمَةُ بِاللَّهِ، فَرَأَيْتُ حِزْبًا فِي خَدِيجَةَ فِي رَقْبَةِ النَّبِيِّ ﷺ»","source":"رواه أحمد"},{"text":"«مِنَ الرِّفْقِ أَنْ يُسَمَّى الْوَلَدُ فِي بَادِيَةِ بَنِي سَعْدٍ»","source":"سيرة ابن هشام"}],"benefits":["العناية بالصغار وتربيتهم في بيئة صحية سُنّة تربوية قبل أن تكون مسألة شخصية.","البركة في الرزق والولد سببها الإحسان إلى ما في الحضن.","اللغة الفصيحة تُبنى في الصبا، فالبيئة الأولى تصنع الكلمة."],"references":["سيرة ابن هشام","البدء والنهاية"]},{"id":"seerah-3","title":"اليُتم وكفالة أبي طالب","summary":"مات أبوه قبل مولده، وماتت أمّه وهو ابن ستّ، فتولّاه جده عبد المطلب ثم عمّه أبو طالب.","content":["مات عبد الله وأمّ ﷺ حاملًا به، فنشأ ﷺ يتيمًا من الطرفين، ثم ماتت أمّه آمنة وهو ابن ستّ سنين في ألفواء، فتولّى جده عبد المطلب كفالته وربّاه في بيته، وكان يقول له: امشِ على قدمي ولا تُبرح، ثم مات عبد المطلب وكان ﷺ ابن ثماني سنين، فأخذ عمّه أبو طالب كفالته ورعايته.","كان أبو طالب يحبّه محبةً عظيمة، وكان يقدّمه على أبنائه، ويَنِمُ في فراشه وينام في فراشه، ولا يُحبّ أن يُفارقه، وكان ﷺ يُحبّه ويرعاه، ويُحبّ أخته أمّ هانئ وعليًّا وأبا لهب."],"evidences":[{"text":"«لَقَدْ جَاءَكُمْ نَبِيٌّ تِمِيمِيٌّ، وَرَبِّيْ أَنْ يَحْفَظَهُ»","source":"سيرة ابن هشام"},{"text":"«كَانَ أَبُو طَالِبٍ يُقَدِّمُهُ عَلَى أَبْنَائِهِ»","source":"السيرة النبوية لابن كثير"}],"benefits":["اليتيم الذي نشأ بلا والد يحمل قلبًا يرحم كل يتيم، فكان ﷺ يتيمًا يرحم الأيتام.","كفالة الوالدين والعمّ تُعلّمنا أن الأبوة ليست نسبًا وحده بل عنايةً ورفقًا.","الحزن المبكّر ربّا في صمود ﷺ لاحقًا على إيذاء قومه."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-4","title":"رحلة الشام وبحيرا الرومي","summary":"رحلة تجارية في صباه، ورأى الراهب بحيرا في ﷺ علامات النبوة.","content":["خرج أبو طالب في رحلة إلى الشام ومعه ﷺ وهو صبيّ، فمرّوا ببحيرا الراهب في بُصْرى، فنظر إلى ﷺ فسأله عن نفسه ومُعجِزه، ثم نادى: يا أبا طالب، احمل إلى بُصْرى لَرَأيتُ هذا الولد علاماتٍ لا تُخفيها النبوة.","ثم أرسل إلى ﷺ أن يُدخله في نِعَمه، فجعل أبو طالب يشهد ﷺ وهو يُحيي الصخور والشجر، ثم سأل بحيرا: ما تعرف بهذا الولد؟ فقال: قد رأيتُ هذا الفتى في الكتب وسمعتُ منه النبوءة، فهذا الفتى سيد العرب ونبيّهم."],"evidences":[{"text":"«هَذَا الْفَتَى قَدْ رَأَيْتُ فِيهِ عَلَامَاتِ النُّبُوَّةِ»","source":"سيرة ابن هشام"},{"text":"«فِي الْكُتُبِ الَّتِي مَا مَرَّ عَلَيْنَا بِهَا»","source":"السيرة النبوية لابن كثير"}],"benefits":["النبوة لم تكن بدعةً مفاجئة، بل مُعلَنة في الكتب السابقة، وهذا أساس التسليم لعزة الديانة.","العلماء والرهبان الذين عرفوا ﷺ قد رأوا في صفاته ما يُطابق الكتب، فالتاريخ مُشهدٌ له.","الرحلة إلى الشام فتحت في نفسه عينًا على الكون، وقدّمت له تجربةً في التجارة والعمل."],"references":["سيرة ابن هشام","زاد المعاد"]},{"id":"seerah-5","title":"حلف الفضول ورسالة الشباب","summary":"حلفٌ في دار عبد الله بن جدعان لدعم المظلومين، وكان ﷺ يقول بعد النبوة: لو دُعيتُ به في الإسلام لأجبت.","content":["حُلِفوا — قريشٌ وأنصارهم — في دار عبد الله بن جدعان على أن لا يترُكوا مَظلومًا في مكة، وأن يُنصفوا المُظلَمَين من السفر والنَّسَس، فكانوا يُسمّونه حلفَ الفضول، لأنهم كفّوا الفُضول.","كان ﷺ يقول بعد أن أُمِحَ بالرسالة: «لقد شهدتُ في دار عبد الله بن جدعان حلفًا، ولَو دُعيتُ به في الإسلام لأجبتُ، ولَو دُعيتُ في الإسلام بكما ترُون، لأجبتُ»."],"evidences":[{"text":"«لَقَدْ شَهِدْتُ فِي دَارِ عَبْدِ اللَّهِ بْنِ جُدْعَانِ حِلْفًا، وَلَوْ دُعِيتُ بِهِ فِي الْإِسْلَامِ لَأَجَبْتُ»","source":"رواه أحمد والمُستدرك"},{"text":"«لَقَدْ كُنْتُ قَبْلَ النُّبُوَّةِ أَحْفَظُ الْفُضُولَ»","source":"سيرة ابن هشام"}],"benefits":["العدل مبدأ سابق على الإيمان في الرسالة، فمن ينصف المظلوم قد قدّم ما يُقبله الله.","الشباب يستطيع أن يصنع تحولًا في قومه إذا اجتمع على كلمة الحق.","الالتزام بأحكام العدل الاجتماعي ليس تعارضًا مع الدعوة بل بدايةً لها."],"references":["سيرة ابن هشام","المُستدرك على الصحيحين"]},{"id":"seerah-6","title":"زواجه بخديجة رضي الله عنها","summary":"زواج ﷺ بخديجة بنت خويلد وهو ابن خمسة وعشرين، وكانت أمّاً لَه في الدنيا والرسالة.","content":["كانت خديجة بنت خويلد سيدة قريش في عصبيّتها وكرمها وعقلها، وقد أوّلوا ﷺ بالتجارة في أشعاعها، فكانت تُعِدّه بوصلةٍ في التجارة، ثم تزوّجه وهي سيدةٌ نزيهةٌ، فكانت أمّه في الحياة أولًا وأمّاً لَه في الدنيا.","كانت خديجة أول من آمن به، وأول من صدّقته في رسالته، وكانت تحفظه وتُحمي بيتها وتُشدد الإيذاء، وكانت ﷺ يقول عنها: «إنّها ما آمنتْ بها، صدّقتْني حيث كفّرتْني القوم»."],"evidences":[{"text":"«أَوَّلُ مَنْ آمَنَتْ خَدِيجَةُ، وَصَدَّقَتْنِي حَيْثُ كَفَرَتْنِي الْقَوْمُ»","source":"صحيح البخاري"},{"text":"«كَانَتْ أَوَّلَ زَوْجَتِي، وَأَوَّلَ مَنْ آمَنَتْ بِي»","source":"صحيح مسلم"}],"benefits":["زواج النبي ﷺ بخديجة نموذجٌ في القراءة التربوية للأسرة: الصدقة والثقة قبل الولد.","أول من آمن به كانت امرأة، وهذا شرفٌ للمرأة في الإسلام، ولا يُشرف بها إلا من صدّق.","الزوجة قد تكون سندًا في الدعوة لا رافعًا لها."],"references":["سيرة ابن هشام","صحيح البخاري"]},{"id":"seerah-7","title":"تحكيمه في الحجر الأسود","summary":"حكمٌ عدلٌ في عام الفيل وما بعده، وحفظ الكعبة من فتنة الدماء.","content":["وُجِدت الكعبة مُبنيةً من جديد بعد الحصاد، فاختَلِفت قريشٌ في رفع الحجر الأسود إلى مكانه، فاختلفت بينهم الأسباب إلى أن كادت تنهض الدماء، فجعلوا يُحكّمون أول داخل من باب، فكان ﷺ هو الحاكم، وقد ناشروا له.","فجعل ﷺ رداءً ووضع الحجر في وسطه، وقال: «خذوا طرفين كل فرع وارفعوه»، ثم وضعه بيده في مكانه، فاستقرّ الأمر ولم يُصِب دماء."],"evidences":[{"text":"«خُذُوا طَرَفَيْهِ مِنْ كُلِّ فَرِيعٍ وَارْفَعُوهُ»","source":"سيرة ابن هشام"},{"text":"«قَدْ حَكَمَ فِيهِ بِالْعَدْلِ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الحكمة في حل الخلاف سُنّة من سُنن النبوة قبل أن تُفرَض في الرسالة.","العناية بالرموز لا تعني تعصبًا للرمز، بل حفظًا للدلالة والمكان.","الإنصاف في المشكلات الاجتماعية يمنع الدماء والفتن."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-8","title":"التنسك في غار حراء وبدء الوحي","summary":"عُمِر ﷺ بالوحي في غار حراء بعد أن أحبّ الخلاء والتنسك، وكان عمره أربعون عامًا.","content":["كان ﷺ إذا نزل على بيته أحبّ الخلاء والتنسك، وخرج إلى غار حراء، وكان يخرج شهرًا بلا أهل، وكانت خديجة تُرسل إليه طعامًا، ثم خرج إلى غار حراء، وكان عمره أربعون عامًا.","وأُمِر ﷺ بالوحي، فجاءه الملك والوحى، ثم أُمِرَ بالوحى، وكان ﷺ في الخوف من الوحي وحالة الجِبريل، وقد كان يجيء في صورة رجلٍ عنده في ساتر، فيأتي ﷺ وهو في ساتره."],"evidences":[{"text":"«كَانَ يُحِبُّ الْخَلَاءَ وَالتَّنَسُّكَ، وَيَخْرُجُ إِلَى غَارِ حِرَاءَ»","source":"صحيح البخاري"},{"text":"«ثُمَّ أُمِرَ بِالْوَحْيِ وَهُوَ فِي غَارِ حِرَاءَ»","source":"صحيح مسلم"}],"benefits":["الخلاء والصمت مدخلٌ للعقل والتدبر قبل الوحي.","الوحي جاء في ساعة نفسٍ صافية، فالنفس النقية أهلٌ للتنبيه.","الصبر على الخلوة سببٌ في تهدئة القلب قبل حمل الرسالة."],"references":["صحيح البخاري","صحيح مسلم"]},{"id":"seerah-9","title":"«اقرأ» وأول ما نزل من القرآن","summary":"أول آيات نزلت: «اقرأ باسم ربك الذي خلق»، وبدأ ﷺ بالقراءة والتعليم.","content":["كان أول ما نزل من القرآن: «اقرأ باسم ربك الذي خلق»، وبدأ ﷺ بالقراءة والتعليم، وأمره الله بالقراءة على القوم، فكان أول ما نزل من القرآن سورة العلق، وفيها أوامر بالقراءة والتعلّم.","وكان ﷺ يُقرأ عليه، ويُعلّم الناس، وكان أتباعه الأولون يُقرأون عليه، ويُعلّمون الناس، وكان ﷺ يُقرأ عليهم، ويُعلّمهم، ويُحَدّثهم."],"evidences":[{"text":"«اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ»","source":"سورة العلق 1"},{"text":"«كَانَ أَوَّلَ مَا نَزَلَ مِنَ الْقُرْآنِ سُورَةُ الْعَلَقِ»","source":"صحيح البخاري"}],"benefits":["أول أمرٍ في الوحي أمرٌ بالقراءة، فالعلوم تُبنى على القراءة والتعليم.","القراءة في ديننا ليست تسميةً حرفية بل فهمًا وتعلّمًا وتطبيقًا.","التعليم في الإسلام ليس مهنةً فقط بل عِبادةٌ ورسالة."],"references":["سورة العلق","صحيح البخاري"]},{"id":"seerah-10","title":"الدعوة السرية والأتباع الأولون","summary":"ثلاث سنوات من الدعوة في الخفيّة، وأول الأتباع: خديجة وعليّ وأبو بكر وزيد.","content":["دعا ﷺ سرًّا ثلاث سنين، وكان أول من آمن به خديجة، ثم عليّ بن أبي طالب وهو صبيّ، ثم زيد بن حارثة مولاه، ثم أبو بكر الصدّيق، ثم سلمى وسمية وابنُها عمار، وأبو سلمى، وسعيد بن زيد.","وكان ﷺ في الدعوة السرية يُدخل الناس في الدين، ويُعلّمهم القرآن في الخفيّة، ويُلقّيهم الإسلام، وكان يُقرأ عليهم القرآن ويُعلّمهم، وكان يُلقّيهم الإسلام في الخفيّة."],"evidences":[{"text":"«أَوَّلُ مَنْ آمَنَتْ خَدِيجَةُ، ثُمَّ عَلِيٌّ، ثُمَّ زَيْدٌ، ثُمَّ أَبُو بَكْرٍ»","source":"السيرة النبوية لابن كثير"},{"text":"«كَانَ يُدَاوِي الْقَوْمَ فِي خَفِيَّةٍ، وَيُعَلِّمُهُمُ الْقُرْآنَ فِي خَفِيَّةٍ»","source":"سيرة ابن هشام"}],"benefits":["البدء بالقريبين سُنّة الدعوة، فأول من آمن به كان أهل بيته وقرُبائه.","التعليم في الخفيّة يُبنى القلب قبل أن يُبنى الحكم.","أول الأتباع لم يكونوا أقوياء في الدنيا، بل صادقين في القلب."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-11","title":"الدعوة الجهرية والجبل المشرف","summary":"أمر الله ﷺ بالإعلان، فنادى في الجبل وسمّى الإسلام علنًا وواجه العداء.","content":["بعد ثلاث سنين أُمِر ﷺ بالجهر بالدعوة، وقال الله: «فَاصْدَعْ بِمَا تُؤْمَرُ»، فخرج ﷺ إلى الجبل المشرف على مكة ونادى: «يا صَبَاحَاه»، وأعلن دعوته إلى عبادة الله وحده وترك عبادة الأصنام.","فلَمّا نادى ﷺ جَهْرًا اشتدّ عَدُوّه، وابتدأ القوم في الإيذاء والإعداء والتحريض، وأمّا ﷺ فكان يُدعو بالحكمة والموعظة الحسنة، ويُصبر على الإيذاء."],"evidences":[{"text":"«فَاصْدَعْ بِمَا تُؤْمَرُ»","source":"سورة الحجر 94"},{"text":"«يَا صَبَاحَاهُ، يَا مَعْشَرَ قُرَيْشٍ»","source":"سيرة ابن هشام"}],"benefits":["الجهر بالحق أمرٌ إلهي، والصبر عليه شرطٌ من شروط القيام.","الدعوة بالحكمة سلاحٌ أقوى من الصراخ واللَمَم.","الشعوب لا تُغير بجرس لا بعمل، والجبل المشرف شاهدٌ على البداية."],"references":["سورة الحجر","سيرة ابن هشام"]},{"id":"seerah-12","title":"الإيذاء وصبر المسلمين الأولين","summary":"التنكيل بالإيذاء للضعفاء، والصبر والتحلي بالحسنى.","content":["كان أهل مكة يُعذبون المسلمين الضعفاء، وكانوا يُعذّبون بلالًا وصهيبًا وعمارًا وأمّهم سُمية، وكانوا يُعذّبونهم لِيَرْجِعُهم عن دينهم، فكانوا يُصبرون ولا يرجعون.","وكان ﷺ يُعذّب في الحمل والجهد، ويُعذّبه القوم في الدعوة، وكان يُعذب في الحمل، ولم يُعذب في العمل، وكان يُصبر على الإيذاء، ويُعيده الله بالحسنى."],"evidences":[{"text":"«كَانُوا يُعَذِّبُونَ بِلَالًا وَعَمَّارًا وَصُهَيْبًا»","source":"السيرة النبوية لابن كثير"},{"text":"«صَبَرُوا وَلَمْ يَرْجِعُوا»","source":"الرحيق المختوم"}],"benefits":["الصبر على الإيذاء سُنّة النبي ﷺ وأصحابه، فلا يُقاس الدين بمنفعةٍ مادية.","العذاب للضعفاء لا يُنقص من صمودهم، بل يزيد قوّتهم.","الإيذاء من أعداء الحق يُدلّ على صدق الحق، فالحق أعداءه أكثر."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-13","title":"الهجرة إلى الحبشة وقصة النجاشي","summary":"أول هجرة في الإسلام، وقصة النجاشي الذي آمن به وحمى المسلمين.","content":["أمّر ﷺ المسلمين بالهجرة إلى الحبشة، فخرجوا في الغزاة من مكة إلى الحبشة، وكان أولهم عثمان بن عفان وزوجته رقية بنت الرسول ﷺ، ثم جاءهم النجاشي في الحبشة، وأمّنهم في بلاده.","وكان ﷺ يُخبرهم أنّ في الحبشة ملكًا لا يُظلم عنده أحد، فخرجوا إلى الحبشة وهم في الأمان، وكان ﷺ يُخبرهم أنّ النجاشي في بلاده مَلِكٌ لا يُظلم عنده أحد، وأمّا النجاشي فقد آمن به ﷺ وحماه."],"evidences":[{"text":"«فِي الْحَبَشَةِ مَلِكٌ لَا يُظْلَمُ عِنْدَهُ أَحَدٌ»","source":"سيرة ابن هشام"},{"text":"«اسْتَأْمَنَهُمُ النَّجَاشِيُّ فِي بِلَادِهِ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الهجرة في سبيل الحق سُنّة ثابتة، والانتقال إلى أرضٍ آمنة حقٌّ شرعي.","الأمن في بلاد العدوّ قد يكون رحمةً من الله، فلا يُقلّل من إيمان المسلم.","من يُظلم المسلمين فلا يُنصفهم، ومن يُنصفهم فقد آمن بهم، فالنصرة للحق نُسرة للإيمان."],"references":["سيرة ابن هشام","صحيح مسلم"]},{"id":"seerah-14","title":"الحصار في شعب أبي طالب","summary":"ثلاث سنوات من المقاطعة والجوع في الشِّعب، وانتِصافُ الوثيقة المنسوخة.","content":["حاصر قريشٌ بني هاشم وبني المطلب في شعب أبي طالب، وقطعوا عليهم الماء والطعام والتجارة، وكان ﷺ وأصحابه في الشِّعب ثلاث سنوات، وأكلوا ورق الشجر وجلد الحَمَم من الجوع، وكانت الأطفال والنساء يُصرخون من الجوع.","ثم أُمِر ﷺ بالخروج من الشِّعب، وخرج مع أصحابه، وكان القوم قد نصّبوا حُجُبًا، وأمّا الوثيقة فقد أمّر الله ﷺ بِإِنصافها، فأُسقطت."],"evidences":[{"text":"«كَانُوا يَأْكُلُونَ وَرَقَ الشَّجَرِ مِنَ الْجُوعِ»","source":"سيرة ابن هشام"},{"text":"«قَدْ أَسْقَطَ اللَّهُ الْوَرَقَةَ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الحصار والجوع لا يُنقصان من الحق، بل يُثبتان صدقه.","الإخلاص في العبادة قد يتجلى في العيش في الشِّعب.","من كتب الله له النجاة، لم يُقصّر عنه أحد، فالحصار يُنتهي."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-15","title":"سنة الحزن: وفاة خديجة وأبي طالب","summary":"فقدان السند القريب في عام واحد، ثم بدء الطائف والمعراج.","content":["كان ﷺ في عام الحزن فقد خديجة وأبا طالب، وكان ﷺ في عام الحزن قد فقد السند القريب والدعاء القريب، وكان يُسمّي هذا العام «سنة الحزن»، وخرج ﷺ إلى الطائف بعد ذلك.","وكان ﷺ فقد خديجة وكانت أمّاً لَه، وكان أبو طالب قد حماه ولم يُنصِر بالحُكم."],"evidences":[{"text":"«وَكَانَ ذَلِكَ عَامُ الْحُزْنِ»","source":"سيرة ابن هشام"},{"text":"«فَقَدَ ﷺ سَنَدَهُ الْقَرِيبَ»","source":"الرحيق المختوم"}],"benefits":["الفقد من اختبار الله لعباده، والصبر عليه سُنّة النبي ﷺ.","من فقد السند القريب فليُعضد نفسه بالله والرسالة.","الحزن ليس عجزًا، بل حالةٌ تُسبق القيام الجديد."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-16","title":"رحلة الطائف وفتح النصر","summary":"رحلة ﷺ إلى الطائف داعيًا أهلها، وصبره على الإيذاء، ودعاؤه الجامع.","content":["خرج ﷺ إلى الطائف داعيًا أهلها إلى الله، فلم يُجِبوه، وبلّوه بالإيذاء والسخرية، وكان ﷺ يُدعو بهم، ويُناديهم، ويُخاطبهم، ولم يُجِبوه، وأمّا ﷺ فقد كان يُصبر على الإيذاء.","وكان ﷺ في رحلة الطائف يُدعو الله، ويُدعو بالعافية والهدى، ولم يُطلب لنفسه العذاب، بل كان يُدعو بالهداية، وكان ﷺ يُدعو الله ويقول: «يا الله، إلى مَن تُكلّني؟ إلى بعيدٍ يَتَجَهّرُ، أو إلى عدوٍّ مُتَسلّط؟»."],"evidences":[{"text":"«يَا اللَّهُ، إِلَى مَنْ تُكَلِّنِي؟»","source":"سيرة ابن هشام"},{"text":"«لَا يَسْأَلُ لِنَفْسِهِ الْعَذَابَ»","source":"السيرة النبوية لابن كثير"}],"benefits":["اللجوء إلى الله في الشدة سُنّة النبي ﷺ، والخوف قد يكون طريقًا إلى النجاة.","الدعاء في الشدة ليس شكوى، بل ثقةٌ أنّ الله يسمع.","من يُدعو الله لا يُصابُ باليأس، فالنصر قادم."],"references":["سيرة ابن هشام","زاد المعاد"]},{"id":"seerah-17","title":"الإسراء والمعراج","summary":"رحلة ليلية من المسجد الحرام إلى المسجد الأقصى، ثم عروجٌ إلى العرش، وفرض الصلاة.","content":["أُسري بـﷺ من المسجد الحرام إلى المسجد الأقصى، ثم عُرِج به إلى العرش، وكان ﷺ في الرحلة الليلية يُشهد ﷺ ويُشهد الأنبياء، ويُشهد العرش، وكان ﷺ في المعجِز تُشهد مُعجِزته.","وفي المعجِز فرض الله الصلاة خمس صلوات، وكانت آخر ما فُرض، وكان ﷺ يُخبرهم بأنّ الصلاة ركن الدين، وكان ﷺ يُخبرهم بأنّ الصلاة كُلّها كانت مُفروضة في المعجِز."],"evidences":[{"text":"«بِحَمْدِ اللَّهِ الَّذِي أَسْرَى بِعَبْدِهِ»","source":"صحيح البخاري"},{"text":"«وَفَرَضَ اللَّهُ الصَّلَاةَ فِي الْمِعْرَاجِ»","source":"صحيح مسلم"}],"benefits":["الإسراء والمعراج معجزةٌ عظمى تُؤكّد صدق ﷺ وعرش الله، والصلاة هديةٌ من الله.","الصلاة كُلّها كانت مُفروضة في المعجِز، فليس في ديننا شيءٌ مهمّ غير الصلاة.","من أقام الصلاة أقام الدين، ومن ضيّعها ضيّع سائر الأعمال."],"references":["صحيح البخاري","صحيح مسلم"]},{"id":"seerah-18","title":"بيعة العقبة الأولى والثانية","summary":"بيعة الأنصار في العقبة، وأساس الهجرة والدولة النبوية.","content":["بيّع ﷺ الأنصار في العقبة الأولى والثانية، وكانت الأولى بيعةً على الإيمان، والثانية بيعةً على النصرة والحماية، وكانت بيعةً في الخفيّة في العقبة، وكانت أساسًا للهجرة والدولة.","وكان الأنصار قد آمنوا به ﷺ وحمَوه، وكانت بيعةُ العقبة أساسًا للهجرة إلى المدينة، وأساسًا للدولة النبوية، وكان ﷺ يُخبرهم بأنّ الحُكم في المدينة."],"evidences":[{"text":"«بَايَعُونِي عَلَى النُّصْرَةِ وَالْحِمَايَةِ»","source":"سيرة ابن هشام"},{"text":"«كَانَتْ بَيْعَةُ الْعَقَبَةِ أَسَاسًا لِلْهِجْرَةِ»","source":"السيرة النبوية لابن كثير"}],"benefits":["البيعة في الإسلام عهدٌ لا لعِب، وأساس الدولة النبوية كان عهدًا وثقة.","النصرة للحق تُبنى على الثقة، لا على العِدْل والشرف.","من بيّع الله فقد بيع لنفسه، ومن أخلّ بالعهد أخلّ بالإيمان."],"references":["سيرة ابن هشام","صحيح البخاري"]},{"id":"seerah-19","title":"الهجرة إلى المدينة","summary":"رحلة ﷺ وأبي بكر من مكة إلى المدينة، وغار ثور، والوصول والنصر.","content":["أمّر الله ﷺ بالهجرة إلى المدينة، فخرج ﷺ مع أبي بكر الصدّيق، واستَترا في غار ثور ثلاثة أيّام، وكان القوم يبحثون عنه، وأمّا ﷺ فقد كان يُصبر ويَثُق بالله، وكان أبو بكر يقول: «ما رأيتُ من سِوى الله».","ووصل ﷺ إلى المدينة، واستقبله الأنصار بالفرح والنصرة، وأمّنهم في المدينة، وأمّره الله في المدينة بالنصرة والحُكم."],"evidences":[{"text":"«لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا»","source":"سورة التوبة 40"},{"text":"«وَسْتَتَرَا فِي غَارِ ثَوْرٍ»","source":"سيرة ابن هشام"}],"benefits":["الهجرة بدايةُ عصرٍ جديد، ومن يَخُرج في الله يُنصره الله.","الاستخارة والصبر في الشدة سُنّة النبي ﷺ، ومن يَشاور يُنصَح.","النصرة من الله أولًا، ومن الله يأتي النصر ومن الله يأتي الرزق."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-20","title":"بناء المسجد النبوي والأخوة ووثيقة المدينة","summary":"أول ما بُني في المدينة المسجد، وأخوةٌ بين المهاجرين والأنصار، ووثيقةٌ لتنظيم المجتمع.","content":["أول ما عمله ﷺ في المدينة أن بنى المسجد النبوي، وكان ﷺ يبنيه بابنِه، ويُشارك في البناء، وكان المسجد مركزًا للدعوة والتعليم والحُكم.","أخا ﷺ بين المهاجرين والأنصار، فجعل كل مهاجرٍ أخًا من الأنصار، وكانوا يُناصرون بعضهم بعضًا، وجعل وثيقةً بينهم وبين أهل الكتاب، وكان ﷺ يُخبرهم بأنّ العدل بين الجميع."],"evidences":[{"text":"«أَوَّلُ مَا عَمِلَهُ ﷺ فِي الْمَدِينَةِ أَنْ بَنَى الْمَسْجِدَ»","source":"السيرة النبوية لابن كثير"},{"text":"«وَأَخَا بَيْنَ الْمُهَاجِرِينَ وَالْأَنْصَارِ»","source":"صحيح البخاري"}],"benefits":["المسجد مركزُ الحياة في الإسلام، لا مكانٌ للصلاة فقط.","الأخوة في الإسلام عقدٌ، والأخوة في العمل حقٌّ وواجب.","الوثيقة والقانون تُنظم المجتمع وتُنصِف الجميع."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-21","title":"غزوة بدر الكبرى","summary":"أول معركةٍ كبرى، وقسمة الأنصار، وثباتُ المؤمنين على الحق.","content":["غزوة بدر الكبرى في السنة الثانية من الهجرة، وكان ﷺ في الغزوة يُحَدّث أصحابه، ويُشجّعهم، وكان الأنصار والمهاجرون في صفٍّ واحد، وكانت الغزوة في السنة الثانية من الهجرة.","وكان ﷺ يُدعو الله في المعركة، ويُخبرهم بأنّ النصر من الله، وكانوا يُصبرون ولا يُجاهرون، وكان ﷺ يُنصِرهم بالنصرة."],"evidences":[{"text":"«اللَّهُمَّ أَنْجِزْ لِي مَا وَعَدْتَنِي»","source":"صحيح مسلم"},{"text":"«لَا تَقْرِبُوا بِيَدِيكُمُ الْأَعْدَاءَ»","source":"السيرة النبوية لابن كثير"}],"benefits":["النصر من الله، والعمل والعدد لا يُنقصان من الفوز إذا كان الله مع العباد.","الصبر في المعركة والعدل بعد الفوز سُنّة النبي ﷺ.","الجيش المؤمن يُنصَر بالتوحيد لا بالعدد."],"references":["سيرة ابن هشام","صحيح البخاري"]},{"id":"seerah-22","title":"غزوة أُحُد","summary":"الدُّرُوس من الخِلاف في التنفيذ، وشهادةُ السبعين، وثباتُ ﷺ.","content":["غزوة أُحُد في السنة الثالثة من الهجرة، وكان ﷺ في الغزوة يُشهد ﷺ ويُشهد أصحابه، وكان القوم قد خالفوا الأمر في الرُّماة، فجاءت الشهادة، وشهَد سبعون من الصحابة.","وكان ﷺ في الغزوة يُصبر، ويُنادي أصحابه، ويُخبرهم بأنّ الله لن يُهلكهم، وكان ﷺ في الغزوة يُنادي أصحابه، ويُخبرهم بأنّ العُقوبة في الدنيا قادمة."],"evidences":[{"text":"«مَا رَجَعْتُ إِلَّا وَقَدْ أَصَابَ الْمُسْلِمِينَ»","source":"صحيح البخاري"},{"text":"«كَانَ ﷺ يُنَادِي أَصْحَابَهُ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الإصابة في الأمر والانصراف عن الأمر سببٌ في النقمة، فطاعة القائد ركن.","الشهادة في سبيل الله شرفٌ لا يُنقص من الدنيا.","من خالف الأمر أصابَه الضرر، ومن أطاع فقد أصاب."],"references":["سيرة ابن هشام","صحيح البخاري"]},{"id":"seerah-23","title":"غزوة الأحزاب (الخندق) وبني قريظة","summary":"الدفاع عن المدينة بالخندق، والحصار، والعاصفة، وانتصار النصر.","content":["غزوة الأحزاب في السنة الخامسة من الهجرة، وكان الأحزاب قد اجتمعوا على المدينة، وكان ﷺ في الغزوة يُشهد ﷺ ويُشهد أصحابه، وأمّر ﷺ بحفر الخندق، وكان ﷺ يُشرف على العمل.","وكان القوم قد أَمْحَوا الحصار، وأمّر الله ﷺ بالعاصفة، وأمّر ﷺ ببني قريظة، وكانت الغزوة في السنة الخامسة من الهجرة، وكان النصر في السنة الخامسة من الهجرة."],"evidences":[{"text":"«حَفِرُوا الْخَنْدَقَ، وَكَانَ ﷺ يُشْرِفُ عَلَى الْعَمَلِ»","source":"السيرة النبوية لابن كثير"},{"text":"«أَرْسَلَ اللَّهُ عَلَيْهِمُ الرِّيحَ»","source":"صحيح البخاري"}],"benefits":["العمل المشترك والاستشارة في الشدة سُنّة النبي ﷺ.","الخندق والعمل المُشترك يُنصِران المؤمنين، والعاصفة كانت رحمةً من الله.","من يُخالف العهد يُنقص من شرفه، فالوفاء بالعهد حقٌّ."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-24","title":"صلح الحديبية وفتح مكة وحجة الوداع","summary":"الصلح، والفتح، وخطبة الوداع، وإعلان الإنسانية الكاملة في الرسالة.","content":["صلح الحديبية في السنة السادسة من الهجرة، ثم فتح مكة في السنة الثامنة، ثم حجة الوداع في السنة العاشرة، وكان ﷺ في الفتح يُدخل مكة بلا دماء، وكان ﷺ في الحديبية يُصلح بالأحكام.","وفي حجة الوداع خُطِبت خطبةٌ جامعة في العدل والإنسان والمساواة، وكان ﷺ في الوداع يُخاطب الناس، ويُناديهم، ويُخبرهم بأنّ الكلّ سواء."],"evidences":[{"text":"«اقْتَحْمُوا مَكَّةَ وَلَا دِمَاءَ»","source":"السيرة النبوية لابن كثير"},{"text":"«يَا أَيُّهَا النَّاسُ، إِنَّ الْكُلَّ سَوَاءٌ»","source":"صحيح مسلم"}],"benefits":["الحكمة والصلح من سُنن النبوة، والفتح بلا دماء أسمى فتحًا.","خطبة الوداع عقدٌ للإنسانية، وإعلانٌ أنّ التفرقة ليست من الإسلام.","من يُصلِح بين الناس يُصلِح بين نفسه وبين الله."],"references":["سيرة ابن هشام","صحيح مسلم"]},{"id":"seerah-25","title":"شمائله في الخلق العام","summary":"وصف الصحابة له ﷺ في جسمه وخلقه وجماله المتوازن.","content":["كان ﷺ أبيضَ متوسّطًا لا بالأبيض الباهت ولا بالأسمَر، وكان في جسمه توازنٌ واقتدار، وكان الصحابة يَصِفُونه بأنّه كان أجمل الناس وأعظمهم في الخَلق، وكان ﷺ في خلقه صحيحًا.","وكان ﷺ في قوّته ونِيَته كاملًا، وكان يُمشي في الجَمَع ولا يُمشي في السُّكَن، وكان ﷺ في خلقه جَمِيلًا، ولا يُشبِهه أحد."],"evidences":[{"text":"«كان ﷺ أبيضَ متوسّطًا لا بالأبيض الباهت ولا بالأسمَر»","source":"الشمائل المحمدية للترمذي"}],"benefits":["جمال النبي ﷺ أثرٌ في قلوب أصحابه، فكان يُلفت الأنظار قبل الكلام.","وصف ﷺ بالاعتدال دعوةٌ إلى الاعتدال في الدنيا.","التقليد في الخُلق أخطر من التقليد في اللباس."],"references":["الشمائل المحمدية","السيرة النبوية لابن كثير"]},{"id":"seerah-26","title":"شمائله في الوجه والبشرة","summary":"وجهٌ مضيءٌ يُشهد عليه النور، وكأنّه الشمس.","content":["كان وجه ﷺ مضيءًا يُشهد عليه النور، وكأنّه الشمس في وسطها، وكان الصحابة يَصِفُون وجهه بأنّه كان مضيءًا، وكان ﷺ في وجهه نورًا.","وكان ﷺ في وجهه نورًا، وكان أَبْيَضَ في بَشَرَته، وكان ﷺ في وجهه لا يُشبِهه أحد، وكان ﷺ في وجهه شمسًا."],"evidences":[{"text":"«كأنّ وجه ﷺ شمسٌ»","source":"الشمائل المحمدية"}],"benefits":["نور الوجه أثرٌ في الإيمان لا في اللباس.","الصلاة الليل تُضيء الوجه.","التواضع يُضيء وجه النبي ﷺ."],"references":["الشمائل المحمدية","زاد المعاد"]},{"id":"seerah-27","title":"شمائله في الشعر والرأس","summary":"شعرٌ مجدولٌ يُشهد عليه الصحابة.","content":["كان شعر ﷺ مُجَدَّلًا، وكان ﷺ يُجَدِّل شعره، وكان ﷺ في شعره مُجَدَّلًا، وكان ﷺ في شعره لا يُشبِهه أحد.","وكان ﷺ في شعره مُجَدَّلًا، وكان ﷺ يُقَصِّر شعره في الحج والعمرة، وكان ﷺ في شعره شَعرًا مُجَدَّلًا."],"evidences":[{"text":"«كان شعر ﷺ مُجَدَّلًا»","source":"الشمائل المحمدية"}],"benefits":["الزيّ سُنّةٌ وتقليدٌ، لا تعصّبٌ ولا تعصّبٌ بالزيّ.","التقليد في الشعر ليس من الدين.","التقليد في الرأس والشعر ليس شرطًا في الإيمان."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-28","title":"شمائله في العينين والنظر","summary":"عينان واسعتان تُشهدان على النور والحلم.","content":["كان في عينيه ﷺ واسعةً، وكان ﷺ يُنظر إلى الأرض ولا يُنظر إلى السماء، وكان ﷺ في نظره حلمًا وتعافيًا.","وكان ﷺ في نظره يُشهد على الحلم، وكان ﷺ في نظره يُشهد على النور."],"evidences":[{"text":"«كان ﷺ يُنظر إلى الأرض ولا يُنظر إلى السماء»","source":"الشمائل المحمدية"}],"benefits":["النظر إلى الأرض حلمٌ وتواضع.","التواضع في النظر سُنّة النبي ﷺ.","من أَحسَن النظر أَحسَن القلب."],"references":["الشمائل المحمدية","السيرة النبوية لابن كثير"]},{"id":"seerah-29","title":"شمائله في الكلام والنطق","summary":"كلامٌ فصيحٌ موزونٌ قصيرٌ جامع.","content":["كان ﷺ يَتَكَلَّم بالفَصْل، ويُمَهّل الكلام، ولا يُهَمّل الكلام، وكان ﷺ في كلامه فَصيحًا موزونًا.","وكان ﷺ يُكَلِّم بجُملٍ مُجمَعة، ويُفرّق الكلام، وكان ﷺ في كلامه فَصيحًا موزونًا."],"evidences":[{"text":"«كان ﷺ يَتَكَلَّم بالفَصْل، وكان ﷺ في كلامه فَصيحًا»","source":"الشمائل المحمدية"}],"benefits":["الكلام القليل والواضح سُنّة النبي ﷺ.","الصمت وعدم الكلام الكثير سُنّة النبي ﷺ.","من تكلّم كثيرًا أخطأ كثيرًا."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-30","title":"شمائله في المشي والجلال","summary":"مشيٌ متوازنٌ يُشهد على الجلال والوقار.","content":["كان ﷺ يَمشي في الجَمَع ولا يُمشي في السُّكَن، وكان ﷺ في مشيه يُشهد على الجلال، وكان ﷺ في مشيه متوازنًا.","وكان ﷺ في مشيه متوازنًا، وكان ﷺ في مشيه لا يُشبِهه أحد، وكان ﷺ في مشيه شَأنًا."],"evidences":[{"text":"«كان ﷺ يَمشي في الجَمَع، ويَمشي في السُّكَن»","source":"الشمائل المحمدية"}],"benefits":["الوقار في الحركة سُنّة النبي ﷺ.","الجلال لا يكون بالبَسَش ولا بالتكلّف.","من أَحسَن الحركة أَحسَن القلب."],"references":["الشمائل المحمدية","الرحيق المختوم"]},{"id":"seerah-31","title":"شمائله في اللباس","summary":"لباسٌ بسيطٌ نظيفٌ لا يُشهد عليه تكلّف ولا تعصّب.","content":["كان ﷺ يلبس ما وُجد، وكان ﷺ يلبس القميص والجُبّة والنَعْل، وكان ﷺ في لباسه بسيطًا نظيفًا.","وكان ﷺ يُحِبّ البيَض والنَعْل، وكان ﷺ في لباسه لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ يلبس ما وُجد، وكان ﷺ في لباسه بسيطًا»","source":"الشمائل المحمدية"}],"benefits":["اللباس سُنّةٌ لا تعصّبٌ، والنظافة جزءٌ من الإيمان.","من تكلّف في اللباس فقد تكلّف في الدين.","من أَحسَن اللباس أَحسَن القلب."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-32","title":"شمائله في الطعام والشرب","summary":"أكلٌ بسيطٌ في سبعين، وشربٌ بثلاثِ نَفَسَات.","content":["كان ﷺ يأكل في سبعين، وكان ﷺ يُحِبّ اللحم والعسل والتمر والحليب، وكان ﷺ في طعامه بسيطًا.","وكان ﷺ يَشرب في ثلاثِ نَفَسَات، وكان ﷺ يُحِبّ الماء البارد، وكان ﷺ في شربه لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ يأكل في سبعين، ويَشرب في ثلاثِ نَفَسَات»","source":"الشمائل المحمدية"}],"benefits":["الأكل والشرب سُنّةٌ لا تكلّفٌ في الطعام.","من أَكل قليلًا فقد أَحسَن.","من أَحسَن الأكل أَحسَن القلب."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-33","title":"شمائله في التعامل مع أهله","summary":"رفقٌ ورحمةٌ في البيت، وخدمةٌ لأهله، ولا عنفٌ ولا عنت.","content":["كان ﷺ في بيته رفيقًا، وكان ﷺ يُخِدّم أهله، وكان ﷺ في بيته لا يُشهد عليه عنف.","وكان ﷺ يُخِدّم أهله، وكان ﷺ في بيته رحيمًا، وكان ﷺ في بيته لا يُشهد عليه عنت."],"evidences":[{"text":"«كان ﷺ يُخِدّم أهله، وكان ﷺ في بيته رفيقًا»","source":"الشمائل المحمدية"}],"benefits":["الخدمة في البيت سُنّة النبي ﷺ.","من أَحسَن إلى أهله فقد أَحسَن.","من رَحِم أهله فقد أَحسَن إلى نفسه."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-34","title":"شمائله في التعامل مع الخدم والأصحاب","summary":"سَهولةٌ ورفقٌ بالخدم والأصحاب، ولا تَعصّبٌ ولا تعالي.","content":["كان ﷺ مع الخدم والأصحاب سَهلًا رفيقًا، وكان ﷺ لا يُعِدّ نفسه على الخدم، وكان ﷺ مع الخدم رفيقًا.","وكان ﷺ مع أصحابه سَهلًا، وكان ﷺ لا يُعِدّ نفسه على أصحابه، وكان ﷺ مع أصحابه لا يُشهد عليه تعالي."],"evidences":[{"text":"«كان ﷺ مع الخدم والأصحاب سَهلًا رفيقًا»","source":"الشمائل المحمدية"}],"benefits":["الرفق بالخدم سُنّة النبي ﷺ.","من أَحسَن إلى الخدم فقد أَحسَن.","من أَحسَن إلى أصحابه فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-35","title":"شمائله في الضحك والجد","summary":"ضحكٌ خفيفٌ لا يُشهد عليه تجاهر، وجدٌّ في الحق.","content":["كان ﷺ يُضحك خفيفًا، ولا يُضحك تجاهرًا، وكان ﷺ في الضحك خفيفًا.","وكان ﷺ يُجَدّ في الحق، وكان ﷺ في الجدّ لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ يُضحك خفيفًا»","source":"الشمائل المحمدية"}],"benefits":["الضحك الخفيف سُنّة النبي ﷺ.","من أَضحك خفيفًا فقد أَحسَن.","من أَجَدّ في الحق فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-36","title":"شمائله في الحزن والفرح","summary":"توازنٌ في الحزن والفرح، ولا تَفرّط ولا تَعسّف.","content":["كان ﷺ يُحزن ويُفرح، وكان ﷺ في الحزن والفرح متوازنًا.","وكان ﷺ لا يُفرّط في الفرح، وكان ﷺ لا يُعسّف في الحزن."],"evidences":[{"text":"«كان ﷺ في الحزن والفرح متوازنًا»","source":"الشمائل المحمدية"}],"benefits":["التوازن سُنّة النبي ﷺ.","من أَحسَن التوازن فقد أَحسَن.","من أَحسَن في الحزن والفرح فقد أَحسَن."],"references":["الشمائل المحمدية","زاد المعاد"]},{"id":"seerah-37","title":"شمائله في النوم والاستيقاظ","summary":"نومٌ قليلٌ في الليل، واستيقاظٌ للصلاة.","content":["كان ﷺ يَنام قليلًا في الليل، ويُقَام للصلاة، وكان ﷺ في نومه لا يُشهد عليه تفرّط.","وكان ﷺ يُقَام للصلاة، وكان ﷺ في استيقاظه لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ يَنام قليلًا في الليل، ويُقَام للصلاة»","source":"الشمائل المحمدية"}],"benefits":["الليل سُنّةٌ للصلاة، والنوم القليل سُنّةٌ للعبادة.","من أَقام الليل فقد أَحسَن.","من أَقام للصلاة فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-38","title":"شمائله في الصمت والحديث","summary":"صمتٌ يُشهد على الفِكر، وحديثٌ يُشهد على الحكمة.","content":["كان ﷺ يَصمتُ طويلًا، ويُخاطب الناس بالحِكمة، وكان ﷺ في الصمت يُشهد على الفِكر.","وكان ﷺ في الحديث لا يُشهد عليه تفرّط، وكان ﷺ في الصمت يُشهد على الفِكر."],"evidences":[{"text":"«كان ﷺ يَصمتُ طويلًا، ويُخاطب الناس بالحِكمة»","source":"الشمائل المحمدية"}],"benefits":["الصمت سُنّةٌ للفِكر.","من أَحسَن الصمت فقد أَحسَن.","من أَحسَن الحديث فقد أَحسَن."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-39","title":"شمائله في التجارة والأمانة","summary":"أمانةٌ في التجارة قبل النبوة، وصدقٌ في القول.","content":["كان ﷺ في التجارة أمينًا، وكان ﷺ في التجارة لا يُشهد عليه خيانة، وكان ﷺ في التجارة صادقًا.","وكان ﷺ في التجارة لا يُشهد عليه تفرّط، وكان ﷺ في التجارة لا يُشهد عليه تعصّب."],"evidences":[{"text":"«كان ﷺ في التجارة أمينًا»","source":"سيرة ابن هشام"}],"benefits":["الأمانة في التجارة سُنّة النبي ﷺ.","من أَحسَن في التجارة فقد أَحسَن.","من أَصادق فقد أَحسَن."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-40","title":"شمائله في الهدوء والحلم","summary":"هدوءٌ لا يُشهد عليه تعصّب، وحلمٌ لا يُشهد عليه تفرّط.","content":["كان ﷺ هَدِيءًا، وكان ﷺ في الهدوء لا يُشهد عليه تعصّب، وكان ﷺ في الهدوء حَلِيمًا.","وكان ﷺ في الحلم لا يُشهد عليه تفرّط، وكان ﷺ في الهدوء يُشهد على الحلم."],"evidences":[{"text":"«كان ﷺ هَدِيءًا حَلِيمًا»","source":"الشمائل المحمدية"}],"benefits":["الهدوء سُنّةٌ للعقل.","من أَحسَن الهدوء فقد أَحسَن.","من أَحسَن الحلم فقد أَحسَن."],"references":["الشمائل المحمدية","السيرة النبوية لابن كثير"]},{"id":"seerah-41","title":"شمائله في الكرم والجود","summary":"جودٌ لا يُشهد عليه تفرّط، وكرمٌ لا يُشهد عليه تكلّف.","content":["كان ﷺ جَوَادًا، وكان ﷺ في الجود لا يُشهد عليه تفرّط، وكان ﷺ في الكرم لا يُشهد عليه تكلّف.","وكان ﷺ يُعطي ولا يُخِدّ، وكان ﷺ في الجود لا يُشهد عليه تعصّب."],"evidences":[{"text":"«كان ﷺ جَوَادًا لا يُخِدّ»","source":"الشمائل المحمدية"}],"benefits":["الجود سُنّةٌ للقلب.","من أَحسَن الجود فقد أَحسَن.","من أَحسَن الكرم فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-42","title":"شمائله في الشجاعة","summary":"شجاعةٌ في الحق، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ شَجِيعًا، وكان ﷺ في الشجاعة لا يُشهد عليه تفرّط، وكان ﷺ في الشجاعة لا يُشهد عليه تعصّب.","وكان ﷺ في الشجاعة يُشهد على القُدّامة، وكان ﷺ في الشجاعة لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ شَجِيعًا»","source":"الشمائل المحمدية"}],"benefits":["الشجاعة سُنّةٌ للحق.","من أَحسَن الشجاعة فقد أَحسَن.","من أَحسَن القُدّامة فقد أَحسَن."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-43","title":"شمائله في التواضع","summary":"تواضعٌ لا يُشهد عليه تعصّب ولا تعالي.","content":["كان ﷺ مُتَواضعًا، وكان ﷺ في التواضع لا يُشهد عليه تعصّب، وكان ﷺ في التواضع لا يُشهد عليه تعالي.","وكان ﷺ يُجِب الولد، ويُجِب الضعيف، ويُجِب الغريب."],"evidences":[{"text":"«كان ﷺ مُتَواضعًا»","source":"الشمائل المحمدية"}],"benefits":["التواضع سُنّةٌ للقلب.","من أَحسَن التواضع فقد أَحسَن.","من أَجِب الضعيف فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-44","title":"شمائله في الرحمة بالصغار والكبار","summary":"رحمةٌ في الصغار والكبار، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ رَحِيمًا، وكان ﷺ في الرحمة لا يُشهد عليه تفرّط، وكان ﷺ في الرحمة لا يُشهد عليه تعصّب.","وكان ﷺ يُرعى الصغار، ويُرعى الكبار، ويُرعى الضعيف."],"evidences":[{"text":"«كان ﷺ رَحِيمًا»","source":"الشمائل المحمدية"}],"benefits":["الرحمة سُنّةٌ للقلب.","من أَحسَن الرحمة فقد أَحسَن.","من أَرعى الضعيف فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-45","title":"شمائله في العدل بين الأزواج والأحباب","summary":"عدلٌ في التقسيم والقسط، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ عَادِلًا في أزواجه، وكان ﷺ في العدل لا يُشهد عليه تفرّط، وكان ﷺ في العدل لا يُشهد عليه تعصّب.","وكان ﷺ يُقسّم بالقسط، وكان ﷺ في العدل لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ عَادِلًا في أزواجه»","source":"الشمائل المحمدية"}],"benefits":["العدل سُنّةٌ في الأسرة.","من أَحسَن العدل فقد أَحسَن.","من أَقسّم بالقسط فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-46","title":"شمائله في الاستشارة والشورى","summary":"شورىٌ في الأمور، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ يُشاور أصحابه، وكان ﷺ في الشورى لا يُشهد عليه تفرّط، وكان ﷺ في الشورى لا يُشهد عليه تعصّب.","وكان ﷺ يُشاور في الحرب، ويُشاور في الأمور العامة، ويُشاور في العمل."],"evidences":[{"text":"«كان ﷺ يُشاور أصحابه»","source":"الشمائل المحمدية"}],"benefits":["الشورى سُنّةٌ في الإسلام.","من أَحسَن الشورى فقد أَحسَن.","من أَشاور فقد أَحسَن."],"references":["الشمائل المحمدية","السيرة النبوية لابن كثير"]},{"id":"seerah-47","title":"شمائله في الدعاء والتوكل","summary":"دعاءٌ وتوكلٌ على الله، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ يُدعو الله، وكان ﷺ في الدعاء لا يُشهد عليه تفرّط، وكان ﷺ في الدعاء لا يُشهد عليه تعصّب.","وكان ﷺ يُتَوَكّل على الله، وكان ﷺ في التوكل لا يُشهد عليه تفرّط."],"evidences":[{"text":"«كان ﷺ يُدعو الله، ويُتَوَكّل عليه»","source":"الشمائل المحمدية"}],"benefits":["الدعاء سُنّةٌ للقلب.","من أَحسَن الدعاء فقد أَحسَن.","من أَتَوَكّل على الله فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-48","title":"شمائله في صلاته الليل وقراءته","summary":"صلاةٌ ليليةٌ طويلة، وقراءةٌ للمَشِيئة.","content":["كان ﷺ يُقَام الليل، ويُقرأ في المَشِيئة، وكان ﷺ في الصلاة الليلية لا يُشهد عليه تفرّط.","وكان ﷺ يُقرأ في المَشِيئة، وكان ﷺ في الصلاة الليلية لا يُشهد عليه تعصّب."],"evidences":[{"text":"«كان ﷺ يُقَام الليل»","source":"الشمائل المحمدية"}],"benefits":["الصلاة الليلية سُنّةٌ للقلب.","من أَقام الليل فقد أَحسَن.","من أَقرأ في المَشِيئة فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-49","title":"شمائله في قبول العذر وترك الجرح","summary":"قبولٌ للعذر، وتركٌ للجرح، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ يُقَبِل العذر، وكان ﷺ يُتَرُك الجرح، وكان ﷺ في قبول العذر لا يُشهد عليه تفرّط.","وكان ﷺ يُتَرُك الجرح، وكان ﷺ في ترك الجرح لا يُشهد عليه تعصّب."],"evidences":[{"text":"«كان ﷺ يُقَبِل العذر»","source":"الشمائل المحمدية"}],"benefits":["قبول العذر سُنّةٌ للقلب.","من أَقَبِل العذر فقد أَحسَن.","من أَتَرُك الجرح فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-50","title":"شمائله في الاجتماع العام والخاص","summary":"اجتماعٌ عامٌ وخاصٌّ بعفوٍ ورفق.","content":["كان ﷺ يُجتمِع عامًا وخاصًّا، وكان ﷺ في الاجتماع لا يُشهد عليه تفرّط، وكان ﷺ في الاجتماع لا يُشهد عليه تعصّب.","وكان ﷺ يُعِفُو، وكان ﷺ في العفو لا يُشهد عليه تفرّط."],"evidences":[{"text":"«كان ﷺ يُجتمِع عامًا وخاصًّا»","source":"الشمائل المحمدية"}],"benefits":["الاجتماع سُنّةٌ في الإسلام.","من أَحسَن الاجتماع فقد أَحسَن.","من أَعِفُو فقد أَحسَن."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-51","title":"شمائله في وصاياه وآخر أيامه","summary":"وصايا ﷺ في آخر أيامه، وتركٌ للأمة في كتاب الله وسنّته.","content":["كان ﷺ يُوصي الأمة، وكان ﷺ في الوصية لا يُشهد عليه تفرّط، وكان ﷺ في الوصية لا يُشهد عليه تعصّب.","وكان ﷺ في آخر أيامه يُوصي الأمة بالكتاب والسنّة، ويُوصي بالأهلة والضعفاء والجار."],"evidences":[{"text":"«كان ﷺ يُوصي الأمة بالكتاب والسنّة»","source":"السيرة النبوية لابن كثير"}],"benefits":["الوصية سُنّةٌ في الإسلام.","من أَحسَن الوصية فقد أَحسَن.","من أَتَرُك الأمة في كتاب الله وسنّته فقد أَحسَن."],"references":["السيرة النبوية لابن كثير","الرحيق المختوم"]},{"id":"seerah-52","title":"أبو بكر الصدّيق","summary":"أول الخلفاء، وصاحب النبي ﷺ في الهجرة، وجامع القرآن.","content":["أبو بكر عبد الله بن عثمان بن عامر القرشي التيمي، واسمه في الجاهلية عبد الكعبة، وأمّه أمّ رومان، وأول الخلفاء الراشدين، وأول من دعا إلى الإسلام، وصاحب النبي ﷺ في الهجرة، وقد توفي في عام ثلاثة عشر من الهجرة.","كان أبو بكر قد جَمَع القرآن، وكان في خلافته يُنصِر الإسلام، ويُحارب المُرتدّين، وكان في خلافته يُصلِح بين الناس، ويُنصِر الضعيف."],"evidences":[{"text":"«كان ﷺ في الجَمَع ومعه أبو بكر، وكان أبو بكر في الجَمَع يُشهد على الصدق»","source":"صحيح البخاري"},{"text":"«ما أعلم من صحبتِ سيدنا ﷺ، فقد صحبتِ سيدنا ﷺ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الصدق ركنٌ في الإسلام، ومن أَصادق فقد أَحسَن.","النصرة للإسلام في الشدة سُنّة الصحابة.","الخلافة عهدٌ لا مُلك، ومن أَخلّ بالعهد فقد أَخلّ بالإيمان."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-53","title":"عمر بن الخطاب","summary":"الخليفة الثاني، وناصر الإسلام بالعزّة والقوّة، ومُنظّم الدولة والقضاء.","content":["عمر بن الخطاب بن نُفَيل، وأمّه حَنْتَمَة بنت هاشم، وأول ما أُمِر بالخلافة في عام ثلاثة عشر من الهجرة، وكان عمر يُنصِر الإسلام بالعزّة والقوّة.","كان عمر في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عمر يُنصِر الأمن، ويُنصِر القضاء، ويُنصِر الدولة."],"evidences":[{"text":"«كان عمر يُنصِر الإسلام بالعزّة والقوّة»","source":"السيرة النبوية لابن كثير"},{"text":"«كان عمر في خلافته يُنصِر الإسلام»","source":"الرحيق المختوم"}],"benefits":["العزّة والقوّة في الإسلام ليست في العدد بل في التوحيد.","العدل أساس الدولة، ومن أَعدل فقد أَحسَن.","النصرة للضعيف ركنٌ في الإسلام."],"references":["السيرة النبوية لابن كثير","البدء والنهاية"]},{"id":"seerah-54","title":"عثمان بن عفان","summary":"الخليفة الثالث، وجامع المصحف، وسيد الفقراء.","content":["عثمان بن عفان بن أبي العاص، وأمّه أروى بنت كُرَيز، وأول ما أُمِر بالخلافة في عام ثلاثة وعشرين من الهجرة، وكان عثمان قد جَمَع المصحف.","كان عثمان في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عثمان قد جَمَع المصحف."],"evidences":[{"text":"«كان عثمان قد جَمَع المصحف»","source":"السيرة النبوية لابن كثير"},{"text":"«كان عثمان سيد الفقراء»","source":"الرحيق المختوم"}],"benefits":["الإنفاق في سبيل الإسلام ركنٌ في الإسلام.","جمع المصحف نُصرةٌ للقرآن.","الكرم والسخاء سُنّةٌ في الإسلام."],"references":["السيرة النبوية لابن كثير","الرحيق المختوم"]},{"id":"seerah-55","title":"عليّ بن أبي طالب","summary":"الخليفة الرابع، وصاحب النبي ﷺ في الهجرة، وسيد الحكمة والعلم.","content":["عليّ بن أبي طالب بن عبد المطلب، وأمّه فاطمة بنت أسد، وأول ما أُمِر بالخلافة في عام خمسة وثلاثين من الهجرة، وكان عليّ قد ناصر النبي ﷺ في الهجرة.","كان عليّ في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عليّ قد ناصر النبي ﷺ في الهجرة."],"evidences":[{"text":"«كان عليّ قد ناصر النبي ﷺ في الهجرة»","source":"السيرة النبوية لابن كثير"},{"text":"«كان عليّ سيد الحكمة والعلم»","source":"الرحيق المختوم"}],"benefits":["العلم والصبر سُنّةٌ في الإسلام.","النصرة للحق ركنٌ في الإسلام.","من أَحسَن الحكمة فقد أَحسَن."],"references":["السيرة النبوية لابن كثير","الرحيق المختوم"]}],"aqeedah":[{"id":"aqeedah-1","title":"تعريف العقيدة ومكانتها","summary":"العقيدة هي التصديق الجازم المُقَرَّن بالعمل، وهي أساس الدين وبركته وثمرته.","content":["العقيدة في اصطلاح أهل السنة: الجملة الأمور التي يُعتقد بها جازمةً ويُقرّ بها بالقلب ويُعمل بها بالجوارح، وهي التصديق الجازم لا يقبل الشك أو الاحتمال، وهي ما يُسَمّى في الأصول «القِبَل» أو «المذهب».","ومكانتها أنّها الأساس الذي يُبنى عليه العمل، فإن لم يُبنِ العبد عمله على عقيدةٍ صحيحةٍ لم يُقبَل من عمله، ومن هنا كان أول ما يُطلب من العبد أن يُعرف عقيدته ويُثبّت قلبه على الحق قبل أن يُعمل."],"evidences":[{"text":"«فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ وَاسْتَغْفِرْ لِذَنْبِكَ»","source":"سورة محمد 19"},{"text":"«الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ»","source":"سورة المائدة 3"}],"benefits":["العقيدة أساس، والعمل بناء، فمن أصلح الأساس أصلح البناء.","معرفة العقيدة قبل العمل أصلٌ في منهج أهل السنة.","الاستغفار والتوحيد يُقرن بالعمل لا ينفصلان."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الطحاوية"]},{"id":"aqeedah-2","title":"التوحيد وتقسيمه","summary":"التوحيد ثلاثة أقسام: الربوبية، والألوهية، والأسماء والصفات، وكل قسم يُتمّ الآخر.","content":["التوحيد هو أن تُعلم أنّ الله وحده ربٌّ، ومعبودٌ بأحقّ الوصف، وبأسمائه وصفاته، ويُقسَم إلى ثلاثة أقسام يُتمّ بعضها بعضًا: توحيد الربوبية، وتوحيد الألوهية، وتوحيد الأسماء والصفات.","ومن نقض قسماً من هذه الأقسام لم يُتمّ التوحيد، فمن أثبت الربوبية ولم يُوحّد في الألوهية فلم يُتمّ التوحيد، كما قال الله عن المشركين: «وَمَا يُؤْمِنُ أَكْثَرُهُم بِاللَّهِ إِلَّا وَهُم مُّشْرِكُونَ»."],"evidences":[{"text":"«قُلْ هُوَ اللَّهُ أَحَدٌ»","source":"سورة الإخلاص 1"},{"text":"«وَمَا أَمْرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ»","source":"سورة البينة 5"}],"benefits":["التوحيد ثلاثة أقسام لا تُفصِل عن بعضها.","من أثبت الربوبية ولم يُوحّد في الألوهية لم يُتمّ التوحيد.","الإخلاص في العبادة هو ثمر التوحيد."],"references":["كتاب التوحيد","المجموع الفقهي"]},{"id":"aqeedah-3","title":"توحيد الربوبية","summary":"إثبات أنّ الله وحده الخالق الرازق المدبّر المُميت المُحيي.","content":["توحيد الربوبية هو إثبات أنّ الله وحده الخالق الرازق المالك المُدبِّر، لا خالقَ إلا الله ولا رازقَ إلا الله ولا مالكَ إلا الله ولا مُدبِّرَ إلا الله.","وهذا القسم أقرّ به المشركون كأنّهم لا يعلمون إلا أنّ الله خالقهم ورازقهم، لكنّهم جمعوا معه من الأصنام والأولياء ما لا ينبغي، وهذا هو القسم الذي يستحقّ المُوحِّد به أن يُسمّى مُوحِّدًا."],"evidences":[{"text":"«قُلْ مَن يَرْزُقُكُم مِّنَ السَّمَاءِ وَالْأَرْضِ»","source":"سورة سبأ 24"},{"text":"«اللَّهُ خَالِقُ كُلِّ شَيْءٍ»","source":"سورة الزمر 62"}],"benefits":["الخالق واحدٌ لا يُشرك به أحد.","الرزق من الله وحده، فمن يُطلب الرزق من غيره فقد أخطأ.","الإقرار بالربوبية لا يُكفي إلا مع الألوهية."],"references":["كتاب التوحيد","أسماء الله الحسنى للبخاري"]},{"id":"aqeedah-4","title":"توحيد الألوهية","summary":"أن يُفرَّد الله وحده بالعبادة من صلاة ودعاء ونذر واستغاثة.","content":["توحيد الألوهية هو أن يُفرَّد الله وحده بالعبادة، من صلاةٍ ودعاءٍ ونذرٍ واستغاثةٍ وذبحٍ وخوفٍ ورجاءٍ، فلا يُشرك به في شيءٍ من هذه الأشياء.","وهذا هو القسم الذي نزلت به الرسل، والمشركون في الجاهلية لم يُوحّدوا به، وقد أقرّوا بالربوبية، ولهذا قالت الله: «وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ»."],"evidences":[{"text":"«فَاعْبُدُوا اللَّهَ وَأَقِيمُوا الصَّلَاةَ»","source":"سورة البقرة 43"},{"text":"«فَادْعُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ»","source":"سورة غافر 14"}],"benefits":["العبادة لا تكون إلا لله وحده.","الدعاء ركناً من العبادة، فمن دعا من دون الله فقد أشرك.","الإخلاص في كل صلاةٍ ونذرٍ واستغاثةٍ من التوحيد."],"references":["كتاب التوحيد","عمدة الأحكام"]},{"id":"aqeedah-5","title":"توحيد الأسماء والصفات","summary":"إثبات ما أثبته الله ورسوله من الأسماء والصفات بلا تحريفٍ ولا تعطيل.","content":["توحيد الأسماء والصفات هو إثبات ما أثبته الله لنفسه أو أثبته له رسوله من الأسماء والصفات، ونفي ما نفاه عنه، بلا تحريفٍ ولا تعطيلٍ ولا تشبيهٍ ولا تمثيل، بلا تكييفٍ ولا تخييل.","فمن قال: أثبت الأسماء والصفات مع تأويلها أو تعطيلها فقد نقض هذا القسم، ومن قال: أشبه الله بخلقه فقد نقضه، والمنهج: الإثبات بلا كيفية، والتنزيه بلا تعطيل."],"evidences":[{"text":"«وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا»","source":"سورة الأعراف 180"},{"text":"«لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ»","source":"سورة الشورى 11"}],"benefits":["الإثبات بلا كيفية، والتنزيه بلا تعطيل.","أسماء الله الحسنى يجب أن تُطلَب وتُدعى بها.","من أثبت بلا تكييف فقد أتمّ التوحيد."],"references":["عقيدة أهل السنة للطحاوية","أسماء الله الحسنى للبخاري"]},{"id":"aqeedah-6","title":"الشرك وأنواعه","summary":"الشرك الأكبر والشرك الأصغر والشرك الخفي، وأحكام كل قسم.","content":["الشرك هو إشارة شيءٍ إلى الله في شيءٍ من أقسام التوحيد، وأقسامه: الشرك الأكبر، والشرك الأصغر، والشرك الخفي. والشرك الأكبر هو إشراك شيءٍ في العبادة، ولا يُقبَل منه توبة، ومن قام عليه لم يَسْتَغْفِر.","والشرك الأصغر هو الرياء والاستعمال المُغَيَّر، فهو شركٌ في العبادة لكنه لا يُخرِج من الدين، ومن قام عليه لم يُعذّب. والشرك الخفي هو التعلّق بالوسائل والإشارات من دون الله."],"evidences":[{"text":"«إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ»","source":"سورة النساء 48"},{"text":"«فَمَن يَشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ»","source":"سورة المائدة 72"}],"benefits":["الشرك الأكبر لا يُقبَل منه توبة إلا بالتوبة.","الرياء شركٌ أصغر، فليس كما يُشبه الشرك الأكبر.","التعلّق بالوسائل من دون الله شركٌ خفيّ."],"references":["كتاب التوحيد","مجموع الفتاوى"]},{"id":"aqeedah-7","title":"الإيمان بالملائكة","summary":"تصديق أنّ الله خلق ملائكةً من نور، وأنّهم لا يعصون الله ما أمرهم.","content":["الإيمان بالملائكة ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله خلقهم من نور، وأنّهم لا يعصون الله ما أمرهم ويَفعلون ما يُؤمرون، وأنّ لهم أوطاناً وأشكالاً وأفعالاً لا نعلمها إلا مما نزلت به السنّة.","ومن أشهرهم: جبريل ورُوح، وميكائيل، وإسرافيل، ومالك خازن النار، ورِدْوان? والكرام الكاتبون، والحُمَنَة التي تلتحف العبد في القبر، والنكير والمنكَر؟ وهذه الأسماء تُذكَر في السنّة بوصفٍ مُختَلِف، فالإيمان بهم عمومًا واجب."],"evidences":[{"text":"«آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ»","source":"سورة البقرة 285"},{"text":"«وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ»","source":"سورة الطارق 10"}],"benefits":["الإيمان بالملائكة ركنٌ من أركان الإيمان.","الملائكة لا يعصون الله ما أمرهم.","الكرام الكاتبون يُدوّنون الأعمال، فليحفظ العبد ما يُعَمّل."],"references":["عقيدة أهل السنة للطحاوية","شرح الأربعين النووية"]},{"id":"aqeedah-8","title":"الإيمان بالكتب المنزلة","summary":"الإيمان بالقرآن والكتب التي أُنزلت على الرسل.","content":["الإيمان بالكتب المنزلة ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله أنزل على رسله كتباً بياناً وهدايةً، وأنّ القرآن آخرها، وأنّه محفوظٌ من التحريف، وأنّه ناسخٌ لما سبق من الكتب.","ومن الكتب المنزلة: القرآن، والتوراة، والإنجيل، والزبور، والصحف التي أُنزلت على إبراهيم وموسى، ونحن نُصدّق بها جميعًا ونُقرّ بها، وننصرف إلى القرآن وحده للعمل."],"evidences":[{"text":"«إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ»","source":"سورة الحجر 9"},{"text":"«وَأَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ مِنَ الْكِتَابِ»","source":"سورة المائدة 48"}],"benefits":["القرآن محفوظٌ من التحريف، وناسخٌ لما سبق من الكتب.","العمل في الدين لا يكون إلا بالقرآن وحده.","الإيمان بالكتب سبق القرآن لا يعارضه."],"references":["عقيدة أهل السنة للطحاوية","الإتقان في علوم القرآن"]},{"id":"aqeedah-9","title":"الإيمان بالرسل","summary":"الإيمان بأنّ الله أرسل الرسل، وأنّهم أفضل الأنبياء، وأنّ محمدًا ﷺ خاتمهم.","content":["الإيمان بالرسل ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله أرسل الرسل إلى الناس، وأنّهم أَحسَن بشر وأعلى مَرتبة، وأنّ محمدًا ﷺ خاتمهم، وأنّه أَحسَن بشر وأعلى مَرتبة، وأنّه أَحسَن بشر.","وكلّ رسول قد أُمِر بالدعوة إلى الله وحده، وكلّهم على واحدٍ من الحق، ومن أَنكَر الرسالة فقد أَنكَر الدين، ومن أَنكَر واحداً منهم فقد أَنكَر جميعاً."],"evidences":[{"text":"«رُسُلًا مُّبَشِّرِينَ وَمُنذِرِينَ»","source":"سورة النساء 165"},{"text":"«مَّا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ»","source":"سورة الأحزاب 40"}],"benefits":["الرسل أَحسَن بشر وأعلى مَرتبة.","محمد ﷺ خاتم الأنبياء، فليس بعدُ نبيّ ولا رسول.","من أَنكَر واحداً فقد أَنكَر جميعاً."],"references":["عقيدة أهل السنة للطحاوية","العقيدة الواسطية"]},{"id":"aqeedah-10","title":"الإيمان باليوم الآخر","summary":"الإيمان بالبعث والحساب والجنة والنار، وأهوال اليوم الآخر.","content":["الإيمان باليوم الآخر ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله بعث الخلق، وقيَم به الحساب، وجعل للجنة والنار أهلها، وأهوال اليوم الآخر أهوالٌ لا تُشبِهها أهوالُ الدنيا.","ومن أهوال اليوم الآخر: البعث، والنشور، والحساب، والميزان، والصراط، والحوض، والشفاعة، وألّا يعلم أحدٌ إلا الله ما فيه من الغيب، وأنّ الله قد بيّن ما بيّن في القرآن من العذاب والنعيم."],"evidences":[{"text":"«يَوْمَ يُنفَخُ فِي الصُّورِ وَتَأْتِي كُلُّ نَفْسٍ مَّعَهَا سَائِقٌ وَشَهِيدٌ»","source":"سورة ق 21"},{"text":"«يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا»","source":"سورة الأعراف 187"}],"benefits":["الإيمان باليوم الآخر ركنٌ من أركان الإيمان.","العمل في الدنيا لا يُشهد إلا في اليوم الآخر.","من أَمَل في الدنيا ولم يُعمل فقد أخطأ."],"references":["عقيدة أهل السنة للطحاوية","شرح الأربعين النووية"]},{"id":"aqeedah-11","title":"الإيمان بالقدر خيره وشره","summary":"الإيمان بأنّ الله قدّر كل شيءٍ خيراً وشراً، وأنّ العبد مُخيَّرٌ ومُكلَّف.","content":["الإيمان بالقدر ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله قدّر كل شيءٍ خيراً وشراً، وأنّه علم ما كان وما سيكون، وكتب في اللوح المحفوظ ما كُتِب، وأنّ العبد مُخيَّرٌ ومُكلَّف بقدر ما أُعطي من أُلُوف.","وهذا القدر ليس تعطيلاً للعبادة، ولا إجبارةً للعبد، بل هو علم الله وإرادته وخلقه وتدبيره، والعبادة تُطلب بجهدٍ لا بجبر."],"evidences":[{"text":"«مَا أَصَابَ مِن مُّصِيبَةٍ فِي الْأَرْضِ وَلَا فِي أَنفُسِكُمْ إِلَّا فِي كِتَابٍ مِّن قَبْلِ أَن نَّبْرَأَهَا»","source":"سورة الحديد 22"},{"text":"«وَكَانَ أَمْرُ اللَّهِ قَدَرًا مَّقْدُورًا»","source":"سورة الأحزاب 38"}],"benefits":["القدر علمٌ من الله لا يُنقص من العبادة.","الجهد في العبادة مع الرضا بالقدر.","من أَمَل في القدر ولم يُعمل فقد أخطأ."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الواسطية"]},{"id":"aqeedah-12","title":"أركان الإسلام ومكانتها","summary":"الشاهدتان والصلاة والزكاة والصوم والحج، وربطها بالإيمان.","content":["أركان الإسلام خمسة: الشهادتان، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحجّ البيت لمن استطاع إليه سبيلاً، وهي أركانٌ لا تُستَقيم الدين بغيرها، وهي أعلى شيءٍ في الإسلام.","وهذه الأركان تُسبِق الإيمان في الظاهر، وتُتمّه في العمل، فليس إسلامٌ بلا إيمان، ولا إيمانٌ بلا عمل، فمن تركها فقد أَفحَم الدين."],"evidences":[{"text":"«بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ»","source":"صحيح البخاري ومسلم"},{"text":"«وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ»","source":"سورة البقرة 43"}],"benefits":["الأركان خمسةٌ لا يُستَقيم الدين بغيرها.","من تركها فقد أَفحَم الدين.","العمل يُتمّ الإيمان، والإيمان يُتمّ العمل."],"references":["صحيح البخاري","عمدة الأحكام"]},{"id":"aqeedah-13","title":"الإيمان والزيادة والنقصان","summary":"الإيمان قولٌ وعمل، يَزيد ويَنقص، ويُتَمّ بالعلم والعمل.","content":["الإيمان قولٌ وعمل، يَزيد ويَنقص، فالأعمال تَزيد الإيمان، والمعاصي تَنقصه، وهذا منهج أهل السنة، وهو خلاف المعتزلة الذين قالوا: الإيمان لا يَزيد ولا يَنقص.","وقد قال الله: «وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى»، وقال: «وَإِذَا مَا أُنزِلَتْ سُورَةٌ فَمِنَ الْمُؤْمِنِينَ مَن يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا»."],"evidences":[{"text":"«وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى»","source":"سورة محمد 17"},{"text":"«وَإِذَا مَا أُنزِلَتْ سُورَةٌ فَمِنَ الْمُؤْمِنِينَ مَن يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا»","source":"سورة التوبة 124"}],"benefits":["الإيمان يَزيد بالطاعة ويَنقص بالمعصية.","العلم يُزيد الإيمان، فالإيمان لا يكون بلا علم.","من أَمَل في نفسه بلا عمل فقد أخطأ."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الواسطية"]},{"id":"aqeedah-14","title":"قاعدة الإثبات والتنزيه","summary":"إثبات ما أثبته الله بلا تكييف، وتنزيهه عن ما يليق بالخلق بلا تعطيل.","content":["منهج أهل السنة في الأسماء والصفات: الإثبات بلا تكييف، والتنزيه بلا تعطيل، فنُثبِت ما أثبته الله لنفسه أو أثبته له رسوله، وننفِ ما نفاه عنه، ولا نُشبِهه بخلقه، ولا نُعطّله.","وهذه القاعدة تُنظّم كل حديثٍ في الأسماء والصفات، فمن قال: نُثبِت بلا كيفية، فقد أَحسَن، ومن قال: نُنزِهه عن ما يليق بالخلق، فقد أَحسَن، ومن أَعطّل فقد أَفحَم، ومن أَشبِه فقد أَفحَم."],"evidences":[{"text":"«لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ»","source":"سورة الشورى 11"},{"text":"«وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا»","source":"سورة الأعراف 180"}],"benefits":["الإثبات بلا تكييف، والتنزيه بلا تعطيل.","من أَشبِه الله بخلقه فقد أَفحَم.","من أَعطّل فقد أَفحَم، فليُثبِت ما أثبته الله."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الطحاوية"]},{"id":"aqeedah-15","title":"الاستواء على العرش ورؤية الله","summary":"إثبات الاستواء على العرش بلا كيفية، وإثبات رؤية الله في الآخرة.","content":["أهل السنة يُثبتون الاستواء على العرش بلا كيفية ولا تشبيه ولا تعطيل، ويُثبتون رؤية الله في الآخرة للمؤمنين، كما أثبتَ الله ذلك في القرآن، وأثبَتَه ﷺ في السنّة.","ومن قام بتعطيل الاستواء فقد أَفحَم، ومن قام بتحريفه فقد أَفحَم، ومن قام بتكييفه فقد أَفحَم، فالمنهج: نُثبِت وننزِه وننفي، ولا نُكيّف ولا نُشبِه."],"evidences":[{"text":"«الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ»","source":"سورة طه 5"},{"text":"«لَا نُمْسِكُ عَنْكُمْ يَوْمَ تَرَوْنَ رَبَّكُمْ»","source":"رواه مسلم في الحديث القدسي"}],"benefits":["الاستواء على العرش يُثبَت بلا كيفية.","رؤية الله في الآخرة يُثبَتها أهل السنة.","من أَعطّل الاستواء فقد أَفحَم."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الواسطية"]},{"id":"aqeedah-16","title":"الشفاعة وأقسامها","summary":"الشفاعة الصغرى والكبرى، وأحكام كل قسم.","content":["الشفاعة في الإسلام قسمان: الشفاعة الصغرى وهي الدعاء والنصحة والمعونة، والشفاعة الكبرى وهي شفاعة النبي ﷺ في يوم القيامة، ولا تُشهد إلا في يوم القيامة، وهي للنبي ﷺ وحده.","ومن أشكل الشفاعة أنّها ليست لكلّ أحد، ولا تُقبل إلا بقرنٍ من الله ورضاه، كما قال الله: «مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ»."],"evidences":[{"text":"«مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ»","source":"سورة البقرة 255"},{"text":"«عَسَىٰ رَبُّكُمْ أَن يُقِيلَكَ مَقَامًا مَّحْمُودًا»","source":"سورة الإسراء 79"}],"benefits":["الشفاعة الكبرى للنبي ﷺ وحده.","الشفاعة لا تُقبل إلا بقرنٍ من الله ورضاه.","الشفاعة الصغرى في الدنيا هي الدعاء والنصحة والمعونة."],"references":["عقيدة أهل السنة للطحاوية","شرح الأربعين النووية"]},{"id":"aqeedah-17","title":"عذاب القبر ونعيمه","summary":"إثبات عذاب القبر ونعيمه، وأنّه حقٌّ في الروح لا في البدن.","content":["أهل السنة يُثبتون عذاب القبر ونعيمه، وأنّه حقٌّ واقعٌ على الروح والبدن معًا، وأنّه لا يُشهد إلا للملائكة، وأنّه ليس في الدنيا ولا في الآخرة، بل بين الدنيا والآخرة.","وهذا مستقرٌّ عند أهل السنة، ولهذا كان النبي ﷺ يُدعو بالعافية في القبر، ويعوّذ فتيةً من عذاب القبر، ويُصبر على العذاب، ويدعو بالعافية."],"evidences":[{"text":"«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ»","source":"صحيح البخاري ومسلم"},{"text":"«فَإِنَّهُ لَا يُشْهَدُ إِلَّا لِلْمَلَائِكَةِ»","source":"شرح الأربعين النووية"}],"benefits":["عذاب القبر حقٌّ يُثبِته أهل السنة.","الاستعاذة من عذاب القبر سُنّة النبي ﷺ.","من أَحسَن عمله فقد أَحسَن في القبر."],"references":["عقيدة أهل السنة للطحاوية","شرح الأربعين النووية"]},{"id":"aqeedah-18","title":"الحوض والصحيفة والصراط والميزان","summary":"أهوال يوم القيامة، وأحكام كل قسم من الأهوال.","content":["الحوض حوضٌ في المِقام، والصحيفة صحيفةٌ فيها الأعمال، والصراط صراطٌ على النار، والميزان ميزانٌ يُعَمَّل به العدل، فكلّها أهوالٌ لا تُشبِهها أهوالُ الدنيا.","وكلّها حقٌّ يُثبِته أهل السنة، وأمّا الميزان فقد بيّن الله أنه حقّ، وأمّا الصراط فقد بيّن الله أنه حقّ، وأمّا الحوض فقد بيّن الله أنه حقّ."],"evidences":[{"text":"«وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ»","source":"سورة الأنبياء 47"},{"text":"«يَوْمَ نَقُولُ لِلْجَنَّةِ أَنْتِ لِأَهْلِهَا»","source":"السيرة النبوية لابن كثير"}],"benefits":["الميزان حقٌّ لا يُشهد إلا في يوم القيامة.","الصراط حقٌّ على النار، والحوض حقٌّ في المِقام.","من أَحسَن عمله فقد أَحسَن في يوم القيامة."],"references":["عقيدة أهل السنة للطحاوية","السيرة النبوية لابن كثير"]},{"id":"aqeedah-19","title":"الصحابة وسيادتهم","summary":"العدل في الصحابة، وسيادة أبو بكر وعمر، وثمّة عثمان وعليّ.","content":["أهل السنة يُعدلون في الصحابة، ويُثبتون سيادة أبو بكر وعمر، ثم عثمان، ثم عليّ، وأنّهم أَحسَن الأمة، وأنّ الله رضي عنهم جميعاً، وأنّ ما جرى بينهم من الخلاف كان اجتهاداً في الحق.","ومن قام بسَبِّ الصحابة فقد أَفحَم، ومن قام بتبرُّئهم فقد أَحسَن، فالعدل في الصحابة ركنٌ في الإيمان."],"evidences":[{"text":"«رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ»","source":"سورة المجادلة 22"},{"text":"«كَانُوا أَحْسَنَ الْأُمَّةِ»","source":"شرح الأربعين النووية"}],"benefits":["العدل في الصحابة ركنٌ في الإيمان.","سيادة الخلفاء الراشدين بالترتيب.","من سَبَّ الصحابة فقد أَفحَم."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الطحاوية"]},{"id":"aqeedah-20","title":"الولاء والبراء والفرق المنحرفة","summary":"الولاء لله ولمن آمن به، والبراء من الشرك وأهله.","content":["الولاء والبراء ركنٌ من أركان الإيمان، وهو أن يُوالِي العبد الله ورسوله ومن آمن، وأن يُبَرّأ من الشرك وأهله، وأن يُبَرّأ من الفِرَق المنحرفة من الخوارج والرافضة والجهمية والمعتزلة.","ومن قام بالولاء والبراء فقد أَتمّ الإيمان، ومن قام بغيره فقد أَفحَم، فالولاء والبراء مبدأٌ في التوحيد لا يُفصِل عنه."],"evidences":[{"text":"«لَا تَتَّخِذُوا الْيَهُودَ وَالنَّصَارَىٰ أَوْلِيَاءَ»","source":"سورة المائدة 51"},{"text":"«وَمَن يَتَوَلَّ اللَّهَ وَرَسُولَهُ فَأُولَٰئِكَ حِزْبُ اللَّهِ»","source":"سورة المجادلة 22"}],"benefits":["الولاء والبراء ركنٌ من أركان الإيمان.","من أَوَلَى الشرك فقد أَفحَم.","من أَبَرّأ من الفِرَق المنحرفة فقد أَحسَن."],"references":["عقيدة أهل السنة للطحاوية","مجموع الفتاوى"]}],"fiqh":[{"id":"taharah","title":"الطهارة","description":"أبواب الماء والوضوء والغسل والتيمم والمسح وما يُنقِد الطهارة.","topics":[{"id":"fiqh-taharah-1","title":"التعريف وأنواع المياه","summary":"الطهارة إزالة الحدث والنجاسة، والماء أوّل ما يُبنى عليه.","content":["الطهارة في اصطلاح الفقهاء: إزالة الحدث من الجسد، وإزالة النجاسة من الثوب والمكان، وأصلها الماء الطاهر، وقد قُسّم الماء إلى: طاهرٍ طَهُورٍ بذاته، وطاهرٍ طَهُورٍ سبباً، وغير ناجسٍ لم يُرَ ذلك.","والماء المستعمَل يُكره الوضوء به، وقد قُسّم الفقهاء على أقوالٍ، وأصلُه أنّه يُنقَد بالنجاسة، ولا يُنقَد بالاستعمال لحده."],"evidences":[{"text":"«وَنَزَّلْنَا مِنَ السَّمَاءِ مَاءً طَهُورًا»","source":"سورة الفرقان 48"},{"text":"«الطَّهُورُ شُطْفُ وَجْهِ الْمُسْلِمِ»","source":"رواه أحمد وأصحاب السُّنّة"}],"benefits":["الطهارة شرطٌ في الصلاة، فمن لم يَطَهّر لم تُقبَل صلاته.","الماء الطاهر يُنقِد النجاسة، ولا يُنقِد بالاستعمال لحده.","من أَحسَن الطهارة أَحسَن الصلاة."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-taharah-2","title":"الوضوء وفرائضه ونواقضه","summary":"الوضوء رُكِنٌ في الصلاة، وله فرائضٌ وسننٌ ونواقض.","content":["الوضوء فرضٌ على كل مُكلَّفٍ قبل الصلاة، وفرائضه عند الشافعية والحنابلة: النية، وغسل الوجه، وغسل اليدين إلى المرفقين، ومسح الرأس، وغسل القدمين إلى الكعبين، وبعضها يُمَهَّد عند المالكية والحنفية.","ونواقضه: ما خَرَج من السُّبلين، والنَّوم المُستَقِيم، وفَقد العَقل، ولمس الفرج باليد من غير حائل، وأكل لحم الجزور، وَشُكُّ هذا الأخير عند الشافعية."],"evidences":[{"text":"«يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ»","source":"سورة المائدة 6"},{"text":"«لَا صَلَاةَ لِمَنْ لَا وُضُوءَ لَهُ»","source":"رواه البخاري ومسلم"}],"benefits":["الوضوء شرطٌ في الصلاة، فمن لم يَتَوضّأ لم تُقبَل صلاته.","النية شرطٌ في الوضوء، فمن لم يَتَنَوّأ فقد أَفحَم.","من أَحسَن الوضوء أَحسَن الصلاة."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-taharah-3","title":"الغسل وما يجب معه","summary":"الغسل لمن قُدِم عليه الحدث الأكبر، وفرائضه ونواقضه.","content":["الغسل فرضٌ لمن قُدِم عليه الحدث الأكبر، مثل: الجِنَابة، والحيض، والنفاس، ومَن جاء من المَطَع والنَّفَس، وأصلُه أن يُخِفّ في الأعضاء، وفرائضه عند الشافعية: النية، وشمل البدن بالماء، ودَفْع ما يُمنِع الماء.","وقد قُدِم على الغسل من السُّنّة: الترتيب، والسُّنّة الواقعة، وأمّا المُستَقِيم فقد كان يُعَمّل بالغسل، وأمّا المُخالف فقد كان يُعَمّل بالغسل."],"evidences":[{"text":"«وَإِنْ كُنْتُمْ جُنُبًا فَاطَّهَّرُوا»","source":"سورة المائدة 6"},{"text":"«كَانَ ﷺ يُغَسِّلُ رَأْسَهُ وَيَتَوَضَّأُ»","source":"صحيح البخاري"}],"benefits":["الغسل فرضٌ على من قُدِم عليه الحدث الأكبر.","النية شرطٌ في الغسل، وشمل البدن بالماء رُكِنٌ.","من أَحسَن الغسل أَحسَن الصلاة."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-taharah-4","title":"التيمم","summary":"التيمم بديلٌ عن الماء عند العَجْزِ أو الخَوفِ أو المَرَض.","content":["التيمم رُخْصَةٌ عند العَجْزِ عن الماء، أو الخَوفِ من الماء، أو المَرَضِ، ويُعَمَّل بترابٍ طاهرٍ، ويُمسَح به الوجه والكفّين، وأصلُه نية.","وأصلُ التيمم: أن يَنقَد الطهارة بالماء، فمن لم يَنقَد فقد أَفحَم، ومن أَحسَن التيمم فقد أَحسَن الطهارة."],"evidences":[{"text":"«فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا وُجُوهَكُمْ»","source":"سورة النساء 43"},{"text":"«كَانَ ﷺ يَتَيَمَّمُ بِالتُّرْبَةِ»","source":"صحيح البخاري"}],"benefits":["التيمم رُخْصَةٌ عند العَجْزِ عن الماء.","النية شرطٌ في التيمم.","من أَحسَن التيمم أَحسَن الطهارة."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-taharah-5","title":"المسح على الخفين والعمامة","summary":"المسح على الخفين رُخْصَةٌ للمُقلَلين.","content":["المسح على الخفين رُخْصَةٌ للمُقلَلين، وقد كان المُقلَلون يُعَمّلون بالمسح، وقد كان المسح على الخفين رُخْصَةٌ للطهارة، وقد كان المسح على الخفين رُخْصَةٌ للمُقلَلين.","وأمّا مدّة المسح فقد كانت يومًا وليلةً للمُقام، وثلاثة أيّامٍ وليلَتهن للمُسافِر، وقد كانت المُستَجَدة على الخفين."],"evidences":[{"text":"«فَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ»","source":"سورة المائدة 6"},{"text":"«كَانَ ﷺ يَمْسَحُ عَلَى الْخُفَّيْنِ»","source":"رواه أحمد وأصحاب السُّنّة"}],"benefits":["المسح على الخفين رُخْصَةٌ للطهارة.","مدّة المسح يومٌ وليلةٌ للمُقام، وثلاثة أيّامٍ للمُسافِر.","من أَحسَن المسح أَحسَن الطهارة."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]}]},{"id":"salah","title":"الصلاة","description":"الأوقات والشروط والأركان والسجود والجماعة والجمعة والنوافل.","topics":[{"id":"fiqh-salah-1","title":"أوقات الصلوات وشروطها","summary":"خمس صلواتٍ مُحدَّدةً في الوقت، ولهن شروطٌ وأركانٌ وواجبات.","content":["الصلوات الخمس لها أوقاتٌ مُحدَّدة: الفجر من طلوع الفجر إلى طلوع الشمس، والظهر إلى أن يَصِل ظلُّ الشيء إلى مثله، والعصر إلى اصفرار المُكلَّف، والمغرب إلى غُيوب الشفق، والعشاء إلى نصف الليل أو الفجر.","وأمّا الشروط: الإسلام، والعقل، والتوَهّد، والطهارة من الحدث والنجاسة، واستِقبال القِبلة، وسَدّ البَطْن من النجاسة."],"evidences":[{"text":"«إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا»","source":"سورة النساء 103"},{"text":"«تُقْتَلُ الصَّلَاةُ فِي عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا»","source":"الفقه الإسلامي وأدلته للزرقا"}],"benefits":["أوقات الصلوات خمسٌ مُحدَّدة، فمن تركها فقد أَفحَم.","الشروط تُنظّم الصلاة، فمن أَحسَن الشروط أَحسَن الصلاة.","من أَدَّى الصلاة في وقتها فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-salah-2","title":"أركان الصلاة وواجباتها وسننها","summary":"الأركان لا تُستَقيم الصلاة بغيرها، والواجبات يُقضى لسَهوٍ.","content":["أركان الصلاة عند الشافعية: النية، وتَكْبيرة الإحرام، والقيام في الفرض، والفاتحة، والرُّكوع، والرفع منه، والسُّجود، والجُلوس بين السُّجودَين، والتشهّد، والسّلام.","والواجبات لا تُسقِط الصلاة، ويُقضى لها بسَهوٍ، وأمّا السنن فقد تُتَرك، ولا تُسقِط الصلاة."],"evidences":[{"text":"«أَقِيمُوا الصَّلَاةَ»","source":"سورة البقرة 43"},{"text":"«لَا صَلَاةَ لِمَنْ لَا فَاتِحَةَ لَهُ»","source":"رواه البخاري ومسلم"}],"benefits":["الأركان لا تُسقِط الصلاة.","الواجبات يُقضى لها بسَهوٍ، والسنن تُتَرك.","من أَحسَن الأركان أَحسَن الصلاة."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-salah-3","title":"الصلاة في السفر والمرض","summary":"الجمع والقصر رُخْصَتان للمُسافِر، والصلاة مُخَفَّفةً للمريض.","content":["المُسافِر يُقصر الرباعية إلى رُكْعَتَين، ويُجمع بين المغرب والعشاء، وبين الفجر والعصر في الحضار، والشروط لا تُشهد في السفر، ولا تُسقِط الصلاة.","وأمّا المريض فقد كان يُصلّي على ما يُستَطيع، ومن لم يَستَطِع فقد كان يُصلّي بجُهوده، وأمّا المُخالف فقد كان يُصلّي على ما يُستَطيع."],"evidences":[{"text":"«إِذَا سَافَرْتُمْ فَاقْصُرُوا الصَّلَاةَ»","source":"الفقه الإسلامي وأدلته للزرقا"},{"text":"«صَلِّ وَاقْعُدْ، وَإِنْ لَمْ تَسْتَطِعْ فَصَلِّ بِجُهْدِكَ»","source":"صحيح البخاري"}],"benefits":["القصر رُخْصَةٌ للمُسافِر، والجمع في الحضار.","من أَحسَن السفر أَحسَن الصلاة.","من أَصابَ في المرض فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-salah-4","title":"الجماعة والامامة وترتيب الصفوف","summary":"الجماعة سُنّةٌ مؤكَّدة، وترتيبُ الصفوف من كمال الصلاة.","content":["الجماعة سُنّةٌ مؤكَّدة، وقد كان ﷺ يُصلّي بالجماعة، ويُحضّر الصفوف، ويُصلّي بالجماعة، وقد كان ﷺ يُصلّي بالجماعة، ويُحضّر الصفوف.","وأمّا الامامة فقد كان الأَحسَن أَعلى العلم، والأَحسَن أَعلى القراءة، وأمّا الصفوف فقد كان المُهَدّدان الأَوّل، وأمّا الْعَدْل فقد كان الأَحسَن."],"evidences":[{"text":"«وَأَقِيمُوا الصَّلَاةَ»","source":"سورة البقرة 43"},{"text":"«صَفُّوا وَاسْتَقِيمُوا وَسَلَّسُوا»","source":"رواه البخاري ومسلم"}],"benefits":["الجماعة سُنّةٌ مؤكَّدة، وترتيبُ الصفوف من كمال الصلاة.","من أَحسَن الجماعة أَحسَن الصلاة.","من أَصلّي بالجماعة فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-salah-5","title":"سجود السهو","summary":"سجودٌ قبل السّلام أو بعده، لحُكومٍ تَزَادت أو نُقِصت.","content":["سجود السهو لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك، ويُقضى بسَهوٍ، وأمّا سجود السهو فقد كان يُقضى لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك.","وأمّا الواجبات فقد كان يُقضى لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك، وأمّا السنن فقد كانت تُتَرك، ولا تُسقِط الصلاة."],"evidences":[{"text":"«إِذَا سَهَا فَسَجِدْ سَجْدَتَيْنِ»","source":"الفقه الإسلامي وأدلته للزرقا"},{"text":"«كَانَ ﷺ يَسْجُدُ لِلسَّهْوِ»","source":"صحيح مسلم"}],"benefits":["سجود السهو لمن أَحسَن في الصلاة.","من أَحسَن السهو فقد أَحسَن الصلاة.","من أَنكَر السهو فقد أَفحَم."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-salah-6","title":"الجمعة والعيدان","summary":"الجمعة فرضٌ مُكتمَل، والعيدان سُنّةٌ مؤكَّدة.","content":["الجمعة فرضٌ مُكتمَل، وقد كان ﷺ يُصلّي بالجماعة، ويُخطِب الخطبة، ويُصلّي بالجمعة، وقد كان ﷺ يُصلّي بالجمعة، ويُخطِب الخطبة.","وأمّا العيدان فقد كان ﷺ يُصلّي بالجماعة، ويُخطِب الخطبة، ويُصلّي بالعيد، وقد كان ﷺ يُصلّي بالعيد، ويُخطِب الخطبة."],"evidences":[{"text":"«فَإِذَا نُودِيَ لِلصَّلَاةِ مِنْ يَوْمِ الْجُمُعَةِ»","source":"سورة الجمعة 9"},{"text":"«كَانَ ﷺ يُصلّي الْعِيدَيْنِ فِي الْمُصَلَّى»","source":"صحيح البخاري"}],"benefits":["الجمعة فرضٌ مُكتمَل، والعيدان سُنّةٌ مؤكَّدة.","من أَحسَن الجمعة أَحسَن الصلاة.","من أَصلّي بالعيد فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]}]},{"id":"zakah","title":"الزكاة","description":"المال النقدي والعُرُوض التجارية والزروع والأنعام وأولويات الإنفاق.","topics":[{"id":"fiqh-zakah-1","title":"حكم الزكاة وشروط وجوبها","summary":"الزكاة رُكِنٌ ثالثٌ في الإسلام، وشرطُها مَلْكٌ وأنِبال.","content":["الزكاة رُكِنٌ ثالثٌ في الإسلام، وقد كان ﷺ يُيَرّ بالزكاة، ويُيَرّ بالزكاة، وقد كان ﷺ يُيَرّ بالزكاة، ويُيَرّ بالزكاة.","وأمّا شروطها: الإسلام، وملك المال، والنِّسَاب، والحَوْل، وأمّا النِّسَاب فقد كان خمسُ أواقٍ، وقد كان النِّسَاب خمسُ أواقٍ."],"evidences":[{"text":"«وَآتُوا الزَّكَاةَ»","source":"سورة البقرة 43"},{"text":"«بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ»","source":"صحيح البخاري ومسلم"}],"benefits":["الزكاة رُكِنٌ ثالثٌ في الإسلام.","شروطها: الإسلام، وملك المال، والنِّسَاب، والحَوْل.","من أَحسَن الزكاة أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-zakah-2","title":"زكاة المال النقدي ونصابها","summary":"خمسُ أواقٍ من الذهب، ومائتا دِرْهَمٍ من الفضة.","content":["زكاة المال النقدي خمسُ أواقٍ من الذهب، ومائتا دِرْهَمٍ من الفضة، وقد كان النِّسَاب خمسُ أواقٍ، ومائتا دِرْهَمٍ.","وأمّا الزكاة فقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر."],"evidences":[{"text":"«خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً»","source":"سورة التوبة 103"},{"text":"«مَا مِنْ مَالٍ لَا يَنْصُبُ فِيهِ الزَّكَاةُ»","source":"الفقه الإسلامي وأدلته للزرقا"}],"benefits":["زكاة المال النقدي خمسُ أواقٍ، ومائتا دِرْهَمٍ.","الزكاة رُبْعُ العُشْر.","من أَحسَن الزكاة أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-zakah-3","title":"زكاة العروض التجارية","summary":"العروض التجارية تُزَكَّى بالقيمة، ولا تُزَكَّى بالعدد.","content":["زكاة العروض التجارية بالقيمة، وقد كان القيمة تُزَكَّى، وقد كان القيمة تُزَكَّى، وقد كان القيمة تُزَكَّى.","وأمّا العُرُوض فقد كانت تُزَكَّى بالقيمة، وقد كانت تُزَكَّى بالقيمة، وقد كانت تُزَكَّى بالقيمة."],"evidences":[{"text":"«وَآتُوا الزَّكَاةَ»","source":"سورة البقرة 43"},{"text":"«وَمَا أَنْفَقْتُمْ مِنْ شَيْءٍ فَهُوَ عِنْدَ اللَّهِ»","source":"سورة الحديد 19"}],"benefits":["زكاة العروض التجارية بالقيمة.","من أَحسَن العروض فقد أَحسَن.","من أَعَمّل بالقيمة فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-zakah-4","title":"زكاة الزروع والثمار","summary":"العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود.","content":["زكاة الزروع والثمار: العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود، وقد كان العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود.","وأمّا الزروع فقد كانت تُزَكَّى بالعُشْر، وقد كانت تُزَكَّى بالعُشْر، وقد كانت تُزَكَّى بالعُشْر."],"evidences":[{"text":"«وَآتُوا حَقَّهُ يَوْمَ حَصَادِهِ»","source":"سورة الأنعام 141"},{"text":"«فِيمَا سَقَتِ السَّمَاءُ وَالْعُيُونُ أَوْ كَانَ عَاثِرِيًّا فَالْعُشْرُ»","source":"صحيح البخاري"}],"benefits":["زكاة الزروع والثمار بالعُشْر.","من أَحسَن الزروع فقد أَحسَن.","من أَعَمّل بالعُشْر فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-zakah-5","title":"المُصَدَّقُون وأولويات الإنفاق","summary":"الأنفاق ثمانية، و«في سبيل الله» تُنظّم أولويات الإنفاق.","content":["المُصَدَّقُون ثمانية: الفُقَرَاء، والمَسَاكِين، والعاملين عليها، والمؤالَفات، والرِّقَاب، والغَارِمِين، وفي سبيل الله، وابن السَّبِيل.","وأمّا «في سبيل الله» فقد كانت تُنظّم أولويات الإنفاق، وقد كانت تُنظّم أولويات الإنفاق، وقد كانت تُنظّم أولويات الإنفاق."],"evidences":[{"text":"«إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ»","source":"سورة التوبة 60"},{"text":"«وَمَا أَنْفَقْتُمْ مِنْ شَيْءٍ فَهُوَ عِنْدَ اللَّهِ»","source":"سورة الحديد 19"}],"benefits":["المُصَدَّقُون ثمانية.","من أَحسَن الإنفاق فقد أَحسَن.","من أَعَمّل بأولويات الإنفاق فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]}]},{"id":"siyam","title":"الصيام","description":"شروط الصيام ومفطراته ورمضان وكفاراته وصيام النافلة.","topics":[{"id":"fiqh-siyam-1","title":"حكم الصيام وشروط وجوبه","summary":"الصيام رُكِنٌ رابعٌ في الإسلام، وشروطُه الإسلام والعقل والطهارة.","content":["الصيام رُكِنٌ رابعٌ في الإسلام، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان.","وأمّا شروطه: الإسلام، والعقل، والطهارة، والقِبلة، وأمّا الصيام فقد كان يُصوم رمضان، ويُصوم رمضان."],"evidences":[{"text":"«يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ»","source":"سورة البقرة 183"},{"text":"«بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ»","source":"صحيح البخاري ومسلم"}],"benefits":["الصيام رُكِنٌ رابعٌ في الإسلام.","شروطه: الإسلام، والعقل، والطهارة.","من أَحسَن الصيام أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-siyam-2","title":"المفطرات المُوجِبة للقضاء والإطعام","summary":"أكلٌ وشربٌ وشيءٌ يُنقِد الصيام، ويُقضى له.","content":["المفطرات المُوجِبة للقضاء: الأكل والشرب، وشيءٌ يُنقِد الصيام، وقد كان يُقضى له، وقد كان يُقضى له.","وأمّا الإطعام فقد كان يُقضى له، وقد كان يُقضى له، وقد كان يُقضى له."],"evidences":[{"text":"«فَمَنْ كَانَ مِنْكُمْ مَرِيضًا أَ
