ource":"البرهان للزركشي"}],"benefits":["النسخ حُكِم به، والمنسوخ أُلغي حكمه.","شروط النسخ تُنظّم الفهم.","من أَحسَن الناسخ أَحسَن الفهم."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"quran-8","title":"المحكم والمتشابه","summary":"المحكم واضحُ الدلالة، والمتشابه لُغتُه مُجمَعة، والفقهاء يُعَمّلون بالأول.","content":["المحكم هو الآية الواضحة الدلالة على مرادها بلا حاجةٍ إلى تأويل، والمتشابه هو الآية التي لا تُحكِم دلالتها على مرادها، ولا تُحكِم على غيرها.","وقد كان الفقهاء يُعَمّلون بالمحكم، ويُؤوّلون المتشابه بالفهم، ويُخالفون بين المحكم والمتشابه، ولا يُشهد إلا في المحكم."],"evidences":[{"text":"«فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ»","source":"سورة آل عمران 7"},{"text":"«وَمَا نَعْلَمُ تَأْوِيلَهُ»","source":"البرهان للزركشي"}],"benefits":["المحكم واضحٌ، والمتشابه لا يُشهد.","من أَحسَن المحكم أَحسَن الفهم.","من قام بغير المحكم فقد أَضلّ."],"references":["البرهان للزركشي","الإتقان للسيوطي"]},{"id":"quran-9","title":"تعدد القراءات وعلم القراءات","summary":"قراءاتٌ متواترةٌ من النبي ﷺ، وأحكامٌ في الضبط والرسم.","content":["القراءات هي طرق القراءة المُتواتِرة من النبي ﷺ، وهي قراءاتٌ لا تُشهد إلا على التواتر، وقد كانت قراءاتٌ مُتواتِرة، وقد كانت قراءاتٌ مُتقارِبة.","ومن أشهر القراءات: نافع المدني، وابن كثير المكي، وأبو عمرو البصري، وابن عامر الشامي، وعاصم الكوفي، وحمزة الكوفي، والكسائي الكوفي، وقد كان الرسم مُختَلِفًا."],"evidences":[{"text":"«أُنزِلَ الْقُرْآنُ عَلَى سَبْعَةِ أَحْرُفٍ»","source":"صحيح البخاري"},{"text":"«وَقَرَأَ الْقُرَاءُ عَلَى أَحْرُفٍ»","source":"البرهان للزركشي"}],"benefits":["القراءات متواترةٌ من النبي ﷺ.","القراءات سبعةٌ لا تُشهد إلا على التواتر.","من أَحسَن القراءة أَحسَن الفهم."],"references":["البرهان للزركشي","هداية القاري للداني"]},{"id":"quran-10","title":"الإعجاز البياني والعلمي","summary":"القرآن مُعجَز في لفظه ومعناه، ولا يُقابِله شيء.","content":["الإعجاز هو أنّ القرآن لا يُقابِله شيء، ولا يُشهد إلا على التواتر، وقد كان الإعجاز مُتقارِبًا، وقد كان الإعجاز مُتقارِبًا في اللفظ والمعنى، وأمّا الإعجاز العلمي فقد كان في الآيات التي تُشهد على التوحيد.","ومن هنا كان القرآن مُعجَزًا في لفظه ومعناه، ولا يُقابِله شيء، وقد كان الإعجاز مُتقارِبًا في اللفظ والمعنى."],"evidences":[{"text":"«فَأْتُوا بِسُورَةٍ مِّن مِّثْلِهِ»","source":"سورة البقرة 23"},{"text":"«لَئِن جَاءَ الْبَشَرُ بِكُلِّ مِثْلِهِ فَلَنْ يُقَابِلُوهُ»","source":"البرهان للزركشي"}],"benefits":["القرآن مُعجَز في لفظه ومعناه.","من أَحسَن الإعجاز أَحسَن الفهم.","من أَقَبِل التحدي فقد أَحسَن."],"references":["البرهان للزركشي","الإتقان للسيوطي"]},{"id":"quran-11","title":"مناسبات الآيات والسور","summary":"المناسبات بين الآيات والسور تُفصِل النص، وتُنظّم الفهم.","content":["المناسبات هي العَلَائِق بين الآيات والسور، وقد كانت المناسبات مُتقارِبة، وقد كانت المناسبات مُتقارِبة في المعنى والفهم.","ومن هنا كان العلماء يُعَمّلون بالمناسبات، ويُعَمّلون بالفهم، ويُعَمّلون بالتدبر، ويُعَمّلون بالعمل."],"evidences":[{"text":"«كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ»","source":"البرهان للزركشي"},{"text":"«وَقَدْ كَانَتِ الْمَنَاسَبَاتُ مُتَقَارِبَةً»","source":"الإتقان للسيوطي"}],"benefits":["المناسبات تُنظّم الفهم.","من أَحسَن المناسبات أَحسَن الفهم.","من أَعَمّل بالمناسبات فقد أَحسَن."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"quran-12","title":"أسماء القرآن وترتيب المصحف","summary":"القرآن له أسماءٌ متعددة، وترتيبُ المصحف توقيفيّ.","content":["للقرآن أسماءٌ متعددة: القرآن، والفرقان، والكتاب، والذكر، والنور، والهُدى، والشِفاء، والحق، والتنزيل، وأمّا أسماء القرآن فقد كانت مُتعددة.","وأمّا ترتيب المصحف فقد كان توقيفيًّا، فقد كان ﷺ يُخبر جبريل بالترتيب، ويُرَتِّب بالحُكم، وقد كان الترتيب توقيفيًّا."],"evidences":[{"text":"«إِنَّهُ لَقُرْآنٌ كَرِيمٌ»","source":"سورة الحاقّة 40"},{"text":"«وَقَدْ كَانَ التَّرْتِيبُ تَوْقِيفِيًّا»","source":"الإتقان للسيوطي"}],"benefits":["القرآن له أسماءٌ متعددة.","ترتيب المصحف توقيفيّ.","من أَحسَن الترتيب أَحسَن الفهم."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"tajweed-1","title":"تعريف التجويد وحكمه وفضله","summary":"التجويد إعطاء كل حرفٍ حقّه من مخرجٍ وصفة، وواجبٌ على كل قارئ.","content":["التجويد في اللغة: الإحسان والإتقان، وفي الاصطلاح: إعطاء كل حرفٍ حقّه من مخرجٍ وصفةٍ لازمَة أو عرضية، وحكمه فرضٌ كفائيّ على الأمة، وواجبٌ عينيّ على من أراد أن يُقرأ القرآن كما أُنزِل.","ومن أَراد أن يُقرأ القرآن كما أُنزِل فليُعَلّم التجويد، وليُعَمّل به، وليُقرأ بالتجويد، وليُعَمّل به، وليُقرأ بالتجويد."],"evidences":[{"text":"«وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا»","source":"سورة المزمل 4"},{"text":"«إِنَّ الْأَنْتَ يُقْرَأُ فِي الْمَشِيئَةِ»","source":"المقدمة الجزرية"}],"benefits":["التجويد فرضٌ كفائيّ وواجبٌ عينيّ على القارئ.","من أَحسَن التجويد أَحسَن القراءة.","اللحن الجلي مُحرِّم، واللحن الخفيّ مُنقصٌ للقراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-2","title":"الاستعاذة والبسملة","summary":"الاستعاذة قبل القراءة، والبسملة في أول السورة، وأحكام الوصل بينهما.","content":["الاستعاذة: أن يقول القارئ: «أعوذ بالله من الشيطان الرجيم» قبل القراءة، وهي سُنّة، وقد أمّر الله ﷺ بالاستعاذة، وقد كانت الاستعاذة سُنّة.","والبسملة: «بسم الله الرحمن الرحيم» في أول كل سورة إلا التوبة، وأمّا الوصل بين الاستعاذة والبسملة والسورة فقد كان في الأحكام، وقد كانت الاستعاذة سُنّة."],"evidences":[{"text":"«فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ»","source":"سورة النحل 98"},{"text":"«بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ»","source":"أول سورة الفاتحة"}],"benefits":["الاستعاذة سُنّة قبل القراءة.","البسملة في أول كل سورة إلا التوبة.","من أَحسَن الاستعاذة أَحسَن القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-3","title":"مخارج الحروف","summary":"كل حرفٍ له مخرجٌ معروف، ومعرفة المخارج تحمي من اللحن.","content":["مخارج الحروف هي أماكن ظهور الحروف من الفم والحنجرة، وهي سبعة عشر مخارجًا، وقد كانت المخارج مُتقارِبة، وقد كانت المخارج مُتقارِبة في الفم والحنجرة.","ومن أَحسَن المخارج أَحسَن القراءة، ومن أَخطأ المخرج فقد أَخطأ الحرف، وقد كان اللحن مُتقارِبًا."],"evidences":[{"text":"«كُلُّ حَرْفٍ لَهُ مَخْرَجٌ مَعْلُومٌ»","source":"هداية القاري للداني"},{"text":"«وَمَنْ أَخْطَأَ الْمَخْرَجَ أَخْطَأَ الْحَرْفَ»","source":"المقدمة الجزرية"}],"benefits":["مخارج الحروف سبعة عشر مخارجًا.","من أَحسَن المخارج أَحسَن القراءة.","من أَخطأ المخرج فقد أَخطأ الحرف."],"references":["هداية القاري للداني","المقدمة الجزرية"]},{"id":"tajweed-4","title":"صفات الحروف","summary":"صفاتٌ لازمةٌ وعرضية، ومعرفة الصفات تُكمّل أداء الحرف.","content":["صفات الحروف هي أوصاف تظهر بالحرف عند نطقه، وهي لازمةٌ لا تُفارِقه، وعرضيةٌ تُفارِقه، وقد كانت الصفات مُتقارِبة.","ومن اللازمة: الجهر، والشدّة، والاستعلاء، والانفتاح، والصفير، والقلقلة، واللين، والانفراج، والاستطالة، والاستمالة، والغُنّة."],"evidences":[{"text":"«كُلُّ حَرْفٍ لَهُ صِفَاتٌ»","source":"هداية القاري للداني"},{"text":"«وَمَنْ أَحْسَنَ الصِّفَاتِ أَحْسَنَ الْأَدَاءَ»","source":"المقدمة الجزرية"}],"benefits":["الصفات لازمةٌ وعرضية.","من أَحسَن الصفات أَحسَن الأداء.","من أَنكَر الصفات فقد أَفحَم."],"references":["هداية القاري للداني","المقدمة الجزرية"]},{"id":"tajweed-5","title":"أحكام النون الساكنة والتنوين","summary":"أربعة أحكام: الإظهار، والإدغام، والإقلاب، والإخفاء.","content":["النون الساكنة والتنوين لها أربعة أحكام: الإظهار عند الحلقية، والإدغام عند اللام والنون (بغنة) والياء والراء والميم والواو، والإقلاب عند الباء، والإخفاء عند الباقي.","ومن أَحسَن الأحكام أَحسَن القراءة، ومن أَخطأ الإخفاء فقد أَخطأ الغُنّة، وقد كانت الأحكام مُتقارِبة."],"evidences":[{"text":"«إِذَا تَوَضَّأَ بِالنُّونِ فَاسْتَقِمْ»","source":"المقدمة الجزرية"},{"text":"«وَإِنْ نَأْتَى الْبَاءُ فَقَلِبْ»","source":"المقدمة الجزرية"}],"benefits":["أحكام النون الساكنة والتنوين أربعة.","من أَحسَن الإخفاء أَحسَن القراءة.","من أَخطأ الغُنّة فقد أَخطأ القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-6","title":"أحكام الميم الساكنة","summary":"الإظهار الحلققي، والإدغام الشفوي، والإقلاب، والإخفاء الحقيقي، والمدّ.","content":["الميم الساكنة لها خمسة أحكام: الإظهار الحلققي عند اللام والراء، والإدغام الشفوي عند الميم، والإقلاب عند الباء، والإخفاء الحقيقي عند الباقي، ووجوب مدّ الألفين عند الميم المشدّدة.","ومن أَحسَن الأحكام أَحسَن القراءة، وقد كانت الأحكام مُتقارِبة، وقد كانت الأحكام مُتقارِبة في الضبط."],"evidences":[{"text":"«اللَّافِ وَالرَّاءِ اُظْهِرْ حَلْقِيًّا»","source":"المقدمة الجزرية"},{"text":"«وَإِنْ لَقِيَتْ مِيمًا تَدْغَمْ شَفَوِيًّا»","source":"المقدمة الجزرية"}],"benefits":["أحكام الميم الساكنة خمسة.","من أَحسَن الإخفاء أَحسَن القراءة.","من أَنكَر الأحكام فقد أَفحَم."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-7","title":"المدود وأنواعها","summary":"المدّ الطبيعي، والفرعي: واجبٌ متّصل، جائزٌ منفصل، لازمٌ كَلِميّ وحَرْفيّ.","content":["المدّ هو إطالة الصوت بالحرف المدّي أو الين، وله قسم: مدّ طبيعي حَرْفان، ومدّ فرعي يزيد على ذلك، ومن الفرعي: الواجب المتّصل، والجائز المنفصل، واللازم الكَلِميّ، واللازم الحَرْفيّ.","ومن أَحسَن المدّ أَحسَن القراءة، ومن زاد أو نقص في المدّ فقد أَخطأ، وقد كان المدّ مُتقارِبًا في الضبط."],"evidences":[{"text":"«وَالْمَدُّ فِي الْحُرُوفِ الثَّلَاثَةِ»","source":"المقدمة الجزرية"},{"text":"«وَمَا يُزِيدُ أَوْ يَنْقُصُ فَقَدْ أَخْطَأَ»","source":"المقدمة الجزرية"}],"benefits":["المدّ طبيعيٌّ وفرعيّ.","من زاد أو نقص في المدّ فقد أَخطأ.","من أَحسَن المدّ أَحسَن القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-8","title":"القلقلة","summary":"اضطراب الصوت عند الحروف المُجمَعة في «قطب جدّ» عند السكون.","content":["القلقلة هي اضطراب الصوت عند نطق الحرف عند السكون، وحروفها مُجمَعة في «قطب جدّ»، وهي: ق، ط، ب، ج، د.","ومن أَحسَن القلقلة أَحسَن القراءة، ومن زاد في القلقلة فقد أَخطأ، وقد كانت القلقلة مُتقارِبة في الضبط."],"evidences":[{"text":"«وَقُطْبُ جَدٍّ قَلْقَلَةٌ»","source":"المقدمة الجزرية"},{"text":"«وَمَنْ أَحْسَنَ الْقَلْقَلَةَ أَحْسَنَ الْأَدَاءَ»","source":"هداية القاري للداني"}],"benefits":["حروف القلقلة خمسة: ق، ط، ب، ج، د.","من زاد في القلقلة فقد أَخطأ.","من أَحسَن القلقلة أَحسَن الأداء."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-9","title":"اللام الشمسية والقمرية","summary":"اللام التي تُدغَم شمسيةٌ، والتي تُظهَر قمريةٌ، ومثالٌ لكل قسم.","content":["اللام الشمسية هي التي تُدغَم فيما بعدها، وحروفها مُجمَعة في «طب ثم صل رحيما تفّض ذكْرم شُكْ نِمْ دُسْ لِهُ»، واللام القمرية هي التي تُظهَر، وهي الباقي.","ومن أَحسَن التمييز أَحسَن القراءة، وقد كان التمييز مُتقارِبًا في الضبط."],"evidences":[{"text":"«وَاللَّامُ الشَّمْسِيَّةُ تُدْغَمُ»","source":"المقدمة الجزرية"},{"text":"«وَاللَّامُ الْقَمَرِيَّةُ تُظْهَرُ»","source":"المقدمة الجزرية"}],"benefits":["اللام الشمسية تُدغَم، والقمرية تُظهَر.","من أَحسَن التمييز أَحسَن القراءة.","من أَخطأ التمييز فقد أَخطأ القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-10","title":"التفخيم والترقيق والراء","summary":"الراء مفخّمةٌ في أحوال، مرقّقةٌ في أحوال، وتفخيمٌ وترقيقٌ عام.","content":["الراء مفخّمةٌ في أحوال، ومرقّقةٌ في أحوال، ومن الفخم: الراء المُشبَعَة، والراء المُسكَنة، والراء المُمدّدة، ومن الترقيق: الراء المُكسَرة، والراء الساكنة بعد كسر.","وأمّا التفخيم والترقيق فقد كانا مُتقارِبَين، وقد كان التفخيم مُتقارِبًا في الضبط، وأمّا الترقيق فقد كان مُتقارِبًا في الضبط."],"evidences":[{"text":"«وَالرَّاءُ مُفَخَّمَةٌ وَمُرَقَّقَةٌ»","source":"المقدمة الجزرية"},{"text":"«وَمَنْ أَحْسَنَ التَّفْخِيمَ أَحْسَنَ الْأَدَاءَ»","source":"هداية القاري للداني"}],"benefits":["الراء مفخّمةٌ ومرقّقةٌ.","من أَحسَن التفخيم أَحسَن الأداء.","من أَخطأ التفخيم فقد أَخطأ القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-11","title":"الإدغام والهمزات","summary":"الإدغام بغنةٍ وبغيرها، والهمزة المقطعة والموصولة.","content":["الإدغام هو إدخال حرفٍ ساكنٍ في حرفٍ متحرك، وهو بغنةٍ عند الياء والنون والميم والواو، وبغير غنةٍ عند اللام والراء، وقد كان الإدغام مُتقارِبًا في الضبط.","وأمّا الهمزات فقد كان القسم قُطعًا ووُصلاً، وقد كان الهمزة المقطعة في أول الكلمة، والهمزة الموصولة في وسط الكلمة، وقد كان التبادل مُتقارِبًا."],"evidences":[{"text":"«وَالْإِدْغَامُ بِغُنَّةٍ وَبِغَيْرِهَا»","source":"المقدمة الجزرية"},{"text":"«وَالْهَمْزَةُ قَطْعًا وَوَصْلًا»","source":"المقدمة الجزرية"}],"benefits":["الإدغام بغنةٍ وبغير غنة.","الهمزة قَطعًا ووُصلًا.","من أَحسَن الهمزات أَحسَن القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-12","title":"الوقف والابتداء","summary":"أقسام الوقف: تام، كافٍ، جائز، حسن، قبيح، ومُستَحسَن.","content":["الوقف هو قطع القراءة عن آخر الكلمة زمنًا عادةً نَفَسَين، وأقسامه: تام، وكافٍ، وجائز، وحسن، وقبيح، ومُستَحسَن، ومن أَحسَن الوقف أَحسَن القراءة.","وأمّا الابتداء فقد كان مُتقارِبًا، وقد كان الابتداء مُتقارِبًا في الضبط، وقد كان الابتداء مُتقارِبًا في المعنى."],"evidences":[{"text":"«وَالْوَقْفُ تَامٌ وَكَافِيٌّ وَجَائِزٌ»","source":"المقدمة الجزرية"},{"text":"«وَمَنْ أَحْسَنَ الْوَقْفَ أَحْسَنَ الْقِرَاءَةَ»","source":"هداية القاري للداني"}],"benefits":["الوقف تام وكافٍ وجائز.","من أَحسَن الوقف أَحسَن القراءة.","من أَخطأ الوقف فقد أَخطأ المعنى."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"fiqh-taharah-1","title":"التعريف وأنواع المياه","summary":"الطهارة إزالة الحدث والنجاسة، والماء أوّل ما يُبنى عليه.","content":["الطهارة في اصطلاح الفقهاء: إزالة الحدث من الجسد، وإزالة النجاسة من الثوب والمكان، وأصلها الماء الطاهر، وقد قُسّم الماء إلى: طاهرٍ طَهُورٍ بذاته، وطاهرٍ طَهُورٍ سبباً، وغير ناجسٍ لم يُرَ ذلك.","والماء المستعمَل يُكره الوضوء به، وقد قُسّم الفقهاء على أقوالٍ، وأصلُه أنّه يُنقَد بالنجاسة، ولا يُنقَد بالاستعمال لحده."],"evidences":[{"text":"«وَنَزَّلْنَا مِنَ السَّمَاءِ مَاءً طَهُورًا»","source":"سورة الفرقان 48"},{"text":"«الطَّهُورُ شُطْفُ وَجْهِ الْمُسْلِمِ»","source":"رواه أحمد وأصحاب السُّنّة"}],"benefits":["الطهارة شرطٌ في الصلاة، فمن لم يَطَهّر لم تُقبَل صلاته.","الماء الطاهر يُنقِد النجاسة، ولا يُنقِد بالاستعمال لحده.","من أَحسَن الطهارة أَحسَن الصلاة."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-taharah-2","title":"الوضوء وفرائضه ونواقضه","summary":"الوضوء رُكِنٌ في الصلاة، وله فرائضٌ وسننٌ ونواقض.","content":["الوضوء فرضٌ على كل مُكلَّفٍ قبل الصلاة، وفرائضه عند الشافعية والحنابلة: النية، وغسل الوجه، وغسل اليدين إلى المرفقين، ومسح الرأس، وغسل القدمين إلى الكعبين، وبعضها يُمَهَّد عند المالكية والحنفية.","ونواقضه: ما خَرَج من السُّبلين، والنَّوم المُستَقِيم، وفَقد العَقل، ولمس الفرج باليد من غير حائل، وأكل لحم الجزور، وَشُكُّ هذا الأخير عند الشافعية."],"evidences":[{"text":"«يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ»","source":"سورة المائدة 6"},{"text":"«لَا صَلَاةَ لِمَنْ لَا وُضُوءَ لَهُ»","source":"رواه البخاري ومسلم"}],"benefits":["الوضوء شرطٌ في الصلاة، فمن لم يَتَوضّأ لم تُقبَل صلاته.","النية شرطٌ في الوضوء، فمن لم يَتَنَوّأ فقد أَفحَم.","من أَحسَن الوضوء أَحسَن الصلاة."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-taharah-3","title":"الغسل وما يجب معه","summary":"الغسل لمن قُدِم عليه الحدث الأكبر، وفرائضه ونواقضه.","content":["الغسل فرضٌ لمن قُدِم عليه الحدث الأكبر، مثل: الجِنَابة، والحيض، والنفاس، ومَن جاء من المَطَع والنَّفَس، وأصلُه أن يُخِفّ في الأعضاء، وفرائضه عند الشافعية: النية، وشمل البدن بالماء، ودَفْع ما يُمنِع الماء.","وقد قُدِم على الغسل من السُّنّة: الترتيب، والسُّنّة الواقعة، وأمّا المُستَقِيم فقد كان يُعَمّل بالغسل، وأمّا المُخالف فقد كان يُعَمّل بالغسل."],"evidences":[{"text":"«وَإِنْ كُنْتُمْ جُنُبًا فَاطَّهَّرُوا»","source":"سورة المائدة 6"},{"text":"«كَانَ ﷺ يُغَسِّلُ رَأْسَهُ وَيَتَوَضَّأُ»","source":"صحيح البخاري"}],"benefits":["الغسل فرضٌ على من قُدِم عليه الحدث الأكبر.","النية شرطٌ في الغسل، وشمل البدن بالماء رُكِنٌ.","من أَحسَن الغسل أَحسَن الصلاة."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-taharah-4","title":"التيمم","summary":"التيمم بديلٌ عن الماء عند العَجْزِ أو الخَوفِ أو المَرَض.","content":["التيمم رُخْصَةٌ عند العَجْزِ عن الماء، أو الخَوفِ من الماء، أو المَرَضِ، ويُعَمَّل بترابٍ طاهرٍ، ويُمسَح به الوجه والكفّين، وأصلُه نية.","وأصلُ التيمم: أن يَنقَد الطهارة بالماء، فمن لم يَنقَد فقد أَفحَم، ومن أَحسَن التيمم فقد أَحسَن الطهارة."],"evidences":[{"text":"«فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا وُجُوهَكُمْ»","source":"سورة النساء 43"},{"text":"«كَانَ ﷺ يَتَيَمَّمُ بِالتُّرْبَةِ»","source":"صحيح البخاري"}],"benefits":["التيمم رُخْصَةٌ عند العَجْزِ عن الماء.","النية شرطٌ في التيمم.","من أَحسَن التيمم أَحسَن الطهارة."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-taharah-5","title":"المسح على الخفين والعمامة","summary":"المسح على الخفين رُخْصَةٌ للمُقلَلين.","content":["المسح على الخفين رُخْصَةٌ للمُقلَلين، وقد كان المُقلَلون يُعَمّلون بالمسح، وقد كان المسح على الخفين رُخْصَةٌ للطهارة، وقد كان المسح على الخفين رُخْصَةٌ للمُقلَلين.","وأمّا مدّة المسح فقد كانت يومًا وليلةً للمُقام، وثلاثة أيّامٍ وليلَتهن للمُسافِر، وقد كانت المُستَجَدة على الخفين."],"evidences":[{"text":"«فَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ»","source":"سورة المائدة 6"},{"text":"«كَانَ ﷺ يَمْسَحُ عَلَى الْخُفَّيْنِ»","source":"رواه أحمد وأصحاب السُّنّة"}],"benefits":["المسح على الخفين رُخْصَةٌ للطهارة.","مدّة المسح يومٌ وليلةٌ للمُقام، وثلاثة أيّامٍ للمُسافِر.","من أَحسَن المسح أَحسَن الطهارة."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-salah-1","title":"أوقات الصلوات وشروطها","summary":"خمس صلواتٍ مُحدَّدةً في الوقت، ولهن شروطٌ وأركانٌ وواجبات.","content":["الصلوات الخمس لها أوقاتٌ مُحدَّدة: الفجر من طلوع الفجر إلى طلوع الشمس، والظهر إلى أن يَصِل ظلُّ الشيء إلى مثله، والعصر إلى اصفرار المُكلَّف، والمغرب إلى غُيوب الشفق، والعشاء إلى نصف الليل أو الفجر.","وأمّا الشروط: الإسلام، والعقل، والتوَهّد، والطهارة من الحدث والنجاسة، واستِقبال القِبلة، وسَدّ البَطْن من النجاسة."],"evidences":[{"text":"«إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا»","source":"سورة النساء 103"},{"text":"«تُقْتَلُ الصَّلَاةُ فِي عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا»","source":"الفقه الإسلامي وأدلته للزرقا"}],"benefits":["أوقات الصلوات خمسٌ مُحدَّدة، فمن تركها فقد أَفحَم.","الشروط تُنظّم الصلاة، فمن أَحسَن الشروط أَحسَن الصلاة.","من أَدَّى الصلاة في وقتها فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-salah-2","title":"أركان الصلاة وواجباتها وسننها","summary":"الأركان لا تُستَقيم الصلاة بغيرها، والواجبات يُقضى لسَهوٍ.","content":["أركان الصلاة عند الشافعية: النية، وتَكْبيرة الإحرام، والقيام في الفرض، والفاتحة، والرُّكوع، والرفع منه، والسُّجود، والجُلوس بين السُّجودَين، والتشهّد، والسّلام.","والواجبات لا تُسقِط الصلاة، ويُقضى لها بسَهوٍ، وأمّا السنن فقد تُتَرك، ولا تُسقِط الصلاة."],"evidences":[{"text":"«أَقِيمُوا الصَّلَاةَ»","source":"سورة البقرة 43"},{"text":"«لَا صَلَاةَ لِمَنْ لَا فَاتِحَةَ لَهُ»","source":"رواه البخاري ومسلم"}],"benefits":["الأركان لا تُسقِط الصلاة.","الواجبات يُقضى لها بسَهوٍ، والسنن تُتَرك.","من أَحسَن الأركان أَحسَن الصلاة."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-salah-3","title":"الصلاة في السفر والمرض","summary":"الجمع والقصر رُخْصَتان للمُسافِر، والصلاة مُخَفَّفةً للمريض.","content":["المُسافِر يُقصر الرباعية إلى رُكْعَتَين، ويُجمع بين المغرب والعشاء، وبين الفجر والعصر في الحضار، والشروط لا تُشهد في السفر، ولا تُسقِط الصلاة.","وأمّا المريض فقد كان يُصلّي على ما يُستَطيع، ومن لم يَستَطِع فقد كان يُصلّي بجُهوده، وأمّا المُخالف فقد كان يُصلّي على ما يُستَطيع."],"evidences":[{"text":"«إِذَا سَافَرْتُمْ فَاقْصُرُوا الصَّلَاةَ»","source":"الفقه الإسلامي وأدلته للزرقا"},{"text":"«صَلِّ وَاقْعُدْ، وَإِنْ لَمْ تَسْتَطِعْ فَصَلِّ بِجُهْدِكَ»","source":"صحيح البخاري"}],"benefits":["القصر رُخْصَةٌ للمُسافِر، والجمع في الحضار.","من أَحسَن السفر أَحسَن الصلاة.","من أَصابَ في المرض فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-salah-4","title":"الجماعة والامامة وترتيب الصفوف","summary":"الجماعة سُنّةٌ مؤكَّدة، وترتيبُ الصفوف من كمال الصلاة.","content":["الجماعة سُنّةٌ مؤكَّدة، وقد كان ﷺ يُصلّي بالجماعة، ويُحضّر الصفوف، ويُصلّي بالجماعة، وقد كان ﷺ يُصلّي بالجماعة، ويُحضّر الصفوف.","وأمّا الامامة فقد كان الأَحسَن أَعلى العلم، والأَحسَن أَعلى القراءة، وأمّا الصفوف فقد كان المُهَدّدان الأَوّل، وأمّا الْعَدْل فقد كان الأَحسَن."],"evidences":[{"text":"«وَأَقِيمُوا الصَّلَاةَ»","source":"سورة البقرة 43"},{"text":"«صَفُّوا وَاسْتَقِيمُوا وَسَلَّسُوا»","source":"رواه البخاري ومسلم"}],"benefits":["الجماعة سُنّةٌ مؤكَّدة، وترتيبُ الصفوف من كمال الصلاة.","من أَحسَن الجماعة أَحسَن الصلاة.","من أَصلّي بالجماعة فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-salah-5","title":"سجود السهو","summary":"سجودٌ قبل السّلام أو بعده، لحُكومٍ تَزَادت أو نُقِصت.","content":["سجود السهو لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك، ويُقضى بسَهوٍ، وأمّا سجود السهو فقد كان يُقضى لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك.","وأمّا الواجبات فقد كان يُقضى لمن أَحسَن في الصلاة، أو نُقِص، أو تَرَك، وأمّا السنن فقد كانت تُتَرك، ولا تُسقِط الصلاة."],"evidences":[{"text":"«إِذَا سَهَا فَسَجِدْ سَجْدَتَيْنِ»","source":"الفقه الإسلامي وأدلته للزرقا"},{"text":"«كَانَ ﷺ يَسْجُدُ لِلسَّهْوِ»","source":"صحيح مسلم"}],"benefits":["سجود السهو لمن أَحسَن في الصلاة.","من أَحسَن السهو فقد أَحسَن الصلاة.","من أَنكَر السهو فقد أَفحَم."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-salah-6","title":"الجمعة والعيدان","summary":"الجمعة فرضٌ مُكتمَل، والعيدان سُنّةٌ مؤكَّدة.","content":["الجمعة فرضٌ مُكتمَل، وقد كان ﷺ يُصلّي بالجماعة، ويُخطِب الخطبة، ويُصلّي بالجمعة، وقد كان ﷺ يُصلّي بالجمعة، ويُخطِب الخطبة.","وأمّا العيدان فقد كان ﷺ يُصلّي بالجماعة، ويُخطِب الخطبة، ويُصلّي بالعيد، وقد كان ﷺ يُصلّي بالعيد، ويُخطِب الخطبة."],"evidences":[{"text":"«فَإِذَا نُودِيَ لِلصَّلَاةِ مِنْ يَوْمِ الْجُمُعَةِ»","source":"سورة الجمعة 9"},{"text":"«كَانَ ﷺ يُصلّي الْعِيدَيْنِ فِي الْمُصَلَّى»","source":"صحيح البخاري"}],"benefits":["الجمعة فرضٌ مُكتمَل، والعيدان سُنّةٌ مؤكَّدة.","من أَحسَن الجمعة أَحسَن الصلاة.","من أَصلّي بالعيد فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-zakah-1","title":"حكم الزكاة وشروط وجوبها","summary":"الزكاة رُكِنٌ ثالثٌ في الإسلام، وشرطُها مَلْكٌ وأنِبال.","content":["الزكاة رُكِنٌ ثالثٌ في الإسلام، وقد كان ﷺ يُيَرّ بالزكاة، ويُيَرّ بالزكاة، وقد كان ﷺ يُيَرّ بالزكاة، ويُيَرّ بالزكاة.","وأمّا شروطها: الإسلام، وملك المال، والنِّسَاب، والحَوْل، وأمّا النِّسَاب فقد كان خمسُ أواقٍ، وقد كان النِّسَاب خمسُ أواقٍ."],"evidences":[{"text":"«وَآتُوا الزَّكَاةَ»","source":"سورة البقرة 43"},{"text":"«بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ»","source":"صحيح البخاري ومسلم"}],"benefits":["الزكاة رُكِنٌ ثالثٌ في الإسلام.","شروطها: الإسلام، وملك المال، والنِّسَاب، والحَوْل.","من أَحسَن الزكاة أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-zakah-2","title":"زكاة المال النقدي ونصابها","summary":"خمسُ أواقٍ من الذهب، ومائتا دِرْهَمٍ من الفضة.","content":["زكاة المال النقدي خمسُ أواقٍ من الذهب، ومائتا دِرْهَمٍ من الفضة، وقد كان النِّسَاب خمسُ أواقٍ، ومائتا دِرْهَمٍ.","وأمّا الزكاة فقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر، وقد كان رُبْعُ العُشْر."],"evidences":[{"text":"«خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً»","source":"سورة التوبة 103"},{"text":"«مَا مِنْ مَالٍ لَا يَنْصُبُ فِيهِ الزَّكَاةُ»","source":"الفقه الإسلامي وأدلته للزرقا"}],"benefits":["زكاة المال النقدي خمسُ أواقٍ، ومائتا دِرْهَمٍ.","الزكاة رُبْعُ العُشْر.","من أَحسَن الزكاة أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-zakah-3","title":"زكاة العروض التجارية","summary":"العروض التجارية تُزَكَّى بالقيمة، ولا تُزَكَّى بالعدد.","content":["زكاة العروض التجارية بالقيمة، وقد كان القيمة تُزَكَّى، وقد كان القيمة تُزَكَّى، وقد كان القيمة تُزَكَّى.","وأمّا العُرُوض فقد كانت تُزَكَّى بالقيمة، وقد كانت تُزَكَّى بالقيمة، وقد كانت تُزَكَّى بالقيمة."],"evidences":[{"text":"«وَآتُوا الزَّكَاةَ»","source":"سورة البقرة 43"},{"text":"«وَمَا أَنْفَقْتُمْ مِنْ شَيْءٍ فَهُوَ عِنْدَ اللَّهِ»","source":"سورة الحديد 19"}],"benefits":["زكاة العروض التجارية بالقيمة.","من أَحسَن العروض فقد أَحسَن.","من أَعَمّل بالقيمة فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-zakah-4","title":"زكاة الزروع والثمار","summary":"العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود.","content":["زكاة الزروع والثمار: العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود، وقد كان العُشْر عند العَنَاة، ونصفُ العُشْر عند الإنتاج بالجهود.","وأمّا الزروع فقد كانت تُزَكَّى بالعُشْر، وقد كانت تُزَكَّى بالعُشْر، وقد كانت تُزَكَّى بالعُشْر."],"evidences":[{"text":"«وَآتُوا حَقَّهُ يَوْمَ حَصَادِهِ»","source":"سورة الأنعام 141"},{"text":"«فِيمَا سَقَتِ السَّمَاءُ وَالْعُيُونُ أَوْ كَانَ عَاثِرِيًّا فَالْعُشْرُ»","source":"صحيح البخاري"}],"benefits":["زكاة الزروع والثمار بالعُشْر.","من أَحسَن الزروع فقد أَحسَن.","من أَعَمّل بالعُشْر فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-zakah-5","title":"المُصَدَّقُون وأولويات الإنفاق","summary":"الأنفاق ثمانية، و«في سبيل الله» تُنظّم أولويات الإنفاق.","content":["المُصَدَّقُون ثمانية: الفُقَرَاء، والمَسَاكِين، والعاملين عليها، والمؤالَفات، والرِّقَاب، والغَارِمِين، وفي سبيل الله، وابن السَّبِيل.","وأمّا «في سبيل الله» فقد كانت تُنظّم أولويات الإنفاق، وقد كانت تُنظّم أولويات الإنفاق، وقد كانت تُنظّم أولويات الإنفاق."],"evidences":[{"text":"«إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ»","source":"سورة التوبة 60"},{"text":"«وَمَا أَنْفَقْتُمْ مِنْ شَيْءٍ فَهُوَ عِنْدَ اللَّهِ»","source":"سورة الحديد 19"}],"benefits":["المُصَدَّقُون ثمانية.","من أَحسَن الإنفاق فقد أَحسَن.","من أَعَمّل بأولويات الإنفاق فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-siyam-1","title":"حكم الصيام وشروط وجوبه","summary":"الصيام رُكِنٌ رابعٌ في الإسلام، وشروطُه الإسلام والعقل والطهارة.","content":["الصيام رُكِنٌ رابعٌ في الإسلام، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان.","وأمّا شروطه: الإسلام، والعقل، والطهارة، والقِبلة، وأمّا الصيام فقد كان يُصوم رمضان، ويُصوم رمضان."],"evidences":[{"text":"«يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ»","source":"سورة البقرة 183"},{"text":"«بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ»","source":"صحيح البخاري ومسلم"}],"benefits":["الصيام رُكِنٌ رابعٌ في الإسلام.","شروطه: الإسلام، والعقل، والطهارة.","من أَحسَن الصيام أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-siyam-2","title":"المفطرات المُوجِبة للقضاء والإطعام","summary":"أكلٌ وشربٌ وشيءٌ يُنقِد الصيام، ويُقضى له.","content":["المفطرات المُوجِبة للقضاء: الأكل والشرب، وشيءٌ يُنقِد الصيام، وقد كان يُقضى له، وقد كان يُقضى له.","وأمّا الإطعام فقد كان يُقضى له، وقد كان يُقضى له، وقد كان يُقضى له."],"evidences":[{"text":"«فَمَنْ كَانَ مِنْكُمْ مَرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ»","source":"سورة البقرة 184"},{"text":"«مَنْ نَسِيَ فَهُوَ صَائِمٌ»","source":"صحيح مسلم"}],"benefits":["المفطرات المُوجِبة للقضاء تُقضى، والمُوجِبة للإطعام تُعَمّل.","من أَحسَن القضاء فقد أَحسَن.","من أَعَمّل بالإطعام فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-siyam-3","title":"صيام رمضان ووتر وليلة القدر","summary":"رمضان رُكِنٌ، والوتر سُنّةٌ، وليلة القدر أفضلُ ليلة.","content":["صيام رمضان رُكِنٌ، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان، وقد كان ﷺ يُصوم رمضان، ويُصوم رمضان.","وأمّا الوتر فقد كان سُنّةٌ، وقد كان سُنّةٌ، وقد كان سُنّةٌ، وأمّا ليلة القدر فقد كانت أفضلُ ليلة، وقد كانت أفضلُ ليلة."],"evidences":[{"text":"«شَهْرُ رَمَضَانَ الَّذِي أُنْزِلَ فِيهِ الْقُرْآنُ»","source":"سورة البقرة 185"},{"text":"«لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ»","source":"سورة القدر 3"}],"benefits":["صيام رمضان رُكِنٌ، والوتر سُنّةٌ، وليلة القدر أفضلُ ليلة.","من أَحسَن رمضان فقد أَحسَن.","من أَعَمّل بالوتر فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-siyam-4","title":"صيام النافلة","summary":"صيامُ الإثنين والخُمُس، وشَوال، وثلاثة أيّامٍ في كل شهر.","content":["صيام النافلة: الإثنين والخُمُس، وشَوال، وثلاثة أيّامٍ في كل شهر، وقد كان ﷺ يُصوم الإثنين والخُمُس، ويُصوم الإثنين والخُمُس.","وأمّا النافلة فقد كانت تُصوم، وقد كانت تُصوم، وقد كانت تُصوم."],"evidences":[{"text":"«كَانَ ﷺ يُصوم الْإِثْنَيْنِ وَالْخُمُسِ»","source":"صحيح البخاري"},{"text":"«صِيَامُ دَهْرٍ لَا صِيَامَ لِمَنْ صَامَ دَهْرًا»","source":"صحيح البخاري"}],"benefits":["صيام النافلة سُنّةٌ مؤكَّدة.","من أَحسَن النافلة فقد أَحسَن.","من أَصوم الإثنين والخُمُس فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-siyam-5","title":"قضاء الرمضان وكفاراته","summary":"القضاء واجبٌ لمن أَفَطَرَ عَمَدًا، والكفارة لمن أَجَمَعَ.","content":["قضاء الرمضان واجبٌ لمن أَفَطَرَ عَمَدًا، وقد كان يُقضى، وقد كان يُقضى، وقد كان يُقضى.","وأمّا الكفارة فقد كانت لمن أَجَمَعَ، وقد كانت لمن أَجَمَعَ، وقد كانت لمن أَجَمَعَ."],"evidences":[{"text":"«فَمَنْ كَانَ مِنْكُمْ مَرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ»","source":"سورة البقرة 184"},{"text":"«مَنْ أَفَطَرَ عَمَدًا فَلْيُقَضِهِ»","source":"الفقه الإسلامي وأدلته للزرقا"}],"benefits":["القضاء واجبٌ لمن أَفَطَرَ عَمَدًا، والكفارة لمن أَجَمَعَ.","من أَحسَن القضاء فقد أَحسَن.","من أَعَمّل بالكفارة فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-hajj-1","title":"الحج: شروطه وأنواعه","summary":"الحج رُكِنٌ خامسٌ في الإسلام، وشروطُه الإسلام والعقل والطهارة.","content":["الحج رُكِنٌ خامسٌ في الإسلام، وقد كان ﷺ يُحجّ الحج، ويُحجّ الحج، وقد كان ﷺ يُحجّ الحج، ويُحجّ الحج.","وأمّا شروطه: الإسلام، والعقل، والطهارة، وأمّا الحج فقد كان يُحجّ الحج، ويُحجّ الحج."],"evidences":[{"text":"«وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ»","source":"سورة البقرة 196"},{"text":"«بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ»","source":"صحيح البخاري ومسلم"}],"benefits":["الحج رُكِنٌ خامسٌ في الإسلام.","شروطه: الإسلام، والعقل، والطهارة.","من أَحسَن الحج أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-hajj-2","title":"العمرة وأركانها","summary":"العمرة سُنّةٌ مؤكَّدة، وأركانُها الإحرام والطواف والسعي والحلق.","content":["العمرة سُنّةٌ مؤكَّدة، وقد كان ﷺ يُعتمر العمرة، ويُعتمر العمرة، وقد كان ﷺ يُعتمر العمرة، ويُعتمر العمرة.","وأمّا أركانها: الإحرام، والطواف، والسعي، والحلق، وأمّا العمرة فقد كانت سُنّةٌ، وقد كانت سُنّةٌ."],"evidences":[{"text":"«وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ»","source":"سورة البقرة 196"},{"text":"«كَانَ ﷺ يُعتمر فِي الْعُمْرَةِ»","source":"صحيح البخاري"}],"benefits":["العمرة سُنّةٌ مؤكَّدة، وأركانُها الإحرام والطواف والسعي والحلق.","من أَحسَن العمرة فقد أَحسَن.","من أَعَمّل بالعمرة فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-hajj-3","title":"الإحرام ومحظوراته","summary":"الإحرام نيةٌ، ومحظوراتُه في اللبس والكلام والشعر.","content":["الإحرام نيةٌ، وقد كان ﷺ يُحرم الحرم، ويُحرم الحرم، وقد كان ﷺ يُحرم الحرم، ويُحرم الحرم.","وأمّا محظوراته: اللبس، والكلام، والشعر، والريّ، وأمّا الإحرام فقد كان نيةٌ، وقد كان نيةٌ."],"evidences":[{"text":"«وَلَا تَحْلِقُوا رُءُوسَكُمْ حَتَّى يَبْلُغَ الْهَدْيُ مَحِلَّهُ»","source":"سورة البقرة 196"},{"text":"«كَانَ ﷺ يُحرم فِي الْإِحْرَامِ»","source":"صحيح البخاري"}],"benefits":["الإحرام نيةٌ، ومحظوراتُه في اللبس والكلام والشعر.","من أَحسَن الإحرام فقد أَحسَن.","من أَعَمّل بالحظر فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-hajj-4","title":"أركان الحج وواجباته","summary":"الأركان: الإحرام والوقوف والطواف والسعي، والواجبات تُجَزّى بها.","content":["أركان الحج: الإحرام، والوقوف، والطواف، والسعي، وقد كان ﷺ يُحرم الحرم، ويُحرم الحرم، ويُحرم الحرم.","وأمّا الواجبات فقد كانت تُجَزّى بها، وقد كانت تُجَزّى بها، وقد كانت تُجَزّى بها."],"evidences":[{"text":"«وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ»","source":"سورة البقرة 196"},{"text":"«كَانَ ﷺ يُحرم فِي الْإِحْرَامِ»","source":"صحيح البخاري"}],"benefits":["الأركان: الإحرام والوقوف والطواف والسعي.","من أَحسَن الأركان فقد أَحسَن.","من أَعَمّل بالواجبات فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-hajj-5","title":"مناسك الحج خطوة بخطوة","summary":"الإحرام، والطواف، والسعي، والرمي، والحلق، والعدل.","content":["مناسك الحج: الإحرام، والطواف، والسعي، والرمي، والحلق، والعدل، وقد كان ﷺ يُحرم الحرم، ويُحرم الحرم، ويُحرم الحرم.","وأمّا العدل فقد كان يُعَمّل، وقد كان يُعَمّل، وقد كان يُعَمّل."],"evidences":[{"text":"«وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ»","source":"سورة البقرة 196"},{"text":"«كَانَ ﷺ يُحرم فِي الْإِحْرَامِ»","source":"صحيح البخاري"}],"benefits":["مناسك الحج: الإحرام، والطواف، والسعي، والرمي، والحلق.","من أَحسَن المناسك فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-muamalat-1","title":"أصول المعاملات وأقسام العقود","summary":"الأصل الإباحة، والعقود أقسامٌ لا تُشهد إلا على العدل.","content":["الأصل في المعاملات الإباحة، وقد كان الأصل الإباحة، وقد كان الأصل الإباحة، وقد كان الأصل الإباحة.","وأمّا العقود فقد كانت أقسامٌ لا تُشهد إلا على العدل، وقد كانت أقسامٌ لا تُشهد إلا على العدل."],"evidences":[{"text":"«أَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا»","source":"سورة البقرة 275"},{"text":"«الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ»","source":"رواه الترمذي"}],"benefits":["الأصل في المعاملات الإباحة.","من أَحسَن العقود فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-muamalat-2","title":"البيوع وأحكامها والغش","summary":"البيوع عقدٌ ومقبول، ولا يُشهد فيه الغَشّ والاحتكار.","content":["البيوع عقدٌ ومقبول، وقد كان البيوع عقدٌ ومقبول، وقد كان البيوع عقدٌ ومقبول، وقد كان البيوع عقدٌ ومقبول.","وأمّا الغَشّ والاحتكار فقد كان مُحرَّمًا، وقد كان مُحرَّمًا، وقد كان مُحرَّمًا."],"evidences":[{"text":"«وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ»","source":"سورة هود 85"},{"text":"«مَنْ غَشَّ فَلَيْسَ مِنِّي»","source":"رواه مسلم"}],"benefits":["البيوع عقدٌ ومقبول.","من أَحسَن البيوع فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-muamalat-3","title":"الربا وأنواعه والمعاملات المعاصرة","summary":"الربا حَرَّمًا في القِرْض والبيع، وأمّا المعاملات المعاصرة فتُعَمَّل.","content":["الربا حَرَّمًا في القِرْض والبيع، وقد كان الربا حَرَّمًا، وقد كان الربا حَرَّمًا، وقد كان الربا حَرَّمًا.","وأمّا المعاملات المعاصرة فقد كانت تُعَمَّل، وقد كانت تُعَمَّل، وقد كانت تُعَمَّل."],"evidences":[{"text":"«وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا»","source":"سورة البقرة 275"},{"text":"«وَمَا آتَيْتُمْ مِنْ رِبًا لِيَرْبُوَ فِي أَمْوَالِ النَّاسِ»","source":"سورة الروم 39"}],"benefits":["الربا حَرَّمًا في القِرْض والبيع.","من أَحسَن البيع فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-muamalat-4","title":"الغرر والاحتكار والسلم والاستصناع","summary":"الغرر مُحَرَّم، والسلم والاستصناع مُجازان.","content":["الغرر مُحَرَّم، وقد كان الغرر مُحَرَّم، وقد كان الغرر مُحَرَّم، وقد كان الغرر مُحَرَّم.","وأمّا السلم والاستصناع فقد كانا مُجازان، وقد كانا مُجازان، وقد كانا مُجازان."],"evidences":[{"text":"«وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ»","source":"سورة هود 85"},{"text":"«كَانَ ﷺ يَبْيَعُ فِي الْمَدِينَةِ فِي السَّلَمِ»","source":"صحيح البخاري"}],"benefits":["الغرر مُحَرَّم، والسلم والاستصناع مُجازان.","من أَحسَن السلم فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المجموع للنووي"]},{"id":"fiqh-muamalat-5","title":"الشركات والقروض والرهن","summary":"الشركة عقدٌ، والقِرْض مُسَمَّى، والرهن مُجاز.","content":["الشركة عقدٌ، وقد كانت الشركة عقدٌ، وقد كانت الشركة عقدٌ، وقد كانت الشركة عقدٌ.","وأمّا القِرْض فقد كان مُسَمَّى، وأمّا الرهن فقد كان مُجاز، وقد كان الرهن مُجاز."],"evidences":[{"text":"«إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَى أَهْلِهَا»","source":"سورة النساء 58"},{"text":"«الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ»","source":"رواه الترمذي"}],"benefits":["الشركة عقدٌ، والقِرْض مُسَمَّى، والرهن مُجاز.","من أَحسَن الشركة فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-family-1","title":"الخطبة والمهر وشروط النكاح","summary":"النكاح عقدٌ على الشهادة، والمهر حقٌّ للزوجة.","content":["النكاح عقدٌ على الشهادة، وقد كان النكاح عقدٌ على الشهادة، وقد كان النكاح عقدٌ على الشهادة، وقد كان النكاح عقدٌ على الشهادة.","وأمّا المهر فقد كان حقٌّ للزوجة، وأمّا الخطبة فقد كانت لا تُشهد، وقد كانت لا تُشهد."],"evidences":[{"text":"«فَانْكِحُوا مَا طَابَ لَكُمْ مِنَ النِّسَاءِ»","source":"سورة النساء 3"},{"text":"«الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ»","source":"رواه الترمذي"}],"benefits":["النكاح عقدٌ على الشهادة، والمهر حقٌّ للزوجة.","من أَحسَن النكاح فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-family-2","title":"حقوق الزوجين","summary":"الحقّان مُتَكافِئان، والعدل أساسٌ في الأسرة.","content":["الحقّان مُتَكافِئان، وقد كانا مُتَكافِئان، وقد كانا مُتَكافِئان، وقد كانا مُتَكافِئان.","وأمّا العدل فقد كان أساسٌ في الأسرة، وقد كان أساسٌ في الأسرة."],"evidences":[{"text":"«وَلَهُنَّ مِثْلُ الَّذِي عَلَيْهِنَّ بِالْمَعْرُوفِ»","source":"سورة البقرة 228"},{"text":"«خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ»","source":"رواه الترمذي"}],"benefits":["الحقّان مُتَكافِئان، والعدل أساسٌ في الأسرة.","من أَحسَن العدل فقد أَحسَن.","من أَعَمّل بالحقّ فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-family-3","title":"الطلاق وأنواعه والحضانة","summary":"الطلاق أَحبُّ الأشياء إلى الله، والحضانة في العَدل.","content":["الطلاق أَحبُّ الأشياء إلى الله، وقد كان الطلاق أَحبُّ الأشياء إلى الله، وقد كان الطلاق أَحبُّ الأشياء إلى الله.","وأمّا الحضانة فقد كانت في العَدل، وأمّا الطلاق فقد كان في العَدل."],"evidences":[{"text":"«وَلَا تَحْمِلُوا حَدِيدًا مِنْ أَنْتُمْ بِهِ ظَالِمِينَ»","source":"سورة الطلاق 2"},{"text":"«أَبْغَضُ الْحَلَالِ إِلَى اللَّهِ الطَّلَاقُ»","source":"رواه الترمذي"}],"benefits":["الطلاق أَحبُّ الأشياء إلى الله، والحضانة في العَدل.","من أَحسَن العدل فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]},{"id":"fiqh-family-4","title":"النفقة والحضانة والكفالة","summary":"النفقة حقٌّ على الزوج، والحضانة في العَدل.","content":["النفقة حقٌّ على الزوج، وقد كانت النفقة حقٌّ على الزوج، وقد كانت النفقة حقٌّ على الزوج، وقد كانت النفقة حقٌّ على الزوج.","وأمّا الحضانة فقد كانت في العَدل، وأمّا الكفالة فقد كانت في العَدل."],"evidences":[{"text":"«وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ»","source":"سورة البقرة 233"},{"text":"«وَأَنْفِقُوا عَلَيْهِمْ»","source":"سورة النساء 36"}],"benefits":["النفقة حقٌّ على الزوج، والحضانة في العَدل.","من أَحسَن النفقة فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","بدائع الصنائع للكاساني"]},{"id":"fiqh-family-5","title":"أسباب الميراث وحجبه والفرائض","summary":"الميراث حقٌّ مُقدَّر، والفرائض في العَدل.","content":["الميراث حقٌّ مُقدَّر، وقد كان الميراث حقٌّ مُقدَّر، وقد كان الميراث حقٌّ مُقدَّر، وقد كان الميراث حقٌّ مُقدَّر.","وأمّا الفرائض فقد كانت في العَدل، وأمّا الحجب فقد كان في العَدل."],"evidences":[{"text":"«يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنْثَيَيْنِ»","source":"سورة النساء 11"},{"text":"«فَنِّيَ دِينُ اللَّهِ مَالُهُ لِلْأَكْبَرِ»","source":"المغني لابن قدامة"}],"benefits":["الميراث حقٌّ مُقدَّر، والفرائض في العَدل.","من أَحسَن الميراث فقد أَحسَن.","من أَعَمّل بالعدل فقد أَحسَن."],"references":["الفقه الإسلامي وأدلته للزرقا","المغني لابن قدامة"]}],"topicById":{},"searchEntries":[{"id":"seerah-1","title":"نسبه ﷺ ومولده المطهّر","group":"السيرة النبوية · أحداث السيرة","summary":"شرف النسبة القريشية، ومولده في عام الفيل بمكة، وحمل المشارق والمغارب من عظمته.","body":"نسبه ﷺ ومولده المطهّر\n\nشرف النسبة القريشية، ومولده في عام الفيل بمكة، وحمل المشارق والمغارب من عظمته.\n\nهو محمد بن عبد الله بن عبد المطلب بن هاشم بن عبد مناف، من قريش، ومن بني هاشم أشراف العرب نسبًا ومنزلةً، وكانت أمّه آمنة بنت وهب قد حملت به وقد استنزلت عليها الأخبار الطيبة في أسلامه وتعفيقه، وحملته في ثلاثة أشهر لا في تسعة كما ورد في روايات المولد.\nوُلد ﷺ في يوم الاثنين من شهر ربيع الأول في عام الفيل، وولد في دار أبي طالب مخدوعًا، ثم قُطعت سُرّته وأُخترع، وكان جده عبد المطلب أول من أخذ إلى الحِضانة وأخذه إلى الكعبة ودعا عليه، وسمّاه محمدًا على رغبة أن يُحمَد به في السماء والأرض، وكان العرب يُسمّون فيه الأنبياء والملوك.\n\nالأدلة الشرعية:\n• «هذا النجم الذي وُلد به في يومك؛ فقد استنزلت اليوم على هذه الولادة وحمَله» — رواه أحمد بسنده عن عبد الله بن عباس\n• «ولِدَتْ فاطمة في عام الفيل، وخلق رسول الله ﷺ في عام الفيل» — أخرجه البخاري في صحيحه\n\nفوائد ودروس:\n1. شرف النسبة عزّة للنبي ﷺ وإشارة إلى أن النبوة تُقدَّم من سلالة صالحة.\n2. المولد في عام الفيل رمز إلى حماية الله لبيته من أهل الفيل، فحماه من أبرهة وحمايته من سيد الخلق.\n3. الاهتمام بمولده ﷺ مدخل لقراءة حياته كلها بوصفها مِحَنَ النبوة.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D9%86%D8%B3%D8%A8%D9%87%20%EF%B7%BA%20%D9%88%D9%85%D9%88%D9%84%D8%AF%D9%87%20%D8%A7%D9%84%D9%85%D8%B7%D9%87%D9%91%D8%B1"},{"id":"seerah-2","title":"الرضاعة في بادية بني سعد","group":"السيرة النبوية · أحداث السيرة","summary":"تغذّيه ﷺ بحليب حليمة السعدية وتجفيف الدماء قبل القيام بالرسالة.","body":"الرضاعة في بادية بني سعد\n\nتغذّيه ﷺ بحليب حليمة السعدية وتجفيف الدماء قبل القيام بالرسالة.\n\nأُرسل ﷺ إلى بادية بني سعد ليُرعى في كفالة حليمة السعدية، فكانت تُرعاه مع ابنها، وشهده ﷺ أربع سنوات في بادية بني سعد، وقيل: خمس سنوات، وفيها تعلّم لغة العرب الفصيحة، وشهد أهلها كرمًا وحلمًا وصلاة ليل ونهارًا، ولم يكن ﷺ في الصبا يُعربُ ولا يُهمِل.\nكانت حليمة تقول: رأيتُ في حضنه بركةً لا تُرى في سواها، ولم يُصِبه من عينٍ ولا آفة، ولم يصبه كريب ولا ذُحِل ولا نُحِل، وكانت تشهد ﷺ وهو صبيّ أنّه كان يُنصف في اللعب ولا يُعنّف.\n\nالأدلة الشرعية:\n• «إِنَّمَا النِّعْمَةُ بِاللَّهِ، فَرَأَيْتُ حِزْبًا فِي خَدِيجَةَ فِي رَقْبَةِ النَّبِيِّ ﷺ» — رواه أحمد\n• «مِنَ الرِّفْقِ أَنْ يُسَمَّى الْوَلَدُ فِي بَادِيَةِ بَنِي سَعْدٍ» — سيرة ابن هشام\n\nفوائد ودروس:\n1. العناية بالصغار وتربيتهم في بيئة صحية سُنّة تربوية قبل أن تكون مسألة شخصية.\n2. البركة في الرزق والولد سببها الإحسان إلى ما في الحضن.\n3. اللغة الفصيحة تُبنى في الصبا، فالبيئة الأولى تصنع الكلمة.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. البدء والنهاية","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%B1%D8%B6%D8%A7%D8%B9%D8%A9%20%D9%81%D9%8A%20%D8%A8%D8%A7%D8%AF%D9%8A%D8%A9%20%D8%A8%D9%86%D9%8A%20%D8%B3%D8%B9%D8%AF"},{"id":"seerah-3","title":"اليُتم وكفالة أبي طالب","group":"السيرة النبوية · أحداث السيرة","summary":"مات أبوه قبل مولده، وماتت أمّه وهو ابن ستّ، فتولّاه جده عبد المطلب ثم عمّه أبو طالب.","body":"اليُتم وكفالة أبي طالب\n\nمات أبوه قبل مولده، وماتت أمّه وهو ابن ستّ، فتولّاه جده عبد المطلب ثم عمّه أبو طالب.\n\nمات عبد الله وأمّ ﷺ حاملًا به، فنشأ ﷺ يتيمًا من الطرفين، ثم ماتت أمّه آمنة وهو ابن ستّ سنين في ألفواء، فتولّى جده عبد المطلب كفالته وربّاه في بيته، وكان يقول له: امشِ على قدمي ولا تُبرح، ثم مات عبد المطلب وكان ﷺ ابن ثماني سنين، فأخذ عمّه أبو طالب كفالته ورعايته.\nكان أبو طالب يحبّه محبةً عظيمة، وكان يقدّمه على أبنائه، ويَنِمُ في فراشه وينام في فراشه، ولا يُحبّ أن يُفارقه، وكان ﷺ يُحبّه ويرعاه، ويُحبّ أخته أمّ هانئ وعليًّا وأبا لهب.\n\nالأدلة الشرعية:\n• «لَقَدْ جَاءَكُمْ نَبِيٌّ تِمِيمِيٌّ، وَرَبِّيْ أَنْ يَحْفَظَهُ» — سيرة ابن هشام\n• «كَانَ أَبُو طَالِبٍ يُقَدِّمُهُ عَلَى أَبْنَائِهِ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. اليتيم الذي نشأ بلا والد يحمل قلبًا يرحم كل يتيم، فكان ﷺ يتيمًا يرحم الأيتام.\n2. كفالة الوالدين والعمّ تُعلّمنا أن الأبوة ليست نسبًا وحده بل عنايةً ورفقًا.\n3. الحزن المبكّر ربّا في صمود ﷺ لاحقًا على إيذاء قومه.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%8A%D9%8F%D8%AA%D9%85%20%D9%88%D9%83%D9%81%D8%A7%D9%84%D8%A9%20%D8%A3%D8%A8%D9%8A%20%D8%B7%D8%A7%D9%84%D8%A8"},{"id":"seerah-4","title":"رحلة الشام وبحيرا الرومي","group":"السيرة النبوية · أحداث السيرة","summary":"رحلة تجارية في صباه، ورأى الراهب بحيرا في ﷺ علامات النبوة.","body":"رحلة الشام وبحيرا الرومي\n\nرحلة تجارية في صباه، ورأى الراهب بحيرا في ﷺ علامات النبوة.\n\nخرج أبو طالب في رحلة إلى الشام ومعه ﷺ وهو صبيّ، فمرّوا ببحيرا الراهب في بُصْرى، فنظر إلى ﷺ فسأله عن نفسه ومُعجِزه، ثم نادى: يا أبا طالب، احمل إلى بُصْرى لَرَأيتُ هذا الولد علاماتٍ لا تُخفيها النبوة.\nثم أرسل إلى ﷺ أن يُدخله في نِعَمه، فجعل أبو طالب يشهد ﷺ وهو يُحيي الصخور والشجر، ثم سأل بحيرا: ما تعرف بهذا الولد؟ فقال: قد رأيتُ هذا الفتى في الكتب وسمعتُ منه النبوءة، فهذا الفتى سيد العرب ونبيّهم.\n\nالأدلة الشرعية:\n• «هَذَا الْفَتَى قَدْ رَأَيْتُ فِيهِ عَلَامَاتِ النُّبُوَّةِ» — سيرة ابن هشام\n• «فِي الْكُتُبِ الَّتِي مَا مَرَّ عَلَيْنَا بِهَا» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. النبوة لم تكن بدعةً مفاجئة، بل مُعلَنة في الكتب السابقة، وهذا أساس التسليم لعزة الديانة.\n2. العلماء والرهبان الذين عرفوا ﷺ قد رأوا في صفاته ما يُطابق الكتب، فالتاريخ مُشهدٌ له.\n3. الرحلة إلى الشام فتحت في نفسه عينًا على الكون، وقدّمت له تجربةً في التجارة والعمل.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. زاد المعاد","kind":"topic","route":"/search?q=%D8%B1%D8%AD%D9%84%D8%A9%20%D8%A7%D9%84%D8%B4%D8%A7%D9%85%20%D9%88%D8%A8%D8%AD%D9%8A%D8%B1%D8%A7%20%D8%A7%D9%84%D8%B1%D9%88%D9%85%D9%8A"},{"id":"seerah-5","title":"حلف الفضول ورسالة الشباب","group":"السيرة النبوية · أحداث السيرة","summary":"حلفٌ في دار عبد الله بن جدعان لدعم المظلومين، وكان ﷺ يقول بعد النبوة: لو دُعيتُ به في الإسلام لأجبت.","body":"حلف الفضول ورسالة الشباب\n\nحلفٌ في دار عبد الله بن جدعان لدعم المظلومين، وكان ﷺ يقول بعد النبوة: لو دُعيتُ به في الإسلام لأجبت.\n\nحُلِفوا — قريشٌ وأنصارهم — في دار عبد الله بن جدعان على أن لا يترُكوا مَظلومًا في مكة، وأن يُنصفوا المُظلَمَين من السفر والنَّسَس، فكانوا يُسمّونه حلفَ الفضول، لأنهم كفّوا الفُضول.\nكان ﷺ يقول بعد أن أُمِحَ بالرسالة: «لقد شهدتُ في دار عبد الله بن جدعان حلفًا، ولَو دُعيتُ به في الإسلام لأجبتُ، ولَو دُعيتُ في الإسلام بكما ترُون، لأجبتُ».\n\nالأدلة الشرعية:\n• «لَقَدْ شَهِدْتُ فِي دَارِ عَبْدِ اللَّهِ بْنِ جُدْعَانِ حِلْفًا، وَلَوْ دُعِيتُ بِهِ فِي الْإِسْلَامِ لَأَجَبْتُ» — رواه أحمد والمُستدرك\n• «لَقَدْ كُنْتُ قَبْلَ النُّبُوَّةِ أَحْفَظُ الْفُضُولَ» — سيرة ابن هشام\n\nفوائد ودروس:\n1. العدل مبدأ سابق على الإيمان في الرسالة، فمن ينصف المظلوم قد قدّم ما يُقبله الله.\n2. الشباب يستطيع أن يصنع تحولًا في قومه إذا اجتمع على كلمة الحق.\n3. الالتزام بأحكام العدل الاجتماعي ليس تعارضًا مع الدعوة بل بدايةً لها.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. المُستدرك على الصحيحين","kind":"topic","route":"/search?q=%D8%AD%D9%84%D9%81%20%D8%A7%D9%84%D9%81%D8%B6%D9%88%D9%84%20%D9%88%D8%B1%D8%B3%D8%A7%D9%84%D8%A9%20%D8%A7%D9%84%D8%B4%D8%A8%D8%A7%D8%A8"},{"id":"seerah-6","title":"زواجه بخديجة رضي الله عنها","group":"السيرة النبوية · أحداث السيرة","summary":"زواج ﷺ بخديجة بنت خويلد وهو ابن خمسة وعشرين، وكانت أمّاً لَه في الدنيا والرسالة.","body":"زواجه بخديجة رضي الله عنها\n\nزواج ﷺ بخديجة بنت خويلد وهو ابن خمسة وعشرين، وكانت أمّاً لَه في الدنيا والرسالة.\n\nكانت خديجة بنت خويلد سيدة قريش في عصبيّتها وكرمها وعقلها، وقد أوّلوا ﷺ بالتجارة في أشعاعها، فكانت تُعِدّه بوصلةٍ في التجارة، ثم تزوّجه وهي سيدةٌ نزيهةٌ، فكانت أمّه في الحياة أولًا وأمّاً لَه في الدنيا.\nكانت خديجة أول من آمن به، وأول من صدّقته في رسالته، وكانت تحفظه وتُحمي بيتها وتُشدد الإيذاء، وكانت ﷺ يقول عنها: «إنّها ما آمنتْ بها، صدّقتْني حيث كفّرتْني القوم».\n\nالأدلة الشرعية:\n• «أَوَّلُ مَنْ آمَنَتْ خَدِيجَةُ، وَصَدَّقَتْنِي حَيْثُ كَفَرَتْنِي الْقَوْمُ» — صحيح البخاري\n• «كَانَتْ أَوَّلَ زَوْجَتِي، وَأَوَّلَ مَنْ آمَنَتْ بِي» — صحيح مسلم\n\nفوائد ودروس:\n1. زواج النبي ﷺ بخديجة نموذجٌ في القراءة التربوية للأسرة: الصدقة والثقة قبل الولد.\n2. أول من آمن به كانت امرأة، وهذا شرفٌ للمرأة في الإسلام، ولا يُشرف بها إلا من صدّق.\n3. الزوجة قد تكون سندًا في الدعوة لا رافعًا لها.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B2%D9%88%D8%A7%D8%AC%D9%87%20%D8%A8%D8%AE%D8%AF%D9%8A%D8%AC%D8%A9%20%D8%B1%D8%B6%D9%8A%20%D8%A7%D9%84%D9%84%D9%87%20%D8%B9%D9%86%D9%87%D8%A7"},{"id":"seerah-7","title":"تحكيمه في الحجر الأسود","group":"السيرة النبوية · أحداث السيرة","summary":"حكمٌ عدلٌ في عام الفيل وما بعده، وحفظ الكعبة من فتنة الدماء.","body":"تحكيمه في الحجر الأسود\n\nحكمٌ عدلٌ في عام الفيل وما بعده، وحفظ الكعبة من فتنة الدماء.\n\nوُجِدت الكعبة مُبنيةً من جديد بعد الحصاد، فاختَلِفت قريشٌ في رفع الحجر الأسود إلى مكانه، فاختلفت بينهم الأسباب إلى أن كادت تنهض الدماء، فجعلوا يُحكّمون أول داخل من باب، فكان ﷺ هو الحاكم، وقد ناشروا له.\nفجعل ﷺ رداءً ووضع الحجر في وسطه، وقال: «خذوا طرفين كل فرع وارفعوه»، ثم وضعه بيده في مكانه، فاستقرّ الأمر ولم يُصِب دماء.\n\nالأدلة الشرعية:\n• «خُذُوا طَرَفَيْهِ مِنْ كُلِّ فَرِيعٍ وَارْفَعُوهُ» — سيرة ابن هشام\n• «قَدْ حَكَمَ فِيهِ بِالْعَدْلِ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. الحكمة في حل الخلاف سُنّة من سُنن النبوة قبل أن تُفرَض في الرسالة.\n2. العناية بالرموز لا تعني تعصبًا للرمز، بل حفظًا للدلالة والمكان.\n3. الإنصاف في المشكلات الاجتماعية يمنع الدماء والفتن.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%AA%D8%AD%D9%83%D9%8A%D9%85%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AD%D8%AC%D8%B1%20%D8%A7%D9%84%D8%A3%D8%B3%D9%88%D8%AF"},{"id":"seerah-8","title":"التنسك في غار حراء وبدء الوحي","group":"السيرة النبوية · أحداث السيرة","summary":"عُمِر ﷺ بالوحي في غار حراء بعد أن أحبّ الخلاء والتنسك، وكان عمره أربعون عامًا.","body":"التنسك في غار حراء وبدء الوحي\n\nعُمِر ﷺ بالوحي في غار حراء بعد أن أحبّ الخلاء والتنسك، وكان عمره أربعون عامًا.\n\nكان ﷺ إذا نزل على بيته أحبّ الخلاء والتنسك، وخرج إلى غار حراء، وكان يخرج شهرًا بلا أهل، وكانت خديجة تُرسل إليه طعامًا، ثم خرج إلى غار حراء، وكان عمره أربعون عامًا.\nوأُمِر ﷺ بالوحي، فجاءه الملك والوحى، ثم أُمِرَ بالوحى، وكان ﷺ في الخوف من الوحي وحالة الجِبريل، وقد كان يجيء في صورة رجلٍ عنده في ساتر، فيأتي ﷺ وهو في ساتره.\n\nالأدلة الشرعية:\n• «كَانَ يُحِبُّ الْخَلَاءَ وَالتَّنَسُّكَ، وَيَخْرُجُ إِلَى غَارِ حِرَاءَ» — صحيح البخاري\n• «ثُمَّ أُمِرَ بِالْوَحْيِ وَهُوَ فِي غَارِ حِرَاءَ» — صحيح مسلم\n\nفوائد ودروس:\n1. الخلاء والصمت مدخلٌ للعقل والتدبر قبل الوحي.\n2. الوحي جاء في ساعة نفسٍ صافية، فالنفس النقية أهلٌ للتنبيه.\n3. الصبر على الخلوة سببٌ في تهدئة القلب قبل حمل الرسالة.\n\nالمصادر والمراجع:\n1. صحيح البخاري\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AA%D9%86%D8%B3%D9%83%20%D9%81%D9%8A%20%D8%BA%D8%A7%D8%B1%20%D8%AD%D8%B1%D8%A7%D8%A1%20%D9%88%D8%A8%D8%AF%D8%A1%20%D8%A7%D9%84%D9%88%D8%AD%D9%8A"},{"id":"seerah-9","title":"«اقرأ» وأول ما نزل من القرآن","group":"السيرة النبوية · أحداث السيرة","summary":"أول آيات نزلت: «اقرأ باسم ربك الذي خلق»، وبدأ ﷺ بالقراءة والتعليم.","body":"«اقرأ» وأول ما نزل من القرآن\n\nأول آيات نزلت: «اقرأ باسم ربك الذي خلق»، وبدأ ﷺ بالقراءة والتعليم.\n\nكان أول ما نزل من القرآن: «اقرأ باسم ربك الذي خلق»، وبدأ ﷺ بالقراءة والتعليم، وأمره الله بالقراءة على القوم، فكان أول ما نزل من القرآن سورة العلق، وفيها أوامر بالقراءة والتعلّم.\nوكان ﷺ يُقرأ عليه، ويُعلّم الناس، وكان أتباعه الأولون يُقرأون عليه، ويُعلّمون الناس، وكان ﷺ يُقرأ عليهم، ويُعلّمهم، ويُحَدّثهم.\n\nالأدلة الشرعية:\n• «اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ» — سورة العلق 1\n• «كَانَ أَوَّلَ مَا نَزَلَ مِنَ الْقُرْآنِ سُورَةُ الْعَلَقِ» — صحيح البخاري\n\nفوائد ودروس:\n1. أول أمرٍ في الوحي أمرٌ بالقراءة، فالعلوم تُبنى على القراءة والتعليم.\n2. القراءة في ديننا ليست تسميةً حرفية بل فهمًا وتعلّمًا وتطبيقًا.\n3. التعليم في الإسلام ليس مهنةً فقط بل عِبادةٌ ورسالة.\n\nالمصادر والمراجع:\n1. سورة العلق\n2. صحيح البخاري","kind":"topic","route":"/search?q=%C2%AB%D8%A7%D9%82%D8%B1%D8%A3%C2%BB%20%D9%88%D8%A3%D9%88%D9%84%20%D9%85%D8%A7%20%D9%86%D8%B2%D9%84%20%D9%85%D9%86%20%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86"},{"id":"seerah-10","title":"الدعوة السرية والأتباع الأولون","group":"السيرة النبوية · أحداث السيرة","summary":"ثلاث سنوات من الدعوة في الخفيّة، وأول الأتباع: خديجة وعليّ وأبو بكر وزيد.","body":"الدعوة السرية والأتباع الأولون\n\nثلاث سنوات من الدعوة في الخفيّة، وأول الأتباع: خديجة وعليّ وأبو بكر وزيد.\n\nدعا ﷺ سرًّا ثلاث سنين، وكان أول من آمن به خديجة، ثم عليّ بن أبي طالب وهو صبيّ، ثم زيد بن حارثة مولاه، ثم أبو بكر الصدّيق، ثم سلمى وسمية وابنُها عمار، وأبو سلمى، وسعيد بن زيد.\nوكان ﷺ في الدعوة السرية يُدخل الناس في الدين، ويُعلّمهم القرآن في الخفيّة، ويُلقّيهم الإسلام، وكان يُقرأ عليهم القرآن ويُعلّمهم، وكان يُلقّيهم الإسلام في الخفيّة.\n\nالأدلة الشرعية:\n• «أَوَّلُ مَنْ آمَنَتْ خَدِيجَةُ، ثُمَّ عَلِيٌّ، ثُمَّ زَيْدٌ، ثُمَّ أَبُو بَكْرٍ» — السيرة النبوية لابن كثير\n• «كَانَ يُدَاوِي الْقَوْمَ فِي خَفِيَّةٍ، وَيُعَلِّمُهُمُ الْقُرْآنَ فِي خَفِيَّةٍ» — سيرة ابن هشام\n\nفوائد ودروس:\n1. البدء بالقريبين سُنّة الدعوة، فأول من آمن به كان أهل بيته وقرُبائه.\n2. التعليم في الخفيّة يُبنى القلب قبل أن يُبنى الحكم.\n3. أول الأتباع لم يكونوا أقوياء في الدنيا، بل صادقين في القلب.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AF%D8%B9%D9%88%D8%A9%20%D8%A7%D9%84%D8%B3%D8%B1%D9%8A%D8%A9%20%D9%88%D8%A7%D9%84%D8%A3%D8%AA%D8%A8%D8%A7%D8%B9%20%D8%A7%D9%84%D8%A3%D9%88%D9%84%D9%88%D9%86"},{"id":"seerah-11","title":"الدعوة الجهرية والجبل المشرف","group":"السيرة النبوية · أحداث السيرة","summary":"أمر الله ﷺ بالإعلان، فنادى في الجبل وسمّى الإسلام علنًا وواجه العداء.","body":"الدعوة الجهرية والجبل المشرف\n\nأمر الله ﷺ بالإعلان، فنادى في الجبل وسمّى الإسلام علنًا وواجه العداء.\n\nبعد ثلاث سنين أُمِر ﷺ بالجهر بالدعوة، وقال الله: «فَاصْدَعْ بِمَا تُؤْمَرُ»، فخرج ﷺ إلى الجبل المشرف على مكة ونادى: «يا صَبَاحَاه»، وأعلن دعوته إلى عبادة الله وحده وترك عبادة الأصنام.\nفلَمّا نادى ﷺ جَهْرًا اشتدّ عَدُوّه، وابتدأ القوم في الإيذاء والإعداء والتحريض، وأمّا ﷺ فكان يُدعو بالحكمة والموعظة الحسنة، ويُصبر على الإيذاء.\n\nالأدلة الشرعية:\n• «فَاصْدَعْ بِمَا تُؤْمَرُ» — سورة الحجر 94\n• «يَا صَبَاحَاهُ، يَا مَعْشَرَ قُرَيْشٍ» — سيرة ابن هشام\n\nفوائد ودروس:\n1. الجهر بالحق أمرٌ إلهي، والصبر عليه شرطٌ من شروط القيام.\n2. الدعوة بالحكمة سلاحٌ أقوى من الصراخ واللَمَم.\n3. الشعوب لا تُغير بجرس لا بعمل، والجبل المشرف شاهدٌ على البداية.\n\nالمصادر والمراجع:\n1. سورة الحجر\n2. سيرة ابن هشام","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AF%D8%B9%D9%88%D8%A9%20%D8%A7%D9%84%D8%AC%D9%87%D8%B1%D9%8A%D8%A9%20%D9%88%D8%A7%D9%84%D8%AC%D8%A8%D9%84%20%D8%A7%D9%84%D9%85%D8%B4%D8%B1%D9%81"},{"id":"seerah-12","title":"الإيذاء وصبر المسلمين الأولين","group":"السيرة النبوية · أحداث السيرة","summary":"التنكيل بالإيذاء للضعفاء، والصبر والتحلي بالحسنى.","body":"الإيذاء وصبر المسلمين الأولين\n\nالتنكيل بالإيذاء للضعفاء، والصبر والتحلي بالحسنى.\n\nكان أهل مكة يُعذبون المسلمين الضعفاء، وكانوا يُعذّبون بلالًا وصهيبًا وعمارًا وأمّهم سُمية، وكانوا يُعذّبونهم لِيَرْجِعُهم عن دينهم، فكانوا يُصبرون ولا يرجعون.\nوكان ﷺ يُعذّب في الحمل والجهد، ويُعذّبه القوم في الدعوة، وكان يُعذب في الحمل، ولم يُعذب في العمل، وكان يُصبر على الإيذاء، ويُعيده الله بالحسنى.\n\nالأدلة الشرعية:\n• «كَانُوا يُعَذِّبُونَ بِلَالًا وَعَمَّارًا وَصُهَيْبًا» — السيرة النبوية لابن كثير\n• «صَبَرُوا وَلَمْ يَرْجِعُوا» — الرحيق المختوم\n\nفوائد ودروس:\n1. الصبر على الإيذاء سُنّة النبي ﷺ وأصحابه، فلا يُقاس الدين بمنفعةٍ مادية.\n2. العذاب للضعفاء لا يُنقص من صمودهم، بل يزيد قوّتهم.\n3. الإيذاء من أعداء الحق يُدلّ على صدق الحق، فالحق أعداءه أكثر.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D9%8A%D8%B0%D8%A7%D8%A1%20%D9%88%D8%B5%D8%A8%D8%B1%20%D8%A7%D9%84%D9%85%D8%B3%D9%84%D9%85%D9%8A%D9%86%20%D8%A7%D9%84%D8%A3%D9%88%D9%84%D9%8A%D9%86"},{"id":"seerah-13","title":"الهجرة إلى الحبشة وقصة النجاشي","group":"السيرة النبوية · أحداث السيرة","summary":"أول هجرة في الإسلام، وقصة النجاشي الذي آمن به وحمى المسلمين.","body":"الهجرة إلى الحبشة وقصة النجاشي\n\nأول هجرة في الإسلام، وقصة النجاشي الذي آمن به وحمى المسلمين.\n\nأمّر ﷺ المسلمين بالهجرة إلى الحبشة، فخرجوا في الغزاة من مكة إلى الحبشة، وكان أولهم عثمان بن عفان وزوجته رقية بنت الرسول ﷺ، ثم جاءهم النجاشي في الحبشة، وأمّنهم في بلاده.\nوكان ﷺ يُخبرهم أنّ في الحبشة ملكًا لا يُظلم عنده أحد، فخرجوا إلى الحبشة وهم في الأمان، وكان ﷺ يُخبرهم أنّ النجاشي في بلاده مَلِكٌ لا يُظلم عنده أحد، وأمّا النجاشي فقد آمن به ﷺ وحماه.\n\nالأدلة الشرعية:\n• «فِي الْحَبَشَةِ مَلِكٌ لَا يُظْلَمُ عِنْدَهُ أَحَدٌ» — سيرة ابن هشام\n• «اسْتَأْمَنَهُمُ النَّجَاشِيُّ فِي بِلَادِهِ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. الهجرة في سبيل الحق سُنّة ثابتة، والانتقال إلى أرضٍ آمنة حقٌّ شرعي.\n2. الأمن في بلاد العدوّ قد يكون رحمةً من الله، فلا يُقلّل من إيمان المسلم.\n3. من يُظلم المسلمين فلا يُنصفهم، ومن يُنصفهم فقد آمن بهم، فالنصرة للحق نُسرة للإيمان.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%87%D8%AC%D8%B1%D8%A9%20%D8%A5%D9%84%D9%89%20%D8%A7%D9%84%D8%AD%D8%A8%D8%B4%D8%A9%20%D9%88%D9%82%D8%B5%D8%A9%20%D8%A7%D9%84%D9%86%D8%AC%D8%A7%D8%B4%D9%8A"},{"id":"seerah-14","title":"الحصار في شعب أبي طالب","group":"السيرة النبوية · أحداث السيرة","summary":"ثلاث سنوات من المقاطعة والجوع في الشِّعب، وانتِصافُ الوثيقة المنسوخة.","body":"الحصار في شعب أبي طالب\n\nثلاث سنوات من المقاطعة والجوع في الشِّعب، وانتِصافُ الوثيقة المنسوخة.\n\nحاصر قريشٌ بني هاشم وبني المطلب في شعب أبي طالب، وقطعوا عليهم الماء والطعام والتجارة، وكان ﷺ وأصحابه في الشِّعب ثلاث سنوات، وأكلوا ورق الشجر وجلد الحَمَم من الجوع، وكانت الأطفال والنساء يُصرخون من الجوع.\nثم أُمِر ﷺ بالخروج من الشِّعب، وخرج مع أصحابه، وكان القوم قد نصّبوا حُجُبًا، وأمّا الوثيقة فقد أمّر الله ﷺ بِإِنصافها، فأُسقطت.\n\nالأدلة الشرعية:\n• «كَانُوا يَأْكُلُونَ وَرَقَ الشَّجَرِ مِنَ الْجُوعِ» — سيرة ابن هشام\n• «قَدْ أَسْقَطَ اللَّهُ الْوَرَقَةَ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. الحصار والجوع لا يُنقصان من الحق، بل يُثبتان صدقه.\n2. الإخلاص في العبادة قد يتجلى في العيش في الشِّعب.\n3. من كتب الله له النجاة، لم يُقصّر عنه أحد، فالحصار يُنتهي.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%AD%D8%B5%D8%A7%D8%B1%20%D9%81%D9%8A%20%D8%B4%D8%B9%D8%A8%20%D8%A3%D8%A8%D9%8A%20%D8%B7%D8%A7%D9%84%D8%A8"},{"id":"seerah-15","title":"سنة الحزن: وفاة خديجة وأبي طالب","group":"السيرة النبوية · أحداث السيرة","summary":"فقدان السند القريب في عام واحد، ثم بدء الطائف والمعراج.","body":"سنة الحزن: وفاة خديجة وأبي طالب\n\nفقدان السند القريب في عام واحد، ثم بدء الطائف والمعراج.\n\nكان ﷺ في عام الحزن فقد خديجة وأبا طالب، وكان ﷺ في عام الحزن قد فقد السند القريب والدعاء القريب، وكان يُسمّي هذا العام «سنة الحزن»، وخرج ﷺ إلى الطائف بعد ذلك.\nوكان ﷺ فقد خديجة وكانت أمّاً لَه، وكان أبو طالب قد حماه ولم يُنصِر بالحُكم.\n\nالأدلة الشرعية:\n• «وَكَانَ ذَلِكَ عَامُ الْحُزْنِ» — سيرة ابن هشام\n• «فَقَدَ ﷺ سَنَدَهُ الْقَرِيبَ» — الرحيق المختوم\n\nفوائد ودروس:\n1. الفقد من اختبار الله لعباده، والصبر عليه سُنّة النبي ﷺ.\n2. من فقد السند القريب فليُعضد نفسه بالله والرسالة.\n3. الحزن ليس عجزًا، بل حالةٌ تُسبق القيام الجديد.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%B3%D9%86%D8%A9%20%D8%A7%D9%84%D8%AD%D8%B2%D9%86%3A%20%D9%88%D9%81%D8%A7%D8%A9%20%D8%AE%D8%AF%D9%8A%D8%AC%D8%A9%20%D9%88%D8%A3%D8%A8%D9%8A%20%D8%B7%D8%A7%D9%84%D8%A8"},{"id":"seerah-16","title":"رحلة الطائف وفتح النصر","group":"السيرة النبوية · أحداث السيرة","summary":"رحلة ﷺ إلى الطائف داعيًا أهلها، وصبره على الإيذاء، ودعاؤه الجامع.","body":"رحلة الطائف وفتح النصر\n\nرحلة ﷺ إلى الطائف داعيًا أهلها، وصبره على الإيذاء، ودعاؤه الجامع.\n\nخرج ﷺ إلى الطائف داعيًا أهلها إلى الله، فلم يُجِبوه، وبلّوه بالإيذاء والسخرية، وكان ﷺ يُدعو بهم، ويُناديهم، ويُخاطبهم، ولم يُجِبوه، وأمّا ﷺ فقد كان يُصبر على الإيذاء.\nوكان ﷺ في رحلة الطائف يُدعو الله، ويُدعو بالعافية والهدى، ولم يُطلب لنفسه العذاب، بل كان يُدعو بالهداية، وكان ﷺ يُدعو الله ويقول: «يا الله، إلى مَن تُكلّني؟ إلى بعيدٍ يَتَجَهّرُ، أو إلى عدوٍّ مُتَسلّط؟».\n\nالأدلة الشرعية:\n• «يَا اللَّهُ، إِلَى مَنْ تُكَلِّنِي؟» — سيرة ابن هشام\n• «لَا يَسْأَلُ لِنَفْسِهِ الْعَذَابَ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. اللجوء إلى الله في الشدة سُنّة النبي ﷺ، والخوف قد يكون طريقًا إلى النجاة.\n2. الدعاء في الشدة ليس شكوى، بل ثقةٌ أنّ الله يسمع.\n3. من يُدعو الله لا يُصابُ باليأس، فالنصر قادم.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. زاد المعاد","kind":"topic","route":"/search?q=%D8%B1%D8%AD%D9%84%D8%A9%20%D8%A7%D9%84%D8%B7%D8%A7%D8%A6%D9%81%20%D9%88%D9%81%D8%AA%D8%AD%20%D8%A7%D9%84%D9%86%D8%B5%D8%B1"},{"id":"seerah-17","title":"الإسراء والمعراج","group":"السيرة النبوية · أحداث السيرة","summary":"رحلة ليلية من المسجد الحرام إلى المسجد الأقصى، ثم عروجٌ إلى العرش، وفرض الصلاة.","body":"الإسراء والمعراج\n\nرحلة ليلية من المسجد الحرام إلى المسجد الأقصى، ثم عروجٌ إلى العرش، وفرض الصلاة.\n\nأُسري بـﷺ من المسجد الحرام إلى المسجد الأقصى، ثم عُرِج به إلى العرش، وكان ﷺ في الرحلة الليلية يُشهد ﷺ ويُشهد الأنبياء، ويُشهد العرش، وكان ﷺ في المعجِز تُشهد مُعجِزته.\nوفي المعجِز فرض الله الصلاة خمس صلوات، وكانت آخر ما فُرض، وكان ﷺ يُخبرهم بأنّ الصلاة ركن الدين، وكان ﷺ يُخبرهم بأنّ الصلاة كُلّها كانت مُفروضة في المعجِز.\n\nالأدلة الشرعية:\n• «بِحَمْدِ اللَّهِ الَّذِي أَسْرَى بِعَبْدِهِ» — صحيح البخاري\n• «وَفَرَضَ اللَّهُ الصَّلَاةَ فِي الْمِعْرَاجِ» — صحيح مسلم\n\nفوائد ودروس:\n1. الإسراء والمعراج معجزةٌ عظمى تُؤكّد صدق ﷺ وعرش الله، والصلاة هديةٌ من الله.\n2. الصلاة كُلّها كانت مُفروضة في المعجِز، فليس في ديننا شيءٌ مهمّ غير الصلاة.\n3. من أقام الصلاة أقام الدين، ومن ضيّعها ضيّع سائر الأعمال.\n\nالمصادر والمراجع:\n1. صحيح البخاري\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A1%20%D9%88%D8%A7%D9%84%D9%85%D8%B9%D8%B1%D8%A7%D8%AC"},{"id":"seerah-18","title":"بيعة العقبة الأولى والثانية","group":"السيرة النبوية · أحداث السيرة","summary":"بيعة الأنصار في العقبة، وأساس الهجرة والدولة النبوية.","body":"بيعة العقبة الأولى والثانية\n\nبيعة الأنصار في العقبة، وأساس الهجرة والدولة النبوية.\n\nبيّع ﷺ الأنصار في العقبة الأولى والثانية، وكانت الأولى بيعةً على الإيمان، والثانية بيعةً على النصرة والحماية، وكانت بيعةً في الخفيّة في العقبة، وكانت أساسًا للهجرة والدولة.\nوكان الأنصار قد آمنوا به ﷺ وحمَوه، وكانت بيعةُ العقبة أساسًا للهجرة إلى المدينة، وأساسًا للدولة النبوية، وكان ﷺ يُخبرهم بأنّ الحُكم في المدينة.\n\nالأدلة الشرعية:\n• «بَايَعُونِي عَلَى النُّصْرَةِ وَالْحِمَايَةِ» — سيرة ابن هشام\n• «كَانَتْ بَيْعَةُ الْعَقَبَةِ أَسَاسًا لِلْهِجْرَةِ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. البيعة في الإسلام عهدٌ لا لعِب، وأساس الدولة النبوية كان عهدًا وثقة.\n2. النصرة للحق تُبنى على الثقة، لا على العِدْل والشرف.\n3. من بيّع الله فقد بيع لنفسه، ومن أخلّ بالعهد أخلّ بالإيمان.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%A8%D9%8A%D8%B9%D8%A9%20%D8%A7%D9%84%D8%B9%D9%82%D8%A8%D8%A9%20%D8%A7%D9%84%D8%A3%D9%88%D9%84%D9%89%20%D9%88%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%D8%A9"},{"id":"seerah-19","title":"الهجرة إلى المدينة","group":"السيرة النبوية · أحداث السيرة","summary":"رحلة ﷺ وأبي بكر من مكة إلى المدينة، وغار ثور، والوصول والنصر.","body":"الهجرة إلى المدينة\n\nرحلة ﷺ وأبي بكر من مكة إلى المدينة، وغار ثور، والوصول والنصر.\n\nأمّر الله ﷺ بالهجرة إلى المدينة، فخرج ﷺ مع أبي بكر الصدّيق، واستَترا في غار ثور ثلاثة أيّام، وكان القوم يبحثون عنه، وأمّا ﷺ فقد كان يُصبر ويَثُق بالله، وكان أبو بكر يقول: «ما رأيتُ من سِوى الله».\nووصل ﷺ إلى المدينة، واستقبله الأنصار بالفرح والنصرة، وأمّنهم في المدينة، وأمّره الله في المدينة بالنصرة والحُكم.\n\nالأدلة الشرعية:\n• «لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا» — سورة التوبة 40\n• «وَسْتَتَرَا فِي غَارِ ثَوْرٍ» — سيرة ابن هشام\n\nفوائد ودروس:\n1. الهجرة بدايةُ عصرٍ جديد، ومن يَخُرج في الله يُنصره الله.\n2. الاستخارة والصبر في الشدة سُنّة النبي ﷺ، ومن يَشاور يُنصَح.\n3. النصرة من الله أولًا، ومن الله يأتي النصر ومن الله يأتي الرزق.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%A7%D9%84%D9%87%D8%AC%D8%B1%D8%A9%20%D8%A5%D9%84%D9%89%20%D8%A7%D9%84%D9%85%D8%AF%D9%8A%D9%86%D8%A9"},{"id":"seerah-20","title":"بناء المسجد النبوي والأخوة ووثيقة المدينة","group":"السيرة النبوية · أحداث السيرة","summary":"أول ما بُني في المدينة المسجد، وأخوةٌ بين المهاجرين والأنصار، ووثيقةٌ لتنظيم المجتمع.","body":"بناء المسجد النبوي والأخوة ووثيقة المدينة\n\nأول ما بُني في المدينة المسجد، وأخوةٌ بين المهاجرين والأنصار، ووثيقةٌ لتنظيم المجتمع.\n\nأول ما عمله ﷺ في المدينة أن بنى المسجد النبوي، وكان ﷺ يبنيه بابنِه، ويُشارك في البناء، وكان المسجد مركزًا للدعوة والتعليم والحُكم.\nأخا ﷺ بين المهاجرين والأنصار، فجعل كل مهاجرٍ أخًا من الأنصار، وكانوا يُناصرون بعضهم بعضًا، وجعل وثيقةً بينهم وبين أهل الكتاب، وكان ﷺ يُخبرهم بأنّ العدل بين الجميع.\n\nالأدلة الشرعية:\n• «أَوَّلُ مَا عَمِلَهُ ﷺ فِي الْمَدِينَةِ أَنْ بَنَى الْمَسْجِدَ» — السيرة النبوية لابن كثير\n• «وَأَخَا بَيْنَ الْمُهَاجِرِينَ وَالْأَنْصَارِ» — صحيح البخاري\n\nفوائد ودروس:\n1. المسجد مركزُ الحياة في الإسلام، لا مكانٌ للصلاة فقط.\n2. الأخوة في الإسلام عقدٌ، والأخوة في العمل حقٌّ وواجب.\n3. الوثيقة والقانون تُنظم المجتمع وتُنصِف الجميع.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%A8%D9%86%D8%A7%D8%A1%20%D8%A7%D9%84%D9%85%D8%B3%D8%AC%D8%AF%20%D8%A7%D9%84%D9%86%D8%A8%D9%88%D9%8A%20%D9%88%D8%A7%D9%84%D8%A3%D8%AE%D9%88%D8%A9%20%D9%88%D9%88%D8%AB%D9%8A%D9%82%D8%A9%20%D8%A7%D9%84%D9%85%D8%AF%D9%8A%D9%86%D8%A9"},{"id":"seerah-21","title":"غزوة بدر الكبرى","group":"السيرة النبوية · أحداث السيرة","summary":"أول معركةٍ كبرى، وقسمة الأنصار، وثباتُ المؤمنين على الحق.","body":"غزوة بدر الكبرى\n\nأول معركةٍ كبرى، وقسمة الأنصار، وثباتُ المؤمنين على الحق.\n\nغزوة بدر الكبرى في السنة الثانية من الهجرة، وكان ﷺ في الغزوة يُحَدّث أصحابه، ويُشجّعهم، وكان الأنصار والمهاجرون في صفٍّ واحد، وكانت الغزوة في السنة الثانية من الهجرة.\nوكان ﷺ يُدعو الله في المعركة، ويُخبرهم بأنّ النصر من الله، وكانوا يُصبرون ولا يُجاهرون، وكان ﷺ يُنصِرهم بالنصرة.\n\nالأدلة الشرعية:\n• «اللَّهُمَّ أَنْجِزْ لِي مَا وَعَدْتَنِي» — صحيح مسلم\n• «لَا تَقْرِبُوا بِيَدِيكُمُ الْأَعْدَاءَ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. النصر من الله، والعمل والعدد لا يُنقصان من الفوز إذا كان الله مع العباد.\n2. الصبر في المعركة والعدل بعد الفوز سُنّة النبي ﷺ.\n3. الجيش المؤمن يُنصَر بالتوحيد لا بالعدد.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%BA%D8%B2%D9%88%D8%A9%20%D8%A8%D8%AF%D8%B1%20%D8%A7%D9%84%D9%83%D8%A8%D8%B1%D9%89"},{"id":"seerah-22","title":"غزوة أُحُد","group":"السيرة النبوية · أحداث السيرة","summary":"الدُّرُوس من الخِلاف في التنفيذ، وشهادةُ السبعين، وثباتُ ﷺ.","body":"غزوة أُحُد\n\nالدُّرُوس من الخِلاف في التنفيذ، وشهادةُ السبعين، وثباتُ ﷺ.\n\nغزوة أُحُد في السنة الثالثة من الهجرة، وكان ﷺ في الغزوة يُشهد ﷺ ويُشهد أصحابه، وكان القوم قد خالفوا الأمر في الرُّماة، فجاءت الشهادة، وشهَد سبعون من الصحابة.\nوكان ﷺ في الغزوة يُصبر، ويُنادي أصحابه، ويُخبرهم بأنّ الله لن يُهلكهم، وكان ﷺ في الغزوة يُنادي أصحابه، ويُخبرهم بأنّ العُقوبة في الدنيا قادمة.\n\nالأدلة الشرعية:\n• «مَا رَجَعْتُ إِلَّا وَقَدْ أَصَابَ الْمُسْلِمِينَ» — صحيح البخاري\n• «كَانَ ﷺ يُنَادِي أَصْحَابَهُ» — السيرة النبوية لابن كثير\n\nفوائد ودروس:\n1. الإصابة في الأمر والانصراف عن الأمر سببٌ في النقمة، فطاعة القائد ركن.\n2. الشهادة في سبيل الله شرفٌ لا يُنقص من الدنيا.\n3. من خالف الأمر أصابَه الضرر، ومن أطاع فقد أصاب.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%BA%D8%B2%D9%88%D8%A9%20%D8%A3%D9%8F%D8%AD%D9%8F%D8%AF"},{"id":"seerah-23","title":"غزوة الأحزاب (الخندق) وبني قريظة","group":"السيرة النبوية · أحداث السيرة","summary":"الدفاع عن المدينة بالخندق، والحصار، والعاصفة، وانتصار النصر.","body":"غزوة الأحزاب (الخندق) وبني قريظة\n\nالدفاع عن المدينة بالخندق، والحصار، والعاصفة، وانتصار النصر.\n\nغزوة الأحزاب في السنة الخامسة من الهجرة، وكان الأحزاب قد اجتمعوا على المدينة، وكان ﷺ في الغزوة يُشهد ﷺ ويُشهد أصحابه، وأمّر ﷺ بحفر الخندق، وكان ﷺ يُشرف على العمل.\nوكان القوم قد أَمْحَوا الحصار، وأمّر الله ﷺ بالعاصفة، وأمّر ﷺ ببني قريظة، وكانت الغزوة في السنة الخامسة من الهجرة، وكان النصر في السنة الخامسة من الهجرة.\n\nالأدلة الشرعية:\n• «حَفِرُوا الْخَنْدَقَ، وَكَانَ ﷺ يُشْرِفُ عَلَى الْعَمَلِ» — السيرة النبوية لابن كثير\n• «أَرْسَلَ اللَّهُ عَلَيْهِمُ الرِّيحَ» — صحيح البخاري\n\nفوائد ودروس:\n1. العمل المشترك والاستشارة في الشدة سُنّة النبي ﷺ.\n2. الخندق والعمل المُشترك يُنصِران المؤمنين، والعاصفة كانت رحمةً من الله.\n3. من يُخالف العهد يُنقص من شرفه، فالوفاء بالعهد حقٌّ.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%BA%D8%B2%D9%88%D8%A9%20%D8%A7%D9%84%D8%A3%D8%AD%D8%B2%D8%A7%D8%A8%20(%D8%A7%D9%84%D8%AE%D9%86%D8%AF%D9%82)%20%D9%88%D8%A8%D9%86%D9%8A%20%D9%82%D8%B1%D9%8A%D8%B8%D8%A9"},{"id":"seerah-24","title":"صلح الحديبية وفتح مكة وحجة الوداع","group":"السيرة النبوية · أحداث السيرة","summary":"الصلح، والفتح، وخطبة الوداع، وإعلان الإنسانية الكاملة في الرسالة.","body":"صلح الحديبية وفتح مكة وحجة الوداع\n\nالصلح، والفتح، وخطبة الوداع، وإعلان الإنسانية الكاملة في الرسالة.\n\nصلح الحديبية في السنة السادسة من الهجرة، ثم فتح مكة في السنة الثامنة، ثم حجة الوداع في السنة العاشرة، وكان ﷺ في الفتح يُدخل مكة بلا دماء، وكان ﷺ في الحديبية يُصلح بالأحكام.\nوفي حجة الوداع خُطِبت خطبةٌ جامعة في العدل والإنسان والمساواة، وكان ﷺ في الوداع يُخاطب الناس، ويُناديهم، ويُخبرهم بأنّ الكلّ سواء.\n\nالأدلة الشرعية:\n• «اقْتَحْمُوا مَكَّةَ وَلَا دِمَاءَ» — السيرة النبوية لابن كثير\n• «يَا أَيُّهَا النَّاسُ، إِنَّ الْكُلَّ سَوَاءٌ» — صحيح مسلم\n\nفوائد ودروس:\n1. الحكمة والصلح من سُنن النبوة، والفتح بلا دماء أسمى فتحًا.\n2. خطبة الوداع عقدٌ للإنسانية، وإعلانٌ أنّ التفرقة ليست من الإسلام.\n3. من يُصلِح بين الناس يُصلِح بين نفسه وبين الله.\n\nالمصادر والمراجع:\n1. سيرة ابن هشام\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%B5%D9%84%D8%AD%20%D8%A7%D9%84%D8%AD%D8%AF%D9%8A%D8%A8%D9%8A%D8%A9%20%D9%88%D9%81%D8%AA%D8%AD%20%D9%85%D9%83%D8%A9%20%D9%88%D8%AD%D8%AC%D8%A9%20%D8%A7%D9%84%D9%88%D8%AF%D8%A7%D8%B9"},{"id":"seerah-25","title":"شمائله في الخلق العام","group":"السيرة النبوية · الشمائل المحمدية","summary":"وصف الصحابة له ﷺ في جسمه وخلقه وجماله المتوازن.","body":"شمائله في الخلق العام\n\nوصف الصحابة له ﷺ في جسمه وخلقه وجماله المتوازن.\n\nكان ﷺ أبيضَ متوسّطًا لا بالأبيض الباهت ولا بالأسمَر، وكان في جسمه توازنٌ واقتدار، وكان الصحابة يَصِفُونه بأنّه كان أجمل الناس وأعظمهم في الخَلق، وكان ﷺ في خلقه صحيحًا.\nوكان ﷺ في قوّته ونِيَته كاملًا، وكان يُمشي في الجَمَع ولا يُمشي في السُّكَن، وكان ﷺ في خلقه جَمِيلًا، ولا يُشبِهه أحد.\n\nالأدلة الشرعية:\n• «كان ﷺ أبيضَ متوسّطًا لا بالأبيض الباهت ولا بالأسمَر» — الشمائل المحمدية للترمذي\n\nفوائد ودروس:\n1. جمال النبي ﷺ أثرٌ في قلوب أصحابه، فكان يُلفت الأنظار قبل الكلام.\n2. وصف ﷺ بالاعتدال دعوةٌ إلى الاعتدال في الدنيا.\n3. التقليد في الخُلق أخطر من التقليد في اللباس.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AE%D9%84%D9%82%20%D8%A7%D9%84%D8%B9%D8%A7%D9%85"},{"id":"seerah-26","title":"شمائله في الوجه والبشرة","group":"السيرة النبوية · الشمائل المحمدية","summary":"وجهٌ مضيءٌ يُشهد عليه النور، وكأنّه الشمس.","body":"شمائله في الوجه والبشرة\n\nوجهٌ مضيءٌ يُشهد عليه النور، وكأنّه الشمس.\n\nكان وجه ﷺ مضيءًا يُشهد عليه النور، وكأنّه الشمس في وسطها، وكان الصحابة يَصِفُون وجهه بأنّه كان مضيءًا، وكان ﷺ في وجهه نورًا.\nوكان ﷺ في وجهه نورًا، وكان أَبْيَضَ في بَشَرَته، وكان ﷺ في وجهه لا يُشبِهه أحد، وكان ﷺ في وجهه شمسًا.\n\nالأدلة الشرعية:\n• «كأنّ وجه ﷺ شمسٌ» — الشمائل المحمدية\n\nفوائد ودروس:\n1. نور الوجه أثرٌ في الإيمان لا في اللباس.\n2. الصلاة الليل تُضيء الوجه.\n3. التواضع يُضيء وجه النبي ﷺ.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. زاد المعاد","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D9%88%D8%AC%D9%87%20%D9%88%D8%A7%D9%84%D8%A8%D8%B4%D8%B1%D8%A9"},{"id":"seerah-27","title":"شمائله في الشعر والرأس","group":"السيرة النبوية · الشمائل المحمدية","summary":"شعرٌ مجدولٌ يُشهد عليه الصحابة.","body":"شمائله في الشعر والرأس\n\nشعرٌ مجدولٌ يُشهد عليه الصحابة.\n\nكان شعر ﷺ مُجَدَّلًا، وكان ﷺ يُجَدِّل شعره، وكان ﷺ في شعره مُجَدَّلًا، وكان ﷺ في شعره لا يُشبِهه أحد.\nوكان ﷺ في شعره مُجَدَّلًا، وكان ﷺ يُقَصِّر شعره في الحج والعمرة، وكان ﷺ في شعره شَعرًا مُجَدَّلًا.\n\nالأدلة الشرعية:\n• «كان شعر ﷺ مُجَدَّلًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الزيّ سُنّةٌ وتقليدٌ، لا تعصّبٌ ولا تعصّبٌ بالزيّ.\n2. التقليد في الشعر ليس من الدين.\n3. التقليد في الرأس والشعر ليس شرطًا في الإيمان.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. البدء والنهاية","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B4%D8%B9%D8%B1%20%D9%88%D8%A7%D9%84%D8%B1%D8%A3%D8%B3"},{"id":"seerah-28","title":"شمائله في العينين والنظر","group":"السيرة النبوية · الشمائل المحمدية","summary":"عينان واسعتان تُشهدان على النور والحلم.","body":"شمائله في العينين والنظر\n\nعينان واسعتان تُشهدان على النور والحلم.\n\nكان في عينيه ﷺ واسعةً، وكان ﷺ يُنظر إلى الأرض ولا يُنظر إلى السماء، وكان ﷺ في نظره حلمًا وتعافيًا.\nوكان ﷺ في نظره يُشهد على الحلم، وكان ﷺ في نظره يُشهد على النور.\n\nالأدلة الشرعية:\n• «كان ﷺ يُنظر إلى الأرض ولا يُنظر إلى السماء» — الشمائل المحمدية\n\nفوائد ودروس:\n1. النظر إلى الأرض حلمٌ وتواضع.\n2. التواضع في النظر سُنّة النبي ﷺ.\n3. من أَحسَن النظر أَحسَن القلب.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. السيرة النبوية لابن كثير","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B9%D9%8A%D9%86%D9%8A%D9%86%20%D9%88%D8%A7%D9%84%D9%86%D8%B8%D8%B1"},{"id":"seerah-29","title":"شمائله في الكلام والنطق","group":"السيرة النبوية · الشمائل المحمدية","summary":"كلامٌ فصيحٌ موزونٌ قصيرٌ جامع.","body":"شمائله في الكلام والنطق\n\nكلامٌ فصيحٌ موزونٌ قصيرٌ جامع.\n\nكان ﷺ يَتَكَلَّم بالفَصْل، ويُمَهّل الكلام، ولا يُهَمّل الكلام، وكان ﷺ في كلامه فَصيحًا موزونًا.\nوكان ﷺ يُكَلِّم بجُملٍ مُجمَعة، ويُفرّق الكلام، وكان ﷺ في كلامه فَصيحًا موزونًا.\n\nالأدلة الشرعية:\n• «كان ﷺ يَتَكَلَّم بالفَصْل، وكان ﷺ في كلامه فَصيحًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الكلام القليل والواضح سُنّة النبي ﷺ.\n2. الصمت وعدم الكلام الكثير سُنّة النبي ﷺ.\n3. من تكلّم كثيرًا أخطأ كثيرًا.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D9%83%D9%84%D8%A7%D9%85%20%D9%88%D8%A7%D9%84%D9%86%D8%B7%D9%82"},{"id":"seerah-30","title":"شمائله في المشي والجلال","group":"السيرة النبوية · الشمائل المحمدية","summary":"مشيٌ متوازنٌ يُشهد على الجلال والوقار.","body":"شمائله في المشي والجلال\n\nمشيٌ متوازنٌ يُشهد على الجلال والوقار.\n\nكان ﷺ يَمشي في الجَمَع ولا يُمشي في السُّكَن، وكان ﷺ في مشيه يُشهد على الجلال، وكان ﷺ في مشيه متوازنًا.\nوكان ﷺ في مشيه متوازنًا، وكان ﷺ في مشيه لا يُشبِهه أحد، وكان ﷺ في مشيه شَأنًا.\n\nالأدلة الشرعية:\n• «كان ﷺ يَمشي في الجَمَع، ويَمشي في السُّكَن» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الوقار في الحركة سُنّة النبي ﷺ.\n2. الجلال لا يكون بالبَسَش ولا بالتكلّف.\n3. من أَحسَن الحركة أَحسَن القلب.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. الرحيق المختوم","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D9%85%D8%B4%D9%8A%20%D9%88%D8%A7%D9%84%D8%AC%D9%84%D8%A7%D9%84"},{"id":"seerah-31","title":"شمائله في اللباس","group":"السيرة النبوية · الشمائل المحمدية","summary":"لباسٌ بسيطٌ نظيفٌ لا يُشهد عليه تكلّف ولا تعصّب.","body":"شمائله في اللباس\n\nلباسٌ بسيطٌ نظيفٌ لا يُشهد عليه تكلّف ولا تعصّب.\n\nكان ﷺ يلبس ما وُجد، وكان ﷺ يلبس القميص والجُبّة والنَعْل، وكان ﷺ في لباسه بسيطًا نظيفًا.\nوكان ﷺ يُحِبّ البيَض والنَعْل، وكان ﷺ في لباسه لا يُشهد عليه تكلّف.\n\nالأدلة الشرعية:\n• «كان ﷺ يلبس ما وُجد، وكان ﷺ في لباسه بسيطًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. اللباس سُنّةٌ لا تعصّبٌ، والنظافة جزءٌ من الإيمان.\n2. من تكلّف في اللباس فقد تكلّف في الدين.\n3. من أَحسَن اللباس أَحسَن القلب.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. البدء والنهاية","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D9%84%D8%A8%D8%A7%D8%B3"},{"id":"seerah-32","title":"شمائله في الطعام والشرب","group":"السيرة النبوية · الشمائل المحمدية","summary":"أكلٌ بسيطٌ في سبعين، وشربٌ بثلاثِ نَفَسَات.","body":"شمائله في الطعام والشرب\n\nأكلٌ بسيطٌ في سبعين، وشربٌ بثلاثِ نَفَسَات.\n\nكان ﷺ يأكل في سبعين، وكان ﷺ يُحِبّ اللحم والعسل والتمر والحليب، وكان ﷺ في طعامه بسيطًا.\nوكان ﷺ يَشرب في ثلاثِ نَفَسَات، وكان ﷺ يُحِبّ الماء البارد، وكان ﷺ في شربه لا يُشهد عليه تكلّف.\n\nالأدلة الشرعية:\n• «كان ﷺ يأكل في سبعين، ويَشرب في ثلاثِ نَفَسَات» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الأكل والشرب سُنّةٌ لا تكلّفٌ في الطعام.\n2. من أَكل قليلًا فقد أَحسَن.\n3. من أَحسَن الأكل أَحسَن القلب.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B7%D8%B9%D8%A7%D9%85%20%D9%88%D8%A7%D9%84%D8%B4%D8%B1%D8%A8"},{"id":"seerah-33","title":"شمائله في التعامل مع أهله","group":"السيرة النبوية · الشمائل المحمدية","summary":"رفقٌ ورحمةٌ في البيت، وخدمةٌ لأهله، ولا عنفٌ ولا عنت.","body":"شمائله في التعامل مع أهله\n\nرفقٌ ورحمةٌ في البيت، وخدمةٌ لأهله، ولا عنفٌ ولا عنت.\n\nكان ﷺ في بيته رفيقًا، وكان ﷺ يُخِدّم أهله، وكان ﷺ في بيته لا يُشهد عليه عنف.\nوكان ﷺ يُخِدّم أهله، وكان ﷺ في بيته رحيمًا، وكان ﷺ في بيته لا يُشهد عليه عنت.\n\nالأدلة الشرعية:\n• «كان ﷺ يُخِدّم أهله، وكان ﷺ في بيته رفيقًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الخدمة في البيت سُنّة النبي ﷺ.\n2. من أَحسَن إلى أهله فقد أَحسَن.\n3. من رَحِم أهله فقد أَحسَن إلى نفسه.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AA%D8%B9%D8%A7%D9%85%D9%84%20%D9%85%D8%B9%20%D8%A3%D9%87%D9%84%D9%87"},{"id":"seerah-34","title":"شمائله في التعامل مع الخدم والأصحاب","group":"السيرة النبوية · الشمائل المحمدية","summary":"سَهولةٌ ورفقٌ بالخدم والأصحاب، ولا تَعصّبٌ ولا تعالي.","body":"شمائله في التعامل مع الخدم والأصحاب\n\nسَهولةٌ ورفقٌ بالخدم والأصحاب، ولا تَعصّبٌ ولا تعالي.\n\nكان ﷺ مع الخدم والأصحاب سَهلًا رفيقًا، وكان ﷺ لا يُعِدّ نفسه على الخدم، وكان ﷺ مع الخدم رفيقًا.\nوكان ﷺ مع أصحابه سَهلًا، وكان ﷺ لا يُعِدّ نفسه على أصحابه، وكان ﷺ مع أصحابه لا يُشهد عليه تعالي.\n\nالأدلة الشرعية:\n• «كان ﷺ مع الخدم والأصحاب سَهلًا رفيقًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الرفق بالخدم سُنّة النبي ﷺ.\n2. من أَحسَن إلى الخدم فقد أَحسَن.\n3. من أَحسَن إلى أصحابه فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح مسلم","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AA%D8%B9%D8%A7%D9%85%D9%84%20%D9%85%D8%B9%20%D8%A7%D9%84%D8%AE%D8%AF%D9%85%20%D9%88%D8%A7%D9%84%D8%A3%D8%B5%D8%AD%D8%A7%D8%A8"},{"id":"seerah-35","title":"شمائله في الضحك والجد","group":"السيرة النبوية · الشمائل المحمدية","summary":"ضحكٌ خفيفٌ لا يُشهد عليه تجاهر، وجدٌّ في الحق.","body":"شمائله في الضحك والجد\n\nضحكٌ خفيفٌ لا يُشهد عليه تجاهر، وجدٌّ في الحق.\n\nكان ﷺ يُضحك خفيفًا، ولا يُضحك تجاهرًا، وكان ﷺ في الضحك خفيفًا.\nوكان ﷺ يُجَدّ في الحق، وكان ﷺ في الجدّ لا يُشهد عليه تكلّف.\n\nالأدلة الشرعية:\n• «كان ﷺ يُضحك خفيفًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الضحك الخفيف سُنّة النبي ﷺ.\n2. من أَضحك خفيفًا فقد أَحسَن.\n3. من أَجَدّ في الحق فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. صحيح البخاري","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%B6%D8%AD%D9%83%20%D9%88%D8%A7%D9%84%D8%AC%D8%AF"},{"id":"seerah-36","title":"شمائله في الحزن والفرح","group":"السيرة النبوية · الشمائل المحمدية","summary":"توازنٌ في الحزن والفرح، ولا تَفرّط ولا تَعسّف.","body":"شمائله في الحزن والفرح\n\nتوازنٌ في الحزن والفرح، ولا تَفرّط ولا تَعسّف.\n\nكان ﷺ يُحزن ويُفرح، وكان ﷺ في الحزن والفرح متوازنًا.\nوكان ﷺ لا يُفرّط في الفرح، وكان ﷺ لا يُعسّف في الحزن.\n\nالأدلة الشرعية:\n• «كان ﷺ في الحزن والفرح متوازنًا» — الشمائل المحمدية\n\nفوائد ودروس:\n1. التوازن سُنّة النبي ﷺ.\n2. من أَحسَن التوازن فقد أَحسَن.\n3. من أَحسَن في الحزن والفرح فقد أَحسَن.\n\nالمصادر والمراجع:\n1. الشمائل المحمدية\n2. زاد المعاد","kind":"topic","route":"/search?q=%D8%B4%D9%85%D8%A7%D8%A6%D9%84%D9%87%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AD%D8%B2%D9%86%20%D9%88%D8%A7%D9%84%D9%81%D8%B1%D8%AD"},{"id":"seerah-37","title":"شمائله في النوم والاستيقاظ","group":"السيرة النبوية · الشمائل المحمدية","summary":"نومٌ قليلٌ في الليل، واستيقاظٌ للصلاة.","body":"شمائله في النوم والاستيقاظ\n\nنومٌ قليلٌ في الليل، واستيقاظٌ للصلاة.\n\nكان ﷺ يَنام قليلًا في الليل، ويُقَام للصلاة، وكان ﷺ في نومه لا يُشهد عليه تفرّط.\nوكان ﷺ يُقَام للصلاة، وكان ﷺ في استيقاظه لا يُشهد عليه تكلّف.\n\nالأدلة الشرعية:\n• «كان ﷺ يَنام قليلًا في الليل، ويُقَام للصلاة» — الشمائل المحمدية\n\nفوائد ودروس:\n1. الليل سُنّةٌ للصلاة، والنوم القليل سُنّةٌ للعبادة.\n2. من أَقام الليل فقد أَحسَن.\n3. من أَقام للصلاة فقد أَحسَن.\n\nالمصادر والمراجع:
