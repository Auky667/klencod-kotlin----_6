رّاء، فأشار عمر إلى أبي بكر بجمع القرآن في مصحفٍ واحد، فوُرِد إلى زيد بن ثابت فجمعه في صحيفة.","ومن هنا كان أول ما جُمِع القرآن صحيفةً واحدة، ثم جُمِع في عهد عثمان في مصحفٍ واحد، وضُبط رسمه، وتُضَرِبت عليه المصاحف، وحُرِستَ عليه المصاحف."],"evidences":[{"text":"«كَانَ زَيْدٌ مِنَ الْقَرَائِكُمْ فَجَمَعُوا الْقُرْآنَ فِي صَحِيفَةٍ»","source":"صحيح البخاري"},{"text":"«كَانَ زَيْدٌ مِنَ الْقُرَائِكُمْ، فَجَمَعُوا الْقُرْآنَ فِي مَصْحَفٍ»","source":"الإتقان للسيوطي"}],"benefits":["جمع القرآن نُصرةٌ للدين.","من أَحسَن الجمع أَحسَن الفهم.","الحُرِستَ على المصحف ركنٌ في الإسلام."],"references":["صحيح البخاري","الإتقان للسيوطي"]},{"id":"quran-4","title":"المصحف في عهد عثمان وضبط الرسم","summary":"إمّا المصاحف، وتوحيد رسم المصحف، ومنع اختلاف القرّاء.","content":["في عهد عثمان اختلفت المصاحف في الرسم، فأمّر عثمان بضبط رسم المصحف، وخلع المصاحف المُختَلِف، وأمّر بحمل المصاحف إلى البلاد، فلم يَشكُل القرّاء بعد ذلك.","ومن هنا كان رسم المصحف الذي نقرأ به اليوم، وأمّا الرسم فقد كان مُختَلِفًا، وأمّا الضبط فقد كان في عهد عثمان، وأمّا المصاحف فقد كانت مُختَلِفًا."],"evidences":[{"text":"«كَانَ عُثْمَانٌ يُضَرِبُ عَلَى الْمَصْحَفِ وَيُخْلِفُ الْمَصَاحِفَ»","source":"الإتقان للسيوطي"},{"text":"«كَانَ عُثْمَانٌ يُضَرِبُ عَلَى الْمَصْحَفِ»","source":"البرهان للزركشي"}],"benefits":["ضبط رسم المصحف نُصرةٌ للدين.","من أَحسَن الضبط أَحسَن القراءة.","الحُرِستَ على المصحف ركنٌ في الإسلام."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"quran-5","title":"المكي والمدني وعلاماتهما","summary":"المكي والمدني بحسب زمان النزول، وعلاماتُ كل قسم.","content":["المكي هو ما نزل قبل الهجرة، والمدني هو ما نزل بعد الهجرة، حتى لو نزل بمكة بعد الهجرة فهو مدنيّ، حتى لو نزل بالمدينة قبل الهجرة فهو مكيّ.","ومن العلامات المكيّة: ألف «كلَّا»، وأسماء الأنبياء، وذكر الجُهُود والقُرّاء، ومن العلامات المدنيّة: ألف «يا أيها الناس»، وذكر الأحكام والمُنافِقين والقِتال."],"evidences":[{"text":"«الَّذِينَ آمَنُوا وَهَاجَرُوا»","source":"الإتقان للسيوطي"},{"text":"«الَّذِينَ كَفَرُوا»","source":"البرهان للزركشي"}],"benefits":["المكي ما نزل قبل الهجرة، والمدني ما نزل بعد الهجرة.","العلامات لا تُعَمّل إلا مع العلم.","من أَحسَن التمييز أَحسَن الفهم."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"quran-6","title":"أسباب النزول","summary":"معرفة سبب نزول الآية تُساعِد في فهمها، والأصل أنّ الآية تُحمل على سببها.","content":["أسباب النزول هي الجُهُود والأحداث التي أُنزِلت فيها الآية، ومعرفتها تُساعِد في فهمها، فمن أَحسَن سبب النزول أَحسَن الفهم، ومن لم يَعرف السبب فقد أَضلّ.","وأمّا الأصل: أنّ الآية تُحمل على سببها، ولا تُختصّ به إن كان السبب خُصوصًا، فالآية تُحمل على سببها وعلى غيره."],"evidences":[{"text":"«فَإِنَّ آيَةً تُنْزَلُ لِسَبَبٍ، فَتُحْمَلُ عَلَى سَبَبِهَا وَعَلَى غَيْرِهِ»","source":"مباحث في علوم القرآن"},{"text":"«مَا أَنْزَلَ اللَّهُ الْآيَةَ إِلَّا لِسَبَبٍ»","source":"الإتقان للسيوطي"}],"benefits":["معرفة سبب النزول تُساعِد في فهم الآية.","الآية تُحمل على سببها وعلى غيره.","من أَحسَن السبب أَحسَن الفهم."],"references":["مباحث في علوم القرآن","الإتقان للسيوطي"]},{"id":"quran-7","title":"الناسخ والمنسوخ","summary":"أن يحلّ حكمٌ محلّ حكمٍ بآيةٍ أُخرى أو سُنّةٍ قطعية.","content":["الناسخ هو ما حُكِم به، والمنسوخ هو ما أُلغي حكمه، وأمّا الناسخ فقد كان حُكِم به، وأمّا المنسوخ فقد أُلغي حكمه.","وأمّا شروط النسخ: أن يكون الناسخ آيةً أو سُنّةً قطعية، وأن يكون المنسوخ قد أُنزِل قبل الناسخ، وأن يكون الناسخ قد أُنزِل قبل وفاة النبي ﷺ."],"evidences":[{"text":"«مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نُسِّهَا»","source":"الإتقان للسيوطي"},{"text":"«مَا نُنْسِخُ مِنْ آيَةٍ»","source":"البرهان للزركشي"}],"benefits":["النسخ حُكِم به، والمنسوخ أُلغي حكمه.","شروط النسخ تُنظّم الفهم.","من أَحسَن الناسخ أَحسَن الفهم."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"quran-8","title":"المحكم والمتشابه","summary":"المحكم واضحُ الدلالة، والمتشابه لُغتُه مُجمَعة، والفقهاء يُعَمّلون بالأول.","content":["المحكم هو الآية الواضحة الدلالة على مرادها بلا حاجةٍ إلى تأويل، والمتشابه هو الآية التي لا تُحكِم دلالتها على مرادها، ولا تُحكِم على غيرها.","وقد كان الفقهاء يُعَمّلون بالمحكم، ويُؤوّلون المتشابه بالفهم، ويُخالفون بين المحكم والمتشابه، ولا يُشهد إلا في المحكم."],"evidences":[{"text":"«فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ»","source":"سورة آل عمران 7"},{"text":"«وَمَا نَعْلَمُ تَأْوِيلَهُ»","source":"البرهان للزركشي"}],"benefits":["المحكم واضحٌ، والمتشابه لا يُشهد.","من أَحسَن المحكم أَحسَن الفهم.","من قام بغير المحكم فقد أَضلّ."],"references":["البرهان للزركشي","الإتقان للسيوطي"]},{"id":"quran-9","title":"تعدد القراءات وعلم القراءات","summary":"قراءاتٌ متواترةٌ من النبي ﷺ، وأحكامٌ في الضبط والرسم.","content":["القراءات هي طرق القراءة المُتواتِرة من النبي ﷺ، وهي قراءاتٌ لا تُشهد إلا على التواتر، وقد كانت قراءاتٌ مُتواتِرة، وقد كانت قراءاتٌ مُتقارِبة.","ومن أشهر القراءات: نافع المدني، وابن كثير المكي، وأبو عمرو البصري، وابن عامر الشامي، وعاصم الكوفي، وحمزة الكوفي، والكسائي الكوفي، وقد كان الرسم مُختَلِفًا."],"evidences":[{"text":"«أُنزِلَ الْقُرْآنُ عَلَى سَبْعَةِ أَحْرُفٍ»","source":"صحيح البخاري"},{"text":"«وَقَرَأَ الْقُرَاءُ عَلَى أَحْرُفٍ»","source":"البرهان للزركشي"}],"benefits":["القراءات متواترةٌ من النبي ﷺ.","القراءات سبعةٌ لا تُشهد إلا على التواتر.","من أَحسَن القراءة أَحسَن الفهم."],"references":["البرهان للزركشي","هداية القاري للداني"]},{"id":"quran-10","title":"الإعجاز البياني والعلمي","summary":"القرآن مُعجَز في لفظه ومعناه، ولا يُقابِله شيء.","content":["الإعجاز هو أنّ القرآن لا يُقابِله شيء، ولا يُشهد إلا على التواتر، وقد كان الإعجاز مُتقارِبًا، وقد كان الإعجاز مُتقارِبًا في اللفظ والمعنى، وأمّا الإعجاز العلمي فقد كان في الآيات التي تُشهد على التوحيد.","ومن هنا كان القرآن مُعجَزًا في لفظه ومعناه، ولا يُقابِله شيء، وقد كان الإعجاز مُتقارِبًا في اللفظ والمعنى."],"evidences":[{"text":"«فَأْتُوا بِسُورَةٍ مِّن مِّثْلِهِ»","source":"سورة البقرة 23"},{"text":"«لَئِن جَاءَ الْبَشَرُ بِكُلِّ مِثْلِهِ فَلَنْ يُقَابِلُوهُ»","source":"البرهان للزركشي"}],"benefits":["القرآن مُعجَز في لفظه ومعناه.","من أَحسَن الإعجاز أَحسَن الفهم.","من أَقَبِل التحدي فقد أَحسَن."],"references":["البرهان للزركشي","الإتقان للسيوطي"]},{"id":"quran-11","title":"مناسبات الآيات والسور","summary":"المناسبات بين الآيات والسور تُفصِل النص، وتُنظّم الفهم.","content":["المناسبات هي العَلَائِق بين الآيات والسور، وقد كانت المناسبات مُتقارِبة، وقد كانت المناسبات مُتقارِبة في المعنى والفهم.","ومن هنا كان العلماء يُعَمّلون بالمناسبات، ويُعَمّلون بالفهم، ويُعَمّلون بالتدبر، ويُعَمّلون بالعمل."],"evidences":[{"text":"«كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ»","source":"البرهان للزركشي"},{"text":"«وَقَدْ كَانَتِ الْمَنَاسَبَاتُ مُتَقَارِبَةً»","source":"الإتقان للسيوطي"}],"benefits":["المناسبات تُنظّم الفهم.","من أَحسَن المناسبات أَحسَن الفهم.","من أَعَمّل بالمناسبات فقد أَحسَن."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"quran-12","title":"أسماء القرآن وترتيب المصحف","summary":"القرآن له أسماءٌ متعددة، وترتيبُ المصحف توقيفيّ.","content":["للقرآن أسماءٌ متعددة: القرآن، والفرقان، والكتاب، والذكر، والنور، والهُدى، والشِفاء، والحق، والتنزيل، وأمّا أسماء القرآن فقد كانت مُتعددة.","وأمّا ترتيب المصحف فقد كان توقيفيًّا، فقد كان ﷺ يُخبر جبريل بالترتيب، ويُرَتِّب بالحُكم، وقد كان الترتيب توقيفيًّا."],"evidences":[{"text":"«إِنَّهُ لَقُرْآنٌ كَرِيمٌ»","source":"سورة الحاقّة 40"},{"text":"«وَقَدْ كَانَ التَّرْتِيبُ تَوْقِيفِيًّا»","source":"الإتقان للسيوطي"}],"benefits":["القرآن له أسماءٌ متعددة.","ترتيب المصحف توقيفيّ.","من أَحسَن الترتيب أَحسَن الفهم."],"references":["الإتقان للسيوطي","البرهان للزركشي"]}]},{"key":"quran-tajweed","title":"التجويد","description":"مخارج الحروف وصفاتها، وأحكام النون والميم والمدود والوقف، لضبط الأداء.","accent":"gold","topics":[{"id":"tajweed-1","title":"تعريف التجويد وحكمه وفضله","summary":"التجويد إعطاء كل حرفٍ حقّه من مخرجٍ وصفة، وواجبٌ على كل قارئ.","content":["التجويد في اللغة: الإحسان والإتقان، وفي الاصطلاح: إعطاء كل حرفٍ حقّه من مخرجٍ وصفةٍ لازمَة أو عرضية، وحكمه فرضٌ كفائيّ على الأمة، وواجبٌ عينيّ على من أراد أن يُقرأ القرآن كما أُنزِل.","ومن أَراد أن يُقرأ القرآن كما أُنزِل فليُعَلّم التجويد، وليُعَمّل به، وليُقرأ بالتجويد، وليُعَمّل به، وليُقرأ بالتجويد."],"evidences":[{"text":"«وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا»","source":"سورة المزمل 4"},{"text":"«إِنَّ الْأَنْتَ يُقْرَأُ فِي الْمَشِيئَةِ»","source":"المقدمة الجزرية"}],"benefits":["التجويد فرضٌ كفائيّ وواجبٌ عينيّ على القارئ.","من أَحسَن التجويد أَحسَن القراءة.","اللحن الجلي مُحرِّم، واللحن الخفيّ مُنقصٌ للقراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-2","title":"الاستعاذة والبسملة","summary":"الاستعاذة قبل القراءة، والبسملة في أول السورة، وأحكام الوصل بينهما.","content":["الاستعاذة: أن يقول القارئ: «أعوذ بالله من الشيطان الرجيم» قبل القراءة، وهي سُنّة، وقد أمّر الله ﷺ بالاستعاذة، وقد كانت الاستعاذة سُنّة.","والبسملة: «بسم الله الرحمن الرحيم» في أول كل سورة إلا التوبة، وأمّا الوصل بين الاستعاذة والبسملة والسورة فقد كان في الأحكام، وقد كانت الاستعاذة سُنّة."],"evidences":[{"text":"«فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ»","source":"سورة النحل 98"},{"text":"«بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ»","source":"أول سورة الفاتحة"}],"benefits":["الاستعاذة سُنّة قبل القراءة.","البسملة في أول كل سورة إلا التوبة.","من أَحسَن الاستعاذة أَحسَن القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-3","title":"مخارج الحروف","summary":"كل حرفٍ له مخرجٌ معروف، ومعرفة المخارج تحمي من اللحن.","content":["مخارج الحروف هي أماكن ظهور الحروف من الفم والحنجرة، وهي سبعة عشر مخارجًا، وقد كانت المخارج مُتقارِبة، وقد كانت المخارج مُتقارِبة في الفم والحنجرة.","ومن أَحسَن المخارج أَحسَن القراءة، ومن أَخطأ المخرج فقد أَخطأ الحرف، وقد كان اللحن مُتقارِبًا."],"evidences":[{"text":"«كُلُّ حَرْفٍ لَهُ مَخْرَجٌ مَعْلُومٌ»","source":"هداية القاري للداني"},{"text":"«وَمَنْ أَخْطَأَ الْمَخْرَجَ أَخْطَأَ الْحَرْفَ»","source":"المقدمة الجزرية"}],"benefits":["مخارج الحروف سبعة عشر مخارجًا.","من أَحسَن المخارج أَحسَن القراءة.","من أَخطأ المخرج فقد أَخطأ الحرف."],"references":["هداية القاري للداني","المقدمة الجزرية"]},{"id":"tajweed-4","title":"صفات الحروف","summary":"صفاتٌ لازمةٌ وعرضية، ومعرفة الصفات تُكمّل أداء الحرف.","content":["صفات الحروف هي أوصاف تظهر بالحرف عند نطقه، وهي لازمةٌ لا تُفارِقه، وعرضيةٌ تُفارِقه، وقد كانت الصفات مُتقارِبة.","ومن اللازمة: الجهر، والشدّة، والاستعلاء، والانفتاح، والصفير، والقلقلة، واللين، والانفراج، والاستطالة، والاستمالة، والغُنّة."],"evidences":[{"text":"«كُلُّ حَرْفٍ لَهُ صِفَاتٌ»","source":"هداية القاري للداني"},{"text":"«وَمَنْ أَحْسَنَ الصِّفَاتِ أَحْسَنَ الْأَدَاءَ»","source":"المقدمة الجزرية"}],"benefits":["الصفات لازمةٌ وعرضية.","من أَحسَن الصفات أَحسَن الأداء.","من أَنكَر الصفات فقد أَفحَم."],"references":["هداية القاري للداني","المقدمة الجزرية"]},{"id":"tajweed-5","title":"أحكام النون الساكنة والتنوين","summary":"أربعة أحكام: الإظهار، والإدغام، والإقلاب، والإخفاء.","content":["النون الساكنة والتنوين لها أربعة أحكام: الإظهار عند الحلقية، والإدغام عند اللام والنون (بغنة) والياء والراء والميم والواو، والإقلاب عند الباء، والإخفاء عند الباقي.","ومن أَحسَن الأحكام أَحسَن القراءة، ومن أَخطأ الإخفاء فقد أَخطأ الغُنّة، وقد كانت الأحكام مُتقارِبة."],"evidences":[{"text":"«إِذَا تَوَضَّأَ بِالنُّونِ فَاسْتَقِمْ»","source":"المقدمة الجزرية"},{"text":"«وَإِنْ نَأْتَى الْبَاءُ فَقَلِبْ»","source":"المقدمة الجزرية"}],"benefits":["أحكام النون الساكنة والتنوين أربعة.","من أَحسَن الإخفاء أَحسَن القراءة.","من أَخطأ الغُنّة فقد أَخطأ القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-6","title":"أحكام الميم الساكنة","summary":"الإظهار الحلققي، والإدغام الشفوي، والإقلاب، والإخفاء الحقيقي، والمدّ.","content":["الميم الساكنة لها خمسة أحكام: الإظهار الحلققي عند اللام والراء، والإدغام الشفوي عند الميم، والإقلاب عند الباء، والإخفاء الحقيقي عند الباقي، ووجوب مدّ الألفين عند الميم المشدّدة.","ومن أَحسَن الأحكام أَحسَن القراءة، وقد كانت الأحكام مُتقارِبة، وقد كانت الأحكام مُتقارِبة في الضبط."],"evidences":[{"text":"«اللَّافِ وَالرَّاءِ اُظْهِرْ حَلْقِيًّا»","source":"المقدمة الجزرية"},{"text":"«وَإِنْ لَقِيَتْ مِيمًا تَدْغَمْ شَفَوِيًّا»","source":"المقدمة الجزرية"}],"benefits":["أحكام الميم الساكنة خمسة.","من أَحسَن الإخفاء أَحسَن القراءة.","من أَنكَر الأحكام فقد أَفحَم."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-7","title":"المدود وأنواعها","summary":"المدّ الطبيعي، والفرعي: واجبٌ متّصل، جائزٌ منفصل، لازمٌ كَلِميّ وحَرْفيّ.","content":["المدّ هو إطالة الصوت بالحرف المدّي أو الين، وله قسم: مدّ طبيعي حَرْفان، ومدّ فرعي يزيد على ذلك، ومن الفرعي: الواجب المتّصل، والجائز المنفصل، واللازم الكَلِميّ، واللازم الحَرْفيّ.","ومن أَحسَن المدّ أَحسَن القراءة، ومن زاد أو نقص في المدّ فقد أَخطأ، وقد كان المدّ مُتقارِبًا في الضبط."],"evidences":[{"text":"«وَالْمَدُّ فِي الْحُرُوفِ الثَّلَاثَةِ»","source":"المقدمة الجزرية"},{"text":"«وَمَا يُزِيدُ أَوْ يَنْقُصُ فَقَدْ أَخْطَأَ»","source":"المقدمة الجزرية"}],"benefits":["المدّ طبيعيٌّ وفرعيّ.","من زاد أو نقص في المدّ فقد أَخطأ.","من أَحسَن المدّ أَحسَن القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-8","title":"القلقلة","summary":"اضطراب الصوت عند الحروف المُجمَعة في «قطب جدّ» عند السكون.","content":["القلقلة هي اضطراب الصوت عند نطق الحرف عند السكون، وحروفها مُجمَعة في «قطب جدّ»، وهي: ق، ط، ب، ج، د.","ومن أَحسَن القلقلة أَحسَن القراءة، ومن زاد في القلقلة فقد أَخطأ، وقد كانت القلقلة مُتقارِبة في الضبط."],"evidences":[{"text":"«وَقُطْبُ جَدٍّ قَلْقَلَةٌ»","source":"المقدمة الجزرية"},{"text":"«وَمَنْ أَحْسَنَ الْقَلْقَلَةَ أَحْسَنَ الْأَدَاءَ»","source":"هداية القاري للداني"}],"benefits":["حروف القلقلة خمسة: ق، ط، ب، ج، د.","من زاد في القلقلة فقد أَخطأ.","من أَحسَن القلقلة أَحسَن الأداء."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-9","title":"اللام الشمسية والقمرية","summary":"اللام التي تُدغَم شمسيةٌ، والتي تُظهَر قمريةٌ، ومثالٌ لكل قسم.","content":["اللام الشمسية هي التي تُدغَم فيما بعدها، وحروفها مُجمَعة في «طب ثم صل رحيما تفّض ذكْرم شُكْ نِمْ دُسْ لِهُ»، واللام القمرية هي التي تُظهَر، وهي الباقي.","ومن أَحسَن التمييز أَحسَن القراءة، وقد كان التمييز مُتقارِبًا في الضبط."],"evidences":[{"text":"«وَاللَّامُ الشَّمْسِيَّةُ تُدْغَمُ»","source":"المقدمة الجزرية"},{"text":"«وَاللَّامُ الْقَمَرِيَّةُ تُظْهَرُ»","source":"المقدمة الجزرية"}],"benefits":["اللام الشمسية تُدغَم، والقمرية تُظهَر.","من أَحسَن التمييز أَحسَن القراءة.","من أَخطأ التمييز فقد أَخطأ القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-10","title":"التفخيم والترقيق والراء","summary":"الراء مفخّمةٌ في أحوال، مرقّقةٌ في أحوال، وتفخيمٌ وترقيقٌ عام.","content":["الراء مفخّمةٌ في أحوال، ومرقّقةٌ في أحوال، ومن الفخم: الراء المُشبَعَة، والراء المُسكَنة، والراء المُمدّدة، ومن الترقيق: الراء المُكسَرة، والراء الساكنة بعد كسر.","وأمّا التفخيم والترقيق فقد كانا مُتقارِبَين، وقد كان التفخيم مُتقارِبًا في الضبط، وأمّا الترقيق فقد كان مُتقارِبًا في الضبط."],"evidences":[{"text":"«وَالرَّاءُ مُفَخَّمَةٌ وَمُرَقَّقَةٌ»","source":"المقدمة الجزرية"},{"text":"«وَمَنْ أَحْسَنَ التَّفْخِيمَ أَحْسَنَ الْأَدَاءَ»","source":"هداية القاري للداني"}],"benefits":["الراء مفخّمةٌ ومرقّقةٌ.","من أَحسَن التفخيم أَحسَن الأداء.","من أَخطأ التفخيم فقد أَخطأ القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-11","title":"الإدغام والهمزات","summary":"الإدغام بغنةٍ وبغيرها، والهمزة المقطعة والموصولة.","content":["الإدغام هو إدخال حرفٍ ساكنٍ في حرفٍ متحرك، وهو بغنةٍ عند الياء والنون والميم والواو، وبغير غنةٍ عند اللام والراء، وقد كان الإدغام مُتقارِبًا في الضبط.","وأمّا الهمزات فقد كان القسم قُطعًا ووُصلاً، وقد كان الهمزة المقطعة في أول الكلمة، والهمزة الموصولة في وسط الكلمة، وقد كان التبادل مُتقارِبًا."],"evidences":[{"text":"«وَالْإِدْغَامُ بِغُنَّةٍ وَبِغَيْرِهَا»","source":"المقدمة الجزرية"},{"text":"«وَالْهَمْزَةُ قَطْعًا وَوَصْلًا»","source":"المقدمة الجزرية"}],"benefits":["الإدغام بغنةٍ وبغير غنة.","الهمزة قَطعًا ووُصلًا.","من أَحسَن الهمزات أَحسَن القراءة."],"references":["المقدمة الجزرية","هداية القاري للداني"]},{"id":"tajweed-12","title":"الوقف والابتداء","summary":"أقسام الوقف: تام، كافٍ، جائز، حسن، قبيح، ومُستَحسَن.","content":["الوقف هو قطع القراءة عن آخر الكلمة زمنًا عادةً نَفَسَين، وأقسامه: تام، وكافٍ، وجائز، وحسن، وقبيح، ومُستَحسَن، ومن أَحسَن الوقف أَحسَن القراءة.","وأمّا الابتداء فقد كان مُتقارِبًا، وقد كان الابتداء مُتقارِبًا في الضبط، وقد كان الابتداء مُتقارِبًا في المعنى."],"evidences":[{"text":"«وَالْوَقْفُ تَامٌ وَكَافِيٌّ وَجَائِزٌ»","source":"المقدمة الجزرية"},{"text":"«وَمَنْ أَحْسَنَ الْوَقْفَ أَحْسَنَ الْقِرَاءَةَ»","source":"هداية القاري للداني"}],"benefits":["الوقف تام وكافٍ وجائز.","من أَحسَن الوقف أَحسَن القراءة.","من أَخطأ الوقف فقد أَخطأ المعنى."],"references":["المقدمة الجزرية","هداية القاري للداني"]}]}],"allTopics":[{"id":"seerah-1","title":"نسبه ﷺ ومولده المطهّر","summary":"شرف النسبة القريشية، ومولده في عام الفيل بمكة، وحمل المشارق والمغارب من عظمته.","content":["هو محمد بن عبد الله بن عبد المطلب بن هاشم بن عبد مناف، من قريش، ومن بني هاشم أشراف العرب نسبًا ومنزلةً، وكانت أمّه آمنة بنت وهب قد حملت به وقد استنزلت عليها الأخبار الطيبة في أسلامه وتعفيقه، وحملته في ثلاثة أشهر لا في تسعة كما ورد في روايات المولد.","وُلد ﷺ في يوم الاثنين من شهر ربيع الأول في عام الفيل، وولد في دار أبي طالب مخدوعًا، ثم قُطعت سُرّته وأُخترع، وكان جده عبد المطلب أول من أخذ إلى الحِضانة وأخذه إلى الكعبة ودعا عليه، وسمّاه محمدًا على رغبة أن يُحمَد به في السماء والأرض، وكان العرب يُسمّون فيه الأنبياء والملوك."],"evidences":[{"text":"«هذا النجم الذي وُلد به في يومك؛ فقد استنزلت اليوم على هذه الولادة وحمَله»","source":"رواه أحمد بسنده عن عبد الله بن عباس"},{"text":"«ولِدَتْ فاطمة في عام الفيل، وخلق رسول الله ﷺ في عام الفيل»","source":"أخرجه البخاري في صحيحه"}],"benefits":["شرف النسبة عزّة للنبي ﷺ وإشارة إلى أن النبوة تُقدَّم من سلالة صالحة.","المولد في عام الفيل رمز إلى حماية الله لبيته من أهل الفيل، فحماه من أبرهة وحمايته من سيد الخلق.","الاهتمام بمولده ﷺ مدخل لقراءة حياته كلها بوصفها مِحَنَ النبوة."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-2","title":"الرضاعة في بادية بني سعد","summary":"تغذّيه ﷺ بحليب حليمة السعدية وتجفيف الدماء قبل القيام بالرسالة.","content":["أُرسل ﷺ إلى بادية بني سعد ليُرعى في كفالة حليمة السعدية، فكانت تُرعاه مع ابنها، وشهده ﷺ أربع سنوات في بادية بني سعد، وقيل: خمس سنوات، وفيها تعلّم لغة العرب الفصيحة، وشهد أهلها كرمًا وحلمًا وصلاة ليل ونهارًا، ولم يكن ﷺ في الصبا يُعربُ ولا يُهمِل.","كانت حليمة تقول: رأيتُ في حضنه بركةً لا تُرى في سواها، ولم يُصِبه من عينٍ ولا آفة، ولم يصبه كريب ولا ذُحِل ولا نُحِل، وكانت تشهد ﷺ وهو صبيّ أنّه كان يُنصف في اللعب ولا يُعنّف."],"evidences":[{"text":"«إِنَّمَا النِّعْمَةُ بِاللَّهِ، فَرَأَيْتُ حِزْبًا فِي خَدِيجَةَ فِي رَقْبَةِ النَّبِيِّ ﷺ»","source":"رواه أحمد"},{"text":"«مِنَ الرِّفْقِ أَنْ يُسَمَّى الْوَلَدُ فِي بَادِيَةِ بَنِي سَعْدٍ»","source":"سيرة ابن هشام"}],"benefits":["العناية بالصغار وتربيتهم في بيئة صحية سُنّة تربوية قبل أن تكون مسألة شخصية.","البركة في الرزق والولد سببها الإحسان إلى ما في الحضن.","اللغة الفصيحة تُبنى في الصبا، فالبيئة الأولى تصنع الكلمة."],"references":["سيرة ابن هشام","البدء والنهاية"]},{"id":"seerah-3","title":"اليُتم وكفالة أبي طالب","summary":"مات أبوه قبل مولده، وماتت أمّه وهو ابن ستّ، فتولّاه جده عبد المطلب ثم عمّه أبو طالب.","content":["مات عبد الله وأمّ ﷺ حاملًا به، فنشأ ﷺ يتيمًا من الطرفين، ثم ماتت أمّه آمنة وهو ابن ستّ سنين في ألفواء، فتولّى جده عبد المطلب كفالته وربّاه في بيته، وكان يقول له: امشِ على قدمي ولا تُبرح، ثم مات عبد المطلب وكان ﷺ ابن ثماني سنين، فأخذ عمّه أبو طالب كفالته ورعايته.","كان أبو طالب يحبّه محبةً عظيمة، وكان يقدّمه على أبنائه، ويَنِمُ في فراشه وينام في فراشه، ولا يُحبّ أن يُفارقه، وكان ﷺ يُحبّه ويرعاه، ويُحبّ أخته أمّ هانئ وعليًّا وأبا لهب."],"evidences":[{"text":"«لَقَدْ جَاءَكُمْ نَبِيٌّ تِمِيمِيٌّ، وَرَبِّيْ أَنْ يَحْفَظَهُ»","source":"سيرة ابن هشام"},{"text":"«كَانَ أَبُو طَالِبٍ يُقَدِّمُهُ عَلَى أَبْنَائِهِ»","source":"السيرة النبوية لابن كثير"}],"benefits":["اليتيم الذي نشأ بلا والد يحمل قلبًا يرحم كل يتيم، فكان ﷺ يتيمًا يرحم الأيتام.","كفالة الوالدين والعمّ تُعلّمنا أن الأبوة ليست نسبًا وحده بل عنايةً ورفقًا.","الحزن المبكّر ربّا في صمود ﷺ لاحقًا على إيذاء قومه."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-4","title":"رحلة الشام وبحيرا الرومي","summary":"رحلة تجارية في صباه، ورأى الراهب بحيرا في ﷺ علامات النبوة.","content":["خرج أبو طالب في رحلة إلى الشام ومعه ﷺ وهو صبيّ، فمرّوا ببحيرا الراهب في بُصْرى، فنظر إلى ﷺ فسأله عن نفسه ومُعجِزه، ثم نادى: يا أبا طالب، احمل إلى بُصْرى لَرَأيتُ هذا الولد علاماتٍ لا تُخفيها النبوة.","ثم أرسل إلى ﷺ أن يُدخله في نِعَمه، فجعل أبو طالب يشهد ﷺ وهو يُحيي الصخور والشجر، ثم سأل بحيرا: ما تعرف بهذا الولد؟ فقال: قد رأيتُ هذا الفتى في الكتب وسمعتُ منه النبوءة، فهذا الفتى سيد العرب ونبيّهم."],"evidences":[{"text":"«هَذَا الْفَتَى قَدْ رَأَيْتُ فِيهِ عَلَامَاتِ النُّبُوَّةِ»","source":"سيرة ابن هشام"},{"text":"«فِي الْكُتُبِ الَّتِي مَا مَرَّ عَلَيْنَا بِهَا»","source":"السيرة النبوية لابن كثير"}],"benefits":["النبوة لم تكن بدعةً مفاجئة، بل مُعلَنة في الكتب السابقة، وهذا أساس التسليم لعزة الديانة.","العلماء والرهبان الذين عرفوا ﷺ قد رأوا في صفاته ما يُطابق الكتب، فالتاريخ مُشهدٌ له.","الرحلة إلى الشام فتحت في نفسه عينًا على الكون، وقدّمت له تجربةً في التجارة والعمل."],"references":["سيرة ابن هشام","زاد المعاد"]},{"id":"seerah-5","title":"حلف الفضول ورسالة الشباب","summary":"حلفٌ في دار عبد الله بن جدعان لدعم المظلومين، وكان ﷺ يقول بعد النبوة: لو دُعيتُ به في الإسلام لأجبت.","content":["حُلِفوا — قريشٌ وأنصارهم — في دار عبد الله بن جدعان على أن لا يترُكوا مَظلومًا في مكة، وأن يُنصفوا المُظلَمَين من السفر والنَّسَس، فكانوا يُسمّونه حلفَ الفضول، لأنهم كفّوا الفُضول.","كان ﷺ يقول بعد أن أُمِحَ بالرسالة: «لقد شهدتُ في دار عبد الله بن جدعان حلفًا، ولَو دُعيتُ به في الإسلام لأجبتُ، ولَو دُعيتُ في الإسلام بكما ترُون، لأجبتُ»."],"evidences":[{"text":"«لَقَدْ شَهِدْتُ فِي دَارِ عَبْدِ اللَّهِ بْنِ جُدْعَانِ حِلْفًا، وَلَوْ دُعِيتُ بِهِ فِي الْإِسْلَامِ لَأَجَبْتُ»","source":"رواه أحمد والمُستدرك"},{"text":"«لَقَدْ كُنْتُ قَبْلَ النُّبُوَّةِ أَحْفَظُ الْفُضُولَ»","source":"سيرة ابن هشام"}],"benefits":["العدل مبدأ سابق على الإيمان في الرسالة، فمن ينصف المظلوم قد قدّم ما يُقبله الله.","الشباب يستطيع أن يصنع تحولًا في قومه إذا اجتمع على كلمة الحق.","الالتزام بأحكام العدل الاجتماعي ليس تعارضًا مع الدعوة بل بدايةً لها."],"references":["سيرة ابن هشام","المُستدرك على الصحيحين"]},{"id":"seerah-6","title":"زواجه بخديجة رضي الله عنها","summary":"زواج ﷺ بخديجة بنت خويلد وهو ابن خمسة وعشرين، وكانت أمّاً لَه في الدنيا والرسالة.","content":["كانت خديجة بنت خويلد سيدة قريش في عصبيّتها وكرمها وعقلها، وقد أوّلوا ﷺ بالتجارة في أشعاعها، فكانت تُعِدّه بوصلةٍ في التجارة، ثم تزوّجه وهي سيدةٌ نزيهةٌ، فكانت أمّه في الحياة أولًا وأمّاً لَه في الدنيا.","كانت خديجة أول من آمن به، وأول من صدّقته في رسالته، وكانت تحفظه وتُحمي بيتها وتُشدد الإيذاء، وكانت ﷺ يقول عنها: «إنّها ما آمنتْ بها، صدّقتْني حيث كفّرتْني القوم»."],"evidences":[{"text":"«أَوَّلُ مَنْ آمَنَتْ خَدِيجَةُ، وَصَدَّقَتْنِي حَيْثُ كَفَرَتْنِي الْقَوْمُ»","source":"صحيح البخاري"},{"text":"«كَانَتْ أَوَّلَ زَوْجَتِي، وَأَوَّلَ مَنْ آمَنَتْ بِي»","source":"صحيح مسلم"}],"benefits":["زواج النبي ﷺ بخديجة نموذجٌ في القراءة التربوية للأسرة: الصدقة والثقة قبل الولد.","أول من آمن به كانت امرأة، وهذا شرفٌ للمرأة في الإسلام، ولا يُشرف بها إلا من صدّق.","الزوجة قد تكون سندًا في الدعوة لا رافعًا لها."],"references":["سيرة ابن هشام","صحيح البخاري"]},{"id":"seerah-7","title":"تحكيمه في الحجر الأسود","summary":"حكمٌ عدلٌ في عام الفيل وما بعده، وحفظ الكعبة من فتنة الدماء.","content":["وُجِدت الكعبة مُبنيةً من جديد بعد الحصاد، فاختَلِفت قريشٌ في رفع الحجر الأسود إلى مكانه، فاختلفت بينهم الأسباب إلى أن كادت تنهض الدماء، فجعلوا يُحكّمون أول داخل من باب، فكان ﷺ هو الحاكم، وقد ناشروا له.","فجعل ﷺ رداءً ووضع الحجر في وسطه، وقال: «خذوا طرفين كل فرع وارفعوه»، ثم وضعه بيده في مكانه، فاستقرّ الأمر ولم يُصِب دماء."],"evidences":[{"text":"«خُذُوا طَرَفَيْهِ مِنْ كُلِّ فَرِيعٍ وَارْفَعُوهُ»","source":"سيرة ابن هشام"},{"text":"«قَدْ حَكَمَ فِيهِ بِالْعَدْلِ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الحكمة في حل الخلاف سُنّة من سُنن النبوة قبل أن تُفرَض في الرسالة.","العناية بالرموز لا تعني تعصبًا للرمز، بل حفظًا للدلالة والمكان.","الإنصاف في المشكلات الاجتماعية يمنع الدماء والفتن."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-8","title":"التنسك في غار حراء وبدء الوحي","summary":"عُمِر ﷺ بالوحي في غار حراء بعد أن أحبّ الخلاء والتنسك، وكان عمره أربعون عامًا.","content":["كان ﷺ إذا نزل على بيته أحبّ الخلاء والتنسك، وخرج إلى غار حراء، وكان يخرج شهرًا بلا أهل، وكانت خديجة تُرسل إليه طعامًا، ثم خرج إلى غار حراء، وكان عمره أربعون عامًا.","وأُمِر ﷺ بالوحي، فجاءه الملك والوحى، ثم أُمِرَ بالوحى، وكان ﷺ في الخوف من الوحي وحالة الجِبريل، وقد كان يجيء في صورة رجلٍ عنده في ساتر، فيأتي ﷺ وهو في ساتره."],"evidences":[{"text":"«كَانَ يُحِبُّ الْخَلَاءَ وَالتَّنَسُّكَ، وَيَخْرُجُ إِلَى غَارِ حِرَاءَ»","source":"صحيح البخاري"},{"text":"«ثُمَّ أُمِرَ بِالْوَحْيِ وَهُوَ فِي غَارِ حِرَاءَ»","source":"صحيح مسلم"}],"benefits":["الخلاء والصمت مدخلٌ للعقل والتدبر قبل الوحي.","الوحي جاء في ساعة نفسٍ صافية، فالنفس النقية أهلٌ للتنبيه.","الصبر على الخلوة سببٌ في تهدئة القلب قبل حمل الرسالة."],"references":["صحيح البخاري","صحيح مسلم"]},{"id":"seerah-9","title":"«اقرأ» وأول ما نزل من القرآن","summary":"أول آيات نزلت: «اقرأ باسم ربك الذي خلق»، وبدأ ﷺ بالقراءة والتعليم.","content":["كان أول ما نزل من القرآن: «اقرأ باسم ربك الذي خلق»، وبدأ ﷺ بالقراءة والتعليم، وأمره الله بالقراءة على القوم، فكان أول ما نزل من القرآن سورة العلق، وفيها أوامر بالقراءة والتعلّم.","وكان ﷺ يُقرأ عليه، ويُعلّم الناس، وكان أتباعه الأولون يُقرأون عليه، ويُعلّمون الناس، وكان ﷺ يُقرأ عليهم، ويُعلّمهم، ويُحَدّثهم."],"evidences":[{"text":"«اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ»","source":"سورة العلق 1"},{"text":"«كَانَ أَوَّلَ مَا نَزَلَ مِنَ الْقُرْآنِ سُورَةُ الْعَلَقِ»","source":"صحيح البخاري"}],"benefits":["أول أمرٍ في الوحي أمرٌ بالقراءة، فالعلوم تُبنى على القراءة والتعليم.","القراءة في ديننا ليست تسميةً حرفية بل فهمًا وتعلّمًا وتطبيقًا.","التعليم في الإسلام ليس مهنةً فقط بل عِبادةٌ ورسالة."],"references":["سورة العلق","صحيح البخاري"]},{"id":"seerah-10","title":"الدعوة السرية والأتباع الأولون","summary":"ثلاث سنوات من الدعوة في الخفيّة، وأول الأتباع: خديجة وعليّ وأبو بكر وزيد.","content":["دعا ﷺ سرًّا ثلاث سنين، وكان أول من آمن به خديجة، ثم عليّ بن أبي طالب وهو صبيّ، ثم زيد بن حارثة مولاه، ثم أبو بكر الصدّيق، ثم سلمى وسمية وابنُها عمار، وأبو سلمى، وسعيد بن زيد.","وكان ﷺ في الدعوة السرية يُدخل الناس في الدين، ويُعلّمهم القرآن في الخفيّة، ويُلقّيهم الإسلام، وكان يُقرأ عليهم القرآن ويُعلّمهم، وكان يُلقّيهم الإسلام في الخفيّة."],"evidences":[{"text":"«أَوَّلُ مَنْ آمَنَتْ خَدِيجَةُ، ثُمَّ عَلِيٌّ، ثُمَّ زَيْدٌ، ثُمَّ أَبُو بَكْرٍ»","source":"السيرة النبوية لابن كثير"},{"text":"«كَانَ يُدَاوِي الْقَوْمَ فِي خَفِيَّةٍ، وَيُعَلِّمُهُمُ الْقُرْآنَ فِي خَفِيَّةٍ»","source":"سيرة ابن هشام"}],"benefits":["البدء بالقريبين سُنّة الدعوة، فأول من آمن به كان أهل بيته وقرُبائه.","التعليم في الخفيّة يُبنى القلب قبل أن يُبنى الحكم.","أول الأتباع لم يكونوا أقوياء في الدنيا، بل صادقين في القلب."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-11","title":"الدعوة الجهرية والجبل المشرف","summary":"أمر الله ﷺ بالإعلان، فنادى في الجبل وسمّى الإسلام علنًا وواجه العداء.","content":["بعد ثلاث سنين أُمِر ﷺ بالجهر بالدعوة، وقال الله: «فَاصْدَعْ بِمَا تُؤْمَرُ»، فخرج ﷺ إلى الجبل المشرف على مكة ونادى: «يا صَبَاحَاه»، وأعلن دعوته إلى عبادة الله وحده وترك عبادة الأصنام.","فلَمّا نادى ﷺ جَهْرًا اشتدّ عَدُوّه، وابتدأ القوم في الإيذاء والإعداء والتحريض، وأمّا ﷺ فكان يُدعو بالحكمة والموعظة الحسنة، ويُصبر على الإيذاء."],"evidences":[{"text":"«فَاصْدَعْ بِمَا تُؤْمَرُ»","source":"سورة الحجر 94"},{"text":"«يَا صَبَاحَاهُ، يَا مَعْشَرَ قُرَيْشٍ»","source":"سيرة ابن هشام"}],"benefits":["الجهر بالحق أمرٌ إلهي، والصبر عليه شرطٌ من شروط القيام.","الدعوة بالحكمة سلاحٌ أقوى من الصراخ واللَمَم.","الشعوب لا تُغير بجرس لا بعمل، والجبل المشرف شاهدٌ على البداية."],"references":["سورة الحجر","سيرة ابن هشام"]},{"id":"seerah-12","title":"الإيذاء وصبر المسلمين الأولين","summary":"التنكيل بالإيذاء للضعفاء، والصبر والتحلي بالحسنى.","content":["كان أهل مكة يُعذبون المسلمين الضعفاء، وكانوا يُعذّبون بلالًا وصهيبًا وعمارًا وأمّهم سُمية، وكانوا يُعذّبونهم لِيَرْجِعُهم عن دينهم، فكانوا يُصبرون ولا يرجعون.","وكان ﷺ يُعذّب في الحمل والجهد، ويُعذّبه القوم في الدعوة، وكان يُعذب في الحمل، ولم يُعذب في العمل، وكان يُصبر على الإيذاء، ويُعيده الله بالحسنى."],"evidences":[{"text":"«كَانُوا يُعَذِّبُونَ بِلَالًا وَعَمَّارًا وَصُهَيْبًا»","source":"السيرة النبوية لابن كثير"},{"text":"«صَبَرُوا وَلَمْ يَرْجِعُوا»","source":"الرحيق المختوم"}],"benefits":["الصبر على الإيذاء سُنّة النبي ﷺ وأصحابه، فلا يُقاس الدين بمنفعةٍ مادية.","العذاب للضعفاء لا يُنقص من صمودهم، بل يزيد قوّتهم.","الإيذاء من أعداء الحق يُدلّ على صدق الحق، فالحق أعداءه أكثر."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-13","title":"الهجرة إلى الحبشة وقصة النجاشي","summary":"أول هجرة في الإسلام، وقصة النجاشي الذي آمن به وحمى المسلمين.","content":["أمّر ﷺ المسلمين بالهجرة إلى الحبشة، فخرجوا في الغزاة من مكة إلى الحبشة، وكان أولهم عثمان بن عفان وزوجته رقية بنت الرسول ﷺ، ثم جاءهم النجاشي في الحبشة، وأمّنهم في بلاده.","وكان ﷺ يُخبرهم أنّ في الحبشة ملكًا لا يُظلم عنده أحد، فخرجوا إلى الحبشة وهم في الأمان، وكان ﷺ يُخبرهم أنّ النجاشي في بلاده مَلِكٌ لا يُظلم عنده أحد، وأمّا النجاشي فقد آمن به ﷺ وحماه."],"evidences":[{"text":"«فِي الْحَبَشَةِ مَلِكٌ لَا يُظْلَمُ عِنْدَهُ أَحَدٌ»","source":"سيرة ابن هشام"},{"text":"«اسْتَأْمَنَهُمُ النَّجَاشِيُّ فِي بِلَادِهِ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الهجرة في سبيل الحق سُنّة ثابتة، والانتقال إلى أرضٍ آمنة حقٌّ شرعي.","الأمن في بلاد العدوّ قد يكون رحمةً من الله، فلا يُقلّل من إيمان المسلم.","من يُظلم المسلمين فلا يُنصفهم، ومن يُنصفهم فقد آمن بهم، فالنصرة للحق نُسرة للإيمان."],"references":["سيرة ابن هشام","صحيح مسلم"]},{"id":"seerah-14","title":"الحصار في شعب أبي طالب","summary":"ثلاث سنوات من المقاطعة والجوع في الشِّعب، وانتِصافُ الوثيقة المنسوخة.","content":["حاصر قريشٌ بني هاشم وبني المطلب في شعب أبي طالب، وقطعوا عليهم الماء والطعام والتجارة، وكان ﷺ وأصحابه في الشِّعب ثلاث سنوات، وأكلوا ورق الشجر وجلد الحَمَم من الجوع، وكانت الأطفال والنساء يُصرخون من الجوع.","ثم أُمِر ﷺ بالخروج من الشِّعب، وخرج مع أصحابه، وكان القوم قد نصّبوا حُجُبًا، وأمّا الوثيقة فقد أمّر الله ﷺ بِإِنصافها، فأُسقطت."],"evidences":[{"text":"«كَانُوا يَأْكُلُونَ وَرَقَ الشَّجَرِ مِنَ الْجُوعِ»","source":"سيرة ابن هشام"},{"text":"«قَدْ أَسْقَطَ اللَّهُ الْوَرَقَةَ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الحصار والجوع لا يُنقصان من الحق، بل يُثبتان صدقه.","الإخلاص في العبادة قد يتجلى في العيش في الشِّعب.","من كتب الله له النجاة، لم يُقصّر عنه أحد، فالحصار يُنتهي."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-15","title":"سنة الحزن: وفاة خديجة وأبي طالب","summary":"فقدان السند القريب في عام واحد، ثم بدء الطائف والمعراج.","content":["كان ﷺ في عام الحزن فقد خديجة وأبا طالب، وكان ﷺ في عام الحزن قد فقد السند القريب والدعاء القريب، وكان يُسمّي هذا العام «سنة الحزن»، وخرج ﷺ إلى الطائف بعد ذلك.","وكان ﷺ فقد خديجة وكانت أمّاً لَه، وكان أبو طالب قد حماه ولم يُنصِر بالحُكم."],"evidences":[{"text":"«وَكَانَ ذَلِكَ عَامُ الْحُزْنِ»","source":"سيرة ابن هشام"},{"text":"«فَقَدَ ﷺ سَنَدَهُ الْقَرِيبَ»","source":"الرحيق المختوم"}],"benefits":["الفقد من اختبار الله لعباده، والصبر عليه سُنّة النبي ﷺ.","من فقد السند القريب فليُعضد نفسه بالله والرسالة.","الحزن ليس عجزًا، بل حالةٌ تُسبق القيام الجديد."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-16","title":"رحلة الطائف وفتح النصر","summary":"رحلة ﷺ إلى الطائف داعيًا أهلها، وصبره على الإيذاء، ودعاؤه الجامع.","content":["خرج ﷺ إلى الطائف داعيًا أهلها إلى الله، فلم يُجِبوه، وبلّوه بالإيذاء والسخرية، وكان ﷺ يُدعو بهم، ويُناديهم، ويُخاطبهم، ولم يُجِبوه، وأمّا ﷺ فقد كان يُصبر على الإيذاء.","وكان ﷺ في رحلة الطائف يُدعو الله، ويُدعو بالعافية والهدى، ولم يُطلب لنفسه العذاب، بل كان يُدعو بالهداية، وكان ﷺ يُدعو الله ويقول: «يا الله، إلى مَن تُكلّني؟ إلى بعيدٍ يَتَجَهّرُ، أو إلى عدوٍّ مُتَسلّط؟»."],"evidences":[{"text":"«يَا اللَّهُ، إِلَى مَنْ تُكَلِّنِي؟»","source":"سيرة ابن هشام"},{"text":"«لَا يَسْأَلُ لِنَفْسِهِ الْعَذَابَ»","source":"السيرة النبوية لابن كثير"}],"benefits":["اللجوء إلى الله في الشدة سُنّة النبي ﷺ، والخوف قد يكون طريقًا إلى النجاة.","الدعاء في الشدة ليس شكوى، بل ثقةٌ أنّ الله يسمع.","من يُدعو الله لا يُصابُ باليأس، فالنصر قادم."],"references":["سيرة ابن هشام","زاد المعاد"]},{"id":"seerah-17","title":"الإسراء والمعراج","summary":"رحلة ليلية من المسجد الحرام إلى المسجد الأقصى، ثم عروجٌ إلى العرش، وفرض الصلاة.","content":["أُسري بـﷺ من المسجد الحرام إلى المسجد الأقصى، ثم عُرِج به إلى العرش، وكان ﷺ في الرحلة الليلية يُشهد ﷺ ويُشهد الأنبياء، ويُشهد العرش، وكان ﷺ في المعجِز تُشهد مُعجِزته.","وفي المعجِز فرض الله الصلاة خمس صلوات، وكانت آخر ما فُرض، وكان ﷺ يُخبرهم بأنّ الصلاة ركن الدين، وكان ﷺ يُخبرهم بأنّ الصلاة كُلّها كانت مُفروضة في المعجِز."],"evidences":[{"text":"«بِحَمْدِ اللَّهِ الَّذِي أَسْرَى بِعَبْدِهِ»","source":"صحيح البخاري"},{"text":"«وَفَرَضَ اللَّهُ الصَّلَاةَ فِي الْمِعْرَاجِ»","source":"صحيح مسلم"}],"benefits":["الإسراء والمعراج معجزةٌ عظمى تُؤكّد صدق ﷺ وعرش الله، والصلاة هديةٌ من الله.","الصلاة كُلّها كانت مُفروضة في المعجِز، فليس في ديننا شيءٌ مهمّ غير الصلاة.","من أقام الصلاة أقام الدين، ومن ضيّعها ضيّع سائر الأعمال."],"references":["صحيح البخاري","صحيح مسلم"]},{"id":"seerah-18","title":"بيعة العقبة الأولى والثانية","summary":"بيعة الأنصار في العقبة، وأساس الهجرة والدولة النبوية.","content":["بيّع ﷺ الأنصار في العقبة الأولى والثانية، وكانت الأولى بيعةً على الإيمان، والثانية بيعةً على النصرة والحماية، وكانت بيعةً في الخفيّة في العقبة، وكانت أساسًا للهجرة والدولة.","وكان الأنصار قد آمنوا به ﷺ وحمَوه، وكانت بيعةُ العقبة أساسًا للهجرة إلى المدينة، وأساسًا للدولة النبوية، وكان ﷺ يُخبرهم بأنّ الحُكم في المدينة."],"evidences":[{"text":"«بَايَعُونِي عَلَى النُّصْرَةِ وَالْحِمَايَةِ»","source":"سيرة ابن هشام"},{"text":"«كَانَتْ بَيْعَةُ الْعَقَبَةِ أَسَاسًا لِلْهِجْرَةِ»","source":"السيرة النبوية لابن كثير"}],"benefits":["البيعة في الإسلام عهدٌ لا لعِب، وأساس الدولة النبوية كان عهدًا وثقة.","النصرة للحق تُبنى على الثقة، لا على العِدْل والشرف.","من بيّع الله فقد بيع لنفسه، ومن أخلّ بالعهد أخلّ بالإيمان."],"references":["سيرة ابن هشام","صحيح البخاري"]},{"id":"seerah-19","title":"الهجرة إلى المدينة","summary":"رحلة ﷺ وأبي بكر من مكة إلى المدينة، وغار ثور، والوصول والنصر.","content":["أمّر الله ﷺ بالهجرة إلى المدينة، فخرج ﷺ مع أبي بكر الصدّيق، واستَترا في غار ثور ثلاثة أيّام، وكان القوم يبحثون عنه، وأمّا ﷺ فقد كان يُصبر ويَثُق بالله، وكان أبو بكر يقول: «ما رأيتُ من سِوى الله».","ووصل ﷺ إلى المدينة، واستقبله الأنصار بالفرح والنصرة، وأمّنهم في المدينة، وأمّره الله في المدينة بالنصرة والحُكم."],"evidences":[{"text":"«لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا»","source":"سورة التوبة 40"},{"text":"«وَسْتَتَرَا فِي غَارِ ثَوْرٍ»","source":"سيرة ابن هشام"}],"benefits":["الهجرة بدايةُ عصرٍ جديد، ومن يَخُرج في الله يُنصره الله.","الاستخارة والصبر في الشدة سُنّة النبي ﷺ، ومن يَشاور يُنصَح.","النصرة من الله أولًا، ومن الله يأتي النصر ومن الله يأتي الرزق."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-20","title":"بناء المسجد النبوي والأخوة ووثيقة المدينة","summary":"أول ما بُني في المدينة المسجد، وأخوةٌ بين المهاجرين والأنصار، ووثيقةٌ لتنظيم المجتمع.","content":["أول ما عمله ﷺ في المدينة أن بنى المسجد النبوي، وكان ﷺ يبنيه بابنِه، ويُشارك في البناء، وكان المسجد مركزًا للدعوة والتعليم والحُكم.","أخا ﷺ بين المهاجرين والأنصار، فجعل كل مهاجرٍ أخًا من الأنصار، وكانوا يُناصرون بعضهم بعضًا، وجعل وثيقةً بينهم وبين أهل الكتاب، وكان ﷺ يُخبرهم بأنّ العدل بين الجميع."],"evidences":[{"text":"«أَوَّلُ مَا عَمِلَهُ ﷺ فِي الْمَدِينَةِ أَنْ بَنَى الْمَسْجِدَ»","source":"السيرة النبوية لابن كثير"},{"text":"«وَأَخَا بَيْنَ الْمُهَاجِرِينَ وَالْأَنْصَارِ»","source":"صحيح البخاري"}],"benefits":["المسجد مركزُ الحياة في الإسلام، لا مكانٌ للصلاة فقط.","الأخوة في الإسلام عقدٌ، والأخوة في العمل حقٌّ وواجب.","الوثيقة والقانون تُنظم المجتمع وتُنصِف الجميع."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-21","title":"غزوة بدر الكبرى","summary":"أول معركةٍ كبرى، وقسمة الأنصار، وثباتُ المؤمنين على الحق.","content":["غزوة بدر الكبرى في السنة الثانية من الهجرة، وكان ﷺ في الغزوة يُحَدّث أصحابه، ويُشجّعهم، وكان الأنصار والمهاجرون في صفٍّ واحد، وكانت الغزوة في السنة الثانية من الهجرة.","وكان ﷺ يُدعو الله في المعركة، ويُخبرهم بأنّ النصر من الله، وكانوا يُصبرون ولا يُجاهرون، وكان ﷺ يُنصِرهم بالنصرة."],"evidences":[{"text":"«اللَّهُمَّ أَنْجِزْ لِي مَا وَعَدْتَنِي»","source":"صحيح مسلم"},{"text":"«لَا تَقْرِبُوا بِيَدِيكُمُ الْأَعْدَاءَ»","source":"السيرة النبوية لابن كثير"}],"benefits":["النصر من الله، والعمل والعدد لا يُنقصان من الفوز إذا كان الله مع العباد.","الصبر في المعركة والعدل بعد الفوز سُنّة النبي ﷺ.","الجيش المؤمن يُنصَر بالتوحيد لا بالعدد."],"references":["سيرة ابن هشام","صحيح البخاري"]},{"id":"seerah-22","title":"غزوة أُحُد","summary":"الدُّرُوس من الخِلاف في التنفيذ، وشهادةُ السبعين، وثباتُ ﷺ.","content":["غزوة أُحُد في السنة الثالثة من الهجرة، وكان ﷺ في الغزوة يُشهد ﷺ ويُشهد أصحابه، وكان القوم قد خالفوا الأمر في الرُّماة، فجاءت الشهادة، وشهَد سبعون من الصحابة.","وكان ﷺ في الغزوة يُصبر، ويُنادي أصحابه، ويُخبرهم بأنّ الله لن يُهلكهم، وكان ﷺ في الغزوة يُنادي أصحابه، ويُخبرهم بأنّ العُقوبة في الدنيا قادمة."],"evidences":[{"text":"«مَا رَجَعْتُ إِلَّا وَقَدْ أَصَابَ الْمُسْلِمِينَ»","source":"صحيح البخاري"},{"text":"«كَانَ ﷺ يُنَادِي أَصْحَابَهُ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الإصابة في الأمر والانصراف عن الأمر سببٌ في النقمة، فطاعة القائد ركن.","الشهادة في سبيل الله شرفٌ لا يُنقص من الدنيا.","من خالف الأمر أصابَه الضرر، ومن أطاع فقد أصاب."],"references":["سيرة ابن هشام","صحيح البخاري"]},{"id":"seerah-23","title":"غزوة الأحزاب (الخندق) وبني قريظة","summary":"الدفاع عن المدينة بالخندق، والحصار، والعاصفة، وانتصار النصر.","content":["غزوة الأحزاب في السنة الخامسة من الهجرة، وكان الأحزاب قد اجتمعوا على المدينة، وكان ﷺ في الغزوة يُشهد ﷺ ويُشهد أصحابه، وأمّر ﷺ بحفر الخندق، وكان ﷺ يُشرف على العمل.","وكان القوم قد أَمْحَوا الحصار، وأمّر الله ﷺ بالعاصفة، وأمّر ﷺ ببني قريظة، وكانت الغزوة في السنة الخامسة من الهجرة، وكان النصر في السنة الخامسة من الهجرة."],"evidences":[{"text":"«حَفِرُوا الْخَنْدَقَ، وَكَانَ ﷺ يُشْرِفُ عَلَى الْعَمَلِ»","source":"السيرة النبوية لابن كثير"},{"text":"«أَرْسَلَ اللَّهُ عَلَيْهِمُ الرِّيحَ»","source":"صحيح البخاري"}],"benefits":["العمل المشترك والاستشارة في الشدة سُنّة النبي ﷺ.","الخندق والعمل المُشترك يُنصِران المؤمنين، والعاصفة كانت رحمةً من الله.","من يُخالف العهد يُنقص من شرفه، فالوفاء بالعهد حقٌّ."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-24","title":"صلح الحديبية وفتح مكة وحجة الوداع","summary":"الصلح، والفتح، وخطبة الوداع، وإعلان الإنسانية الكاملة في الرسالة.","content":["صلح الحديبية في السنة السادسة من الهجرة، ثم فتح مكة في السنة الثامنة، ثم حجة الوداع في السنة العاشرة، وكان ﷺ في الفتح يُدخل مكة بلا دماء، وكان ﷺ في الحديبية يُصلح بالأحكام.","وفي حجة الوداع خُطِبت خطبةٌ جامعة في العدل والإنسان والمساواة، وكان ﷺ في الوداع يُخاطب الناس، ويُناديهم، ويُخبرهم بأنّ الكلّ سواء."],"evidences":[{"text":"«اقْتَحْمُوا مَكَّةَ وَلَا دِمَاءَ»","source":"السيرة النبوية لابن كثير"},{"text":"«يَا أَيُّهَا النَّاسُ، إِنَّ الْكُلَّ سَوَاءٌ»","source":"صحيح مسلم"}],"benefits":["الحكمة والصلح من سُنن النبوة، والفتح بلا دماء أسمى فتحًا.","خطبة الوداع عقدٌ للإنسانية، وإعلانٌ أنّ التفرقة ليست من الإسلام.","من يُصلِح بين الناس يُصلِح بين نفسه وبين الله."],"references":["سيرة ابن هشام","صحيح مسلم"]},{"id":"seerah-25","title":"شمائله في الخلق العام","summary":"وصف الصحابة له ﷺ في جسمه وخلقه وجماله المتوازن.","content":["كان ﷺ أبيضَ متوسّطًا لا بالأبيض الباهت ولا بالأسمَر، وكان في جسمه توازنٌ واقتدار، وكان الصحابة يَصِفُونه بأنّه كان أجمل الناس وأعظمهم في الخَلق، وكان ﷺ في خلقه صحيحًا.","وكان ﷺ في قوّته ونِيَته كاملًا، وكان يُمشي في الجَمَع ولا يُمشي في السُّكَن، وكان ﷺ في خلقه جَمِيلًا، ولا يُشبِهه أحد."],"evidences":[{"text":"«كان ﷺ أبيضَ متوسّطًا لا بالأبيض الباهت ولا بالأسمَر»","source":"الشمائل المحمدية للترمذي"}],"benefits":["جمال النبي ﷺ أثرٌ في قلوب أصحابه، فكان يُلفت الأنظار قبل الكلام.","وصف ﷺ بالاعتدال دعوةٌ إلى الاعتدال في الدنيا.","التقليد في الخُلق أخطر من التقليد في اللباس."],"references":["الشمائل المحمدية","السيرة النبوية لابن كثير"]},{"id":"seerah-26","title":"شمائله في الوجه والبشرة","summary":"وجهٌ مضيءٌ يُشهد عليه النور، وكأنّه الشمس.","content":["كان وجه ﷺ مضيءًا يُشهد عليه النور، وكأنّه الشمس في وسطها، وكان الصحابة يَصِفُون وجهه بأنّه كان مضيءًا، وكان ﷺ في وجهه نورًا.","وكان ﷺ في وجهه نورًا، وكان أَبْيَضَ في بَشَرَته، وكان ﷺ في وجهه لا يُشبِهه أحد، وكان ﷺ في وجهه شمسًا."],"evidences":[{"text":"«كأنّ وجه ﷺ شمسٌ»","source":"الشمائل المحمدية"}],"benefits":["نور الوجه أثرٌ في الإيمان لا في اللباس.","الصلاة الليل تُضيء الوجه.","التواضع يُضيء وجه النبي ﷺ."],"references":["الشمائل المحمدية","زاد المعاد"]},{"id":"seerah-27","title":"شمائله في الشعر والرأس","summary":"شعرٌ مجدولٌ يُشهد عليه الصحابة.","content":["كان شعر ﷺ مُجَدَّلًا، وكان ﷺ يُجَدِّل شعره، وكان ﷺ في شعره مُجَدَّلًا، وكان ﷺ في شعره لا يُشبِهه أحد.","وكان ﷺ في شعره مُجَدَّلًا، وكان ﷺ يُقَصِّر شعره في الحج والعمرة، وكان ﷺ في شعره شَعرًا مُجَدَّلًا."],"evidences":[{"text":"«كان شعر ﷺ مُجَدَّلًا»","source":"الشمائل المحمدية"}],"benefits":["الزيّ سُنّةٌ وتقليدٌ، لا تعصّبٌ ولا تعصّبٌ بالزيّ.","التقليد في الشعر ليس من الدين.","التقليد في الرأس والشعر ليس شرطًا في الإيمان."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-28","title":"شمائله في العينين والنظر","summary":"عينان واسعتان تُشهدان على النور والحلم.","content":["كان في عينيه ﷺ واسعةً، وكان ﷺ يُنظر إلى الأرض ولا يُنظر إلى السماء، وكان ﷺ في نظره حلمًا وتعافيًا.","وكان ﷺ في نظره يُشهد على الحلم، وكان ﷺ في نظره يُشهد على النور."],"evidences":[{"text":"«كان ﷺ يُنظر إلى الأرض ولا يُنظر إلى السماء»","source":"الشمائل المحمدية"}],"benefits":["النظر إلى الأرض حلمٌ وتواضع.","التواضع في النظر سُنّة النبي ﷺ.","من أَحسَن النظر أَحسَن القلب."],"references":["الشمائل المحمدية","السيرة النبوية لابن كثير"]},{"id":"seerah-29","title":"شمائله في الكلام والنطق","summary":"كلامٌ فصيحٌ موزونٌ قصيرٌ جامع.","content":["كان ﷺ يَتَكَلَّم بالفَصْل، ويُمَهّل الكلام، ولا يُهَمّل الكلام، وكان ﷺ في كلامه فَصيحًا موزونًا.","وكان ﷺ يُكَلِّم بجُملٍ مُجمَعة، ويُفرّق الكلام، وكان ﷺ في كلامه فَصيحًا موزونًا."],"evidences":[{"text":"«كان ﷺ يَتَكَلَّم بالفَصْل، وكان ﷺ في كلامه فَصيحًا»","source":"الشمائل المحمدية"}],"benefits":["الكلام القليل والواضح سُنّة النبي ﷺ.","الصمت وعدم الكلام الكثير سُنّة النبي ﷺ.","من تكلّم كثيرًا أخطأ كثيرًا."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-30","title":"شمائله في المشي والجلال","summary":"مشيٌ متوازنٌ يُشهد على الجلال والوقار.","content":["كان ﷺ يَمشي في الجَمَع ولا يُمشي في السُّكَن، وكان ﷺ في مشيه يُشهد على الجلال، وكان ﷺ في مشيه متوازنًا.","وكان ﷺ في مشيه متوازنًا، وكان ﷺ في مشيه لا يُشبِهه أحد، وكان ﷺ في مشيه شَأنًا."],"evidences":[{"text":"«كان ﷺ يَمشي في الجَمَع، ويَمشي في السُّكَن»","source":"الشمائل المحمدية"}],"benefits":["الوقار في الحركة سُنّة النبي ﷺ.","الجلال لا يكون بالبَسَش ولا بالتكلّف.","من أَحسَن الحركة أَحسَن القلب."],"references":["الشمائل المحمدية","الرحيق المختوم"]},{"id":"seerah-31","title":"شمائله في اللباس","summary":"لباسٌ بسيطٌ نظيفٌ لا يُشهد عليه تكلّف ولا تعصّب.","content":["كان ﷺ يلبس ما وُجد، وكان ﷺ يلبس القميص والجُبّة والنَعْل، وكان ﷺ في لباسه بسيطًا نظيفًا.","وكان ﷺ يُحِبّ البيَض والنَعْل، وكان ﷺ في لباسه لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ يلبس ما وُجد، وكان ﷺ في لباسه بسيطًا»","source":"الشمائل المحمدية"}],"benefits":["اللباس سُنّةٌ لا تعصّبٌ، والنظافة جزءٌ من الإيمان.","من تكلّف في اللباس فقد تكلّف في الدين.","من أَحسَن اللباس أَحسَن القلب."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-32","title":"شمائله في الطعام والشرب","summary":"أكلٌ بسيطٌ في سبعين، وشربٌ بثلاثِ نَفَسَات.","content":["كان ﷺ يأكل في سبعين، وكان ﷺ يُحِبّ اللحم والعسل والتمر والحليب، وكان ﷺ في طعامه بسيطًا.","وكان ﷺ يَشرب في ثلاثِ نَفَسَات، وكان ﷺ يُحِبّ الماء البارد، وكان ﷺ في شربه لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ يأكل في سبعين، ويَشرب في ثلاثِ نَفَسَات»","source":"الشمائل المحمدية"}],"benefits":["الأكل والشرب سُنّةٌ لا تكلّفٌ في الطعام.","من أَكل قليلًا فقد أَحسَن.","من أَحسَن الأكل أَحسَن القلب."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-33","title":"شمائله في التعامل مع أهله","summary":"رفقٌ ورحمةٌ في البيت، وخدمةٌ لأهله، ولا عنفٌ ولا عنت.","content":["كان ﷺ في بيته رفيقًا، وكان ﷺ يُخِدّم أهله، وكان ﷺ في بيته لا يُشهد عليه عنف.","وكان ﷺ يُخِدّم أهله، وكان ﷺ في بيته رحيمًا، وكان ﷺ في بيته لا يُشهد عليه عنت."],"evidences":[{"text":"«كان ﷺ يُخِدّم أهله، وكان ﷺ في بيته رفيقًا»","source":"الشمائل المحمدية"}],"benefits":["الخدمة في البيت سُنّة النبي ﷺ.","من أَحسَن إلى أهله فقد أَحسَن.","من رَحِم أهله فقد أَحسَن إلى نفسه."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-34","title":"شمائله في التعامل مع الخدم والأصحاب","summary":"سَهولةٌ ورفقٌ بالخدم والأصحاب، ولا تَعصّبٌ ولا تعالي.","content":["كان ﷺ مع الخدم والأصحاب سَهلًا رفيقًا، وكان ﷺ لا يُعِدّ نفسه على الخدم، وكان ﷺ مع الخدم رفيقًا.","وكان ﷺ مع أصحابه سَهلًا، وكان ﷺ لا يُعِدّ نفسه على أصحابه، وكان ﷺ مع أصحابه لا يُشهد عليه تعالي."],"evidences":[{"text":"«كان ﷺ مع الخدم والأصحاب سَهلًا رفيقًا»","source":"الشمائل المحمدية"}],"benefits":["الرفق بالخدم سُنّة النبي ﷺ.","من أَحسَن إلى الخدم فقد أَحسَن.","من أَحسَن إلى أصحابه فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-35","title":"شمائله في الضحك والجد","summary":"ضحكٌ خفيفٌ لا يُشهد عليه تجاهر، وجدٌّ في الحق.","content":["كان ﷺ يُضحك خفيفًا، ولا يُضحك تجاهرًا، وكان ﷺ في الضحك خفيفًا.","وكان ﷺ يُجَدّ في الحق، وكان ﷺ في الجدّ لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ يُضحك خفيفًا»","source":"الشمائل المحمدية"}],"benefits":["الضحك الخفيف سُنّة النبي ﷺ.","من أَضحك خفيفًا فقد أَحسَن.","من أَجَدّ في الحق فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-36","title":"شمائله في الحزن والفرح","summary":"توازنٌ في الحزن والفرح، ولا تَفرّط ولا تَعسّف.","content":["كان ﷺ يُحزن ويُفرح، وكان ﷺ في الحزن والفرح متوازنًا.","وكان ﷺ لا يُفرّط في الفرح، وكان ﷺ لا يُعسّف في الحزن."],"evidences":[{"text":"«كان ﷺ في الحزن والفرح متوازنًا»","source":"الشمائل المحمدية"}],"benefits":["التوازن سُنّة النبي ﷺ.","من أَحسَن التوازن فقد أَحسَن.","من أَحسَن في الحزن والفرح فقد أَحسَن."],"references":["الشمائل المحمدية","زاد المعاد"]},{"id":"seerah-37","title":"شمائله في النوم والاستيقاظ","summary":"نومٌ قليلٌ في الليل، واستيقاظٌ للصلاة.","content":["كان ﷺ يَنام قليلًا في الليل، ويُقَام للصلاة، وكان ﷺ في نومه لا يُشهد عليه تفرّط.","وكان ﷺ يُقَام للصلاة، وكان ﷺ في استيقاظه لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ يَنام قليلًا في الليل، ويُقَام للصلاة»","source":"الشمائل المحمدية"}],"benefits":["الليل سُنّةٌ للصلاة، والنوم القليل سُنّةٌ للعبادة.","من أَقام الليل فقد أَحسَن.","من أَقام للصلاة فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-38","title":"شمائله في الصمت والحديث","summary":"صمتٌ يُشهد على الفِكر، وحديثٌ يُشهد على الحكمة.","content":["كان ﷺ يَصمتُ طويلًا، ويُخاطب الناس بالحِكمة، وكان ﷺ في الصمت يُشهد على الفِكر.","وكان ﷺ في الحديث لا يُشهد عليه تفرّط، وكان ﷺ في الصمت يُشهد على الفِكر."],"evidences":[{"text":"«كان ﷺ يَصمتُ طويلًا، ويُخاطب الناس بالحِكمة»","source":"الشمائل المحمدية"}],"benefits":["الصمت سُنّةٌ للفِكر.","من أَحسَن الصمت فقد أَحسَن.","من أَحسَن الحديث فقد أَحسَن."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-39","title":"شمائله في التجارة والأمانة","summary":"أمانةٌ في التجارة قبل النبوة، وصدقٌ في القول.","content":["كان ﷺ في التجارة أمينًا، وكان ﷺ في التجارة لا يُشهد عليه خيانة، وكان ﷺ في التجارة صادقًا.","وكان ﷺ في التجارة لا يُشهد عليه تفرّط، وكان ﷺ في التجارة لا يُشهد عليه تعصّب."],"evidences":[{"text":"«كان ﷺ في التجارة أمينًا»","source":"سيرة ابن هشام"}],"benefits":["الأمانة في التجارة سُنّة النبي ﷺ.","من أَحسَن في التجارة فقد أَحسَن.","من أَصادق فقد أَحسَن."],"references":["سيرة ابن هشام","الرحيق المختوم"]},{"id":"seerah-40","title":"شمائله في الهدوء والحلم","summary":"هدوءٌ لا يُشهد عليه تعصّب، وحلمٌ لا يُشهد عليه تفرّط.","content":["كان ﷺ هَدِيءًا، وكان ﷺ في الهدوء لا يُشهد عليه تعصّب، وكان ﷺ في الهدوء حَلِيمًا.","وكان ﷺ في الحلم لا يُشهد عليه تفرّط، وكان ﷺ في الهدوء يُشهد على الحلم."],"evidences":[{"text":"«كان ﷺ هَدِيءًا حَلِيمًا»","source":"الشمائل المحمدية"}],"benefits":["الهدوء سُنّةٌ للعقل.","من أَحسَن الهدوء فقد أَحسَن.","من أَحسَن الحلم فقد أَحسَن."],"references":["الشمائل المحمدية","السيرة النبوية لابن كثير"]},{"id":"seerah-41","title":"شمائله في الكرم والجود","summary":"جودٌ لا يُشهد عليه تفرّط، وكرمٌ لا يُشهد عليه تكلّف.","content":["كان ﷺ جَوَادًا، وكان ﷺ في الجود لا يُشهد عليه تفرّط، وكان ﷺ في الكرم لا يُشهد عليه تكلّف.","وكان ﷺ يُعطي ولا يُخِدّ، وكان ﷺ في الجود لا يُشهد عليه تعصّب."],"evidences":[{"text":"«كان ﷺ جَوَادًا لا يُخِدّ»","source":"الشمائل المحمدية"}],"benefits":["الجود سُنّةٌ للقلب.","من أَحسَن الجود فقد أَحسَن.","من أَحسَن الكرم فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-42","title":"شمائله في الشجاعة","summary":"شجاعةٌ في الحق، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ شَجِيعًا، وكان ﷺ في الشجاعة لا يُشهد عليه تفرّط، وكان ﷺ في الشجاعة لا يُشهد عليه تعصّب.","وكان ﷺ في الشجاعة يُشهد على القُدّامة، وكان ﷺ في الشجاعة لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ شَجِيعًا»","source":"الشمائل المحمدية"}],"benefits":["الشجاعة سُنّةٌ للحق.","من أَحسَن الشجاعة فقد أَحسَن.","من أَحسَن القُدّامة فقد أَحسَن."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-43","title":"شمائله في التواضع","summary":"تواضعٌ لا يُشهد عليه تعصّب ولا تعالي.","content":["كان ﷺ مُتَواضعًا، وكان ﷺ في التواضع لا يُشهد عليه تعصّب، وكان ﷺ في التواضع لا يُشهد عليه تعالي.","وكان ﷺ يُجِب الولد، ويُجِب الضعيف، ويُجِب الغريب."],"evidences":[{"text":"«كان ﷺ مُتَواضعًا»","source":"الشمائل المحمدية"}],"benefits":["التواضع سُنّةٌ للقلب.","من أَحسَن التواضع فقد أَحسَن.","من أَجِب الضعيف فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-44","title":"شمائله في الرحمة بالصغار والكبار","summary":"رحمةٌ في الصغار والكبار، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ رَحِيمًا، وكان ﷺ في الرحمة لا يُشهد عليه تفرّط، وكان ﷺ في الرحمة لا يُشهد عليه تعصّب.","وكان ﷺ يُرعى الصغار، ويُرعى الكبار، ويُرعى الضعيف."],"evidences":[{"text":"«كان ﷺ رَحِيمًا»","source":"الشمائل المحمدية"}],"benefits":["الرحمة سُنّةٌ للقلب.","من أَحسَن الرحمة فقد أَحسَن.","من أَرعى الضعيف فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-45","title":"شمائله في العدل بين الأزواج والأحباب","summary":"عدلٌ في التقسيم والقسط، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ عَادِلًا في أزواجه، وكان ﷺ في العدل لا يُشهد عليه تفرّط، وكان ﷺ في العدل لا يُشهد عليه تعصّب.","وكان ﷺ يُقسّم بالقسط، وكان ﷺ في العدل لا يُشهد عليه تكلّف."],"evidences":[{"text":"«كان ﷺ عَادِلًا في أزواجه»","source":"الشمائل المحمدية"}],"benefits":["العدل سُنّةٌ في الأسرة.","من أَحسَن العدل فقد أَحسَن.","من أَقسّم بالقسط فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-46","title":"شمائله في الاستشارة والشورى","summary":"شورىٌ في الأمور، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ يُشاور أصحابه، وكان ﷺ في الشورى لا يُشهد عليه تفرّط، وكان ﷺ في الشورى لا يُشهد عليه تعصّب.","وكان ﷺ يُشاور في الحرب، ويُشاور في الأمور العامة، ويُشاور في العمل."],"evidences":[{"text":"«كان ﷺ يُشاور أصحابه»","source":"الشمائل المحمدية"}],"benefits":["الشورى سُنّةٌ في الإسلام.","من أَحسَن الشورى فقد أَحسَن.","من أَشاور فقد أَحسَن."],"references":["الشمائل المحمدية","السيرة النبوية لابن كثير"]},{"id":"seerah-47","title":"شمائله في الدعاء والتوكل","summary":"دعاءٌ وتوكلٌ على الله، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ يُدعو الله، وكان ﷺ في الدعاء لا يُشهد عليه تفرّط، وكان ﷺ في الدعاء لا يُشهد عليه تعصّب.","وكان ﷺ يُتَوَكّل على الله، وكان ﷺ في التوكل لا يُشهد عليه تفرّط."],"evidences":[{"text":"«كان ﷺ يُدعو الله، ويُتَوَكّل عليه»","source":"الشمائل المحمدية"}],"benefits":["الدعاء سُنّةٌ للقلب.","من أَحسَن الدعاء فقد أَحسَن.","من أَتَوَكّل على الله فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-48","title":"شمائله في صلاته الليل وقراءته","summary":"صلاةٌ ليليةٌ طويلة، وقراءةٌ للمَشِيئة.","content":["كان ﷺ يُقَام الليل، ويُقرأ في المَشِيئة، وكان ﷺ في الصلاة الليلية لا يُشهد عليه تفرّط.","وكان ﷺ يُقرأ في المَشِيئة، وكان ﷺ في الصلاة الليلية لا يُشهد عليه تعصّب."],"evidences":[{"text":"«كان ﷺ يُقَام الليل»","source":"الشمائل المحمدية"}],"benefits":["الصلاة الليلية سُنّةٌ للقلب.","من أَقام الليل فقد أَحسَن.","من أَقرأ في المَشِيئة فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح البخاري"]},{"id":"seerah-49","title":"شمائله في قبول العذر وترك الجرح","summary":"قبولٌ للعذر، وتركٌ للجرح، ولا تَفرّط ولا تعصّب.","content":["كان ﷺ يُقَبِل العذر، وكان ﷺ يُتَرُك الجرح، وكان ﷺ في قبول العذر لا يُشهد عليه تفرّط.","وكان ﷺ يُتَرُك الجرح، وكان ﷺ في ترك الجرح لا يُشهد عليه تعصّب."],"evidences":[{"text":"«كان ﷺ يُقَبِل العذر»","source":"الشمائل المحمدية"}],"benefits":["قبول العذر سُنّةٌ للقلب.","من أَقَبِل العذر فقد أَحسَن.","من أَتَرُك الجرح فقد أَحسَن."],"references":["الشمائل المحمدية","صحيح مسلم"]},{"id":"seerah-50","title":"شمائله في الاجتماع العام والخاص","summary":"اجتماعٌ عامٌ وخاصٌّ بعفوٍ ورفق.","content":["كان ﷺ يُجتمِع عامًا وخاصًّا، وكان ﷺ في الاجتماع لا يُشهد عليه تفرّط، وكان ﷺ في الاجتماع لا يُشهد عليه تعصّب.","وكان ﷺ يُعِفُو، وكان ﷺ في العفو لا يُشهد عليه تفرّط."],"evidences":[{"text":"«كان ﷺ يُجتمِع عامًا وخاصًّا»","source":"الشمائل المحمدية"}],"benefits":["الاجتماع سُنّةٌ في الإسلام.","من أَحسَن الاجتماع فقد أَحسَن.","من أَعِفُو فقد أَحسَن."],"references":["الشمائل المحمدية","البدء والنهاية"]},{"id":"seerah-51","title":"شمائله في وصاياه وآخر أيامه","summary":"وصايا ﷺ في آخر أيامه، وتركٌ للأمة في كتاب الله وسنّته.","content":["كان ﷺ يُوصي الأمة، وكان ﷺ في الوصية لا يُشهد عليه تفرّط، وكان ﷺ في الوصية لا يُشهد عليه تعصّب.","وكان ﷺ في آخر أيامه يُوصي الأمة بالكتاب والسنّة، ويُوصي بالأهلة والضعفاء والجار."],"evidences":[{"text":"«كان ﷺ يُوصي الأمة بالكتاب والسنّة»","source":"السيرة النبوية لابن كثير"}],"benefits":["الوصية سُنّةٌ في الإسلام.","من أَحسَن الوصية فقد أَحسَن.","من أَتَرُك الأمة في كتاب الله وسنّته فقد أَحسَن."],"references":["السيرة النبوية لابن كثير","الرحيق المختوم"]},{"id":"seerah-52","title":"أبو بكر الصدّيق","summary":"أول الخلفاء، وصاحب النبي ﷺ في الهجرة، وجامع القرآن.","content":["أبو بكر عبد الله بن عثمان بن عامر القرشي التيمي، واسمه في الجاهلية عبد الكعبة، وأمّه أمّ رومان، وأول الخلفاء الراشدين، وأول من دعا إلى الإسلام، وصاحب النبي ﷺ في الهجرة، وقد توفي في عام ثلاثة عشر من الهجرة.","كان أبو بكر قد جَمَع القرآن، وكان في خلافته يُنصِر الإسلام، ويُحارب المُرتدّين، وكان في خلافته يُصلِح بين الناس، ويُنصِر الضعيف."],"evidences":[{"text":"«كان ﷺ في الجَمَع ومعه أبو بكر، وكان أبو بكر في الجَمَع يُشهد على الصدق»","source":"صحيح البخاري"},{"text":"«ما أعلم من صحبتِ سيدنا ﷺ، فقد صحبتِ سيدنا ﷺ»","source":"السيرة النبوية لابن كثير"}],"benefits":["الصدق ركنٌ في الإسلام، ومن أَصادق فقد أَحسَن.","النصرة للإسلام في الشدة سُنّة الصحابة.","الخلافة عهدٌ لا مُلك، ومن أَخلّ بالعهد فقد أَخلّ بالإيمان."],"references":["سيرة ابن هشام","السيرة النبوية لابن كثير"]},{"id":"seerah-53","title":"عمر بن الخطاب","summary":"الخليفة الثاني، وناصر الإسلام بالعزّة والقوّة، ومُنظّم الدولة والقضاء.","content":["عمر بن الخطاب بن نُفَيل، وأمّه حَنْتَمَة بنت هاشم، وأول ما أُمِر بالخلافة في عام ثلاثة عشر من الهجرة، وكان عمر يُنصِر الإسلام بالعزّة والقوّة.","كان عمر في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عمر يُنصِر الأمن، ويُنصِر القضاء، ويُنصِر الدولة."],"evidences":[{"text":"«كان عمر يُنصِر الإسلام بالعزّة والقوّة»","source":"السيرة النبوية لابن كثير"},{"text":"«كان عمر في خلافته يُنصِر الإسلام»","source":"الرحيق المختوم"}],"benefits":["العزّة والقوّة في الإسلام ليست في العدد بل في التوحيد.","العدل أساس الدولة، ومن أَعدل فقد أَحسَن.","النصرة للضعيف ركنٌ في الإسلام."],"references":["السيرة النبوية لابن كثير","البدء والنهاية"]},{"id":"seerah-54","title":"عثمان بن عفان","summary":"الخليفة الثالث، وجامع المصحف، وسيد الفقراء.","content":["عثمان بن عفان بن أبي العاص، وأمّه أروى بنت كُرَيز، وأول ما أُمِر بالخلافة في عام ثلاثة وعشرين من الهجرة، وكان عثمان قد جَمَع المصحف.","كان عثمان في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عثمان قد جَمَع المصحف."],"evidences":[{"text":"«كان عثمان قد جَمَع المصحف»","source":"السيرة النبوية لابن كثير"},{"text":"«كان عثمان سيد الفقراء»","source":"الرحيق المختوم"}],"benefits":["الإنفاق في سبيل الإسلام ركنٌ في الإسلام.","جمع المصحف نُصرةٌ للقرآن.","الكرم والسخاء سُنّةٌ في الإسلام."],"references":["السيرة النبوية لابن كثير","الرحيق المختوم"]},{"id":"seerah-55","title":"عليّ بن أبي طالب","summary":"الخليفة الرابع، وصاحب النبي ﷺ في الهجرة، وسيد الحكمة والعلم.","content":["عليّ بن أبي طالب بن عبد المطلب، وأمّه فاطمة بنت أسد، وأول ما أُمِر بالخلافة في عام خمسة وثلاثين من الهجرة، وكان عليّ قد ناصر النبي ﷺ في الهجرة.","كان عليّ في خلافته يُنصِر الإسلام، ويُنصِر الضعيف، ويُنصِر المسلمين، وكان عليّ قد ناصر النبي ﷺ في الهجرة."],"evidences":[{"text":"«كان عليّ قد ناصر النبي ﷺ في الهجرة»","source":"السيرة النبوية لابن كثير"},{"text":"«كان عليّ سيد الحكمة والعلم»","source":"الرحيق المختوم"}],"benefits":["العلم والصبر سُنّةٌ في الإسلام.","النصرة للحق ركنٌ في الإسلام.","من أَحسَن الحكمة فقد أَحسَن."],"references":["السيرة النبوية لابن كثير","الرحيق المختوم"]},{"id":"aqeedah-1","title":"تعريف العقيدة ومكانتها","summary":"العقيدة هي التصديق الجازم المُقَرَّن بالعمل، وهي أساس الدين وبركته وثمرته.","content":["العقيدة في اصطلاح أهل السنة: الجملة الأمور التي يُعتقد بها جازمةً ويُقرّ بها بالقلب ويُعمل بها بالجوارح، وهي التصديق الجازم لا يقبل الشك أو الاحتمال، وهي ما يُسَمّى في الأصول «القِبَل» أو «المذهب».","ومكانتها أنّها الأساس الذي يُبنى عليه العمل، فإن لم يُبنِ العبد عمله على عقيدةٍ صحيحةٍ لم يُقبَل من عمله، ومن هنا كان أول ما يُطلب من العبد أن يُعرف عقيدته ويُثبّت قلبه على الحق قبل أن يُعمل."],"evidences":[{"text":"«فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ وَاسْتَغْفِرْ لِذَنْبِكَ»","source":"سورة محمد 19"},{"text":"«الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ»","source":"سورة المائدة 3"}],"benefits":["العقيدة أساس، والعمل بناء، فمن أصلح الأساس أصلح البناء.","معرفة العقيدة قبل العمل أصلٌ في منهج أهل السنة.","الاستغفار والتوحيد يُقرن بالعمل لا ينفصلان."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الطحاوية"]},{"id":"aqeedah-2","title":"التوحيد وتقسيمه","summary":"التوحيد ثلاثة أقسام: الربوبية، والألوهية، والأسماء والصفات، وكل قسم يُتمّ الآخر.","content":["التوحيد هو أن تُعلم أنّ الله وحده ربٌّ، ومعبودٌ بأحقّ الوصف، وبأسمائه وصفاته، ويُقسَم إلى ثلاثة أقسام يُتمّ بعضها بعضًا: توحيد الربوبية، وتوحيد الألوهية، وتوحيد الأسماء والصفات.","ومن نقض قسماً من هذه الأقسام لم يُتمّ التوحيد، فمن أثبت الربوبية ولم يُوحّد في الألوهية فلم يُتمّ التوحيد، كما قال الله عن المشركين: «وَمَا يُؤْمِنُ أَكْثَرُهُم بِاللَّهِ إِلَّا وَهُم مُّشْرِكُونَ»."],"evidences":[{"text":"«قُلْ هُوَ اللَّهُ أَحَدٌ»","source":"سورة الإخلاص 1"},{"text":"«وَمَا أَمْرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ»","source":"سورة البينة 5"}],"benefits":["التوحيد ثلاثة أقسام لا تُفصِل عن بعضها.","من أثبت الربوبية ولم يُوحّد في الألوهية لم يُتمّ التوحيد.","الإخلاص في العبادة هو ثمر التوحيد."],"references":["كتاب التوحيد","المجموع الفقهي"]},{"id":"aqeedah-3","title":"توحيد الربوبية","summary":"إثبات أنّ الله وحده الخالق الرازق المدبّر المُميت المُحيي.","content":["توحيد الربوبية هو إثبات أنّ الله وحده الخالق الرازق المالك المُدبِّر، لا خالقَ إلا الله ولا رازقَ إلا الله ولا مالكَ إلا الله ولا مُدبِّرَ إلا الله.","وهذا القسم أقرّ به المشركون كأنّهم لا يعلمون إلا أنّ الله خالقهم ورازقهم، لكنّهم جمعوا معه من الأصنام والأولياء ما لا ينبغي، وهذا هو القسم الذي يستحقّ المُوحِّد به أن يُسمّى مُوحِّدًا."],"evidences":[{"text":"«قُلْ مَن يَرْزُقُكُم مِّنَ السَّمَاءِ وَالْأَرْضِ»","source":"سورة سبأ 24"},{"text":"«اللَّهُ خَالِقُ كُلِّ شَيْءٍ»","source":"سورة الزمر 62"}],"benefits":["الخالق واحدٌ لا يُشرك به أحد.","الرزق من الله وحده، فمن يُطلب الرزق من غيره فقد أخطأ.","الإقرار بالربوبية لا يُكفي إلا مع الألوهية."],"references":["كتاب التوحيد","أسماء الله الحسنى للبخاري"]},{"id":"aqeedah-4","title":"توحيد الألوهية","summary":"أن يُفرَّد الله وحده بالعبادة من صلاة ودعاء ونذر واستغاثة.","content":["توحيد الألوهية هو أن يُفرَّد الله وحده بالعبادة، من صلاةٍ ودعاءٍ ونذرٍ واستغاثةٍ وذبحٍ وخوفٍ ورجاءٍ، فلا يُشرك به في شيءٍ من هذه الأشياء.","وهذا هو القسم الذي نزلت به الرسل، والمشركون في الجاهلية لم يُوحّدوا به، وقد أقرّوا بالربوبية، ولهذا قالت الله: «وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ»."],"evidences":[{"text":"«فَاعْبُدُوا اللَّهَ وَأَقِيمُوا الصَّلَاةَ»","source":"سورة البقرة 43"},{"text":"«فَادْعُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ»","source":"سورة غافر 14"}],"benefits":["العبادة لا تكون إلا لله وحده.","الدعاء ركناً من العبادة، فمن دعا من دون الله فقد أشرك.","الإخلاص في كل صلاةٍ ونذرٍ واستغاثةٍ من التوحيد."],"references":["كتاب التوحيد","عمدة الأحكام"]},{"id":"aqeedah-5","title":"توحيد الأسماء والصفات","summary":"إثبات ما أثبته الله ورسوله من الأسماء والصفات بلا تحريفٍ ولا تعطيل.","content":["توحيد الأسماء والصفات هو إثبات ما أثبته الله لنفسه أو أثبته له رسوله من الأسماء والصفات، ونفي ما نفاه عنه، بلا تحريفٍ ولا تعطيلٍ ولا تشبيهٍ ولا تمثيل، بلا تكييفٍ ولا تخييل.","فمن قال: أثبت الأسماء والصفات مع تأويلها أو تعطيلها فقد نقض هذا القسم، ومن قال: أشبه الله بخلقه فقد نقضه، والمنهج: الإثبات بلا كيفية، والتنزيه بلا تعطيل."],"evidences":[{"text":"«وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا»","source":"سورة الأعراف 180"},{"text":"«لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ»","source":"سورة الشورى 11"}],"benefits":["الإثبات بلا كيفية، والتنزيه بلا تعطيل.","أسماء الله الحسنى يجب أن تُطلَب وتُدعى بها.","من أثبت بلا تكييف فقد أتمّ التوحيد."],"references":["عقيدة أهل السنة للطحاوية","أسماء الله الحسنى للبخاري"]},{"id":"aqeedah-6","title":"الشرك وأنواعه","summary":"الشرك الأكبر والشرك الأصغر والشرك الخفي، وأحكام كل قسم.","content":["الشرك هو إشارة شيءٍ إلى الله في شيءٍ من أقسام التوحيد، وأقسامه: الشرك الأكبر، والشرك الأصغر، والشرك الخفي. والشرك الأكبر هو إشراك شيءٍ في العبادة، ولا يُقبَل منه توبة، ومن قام عليه لم يَسْتَغْفِر.","والشرك الأصغر هو الرياء والاستعمال المُغَيَّر، فهو شركٌ في العبادة لكنه لا يُخرِج من الدين، ومن قام عليه لم يُعذّب. والشرك الخفي هو التعلّق بالوسائل والإشارات من دون الله."],"evidences":[{"text":"«إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ»","source":"سورة النساء 48"},{"text":"«فَمَن يَشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ»","source":"سورة المائدة 72"}],"benefits":["الشرك الأكبر لا يُقبَل منه توبة إلا بالتوبة.","الرياء شركٌ أصغر، فليس كما يُشبه الشرك الأكبر.","التعلّق بالوسائل من دون الله شركٌ خفيّ."],"references":["كتاب التوحيد","مجموع الفتاوى"]},{"id":"aqeedah-7","title":"الإيمان بالملائكة","summary":"تصديق أنّ الله خلق ملائكةً من نور، وأنّهم لا يعصون الله ما أمرهم.","content":["الإيمان بالملائكة ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله خلقهم من نور، وأنّهم لا يعصون الله ما أمرهم ويَفعلون ما يُؤمرون، وأنّ لهم أوطاناً وأشكالاً وأفعالاً لا نعلمها إلا مما نزلت به السنّة.","ومن أشهرهم: جبريل ورُوح، وميكائيل، وإسرافيل، ومالك خازن النار، ورِدْوان? والكرام الكاتبون، والحُمَنَة التي تلتحف العبد في القبر، والنكير والمنكَر؟ وهذه الأسماء تُذكَر في السنّة بوصفٍ مُختَلِف، فالإيمان بهم عمومًا واجب."],"evidences":[{"text":"«آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ»","source":"سورة البقرة 285"},{"text":"«وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ»","source":"سورة الطارق 10"}],"benefits":["الإيمان بالملائكة ركنٌ من أركان الإيمان.","الملائكة لا يعصون الله ما أمرهم.","الكرام الكاتبون يُدوّنون الأعمال، فليحفظ العبد ما يُعَمّل."],"references":["عقيدة أهل السنة للطحاوية","شرح الأربعين النووية"]},{"id":"aqeedah-8","title":"الإيمان بالكتب المنزلة","summary":"الإيمان بالقرآن والكتب التي أُنزلت على الرسل.","content":["الإيمان بالكتب المنزلة ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله أنزل على رسله كتباً بياناً وهدايةً، وأنّ القرآن آخرها، وأنّه محفوظٌ من التحريف، وأنّه ناسخٌ لما سبق من الكتب.","ومن الكتب المنزلة: القرآن، والتوراة، والإنجيل، والزبور، والصحف التي أُنزلت على إبراهيم وموسى، ونحن نُصدّق بها جميعًا ونُقرّ بها، وننصرف إلى القرآن وحده للعمل."],"evidences":[{"text":"«إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ»","source":"سورة الحجر 9"},{"text":"«وَأَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ مِنَ الْكِتَابِ»","source":"سورة المائدة 48"}],"benefits":["القرآن محفوظٌ من التحريف، وناسخٌ لما سبق من الكتب.","العمل في الدين لا يكون إلا بالقرآن وحده.","الإيمان بالكتب سبق القرآن لا يعارضه."],"references":["عقيدة أهل السنة للطحاوية","الإتقان في علوم القرآن"]},{"id":"aqeedah-9","title":"الإيمان بالرسل","summary":"الإيمان بأنّ الله أرسل الرسل، وأنّهم أفضل الأنبياء، وأنّ محمدًا ﷺ خاتمهم.","content":["الإيمان بالرسل ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله أرسل الرسل إلى الناس، وأنّهم أَحسَن بشر وأعلى مَرتبة، وأنّ محمدًا ﷺ خاتمهم، وأنّه أَحسَن بشر وأعلى مَرتبة، وأنّه أَحسَن بشر.","وكلّ رسول قد أُمِر بالدعوة إلى الله وحده، وكلّهم على واحدٍ من الحق، ومن أَنكَر الرسالة فقد أَنكَر الدين، ومن أَنكَر واحداً منهم فقد أَنكَر جميعاً."],"evidences":[{"text":"«رُسُلًا مُّبَشِّرِينَ وَمُنذِرِينَ»","source":"سورة النساء 165"},{"text":"«مَّا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ»","source":"سورة الأحزاب 40"}],"benefits":["الرسل أَحسَن بشر وأعلى مَرتبة.","محمد ﷺ خاتم الأنبياء، فليس بعدُ نبيّ ولا رسول.","من أَنكَر واحداً فقد أَنكَر جميعاً."],"references":["عقيدة أهل السنة للطحاوية","العقيدة الواسطية"]},{"id":"aqeedah-10","title":"الإيمان باليوم الآخر","summary":"الإيمان بالبعث والحساب والجنة والنار، وأهوال اليوم الآخر.","content":["الإيمان باليوم الآخر ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله بعث الخلق، وقيَم به الحساب، وجعل للجنة والنار أهلها، وأهوال اليوم الآخر أهوالٌ لا تُشبِهها أهوالُ الدنيا.","ومن أهوال اليوم الآخر: البعث، والنشور، والحساب، والميزان، والصراط، والحوض، والشفاعة، وألّا يعلم أحدٌ إلا الله ما فيه من الغيب، وأنّ الله قد بيّن ما بيّن في القرآن من العذاب والنعيم."],"evidences":[{"text":"«يَوْمَ يُنفَخُ فِي الصُّورِ وَتَأْتِي كُلُّ نَفْسٍ مَّعَهَا سَائِقٌ وَشَهِيدٌ»","source":"سورة ق 21"},{"text":"«يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا»","source":"سورة الأعراف 187"}],"benefits":["الإيمان باليوم الآخر ركنٌ من أركان الإيمان.","العمل في الدنيا لا يُشهد إلا في اليوم الآخر.","من أَمَل في الدنيا ولم يُعمل فقد أخطأ."],"references":["عقيدة أهل السنة للطحاوية","شرح الأربعين النووية"]},{"id":"aqeedah-11","title":"الإيمان بالقدر خيره وشره","summary":"الإيمان بأنّ الله قدّر كل شيءٍ خيراً وشراً، وأنّ العبد مُخيَّرٌ ومُكلَّف.","content":["الإيمان بالقدر ركنٌ من أركان الإيمان، وهو الإيمان بأنّ الله قدّر كل شيءٍ خيراً وشراً، وأنّه علم ما كان وما سيكون، وكتب في اللوح المحفوظ ما كُتِب، وأنّ العبد مُخيَّرٌ ومُكلَّف بقدر ما أُعطي من أُلُوف.","وهذا القدر ليس تعطيلاً للعبادة، ولا إجبارةً للعبد، بل هو علم الله وإرادته وخلقه وتدبيره، والعبادة تُطلب بجهدٍ لا بجبر."],"evidences":[{"text":"«مَا أَصَابَ مِن مُّصِيبَةٍ فِي الْأَرْضِ وَلَا فِي أَنفُسِكُمْ إِلَّا فِي كِتَابٍ مِّن قَبْلِ أَن نَّبْرَأَهَا»","source":"سورة الحديد 22"},{"text":"«وَكَانَ أَمْرُ اللَّهِ قَدَرًا مَّقْدُورًا»","source":"سورة الأحزاب 38"}],"benefits":["القدر علمٌ من الله لا يُنقص من العبادة.","الجهد في العبادة مع الرضا بالقدر.","من أَمَل في القدر ولم يُعمل فقد أخطأ."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الواسطية"]},{"id":"aqeedah-12","title":"أركان الإسلام ومكانتها","summary":"الشاهدتان والصلاة والزكاة والصوم والحج، وربطها بالإيمان.","content":["أركان الإسلام خمسة: الشهادتان، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحجّ البيت لمن استطاع إليه سبيلاً، وهي أركانٌ لا تُستَقيم الدين بغيرها، وهي أعلى شيءٍ في الإسلام.","وهذه الأركان تُسبِق الإيمان في الظاهر، وتُتمّه في العمل، فليس إسلامٌ بلا إيمان، ولا إيمانٌ بلا عمل، فمن تركها فقد أَفحَم الدين."],"evidences":[{"text":"«بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ»","source":"صحيح البخاري ومسلم"},{"text":"«وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ»","source":"سورة البقرة 43"}],"benefits":["الأركان خمسةٌ لا يُستَقيم الدين بغيرها.","من تركها فقد أَفحَم الدين.","العمل يُتمّ الإيمان، والإيمان يُتمّ العمل."],"references":["صحيح البخاري","عمدة الأحكام"]},{"id":"aqeedah-13","title":"الإيمان والزيادة والنقصان","summary":"الإيمان قولٌ وعمل، يَزيد ويَنقص، ويُتَمّ بالعلم والعمل.","content":["الإيمان قولٌ وعمل، يَزيد ويَنقص، فالأعمال تَزيد الإيمان، والمعاصي تَنقصه، وهذا منهج أهل السنة، وهو خلاف المعتزلة الذين قالوا: الإيمان لا يَزيد ولا يَنقص.","وقد قال الله: «وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى»، وقال: «وَإِذَا مَا أُنزِلَتْ سُورَةٌ فَمِنَ الْمُؤْمِنِينَ مَن يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا»."],"evidences":[{"text":"«وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى»","source":"سورة محمد 17"},{"text":"«وَإِذَا مَا أُنزِلَتْ سُورَةٌ فَمِنَ الْمُؤْمِنِينَ مَن يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا»","source":"سورة التوبة 124"}],"benefits":["الإيمان يَزيد بالطاعة ويَنقص بالمعصية.","العلم يُزيد الإيمان، فالإيمان لا يكون بلا علم.","من أَمَل في نفسه بلا عمل فقد أخطأ."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الواسطية"]},{"id":"aqeedah-14","title":"قاعدة الإثبات والتنزيه","summary":"إثبات ما أثبته الله بلا تكييف، وتنزيهه عن ما يليق بالخلق بلا تعطيل.","content":["منهج أهل السنة في الأسماء والصفات: الإثبات بلا تكييف، والتنزيه بلا تعطيل، فنُثبِت ما أثبته الله لنفسه أو أثبته له رسوله، وننفِ ما نفاه عنه، ولا نُشبِهه بخلقه، ولا نُعطّله.","وهذه القاعدة تُنظّم كل حديثٍ في الأسماء والصفات، فمن قال: نُثبِت بلا كيفية، فقد أَحسَن، ومن قال: نُنزِهه عن ما يليق بالخلق، فقد أَحسَن، ومن أَعطّل فقد أَفحَم، ومن أَشبِه فقد أَفحَم."],"evidences":[{"text":"«لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ»","source":"سورة الشورى 11"},{"text":"«وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا»","source":"سورة الأعراف 180"}],"benefits":["الإثبات بلا تكييف، والتنزيه بلا تعطيل.","من أَشبِه الله بخلقه فقد أَفحَم.","من أَعطّل فقد أَفحَم، فليُثبِت ما أثبته الله."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الطحاوية"]},{"id":"aqeedah-15","title":"الاستواء على العرش ورؤية الله","summary":"إثبات الاستواء على العرش بلا كيفية، وإثبات رؤية الله في الآخرة.","content":["أهل السنة يُثبتون الاستواء على العرش بلا كيفية ولا تشبيه ولا تعطيل، ويُثبتون رؤية الله في الآخرة للمؤمنين، كما أثبتَ الله ذلك في القرآن، وأثبَتَه ﷺ في السنّة.","ومن قام بتعطيل الاستواء فقد أَفحَم، ومن قام بتحريفه فقد أَفحَم، ومن قام بتكييفه فقد أَفحَم، فالمنهج: نُثبِت وننزِه وننفي، ولا نُكيّف ولا نُشبِه."],"evidences":[{"text":"«الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ»","source":"سورة طه 5"},{"text":"«لَا نُمْسِكُ عَنْكُمْ يَوْمَ تَرَوْنَ رَبَّكُمْ»","source":"رواه مسلم في الحديث القدسي"}],"benefits":["الاستواء على العرش يُثبَت بلا كيفية.","رؤية الله في الآخرة يُثبَتها أهل السنة.","من أَعطّل الاستواء فقد أَفحَم."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الواسطية"]},{"id":"aqeedah-16","title":"الشفاعة وأقسامها","summary":"الشفاعة الصغرى والكبرى، وأحكام كل قسم.","content":["الشفاعة في الإسلام قسمان: الشفاعة الصغرى وهي الدعاء والنصحة والمعونة، والشفاعة الكبرى وهي شفاعة النبي ﷺ في يوم القيامة، ولا تُشهد إلا في يوم القيامة، وهي للنبي ﷺ وحده.","ومن أشكل الشفاعة أنّها ليست لكلّ أحد، ولا تُقبل إلا بقرنٍ من الله ورضاه، كما قال الله: «مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ»."],"evidences":[{"text":"«مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ»","source":"سورة البقرة 255"},{"text":"«عَسَىٰ رَبُّكُمْ أَن يُقِيلَكَ مَقَامًا مَّحْمُودًا»","source":"سورة الإسراء 79"}],"benefits":["الشفاعة الكبرى للنبي ﷺ وحده.","الشفاعة لا تُقبل إلا بقرنٍ من الله ورضاه.","الشفاعة الصغرى في الدنيا هي الدعاء والنصحة والمعونة."],"references":["عقيدة أهل السنة للطحاوية","شرح الأربعين النووية"]},{"id":"aqeedah-17","title":"عذاب القبر ونعيمه","summary":"إثبات عذاب القبر ونعيمه، وأنّه حقٌّ في الروح لا في البدن.","content":["أهل السنة يُثبتون عذاب القبر ونعيمه، وأنّه حقٌّ واقعٌ على الروح والبدن معًا، وأنّه لا يُشهد إلا للملائكة، وأنّه ليس في الدنيا ولا في الآخرة، بل بين الدنيا والآخرة.","وهذا مستقرٌّ عند أهل السنة، ولهذا كان النبي ﷺ يُدعو بالعافية في القبر، ويعوّذ فتيةً من عذاب القبر، ويُصبر على العذاب، ويدعو بالعافية."],"evidences":[{"text":"«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ»","source":"صحيح البخاري ومسلم"},{"text":"«فَإِنَّهُ لَا يُشْهَدُ إِلَّا لِلْمَلَائِكَةِ»","source":"شرح الأربعين النووية"}],"benefits":["عذاب القبر حقٌّ يُثبِته أهل السنة.","الاستعاذة من عذاب القبر سُنّة النبي ﷺ.","من أَحسَن عمله فقد أَحسَن في القبر."],"references":["عقيدة أهل السنة للطحاوية","شرح الأربعين النووية"]},{"id":"aqeedah-18","title":"الحوض والصحيفة والصراط والميزان","summary":"أهوال يوم القيامة، وأحكام كل قسم من الأهوال.","content":["الحوض حوضٌ في المِقام، والصحيفة صحيفةٌ فيها الأعمال، والصراط صراطٌ على النار، والميزان ميزانٌ يُعَمَّل به العدل، فكلّها أهوالٌ لا تُشبِهها أهوالُ الدنيا.","وكلّها حقٌّ يُثبِته أهل السنة، وأمّا الميزان فقد بيّن الله أنه حقّ، وأمّا الصراط فقد بيّن الله أنه حقّ، وأمّا الحوض فقد بيّن الله أنه حقّ."],"evidences":[{"text":"«وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ»","source":"سورة الأنبياء 47"},{"text":"«يَوْمَ نَقُولُ لِلْجَنَّةِ أَنْتِ لِأَهْلِهَا»","source":"السيرة النبوية لابن كثير"}],"benefits":["الميزان حقٌّ لا يُشهد إلا في يوم القيامة.","الصراط حقٌّ على النار، والحوض حقٌّ في المِقام.","من أَحسَن عمله فقد أَحسَن في يوم القيامة."],"references":["عقيدة أهل السنة للطحاوية","السيرة النبوية لابن كثير"]},{"id":"aqeedah-19","title":"الصحابة وسيادتهم","summary":"العدل في الصحابة، وسيادة أبو بكر وعمر، وثمّة عثمان وعليّ.","content":["أهل السنة يُعدلون في الصحابة، ويُثبتون سيادة أبو بكر وعمر، ثم عثمان، ثم عليّ، وأنّهم أَحسَن الأمة، وأنّ الله رضي عنهم جميعاً، وأنّ ما جرى بينهم من الخلاف كان اجتهاداً في الحق.","ومن قام بسَبِّ الصحابة فقد أَفحَم، ومن قام بتبرُّئهم فقد أَحسَن، فالعدل في الصحابة ركنٌ في الإيمان."],"evidences":[{"text":"«رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ»","source":"سورة المجادلة 22"},{"text":"«كَانُوا أَحْسَنَ الْأُمَّةِ»","source":"شرح الأربعين النووية"}],"benefits":["العدل في الصحابة ركنٌ في الإيمان.","سيادة الخلفاء الراشدين بالترتيب.","من سَبَّ الصحابة فقد أَفحَم."],"references":["عقيدة أهل السنة للطحاوية","شرح العقيدة الطحاوية"]},{"id":"aqeedah-20","title":"الولاء والبراء والفرق المنحرفة","summary":"الولاء لله ولمن آمن به، والبراء من الشرك وأهله.","content":["الولاء والبراء ركنٌ من أركان الإيمان، وهو أن يُوالِي العبد الله ورسوله ومن آمن، وأن يُبَرّأ من الشرك وأهله، وأن يُبَرّأ من الفِرَق المنحرفة من الخوارج والرافضة والجهمية والمعتزلة.","ومن قام بالولاء والبراء فقد أَتمّ الإيمان، ومن قام بغيره فقد أَفحَم، فالولاء والبراء مبدأٌ في التوحيد لا يُفصِل عنه."],"evidences":[{"text":"«لَا تَتَّخِذُوا الْيَهُودَ وَالنَّصَارَىٰ أَوْلِيَاءَ»","source":"سورة المائدة 51"},{"text":"«وَمَن يَتَوَلَّ اللَّهَ وَرَسُولَهُ فَأُولَٰئِكَ حِزْبُ اللَّهِ»","source":"سورة المجادلة 22"}],"benefits":["الولاء والبراء ركنٌ من أركان الإيمان.","من أَوَلَى الشرك فقد أَفحَم.","من أَبَرّأ من الفِرَق المنحرفة فقد أَحسَن."],"references":["عقيدة أهل السنة للطحاوية","مجموع الفتاوى"]},{"id":"quran-1","title":"تعريف علوم القرآن وفضله","summary":"علوم القرآن هي أدوات فهم النص وتدبّره، والقرآن كتابٌ مُعجَز في لفظه ومعناه.","content":["علوم القرآن هي مجموعة الأبواب التي تُفصِل أحوال النص القرآني: كيف نزل، وكيف جُمِع، وكيف ضُبط، وكيف يُقرأ، وكيف يُفهَم، وكيف يُنازَع في فهمه، وكيف تُستَخرَج منه الأحكام والفوائد.","ومكانة هذه الأبواب أنّها وسائل لا غاية، فالغاية هي التدبر والعمل، ومن انصرف إلى الأدوات وترك الغاية فقد أَفحَم، ومن انصرف إلى الغاية بلا أدوات فقد أَضلّ."],"evidences":[{"text":"«كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِّيَدَّبَّرُوا آيَاتِهِ»","source":"سورة ص 29"},{"text":"«إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ»","source":"سورة الإسراء 9"}],"benefits":["علوم القرآن وسائل، والتدبر والعمل هو الغاية.","من أَحسَن الفهم أَحسَن العمل.","القرآن مُعجَز في لفظه ومعناه."],"references":["الإتقان في علوم القرآن للسيوطي","البرهان في علوم القرآن للزركشي"]},{"id":"quran-2","title":"نزول القرآن وأول ما نزل وآخر ما نزل","summary":"نزولٌ مُتَدرِجٌ بأسبابه، وأول ما نزل «اقرأ»، وآخر ما نزل كان من آيات التوبة.","content":["القرآن نزل مُتَدرِجًا على مدى ثلاثة وعشرين عامًا، لا مرةً واحدة، فذلك أَحسَن في التربية وتثبيت القلوب، ومن أول ما نزل: «اقرأ باسم ربك الذي خلق»، ومن آخر ما نزل: «وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ».","ونزول القرآن على سبعة أَحزاب? وأمّا نزوله فقد كان مُتَدرِجًا، وقد كان ﷺ يُسَمّي ما نزل عليه، ويُعَلِّم أهلَه، ويُخبرهم بأسباب النزول، وقد كان ﷺ يُحَدّث أصحابه في القتل والنكال."],"evidences":[{"text":"«وَقُرْآنًا فَرَقْنَاهُ لِتَقْرَأَهُ عَلَى النَّاسِ عَلَىٰ مُكْثٍ»","source":"سورة الإسراء 106"},{"text":"«وَقَالَ الَّذِينَ كَفَرُوا لَوْلَا نُزِّلَ عَلَيْهِ الْقُرْآنُ جُمْلَةً وَاحِدَةً»","source":"سورة الفرقان 32"}],"benefits":["النزول المُتَدرِج رحمةٌ وتربية، لا عجزٌ في النص.","أول ما نزل أمرٌ بالقراءة، وآخر ما نزل أمرٌ بالتقوى والردّ.","من أَحسَن النزول أَحسَن الفهم."],"references":["الإتقان للسيوطي","مباحث في علوم القرآن"]},{"id":"quran-3","title":"جمع القرآن في عهد أبي بكر","summary":"جمع المصحف في صحيفةٍ واحدة بعد معركة اليمامة، واستخلاف العلماء.","content":["في السنة الثانية عشر من الهجرة وقعت معركة اليمامة، وقتُل فيها عددٌ كبير من القرّاء، فأشار عمر إلى أبي بكر بجمع القرآن في مصحفٍ واحد، فوُرِد إلى زيد بن ثابت فجمعه في صحيفة.","ومن هنا كان أول ما جُمِع القرآن صحيفةً واحدة، ثم جُمِع في عهد عثمان في مصحفٍ واحد، وضُبط رسمه، وتُضَرِبت عليه المصاحف، وحُرِستَ عليه المصاحف."],"evidences":[{"text":"«كَانَ زَيْدٌ مِنَ الْقَرَائِكُمْ فَجَمَعُوا الْقُرْآنَ فِي صَحِيفَةٍ»","source":"صحيح البخاري"},{"text":"«كَانَ زَيْدٌ مِنَ الْقُرَائِكُمْ، فَجَمَعُوا الْقُرْآنَ فِي مَصْحَفٍ»","source":"الإتقان للسيوطي"}],"benefits":["جمع القرآن نُصرةٌ للدين.","من أَحسَن الجمع أَحسَن الفهم.","الحُرِستَ على المصحف ركنٌ في الإسلام."],"references":["صحيح البخاري","الإتقان للسيوطي"]},{"id":"quran-4","title":"المصحف في عهد عثمان وضبط الرسم","summary":"إمّا المصاحف، وتوحيد رسم المصحف، ومنع اختلاف القرّاء.","content":["في عهد عثمان اختلفت المصاحف في الرسم، فأمّر عثمان بضبط رسم المصحف، وخلع المصاحف المُختَلِف، وأمّر بحمل المصاحف إلى البلاد، فلم يَشكُل القرّاء بعد ذلك.","ومن هنا كان رسم المصحف الذي نقرأ به اليوم، وأمّا الرسم فقد كان مُختَلِفًا، وأمّا الضبط فقد كان في عهد عثمان، وأمّا المصاحف فقد كانت مُختَلِفًا."],"evidences":[{"text":"«كَانَ عُثْمَانٌ يُضَرِبُ عَلَى الْمَصْحَفِ وَيُخْلِفُ الْمَصَاحِفَ»","source":"الإتقان للسيوطي"},{"text":"«كَانَ عُثْمَانٌ يُضَرِبُ عَلَى الْمَصْحَفِ»","source":"البرهان للزركشي"}],"benefits":["ضبط رسم المصحف نُصرةٌ للدين.","من أَحسَن الضبط أَحسَن القراءة.","الحُرِستَ على المصحف ركنٌ في الإسلام."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"quran-5","title":"المكي والمدني وعلاماتهما","summary":"المكي والمدني بحسب زمان النزول، وعلاماتُ كل قسم.","content":["المكي هو ما نزل قبل الهجرة، والمدني هو ما نزل بعد الهجرة، حتى لو نزل بمكة بعد الهجرة فهو مدنيّ، حتى لو نزل بالمدينة قبل الهجرة فهو مكيّ.","ومن العلامات المكيّة: ألف «كلَّا»، وأسماء الأنبياء، وذكر الجُهُود والقُرّاء، ومن العلامات المدنيّة: ألف «يا أيها الناس»، وذكر الأحكام والمُنافِقين والقِتال."],"evidences":[{"text":"«الَّذِينَ آمَنُوا وَهَاجَرُوا»","source":"الإتقان للسيوطي"},{"text":"«الَّذِينَ كَفَرُوا»","source":"البرهان للزركشي"}],"benefits":["المكي ما نزل قبل الهجرة، والمدني ما نزل بعد الهجرة.","العلامات لا تُعَمّل إلا مع العلم.","من أَحسَن التمييز أَحسَن الفهم."],"references":["الإتقان للسيوطي","البرهان للزركشي"]},{"id":"quran-6","title":"أسباب النزول","summary":"معرفة سبب نزول الآية تُساعِد في فهمها، والأصل أنّ الآية تُحمل على سببها.","content":["أسباب النزول هي الجُهُود والأحداث التي أُنزِلت فيها الآية، ومعرفتها تُساعِد في فهمها، فمن أَحسَن سبب النزول أَحسَن الفهم، ومن لم يَعرف السبب فقد أَضلّ.","وأمّا الأصل: أنّ الآية تُحمل على سببها، ولا تُختصّ به إن كان السبب خُصوصًا، فالآية تُحمل على سببها وعلى غيره."],"evidences":[{"text":"«فَإِنَّ آيَةً تُنْزَلُ لِسَبَبٍ، فَتُحْمَلُ عَلَى سَبَبِهَا وَعَلَى غَيْرِهِ»","source":"مباحث في علوم القرآن"},{"text":"«مَا أَنْزَلَ اللَّهُ الْآيَةَ إِلَّا لِسَبَبٍ»","source":"الإتقان للسيوطي"}],"benefits":["معرفة سبب النزول تُساعِد في فهم الآية.","الآية تُحمل على سببها وعلى غيره.","من أَحسَن السبب أَحسَن الفهم."],"references":["مباحث في علوم القرآن","الإتقان للسيوطي"]},{"id":"quran-7","title":"الناسخ والمنسوخ","summary":"أن يحلّ حكمٌ محلّ حكمٍ بآيةٍ أُخرى أو سُنّةٍ قطعية.","content":["الناسخ هو ما حُكِم به، والمنسوخ هو ما أُلغي حكمه، وأمّا الناسخ فقد كان حُكِم به، وأمّا المنسوخ فقد أُلغي حكمه.","وأمّا شروط النسخ: أن يكون الناسخ آيةً أو سُنّةً قطعية، وأن يكون المنسوخ قد أُنزِل قبل الناسخ، وأن يكون الناسخ قد أُنزِل قبل وفاة النبي ﷺ."],"evidences":[{"text":"«مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نُسِّهَا»","source":"الإتقان للسيوطي"},{"text":"«مَا نُنْسِخُ مِنْ آيَةٍ»","s
